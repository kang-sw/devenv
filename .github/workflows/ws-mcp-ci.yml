name: ws-mcp CI

# Runs the default Go test group on Linux and Windows for pull requests that touch
# the Go tree and on manual dispatch (`gh workflow run ws-mcp-ci.yml --ref
# develop`). A develop push starts no run; the ship flow dispatches this
# workflow on the exact commit it is about to tag, so a Windows-specific failure
# is caught before release. It is also the release's only test run: the
# tagged release workflow does not re-run the suite and instead refuses to
# publish unless this workflow succeeded on the tagged commit. It publishes
# nothing; the release workflow remains the sole path that builds and uploads
# release assets.
on:
  pull_request:
    paths:
      - ".github/workflows/ws-mcp-ci.yml"
      - "agents-plugin-tool/**"
  workflow_dispatch:
    inputs:
      long_tests:
        description: "Also run the long test group"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: go test (${{ matrix.os }}, ${{ matrix.shard }})
    # Runs on pull requests and manual dispatch only. Before tagging a release,
    # dispatch this workflow on the commit to tag (the ship flow's Publish CI
    # gate does this): the release's CI gate needs a green run on it.
    strategy:
      # Surface every leg's result; a Linux failure must not cancel the Windows
      # run, which is the one this workflow exists to catch early.
      fail-fast: false
      matrix:
        # ubuntu runs the default group. On Windows internal/mcp alone
        # took ~15 min serially (864 s, run 36662026067; git-process heavy), so
        # the Windows leg splits it across parallel jobs; `rest` plus every
        # `mcp I 4` covers exactly the tests of `all`. Add the opt-in long job
        # for full coverage (agents-plugin-tool/scripts/ci-test-shard.sh).
        include:
          - { os: ubuntu-latest, shard: all, args: "all" }
          - { os: windows-latest, shard: rest, args: "rest" }
          - { os: windows-latest, shard: mcp-0, args: "mcp 0 4" }
          - { os: windows-latest, shard: mcp-1, args: "mcp 1 4" }
          - { os: windows-latest, shard: mcp-2, args: "mcp 2 4" }
          - { os: windows-latest, shard: mcp-3, args: "mcp 3 4" }
    runs-on: ${{ matrix.os }}
    # The Windows smoke job in the release workflow once hung to ~46 min
    # (v0.37.2); a cap turns a hang here into a fast, legible failure.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: agents-plugin-tool
        shell: bash
    steps:
      - name: Disable Defender real-time scanning (Windows)
        # Real-time scanning inspects every build-cache object and every git
        # process the tests spawn. Best effort: a runner image that refuses
        # the change still runs the tests, only slower.
        # Runs before checkout, so it cannot use the default working
        # directory, which does not exist yet.
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        continue-on-error: true
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: agents-plugin-tool/go.mod
          cache-dependency-path: agents-plugin-tool/go.sum

      - name: Run tests
        run: bash scripts/ci-test-shard.sh ${{ matrix.args }}

  # Explicit job names stay stable even when skipped before matrix expansion,
  # so the release gate can allow exactly these two skips.
  long-ubuntu:
    name: go test (ubuntu-latest, long)
    if: github.event_name == 'workflow_dispatch' && inputs.long_tests == true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: agents-plugin-tool
        shell: bash
    steps:
      - name: Disable Defender real-time scanning (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        continue-on-error: true
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: agents-plugin-tool/go.mod
          cache-dependency-path: agents-plugin-tool/go.sum

      - name: Run long tests
        run: bash scripts/ci-test-shard.sh long

  long-windows:
    name: go test (windows-latest, long)
    if: github.event_name == 'workflow_dispatch' && inputs.long_tests == true
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: agents-plugin-tool
        shell: bash
    steps:
      - name: Disable Defender real-time scanning (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        continue-on-error: true
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: agents-plugin-tool/go.mod
          cache-dependency-path: agents-plugin-tool/go.sum

      - name: Run long tests
        run: bash scripts/ci-test-shard.sh long
