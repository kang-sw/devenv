name: ws-mcp release

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/ws-mcp-release.yml"
      - ".agents/plugins/marketplace.json"
      - ".claude-plugin/marketplace.json"
      - "agents-plugin/**"
      - "agents-plugin-wsflow/**"
      - "agents-plugin-tool/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to embed in ws-mcp binaries, for example 0.33.7-dev"
        required: false
        default: "0.33.7-dev"

permissions:
  contents: write

jobs:
  build:
    name: Build ws-mcp assets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents-plugin-tool
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: agents-plugin-tool/go.mod

      - name: Run tests
        run: go test ./...

      - name: Validate plugin release contract
        run: |
          plugin_version=$(jq -r '.plugin_version' ../agents-plugin/runtime.json)
          release_tag=$(jq -r '.release_tag' ../agents-plugin/runtime.json)
          test "$release_tag" = "v$plugin_version"
          jq . ../agents-plugin/.codex-plugin/plugin.json >/dev/null
          jq . ../agents-plugin/.mcp.json >/dev/null
          jq . ../agents-plugin/runtime.json >/dev/null
          jq . ../.agents/plugins/marketplace.json >/dev/null
          jq . ../.claude-plugin/marketplace.json >/dev/null
          test "$(jq -r '.plugins[].name' ../.agents/plugins/marketplace.json | sort | tr '\n' ' ')" = "ws wsflow "
          test "$(jq -r '.plugins[].name' ../.claude-plugin/marketplace.json | sort | tr '\n' ' ')" = "ws wsflow "

      - name: Build release assets
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            scripts/build-release-assets.sh "${{ inputs.version }}"
          elif [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            scripts/build-release-assets.sh "${GITHUB_REF_NAME}"
          else
            scripts/build-release-assets.sh 0.33.7-dev
          fi

      - name: Verify release asset checksums
        run: |
          cd dist
          shasum -a 256 -c SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ws-mcp-assets
          path: agents-plugin-tool/dist/*
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Automated ws-mcp release assets for ${GITHUB_REF_NAME}."
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes "$notes"
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber

  windows-smoke:
    name: Windows ws-mcp smoke
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agents-plugin-tool
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: agents-plugin-tool/go.mod

      - name: Build Windows executable
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags "-s -w -X main.version=0.33.7-dev" -o dist/ws-mcp-windows-amd64.exe ./cmd/ws-mcp

      - name: Run Windows executable smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Resolve-Path ".\dist\ws-mcp-windows-amd64.exe"
          $root = Resolve-Path ".."
          & $exe smoke --root $root
