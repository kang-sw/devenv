name: ws-mcp release

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/ws-mcp-release.yml"
      - "package.json"
      - ".agents/plugins/marketplace.json"
      - ".claude-plugin/marketplace.json"
      - "agents-plugin/**"
      - "agents-plugin-pi/**"
      - "agents-plugin-wsflow/**"
      - "agents-plugin-tool/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to embed in ws-mcp binaries, for example 0.50.4-dev"
        required: false
        default: "0.50.4-dev"
      desktop_dry_run:
        description: "Build both desktop zips as workflow artifacts only; never publish a release"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  # The tag CI gate reads ws-mcp CI runs for the tagged commit.
  actions: read

# One run per ref at a time. A tag push can start two runs for the same tag;
# run concurrently they race `gh release upload` (HTTP 422 "asset already
# exists"). Queued, not cancelled: the later run re-uploads with --clobber, so
# the release never ends up half-published by a cancelled run.
concurrency:
  group: ws-mcp-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ws-mcp assets
    runs-on: ubuntu-latest
    # Normal duration ~2 min. Without a cap, a hung step burns runner time while
    # the run still reads as in-progress.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agents-plugin-tool
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: agents-plugin-tool/go.mod
          cache-dependency-path: agents-plugin-tool/go.sum

      # The release does not re-run `go test`: ws-mcp CI already ran the selected
      # ubuntu + windows groups on this exact commit (the ship flow waits for it
      # before tagging). A tag whose
      # commit has no green ws-mcp CI run publishes nothing. A branch push
      # starts no ws-mcp CI run, so the ship flow dispatches one on the
      # release branch head it tags. Every job must succeed, except the two
      # opt-in long legs may be skipped. Ship enforces success for those too
      # when the owner requests long tests.
      - name: Require green ws-mcp CI on the tagged commit
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          green=0
          for id in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ws-mcp-ci.yml/runs?head_sha=${GITHUB_SHA}&status=success" --jq '.workflow_runs[].id'); do
            ran=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs" --jq '.jobs | length > 0 and all(.conclusion == "success" or (.conclusion == "skipped" and (.name == "go test (ubuntu-latest, long)" or .name == "go test (windows-latest, long)")))')
            if [ "$ran" = "true" ]; then green=1; break; fi
          done
          if [ "$green" -lt 1 ]; then
            echo "::error::No successful ws-mcp CI run for ${GITHUB_SHA}; run ws-mcp CI on this commit (gh workflow run ws-mcp-ci.yml --ref release/<version>) before tagging."
            exit 1
          fi

      - name: Validate plugin release contract
        run: |
          plugin_version=$(jq -r '.plugin_version' ../agents-plugin/runtime.json)
          release_tag=$(jq -r '.release_tag' ../agents-plugin/runtime.json)
          test "$release_tag" = "v$plugin_version"
          jq . ../agents-plugin/.codex-plugin/plugin.json >/dev/null
          jq . ../agents-plugin/.mcp.json >/dev/null
          jq . ../agents-plugin/runtime.json >/dev/null
          jq . ../.agents/plugins/marketplace.json >/dev/null
          jq . ../.claude-plugin/marketplace.json >/dev/null
          jq . ../package.json >/dev/null
          jq . ../agents-plugin-pi/package.json >/dev/null
          test "$(jq -r '.plugins[].name' ../.agents/plugins/marketplace.json | sort | tr '\n' ' ')" = "ws wsflow "
          test "$(jq -r '.plugins[].name' ../.claude-plugin/marketplace.json | sort | tr '\n' ' ')" = "ws wsflow "
          diff -q ../agents-plugin/runtime.json ../agents-plugin-pi/runtime.json
          diff -q ../agents-plugin/bin/ws-mcp-launcher.py ../agents-plugin-pi/bin/ws-mcp-launcher.py
          diff -rq ../agents-plugin/rsrc ../agents-plugin-pi/rsrc
          # Root package.json's dependencies must mirror agents-plugin-pi/package.json's
          # runtime dependencies exactly: Pi's git-install flow runs `npm install`
          # only against the root manifest. The two files legitimately differ
          # elsewhere (root carries pi.extensions, omits type/files/scripts/
          # devDependencies), so compare only the parsed dependencies object,
          # not the whole file.
          diff <(jq -S '.dependencies' ../package.json) <(jq -S '.dependencies' ../agents-plugin-pi/package.json)
          # Prepared native Pi closures and workflow bundles need no Node/npm/network.
          python3 ../agents-plugin-pi/scripts/prepare-workflow-bundles.py --check
          for product in agents-plugin agents-plugin-wsflow; do
            python3 "../$product/bin/ws-pi-payload.py" --plugin "../$product" --check-source ..
          done
          for artifact in native-pi/closure-manifest.json native-pi/closure.zip native-pi/first-party-manifest.json bin/ws-pi-payload.py; do
            cmp "../agents-plugin/$artifact" "../agents-plugin-wsflow/$artifact"
          done
          diff -r ../agents-plugin/native-pi/first-party ../agents-plugin-wsflow/native-pi/first-party

      - name: Build release assets
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            scripts/build-release-assets.sh "${{ inputs.version }}"
          elif [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            scripts/build-release-assets.sh "${GITHUB_REF_NAME}"
          else
            scripts/build-release-assets.sh 0.50.4-dev
          fi

      - name: Verify release asset checksums
        run: |
          cd dist
          shasum -a 256 -c SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ws-mcp-assets
          path: agents-plugin-tool/dist/*
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/') && !inputs.desktop_dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Automated ws-mcp release assets for ${GITHUB_REF_NAME}."
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes "$notes"
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber

  windows-smoke:
    name: Windows ws-mcp smoke
    runs-on: windows-latest
    # Builds and smoke-runs the native Windows executable only; the Windows
    # `go test` suite runs in ws-mcp CI (see the build job's CI gate). Normal
    # duration a few minutes; the cap turns a hang into a fast, legible failure.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agents-plugin-tool
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: agents-plugin-tool/go.mod
          cache-dependency-path: agents-plugin-tool/go.sum

      - name: Build Windows executable
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags "-s -w -X main.version=0.50.4-dev" -o dist/ws-mcp-windows-amd64.exe ./cmd/ws-mcp
          python scripts/write-runtime-metadata.py dist/ws-mcp-windows-amd64.exe --version 0.50.4-dev

      - name: Run Windows executable smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Resolve-Path ".\dist\ws-mcp-windows-amd64.exe"
          $root = Resolve-Path ".."
          & $exe smoke --root $root

  desktop-build:
    name: Desktop (${{ matrix.platform }}, ${{ matrix.arch }})
    needs: build
    # Keep ordinary PR/manual native-only builds unchanged. A tag ships desktop;
    # an explicit dry run builds identical archives but cannot publish anything.
    if: startsWith(github.ref, 'refs/tags/') || inputs.desktop_dry_run
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: arm64
            binary: ws-mcp-darwin-arm64
            shell: bash
          - os: windows-latest
            platform: win32
            arch: x64
            binary: ws-mcp-windows-amd64.exe
            shell: pwsh
    defaults:
      run:
        working-directory: agents-plugin-tool/desktop-electron
        shell: ${{ matrix.shell }}
    env:
      # Explicit targets also work if GitHub changes the macOS runner CPU.
      npm_config_platform: ${{ matrix.platform }}
      npm_config_arch: ${{ matrix.arch }}
      DESKTOP_PLATFORM: ${{ matrix.platform }}
      DESKTOP_ARCH: ${{ matrix.arch }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: agents-plugin-tool/desktop-electron/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download the release build's binaries and metadata
        uses: actions/download-artifact@v5
        with:
          name: ws-mcp-assets
          path: ${{ runner.temp }}/ws-mcp-assets

      # Networked prerequisites are explicit and lockfile/version pinned. The
      # subsequent package build only reads the cache; it never runs Electron.
      - name: Install pinned desktop build dependencies and Electron zip
        env:
          # The installer's cacheRoot and build.cjs must agree.
          electron_config_cache: ${{ runner.temp }}/electron-cache
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/electron/install.js

      - name: Test desktop startup and packaging contracts
        run: npm test

      - name: Assemble the wsflow daemon input without executing it
        run: >-
          node scripts/assemble-daemon-input.cjs
          --binary "${{ runner.temp }}/ws-mcp-assets/${{ matrix.binary }}"
          --out "${{ runner.temp }}/desktop-daemon-input"
          --platform "${{ matrix.platform }}" --package wsflow

      - name: Package unsigned desktop app and archive without launching it
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          WERKSCHAFT_DAEMON_INPUT: ${{ runner.temp }}/desktop-daemon-input
        run: >-
          node -e "require('./scripts/build.cjs').build({ platform: process.env.DESKTOP_PLATFORM,
          arch: process.env.DESKTOP_ARCH }).catch(error => { console.error(error); process.exitCode = 1; })"

      - name: Verify packaged Windows daemon autostart without Python
        if: matrix.platform == 'win32'
        run: node test/autostart-smoke.cjs

      - name: Upload Windows autostart evidence
        if: always() && matrix.platform == 'win32'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-win32-autostart-evidence
          path: agents-plugin-tool/desktop-electron/dist/autostart-evidence/
          if-no-files-found: warn

      - name: Upload platform desktop archive and checksum
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            agents-plugin-tool/desktop-electron/dist/Werkschaft-${{ matrix.platform }}-${{ matrix.arch }}.zip
            agents-plugin-tool/desktop-electron/dist/Werkschaft-desktop-SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  desktop-release:
    name: Verify and publish desktop assets
    needs: desktop-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Download both desktop artifacts without overwriting their SUMS
        uses: actions/download-artifact@v5
        with:
          pattern: desktop-*
          path: ${{ runner.temp }}/desktop-platforms
          merge-multiple: false

      - name: Verify archives and write combined updater checksums
        env:
          INPUT: ${{ runner.temp }}/desktop-platforms
          OUTPUT: ${{ runner.temp }}/desktop-release
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const { assetName, parseSums, SUMS } = require('./agents-plugin-tool/desktop-electron/update');
          fs.mkdirSync(process.env.OUTPUT);
          const lines = [];
          for (const [platform, arch] of [['darwin', 'arm64'], ['win32', 'x64']]) {
            const source = path.join(process.env.INPUT, `desktop-${platform}-${arch}`);
            const name = assetName(platform, arch);
            const bytes = fs.readFileSync(path.join(source, name));
            const hash = crypto.createHash('sha256').update(bytes).digest('hex');
            const sums = parseSums(fs.readFileSync(path.join(source, SUMS), 'utf8'));
            if (sums.size !== 1 || sums.get(name) !== hash) throw new Error(`Invalid checksum for ${name}`);
            fs.writeFileSync(path.join(process.env.OUTPUT, name), bytes);
            lines.push(`${hash}  ${name}`);
          }
          fs.writeFileSync(path.join(process.env.OUTPUT, SUMS), lines.join('\n') + '\n');
          NODE

      # Retain the same combined payload on tags and dry runs. Only tags may
      # reach the publishing step below, and the explicit dry-run veto wins.
      - name: Upload combined desktop workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: werkschaft-desktop-assets
          path: ${{ runner.temp }}/desktop-release/*
          if-no-files-found: error
          compression-level: 0

      - name: Publish desktop assets to the native assets' tag release
        if: startsWith(github.ref, 'refs/tags/') && !inputs.desktop_dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/desktop-release/"* --repo "$GITHUB_REPOSITORY" --clobber
