name: ws-mcp release

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/ws-mcp-release.yml"
      - "package.json"
      - ".agents/plugins/marketplace.json"
      - ".claude-plugin/marketplace.json"
      - "agents-plugin/**"
      - "agents-plugin-pi/**"
      - "agents-plugin-wsflow/**"
      - "agents-plugin-tool/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to embed in ws-mcp binaries, for example 0.46.27-dev"
        required: false
        default: "0.46.27-dev"

permissions:
  contents: write
  # The tag CI gate reads ws-mcp CI runs for the tagged commit.
  actions: read

jobs:
  build:
    name: Build ws-mcp assets
    runs-on: ubuntu-latest
    # Normal duration ~2 min. Without a cap, a hung step burns runner time while
    # the run still reads as in-progress.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agents-plugin-tool
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: agents-plugin-tool/go.mod
          cache-dependency-path: agents-plugin-tool/go.sum

      # The release does not re-run `go test`: ws-mcp CI already ran the full
      # ubuntu + windows suite on this exact commit (the ship flow waits for it
      # before tagging), and the Windows leg alone costs ~30 min. A tag whose
      # commit has no green ws-mcp CI run publishes nothing.
      - name: Require green ws-mcp CI on the tagged commit
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          green=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ws-mcp-ci.yml/runs?head_sha=${GITHUB_SHA}&status=success" --jq '.total_count')
          if [ "${green:-0}" -lt 1 ]; then
            echo "::error::No successful ws-mcp CI run for ${GITHUB_SHA}; run ws-mcp CI on this commit (gh workflow run ws-mcp-ci.yml --ref develop) before tagging."
            exit 1
          fi

      - name: Validate plugin release contract
        run: |
          plugin_version=$(jq -r '.plugin_version' ../agents-plugin/runtime.json)
          release_tag=$(jq -r '.release_tag' ../agents-plugin/runtime.json)
          test "$release_tag" = "v$plugin_version"
          jq . ../agents-plugin/.codex-plugin/plugin.json >/dev/null
          jq . ../agents-plugin/.mcp.json >/dev/null
          jq . ../agents-plugin/runtime.json >/dev/null
          jq . ../.agents/plugins/marketplace.json >/dev/null
          jq . ../.claude-plugin/marketplace.json >/dev/null
          jq . ../package.json >/dev/null
          jq . ../agents-plugin-pi/package.json >/dev/null
          test "$(jq -r '.plugins[].name' ../.agents/plugins/marketplace.json | sort | tr '\n' ' ')" = "ws wsflow "
          test "$(jq -r '.plugins[].name' ../.claude-plugin/marketplace.json | sort | tr '\n' ' ')" = "ws wsflow "
          diff -q ../agents-plugin/runtime.json ../agents-plugin-pi/runtime.json
          diff -q ../agents-plugin/bin/ws-mcp-launcher.py ../agents-plugin-pi/bin/ws-mcp-launcher.py
          diff -rq ../agents-plugin/rsrc ../agents-plugin-pi/rsrc
          # Root package.json's dependencies must mirror agents-plugin-pi/package.json's
          # runtime dependencies exactly: Pi's git-install flow runs `npm install`
          # only against the root manifest. The two files legitimately differ
          # elsewhere (root carries pi.extensions, omits type/files/scripts/
          # devDependencies), so compare only the parsed dependencies object,
          # not the whole file.
          diff <(jq -S '.dependencies' ../package.json) <(jq -S '.dependencies' ../agents-plugin-pi/package.json)

      - name: Build release assets
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            scripts/build-release-assets.sh "${{ inputs.version }}"
          elif [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            scripts/build-release-assets.sh "${GITHUB_REF_NAME}"
          else
            scripts/build-release-assets.sh 0.46.27-dev
          fi

      - name: Verify release asset checksums
        run: |
          cd dist
          shasum -a 256 -c SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ws-mcp-assets
          path: agents-plugin-tool/dist/*
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Automated ws-mcp release assets for ${GITHUB_REF_NAME}."
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes "$notes"
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber

  windows-smoke:
    name: Windows ws-mcp smoke
    runs-on: windows-latest
    # Builds and smoke-runs the native Windows executable only; the Windows
    # `go test` suite runs in ws-mcp CI (see the build job's CI gate). Normal
    # duration a few minutes; the cap turns a hang into a fast, legible failure.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agents-plugin-tool
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: agents-plugin-tool/go.mod
          cache-dependency-path: agents-plugin-tool/go.sum

      - name: Build Windows executable
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags "-s -w -X main.version=0.46.27-dev" -o dist/ws-mcp-windows-amd64.exe ./cmd/ws-mcp

      - name: Run Windows executable smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Resolve-Path ".\dist\ws-mcp-windows-amd64.exe"
          $root = Resolve-Path ".."
          & $exe smoke --root $root
