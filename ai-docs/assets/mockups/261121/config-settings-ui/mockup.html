<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ws 대시보드 · /settings 워크플로 설정 v2 목업</title>
<script>
  (function () {
    var m = /[?&]theme=(dark|light)/.exec(location.search);
    document.documentElement.setAttribute("data-theme", m ? m[1] : "light");
  })();
</script>
<style>
/* ==========================================================================
   Live wswhiteboard / wsdashboard CSS tokens (light + dark)
   ========================================================================== */
:root {
  --wb-bg: var(--background, #f3f3f0);
  --wb-fg: var(--foreground, #1b1d21);
  --wb-card: var(--card, #ffffff);
  --wb-muted: var(--muted, #e9e8e3);
  --wb-muted-fg: var(--muted-foreground, #5f646b);
  --wb-primary: var(--primary, #2b62d9);
  --wb-primary-fg: var(--primary-foreground, #ffffff);
  --wb-topic: #2c3038;
  --wb-on-topic: #ffffff;
  --wb-now: var(--wb-primary);
  --wb-on-now: var(--wb-primary-fg);
  --wb-line: color-mix(in srgb, var(--wb-fg) 16%, transparent);
  --wb-wash: color-mix(in srgb, var(--wb-fg) 6%, transparent);
  --wb-policy: #b25000;      --wb-on-policy: #ffffff;
  --wb-technical: #2457c5;   --wb-on-technical: #ffffff;
  --wb-announced: #1d7348;   --wb-on-announced: #ffffff;
  --wb-accent-policy: #b25000;
  --wb-ok: #1d7348;
  --wb-fail: #c0262d;
  --wb-warn: #c27a00;
  --wb-warn-ink: #a35f00;
  --wb-shadow: 0 1px 2px rgb(0 0 0 / .14), 0 2px 6px rgb(0 0 0 / .06);
  --wb-shadow-hi: 0 2px 4px rgb(0 0 0 / .16), 0 6px 18px rgb(0 0 0 / .10);
  --wb-radius: 12px;
  --wb-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --wb-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --wb-bg: var(--background, #141518);
  --wb-fg: var(--foreground, #e7e7e4);
  --wb-card: var(--card, #1e2024);
  --wb-muted: var(--muted, #2b2d32);
  --wb-muted-fg: var(--muted-foreground, #a2a6ad);
  --wb-primary: var(--primary, #7aa2ff);
  --wb-primary-fg: var(--primary-foreground, #0c1424);
  --wb-topic: #2a2d33;
  --wb-on-topic: #e4e5e8;
  --wb-now: #243457;
  --wb-on-now: #d3defb;
  --wb-policy: #5b3a1c;      --wb-on-policy: #f6d9bd;
  --wb-technical: #26385e;   --wb-on-technical: #d2dcf6;
  --wb-announced: #1f4433;   --wb-on-announced: #c6ead6;
  --wb-accent-policy: #e0a36c;
  --wb-ok: #6cc39a;
  --wb-fail: #f0797e;
  --wb-warn: #e0a36c;
  --wb-warn-ink: #e0a36c;
  --wb-shadow: 0 1px 2px rgb(0 0 0 / .5), 0 2px 8px rgb(0 0 0 / .3);
  --wb-shadow-hi: 0 2px 4px rgb(0 0 0 / .55), 0 8px 22px rgb(0 0 0 / .4);
  color-scheme: dark;
}

* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--wb-fg) 24%, transparent) transparent; }
*:hover { scrollbar-color: color-mix(in srgb, var(--wb-fg) 42%, transparent) transparent; }
html, body { margin: 0; height: 100%; background: var(--wb-bg); color: var(--wb-fg); font: 13.5px/1.5 var(--wb-sans); }
button, input, select, textarea { font: inherit; color: inherit; }
code, .mono { font-family: var(--wb-mono); }

.i { width: 14px; height: 14px; flex: none; display: block; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

/* ==========================================================================
   Dashboard Frame: Left Rail (~250px) + Main /settings Stage
   ========================================================================== */
.app {
  display: grid;
  grid-template-columns: 252px minmax(0, 1fr);
  gap: 14px;
  height: 100vh;
  height: 100dvh;
  padding: 12px 14px;
  min-width: 0;
}

/* ---- Left Dashboard Rail (adapted from dashboard-rail.css) ---- */
.rail {
  background: var(--wb-card);
  border-radius: var(--wb-radius);
  box-shadow: var(--wb-shadow);
  display: flex;
  flex-direction: column;
  min-height: 0;
  min-width: 0;
  overflow: hidden;
}
.rail .rhd {
  flex: none;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 9px 10px 9px 12px;
  font-size: 12px;
  font-weight: 800;
  color: var(--wb-muted-fg);
  border-bottom: 1px solid var(--wb-muted);
}
.rail .rhd .rt { color: var(--wb-fg); font-size: 12.5px; }
.rail .rhd .rsp { flex: 1; }
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  height: 20px; padding: 0 8px; border-radius: 999px;
  font-size: 11px; font-weight: 700; line-height: 1;
  background: var(--wb-muted); color: var(--wb-muted-fg);
  white-space: nowrap;
}
.chip.ok { background: color-mix(in srgb, var(--wb-ok) 15%, var(--wb-card)); color: var(--wb-ok); }
.chip.pri { background: color-mix(in srgb, var(--wb-primary) 15%, var(--wb-card)); color: var(--wb-primary); }
.chip.warn { background: color-mix(in srgb, var(--wb-warn) 18%, var(--wb-card)); color: var(--wb-warn-ink); }
.chip.fail { background: color-mix(in srgb, var(--wb-fail) 15%, var(--wb-card)); color: var(--wb-fail); }

.rail .rlist {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding: 8px 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.rail .rws { display: flex; flex-direction: column; }
.rail .wsbar {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 8px 5px 10px;
  background: var(--wb-topic);
  color: var(--wb-on-topic);
  font-size: 12.5px;
  font-weight: 700;
}
.rail .wsbar .nm { white-space: nowrap; }
.rail .wsbar .pp {
  font-family: var(--wb-mono); font-size: 10.5px; opacity: .7;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  flex: 1 1 auto; min-width: 0;
}
.rail .wsbar.dim { opacity: .68; }

/* Entry-point trigger gear buttons on Rail rows (reveal on hover/focus/active) */
.rail-entry {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; padding: 0; border: 0;
  border-radius: 6px; cursor: pointer;
  background: transparent; color: inherit;
  opacity: .32;
  transition: opacity .14s, background .12s, color .12s;
  flex: none;
}
.rail .wsbar:hover .rail-entry,
.rail .wsbar:focus-within .rail-entry,
.rail .wthd:hover .rail-entry,
.rail .wthd:focus-within .rail-entry,
.rail .rs:hover .rail-entry,
.rail .rs:focus-within .rail-entry,
.rail-entry:focus-visible,
.rail-entry[aria-current="true"] {
  opacity: 1;
}
.rail-entry:hover { background: rgb(255 255 255 / .22); }
.rail-entry[aria-current="true"] {
  background: rgb(255 255 255 / .26);
  color: #fff;
}
.rail-entry.light-surface {
  color: var(--wb-muted-fg);
}
.rail-entry.light-surface:hover,
.rail-entry.light-surface:focus-visible {
  background: color-mix(in srgb, var(--wb-primary) 12%, var(--wb-card));
  color: var(--wb-primary);
}
.rail-entry.light-surface[aria-current="true"] {
  background: var(--wb-primary);
  color: var(--wb-primary-fg);
}
.rail-entry .i { width: 13px; height: 13px; }

.rail .wsbody { padding: 4px 0 2px; display: grid; gap: 4px; }
.rail .rwt { padding: 2px 0; }
.rail .wthd {
  display: flex; align-items: center; gap: 5px;
  padding: 3px 8px 3px 14px;
  font-size: 11.5px; font-weight: 700; color: var(--wb-muted-fg);
  min-width: 0;
}
.rail .wthd .br {
  font-family: var(--wb-mono); color: var(--wb-fg);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  flex: 1 1 auto; min-width: 0;
}
.rail .wthd .i { width: 12px; height: 12px; flex: none; }
.rail .rsessions {
  margin: 2px 8px 0 20px;
  padding-left: 8px;
  border-left: 2px solid var(--wb-muted);
  display: grid; gap: 3px;
}
.rail .rs {
  display: flex; flex-direction: column; gap: 2px;
  padding: 5px 6px; border-radius: 7px;
  background: transparent;
  min-width: 0;
}
.rail .rs.cur { background: color-mix(in srgb, var(--wb-primary) 10%, var(--wb-card)); }
.rail .rs .s1 { display: flex; align-items: center; gap: 5px; min-width: 0; }
.rail .rs .rid {
  font-family: var(--wb-mono); font-size: 11.5px; font-weight: 700;
  color: var(--wb-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  flex: 1 1 auto; min-width: 0;
}
.rail .rs.cur .rid { color: var(--wb-fg); }
.rail .rs .s2 {
  font-size: 11px; color: var(--wb-muted-fg);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  padding-left: 26px;
}
.rail .rs.child { padding: 3px 6px 3px 12px; opacity: .86; }
.rail .rs.child .rid { font-size: 11px; font-weight: 600; color: var(--wb-muted-fg); }

.hb {
  position: relative; display: inline-flex; align-items: center; justify-content: center;
  flex: none; width: 21px; height: 14px; border-radius: 4px;
  font: 800 9px/1 var(--wb-sans); background: #3a3b3f; color: #fff;
}
.hb.sm { width: 18px; height: 12px; font-size: 8px; border-radius: 3px; }
.hb[data-h="claude"] { background: #d97757; color: #fff; }
.hb[data-h="pi"] { background: #141416; color: #e6e6e6; box-shadow: inset 0 0 0 1px #5a5a5a; }
.hb[data-h="codex"] { background: #e8e9ec; color: #1e1f22; }
.hb[data-h="agy"] { background: #3b7be8; color: #fff; }

.rail .rscope-legend {
  margin: auto 10px 8px;
  padding: 7px 9px;
  border-radius: 8px;
  background: var(--wb-wash);
  font-size: 11px;
  color: var(--wb-muted-fg);
  line-height: 1.45;
}
.rail .rscope-legend b { color: var(--wb-fg); font-weight: 700; }

.rail .rfoot {
  flex: none;
  display: flex; align-items: center; gap: 6px;
  padding: 8px 10px;
  border-top: 1px solid var(--wb-muted);
}
.rail .rfoot-btn {
  flex: 1 1 0; min-width: 0; height: 30px;
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  padding: 0 8px; border: 1px solid var(--wb-line); border-radius: 8px;
  background: transparent; color: var(--wb-muted-fg);
  font-size: 11.5px; font-weight: 700; cursor: pointer; white-space: nowrap;
}
.rail .rfoot-btn:hover { background: var(--wb-muted); color: var(--wb-fg); }
.rail .rfoot-btn[aria-current="true"] {
  background: color-mix(in srgb, var(--wb-primary) 14%, var(--wb-card));
  border-color: color-mix(in srgb, var(--wb-primary) 45%, transparent);
  color: var(--wb-primary);
}

/* ==========================================================================
   Main /settings Stage
   ========================================================================== */
.stage {
  background: var(--wb-card);
  border-radius: var(--wb-radius);
  box-shadow: var(--wb-shadow);
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  position: relative;
}

/* Top header & precedence strip */
.shd {
  flex: none;
  padding: 11px 16px 10px;
  border-bottom: 1px solid var(--wb-muted);
  display: flex;
  flex-direction: column;
  gap: 9px;
  background: var(--wb-card);
}
.shd-top {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  min-width: 0;
}
.shd-title {
  display: flex; align-items: center; gap: 8px;
  min-width: 0;
}
.shd-title h1 { margin: 0; font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
.route-pill {
  font-family: var(--wb-mono); font-size: 11px; font-weight: 700;
  padding: 2px 7px; border-radius: 6px;
  background: var(--wb-wash); color: var(--wb-muted-fg);
}
.scope-target-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 2px 9px; border-radius: 999px;
  font-size: 11.5px; font-weight: 700;
  background: color-mix(in srgb, var(--wb-primary) 13%, var(--wb-card));
  color: var(--wb-primary);
  min-width: 0; max-width: 100%;
}
.scope-target-pill code { font-size: 11px; opacity: .88; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.scope-target-pill.repo {
  background: color-mix(in srgb, var(--wb-warn) 15%, var(--wb-card));
  color: var(--wb-warn-ink);
}
.scope-target-pill.builtin {
  background: color-mix(in srgb, var(--wb-technical) 13%, var(--wb-card));
  color: var(--wb-technical);
}
:root[data-theme="dark"] .scope-target-pill.builtin {
  background: var(--wb-technical);
  color: var(--wb-on-technical);
}
.shd-actions {
  margin-left: auto;
  display: flex; align-items: center; gap: 8px;
  flex: none;
}

/* Segmented control */
.seg {
  display: inline-flex; align-items: center; gap: 2px;
  padding: 2px; border-radius: 999px;
  background: var(--wb-muted);
}
.seg button {
  border: 0; background: transparent; border-radius: 999px;
  padding: 3px 10px; font-size: 11.5px; font-weight: 700;
  color: var(--wb-muted-fg); cursor: pointer; white-space: nowrap;
}
.seg button[aria-checked="true"] {
  background: var(--wb-card); color: var(--wb-fg);
  box-shadow: inset 0 0 0 1px var(--wb-line);
}
.seg button:disabled { opacity: .45; cursor: not-allowed; }

/* Precedence chain strip: builtin -> (synced) -> global -> repo -> project -> session */
.prec-strip {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
  padding: 6px 10px;
  border-radius: 9px;
  background: color-mix(in srgb, var(--wb-muted) 45%, var(--wb-card));
  border: 1px solid color-mix(in srgb, var(--wb-line) 55%, transparent);
  font-size: 11.5px;
}
.prec-lbl {
  font-size: 10.5px; font-weight: 800; color: var(--wb-muted-fg);
  margin-right: 4px; white-space: nowrap;
}
.prec-arrow { color: var(--wb-muted-fg); opacity: .65; font-size: 11px; user-select: none; }
.prec-node {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 9px; border-radius: 999px;
  font-family: var(--wb-mono); font-size: 11px; font-weight: 700;
  border: 1px solid var(--wb-line);
  background: var(--wb-card); color: var(--wb-muted-fg);
  cursor: pointer; white-space: nowrap;
  transition: border-color .12s, background .12s, color .12s;
}
.prec-node:hover:not(.static) { border-color: var(--wb-primary); color: var(--wb-fg); }
.prec-node.static { cursor: default; opacity: .78; }
.prec-node.synced {
  border-style: dashed;
  background: transparent;
  opacity: .68;
}
.prec-node.active {
  background: var(--wb-primary);
  color: var(--wb-primary-fg);
  border-color: var(--wb-primary);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--wb-primary) 24%, transparent);
}
.prec-node.active.repo-mode {
  background: var(--wb-warn);
  color: #fff;
  border-color: var(--wb-warn);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--wb-warn) 26%, transparent);
}
:root[data-theme="dark"] .prec-node.active.repo-mode { color: #19140b; }
.prec-node.active.builtin-mode {
  background: var(--wb-technical);
  color: var(--wb-on-technical);
  border-color: var(--wb-technical);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--wb-technical) 24%, transparent);
}
.prec-node .sub { font-family: var(--wb-sans); font-size: 10px; font-weight: 600; opacity: .88; }
.prec-hint {
  margin-left: auto;
  font-size: 11px; color: var(--wb-muted-fg);
  white-space: nowrap;
}

/* Sticky Search + Quick Filter Bar */
.filter-bar {
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px 10px;
  flex-wrap: wrap;
  padding: 8px 16px;
  border-bottom: 1px solid var(--wb-muted);
  background: color-mix(in srgb, var(--wb-muted) 26%, var(--wb-card));
}
.search-wrap {
  position: relative;
  display: flex; align-items: center;
  flex: 1 1 200px; max-width: 280px; min-width: 150px;
}
.search-wrap .i {
  position: absolute; left: 9px; color: var(--wb-muted-fg); pointer-events: none;
  width: 13px; height: 13px;
}
.search-input {
  width: 100%; height: 28px;
  padding: 0 26px 0 28px;
  border: 1px solid var(--wb-line); border-radius: 8px;
  background: var(--wb-card); font-size: 12px;
}
.search-input:focus-visible { outline: 1.5px solid var(--wb-primary); outline-offset: -1px; }
.search-clear {
  position: absolute; right: 5px; border: 0; background: none;
  color: var(--wb-muted-fg); cursor: pointer; padding: 2px 4px; font-size: 13px; line-height: 1;
}
.fchips { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.fchip {
  height: 26px; padding: 0 10px; border-radius: 999px;
  border: 1px solid var(--wb-line); background: var(--wb-card);
  color: var(--wb-muted-fg); font-size: 11.5px; font-weight: 700;
  cursor: pointer; white-space: nowrap;
}
.fchip:hover { color: var(--wb-fg); border-color: var(--wb-muted-fg); }
.fchip[aria-pressed="true"] {
  background: color-mix(in srgb, var(--wb-primary) 15%, var(--wb-card));
  border-color: color-mix(in srgb, var(--wb-primary) 50%, transparent);
  color: var(--wb-primary);
}
.ov-counter {
  margin-left: auto;
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11.5px; color: var(--wb-muted-fg); white-space: nowrap;
}
.ov-counter b { color: var(--wb-fg); font-variant-numeric: tabular-nums; }

/* Inner Category Sidebar + Scrollable Content */
.sbody {
  flex: 1 1 auto;
  min-height: 0;
  display: grid;
  grid-template-columns: 192px minmax(0, 1fr);
}
.snav {
  border-right: 1px solid var(--wb-muted);
  padding: 10px 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  overflow-y: auto;
  background: color-mix(in srgb, var(--wb-muted) 14%, var(--wb-card));
}
.snav-btn {
  display: flex; align-items: center; gap: 7px;
  width: 100%; text-align: left;
  border: 0; border-radius: 8px; padding: 7px 9px;
  background: transparent; color: var(--wb-fg);
  font-size: 12.5px; font-weight: 600; cursor: pointer;
}
.snav-btn:hover { background: var(--wb-muted); }
.snav-btn[aria-current="true"] {
  background: color-mix(in srgb, var(--wb-primary) 14%, var(--wb-card));
  color: var(--wb-primary);
  font-weight: 800;
}
.snav-btn .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--wb-primary); flex: none;
}
.snav-btn .dot.none { background: transparent; }
.snav-btn .cnt {
  margin-left: auto; font-size: 11px; font-weight: 600;
  color: var(--wb-muted-fg); font-variant-numeric: tabular-nums;
}
.snav-note {
  margin-top: auto;
  padding: 10px 8px 4px;
  font-size: 11px;
  color: var(--wb-muted-fg);
  line-height: 1.45;
}

.scontent {
  min-width: 0;
  min-height: 0;
  overflow-y: auto;
  padding: 14px 18px 28px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* ==========================================================================
   Special Scope Cards: Grayed-out Sync Card (global) & Repo Banner (repo)
   ========================================================================== */
.sync-card {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 11px 14px;
  border-radius: 10px;
  border: 1px dashed var(--wb-line);
  background: color-mix(in srgb, var(--wb-muted) 42%, var(--wb-card));
  color: var(--wb-muted-fg);
  opacity: .78;
}
.sync-card-left { display: grid; gap: 3px; min-width: 0; flex: 1 1 280px; }
.sync-card-title {
  display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
  font-size: 13px; font-weight: 700; color: var(--wb-fg);
}
.sync-card-desc { font-size: 11.5px; line-height: 1.45; }
.sync-card-desc code { font-size: 11px; padding: 0 4px; border-radius: 4px; background: var(--wb-wash); }
.sync-card-right { display: flex; align-items: center; gap: 8px; flex: none; }

.repo-banner {
  display: flex; align-items: center; justify-content: space-between; gap: 10px 14px; flex-wrap: wrap;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid color-mix(in srgb, var(--wb-warn) 45%, transparent);
  background: color-mix(in srgb, var(--wb-warn) 9%, var(--wb-card));
  font-size: 12px;
}
.repo-banner-left { display: grid; gap: 2px; min-width: 0; flex: 1 1 320px; }
.repo-banner-title { display: flex; align-items: center; gap: 6px; font-weight: 800; color: var(--wb-warn-ink); font-size: 12.5px; }
.repo-banner-desc { color: var(--wb-fg); font-size: 11.5px; line-height: 1.45; }
.repo-banner-demo {
  display: flex; align-items: center; gap: 6px; flex: none;
  padding: 4px 8px; border-radius: 8px;

  function esc(s) {

  function getLayerMap(k, bucket) {
    if (k.bucketed || k.layerMajorBucketed) {

    return k.layers;

  // Resolve effective value + winning scope + whether current targetScope is overridden / shadowed
  function resolveKnob(k, bucket) {
    var b = (k.bucketed || k.layerMajorBucketed) ? (bucket || "*") : null;
    if (k.globalOnly) {
      var gv = k.layers.global;
      if (gv != null && gv !== "") return { value: gv, scope: "global", bucket: null };
      return { value: k.builtin, scope: "builtin", bucket: null };
    }
    if (k.bucketed) {
      var order = b === "*" ? ["*"] : [b, "*"];
      for (var i = 0; i < order.length; i++) {
        var bm = k.buckets[order[i]] || {};
        for (var j = PRECEDENCE.length - 1; j >= 0; j--) {
          var sc = PRECEDENCE[j];
          if (bm[sc] != null && bm[sc] !== "") {
            return { value: bm[sc], scope: sc, bucket: order[i] };
          }
        }
      }
      return { value: k.builtin, scope: "builtin", bucket: "*" };
    }
    if (k.layerMajorBucketed) {
      var keysOrder = b === "*" ? ["*"] : [b, "*"];
      for (var j2 = PRECEDENCE.length - 1; j2 >= 0; j2--) {
        var sc2 = PRECEDENCE[j2];
        for (var i2 = 0; i2 < keysOrder.length; i2++) {
          var bm2 = k.buckets[keysOrder[i2]] || {};
          if (bm2[sc2] != null && bm2[sc2] !== "") {
            return { value: bm2[sc2], scope: sc2, bucket: keysOrder[i2] };
          }
        }
      }
      return { value: k.builtin, scope: "builtin", bucket: "*" };
    }
    for (var j3 = PRECEDENCE.length - 1; j3 >= 0; j3--) {
      var sc3 = PRECEDENCE[j3];
      if (k.layers[sc3] != null && k.layers[sc3] !== "") {
        return { value: k.layers[sc3], scope: sc3, bucket: null };
      }
    }
    return { value: k.builtin, scope: "builtin", bucket: null };
  }

  function hasOverrideInScope(k, scope, bucket) {
    var map = getLayerMap(k, bucket);
    return map[scope] != null && map[scope] !== "";
  }

  function higherShadow(k, targetScope, bucket) {
    if (k.globalOnly) {
      if (targetScope === "builtin" && k.layers.global != null && k.layers.global !== "") {
        return { scope: "global", value: k.layers.global, bucket: null };
      }
      return null;
    }
    var rank = SCOPE_RANK[targetScope];
    var b = (k.bucketed || k.layerMajorBucketed) ? (bucket || "*") : null;
    if (k.bucketed) {
      var order = targetScope === "builtin" && b !== "*" ? [b, "*"] : [b];
      for (var bi = 0; bi < order.length; bi++) {
        var bm = k.buckets[order[bi]] || {};
        for (var j = PRECEDENCE.length - 1; j >= 0; j--) {
          var sc = PRECEDENCE[j];
          if (SCOPE_RANK[sc] > rank && bm[sc] != null && bm[sc] !== "") {
            return { scope: sc, value: bm[sc], bucket: order[bi] };
          }
        }
      }
      return null;
    }
    if (k.layerMajorBucketed) {
      var keysOrder = b === "*" ? ["*"] : [b, "*"];
      for (var j2 = PRECEDENCE.length - 1; j2 >= 0; j2--) {
        var sc2 = PRECEDENCE[j2];
        if (SCOPE_RANK[sc2] <= rank) continue;
        for (var i2 = 0; i2 < keysOrder.length; i2++) {
          var bm2 = k.buckets[keysOrder[i2]] || {};
          if (bm2[sc2] != null && bm2[sc2] !== "") {
            return { scope: sc2, value: bm2[sc2], bucket: keysOrder[i2] };
          }

    for (var j3 = PRECEDENCE.length - 1; j3 >= 0; j3--) {

  // =========================================================================
  // Line Diff Engine for Prompt Overrides
  // =========================================================================
  function computeLineDiff(seedText, overrideText) {
    var a = seedText.split("\n");
    var b = overrideText.split("\n");
    var n = a.length, m = b.length;
    var dp = [];
    for (var i = 0; i <= n; i++) {
      dp[i] = new Array(m + 1).fill(0);
    }
    for (var i2 = n - 1; i2 >= 0; i2--) {
      for (var j2 = m - 1; j2 >= 0; j2--) {
        dp[i2][j2] = a[i2] === b[j2] ? dp[i2 + 1][j2 + 1] + 1 : Math.max(dp[i2 + 1][j2], dp[i2][j2 + 1]);
      }
    }
    var out = [];
    var x = 0, y = 0;
    while (x < n && y < m) {
      if (a[x] === b[y]) { out.push({ type: "ctx", text: a[x] }); x++; y++; }
      else if (dp[x + 1][y] >= dp[x][y + 1]) { out.push({ type: "del", text: a[x] }); x++; }
      else { out.push({ type: "add", text: b[y] }); y++; }
    }
    while (x < n) { out.push({ type: "del", text: a[x++] }); }
    while (y < m) { out.push({ type: "add", text: b[y++] }); }
    return out;
  }

      }

    }
    return true;
  }

          '<div>' +

            '<div class="kdesc">' + esc(pt.desc) + '</div>' +

    var patchJson = JSON.stringify(patchObj, null, 2);

    var leadBtn = state.repoLeadActive
      ? '<button type="button" class="btn pri" data-act="send-proposal"><svg class="i"><use href="#i-send"/></svg>활성 리드(scariness-clerk-energy)에 편집 제안 전송</button>' +
        '<button type="button" class="btn" data-act="copy-proposal"><svg class="i"><use href="#i-copy"/></svg>JSON/diff 복사</button>'
      : '<button type="button" class="btn pri" data-act="copy-proposal"><svg class="i"><use href="#i-copy"/></svg>JSON/diff 복사</button>' +
        '<button type="button" class="btn" disabled title="이 워크트리에 활성 리드가 없습니다">활성 리드 없음</button>';

    return '<footer class="proposal-bar" aria-label="저장소 스코프 편집 제안 바">' +
      '<div class="proposal-top">' +
        '<div class="proposal-title">' +
          '<span class="prov-pill draft">편집 제안 바</span>' +
          '<span><code>.ws-workflow/config.json</code> 패치 초안 ' + keys.length + '건</span>' +
        '</div>' +
        '<button type="button" class="btn" data-act="toggle-patch">' + (state.proposalExpanded ? 'JSON diff 접기 ▾' : 'JSON diff 펼치기 ▸') + '</button>' +
        '<button type="button" class="btn" data-act="clear-proposals">초안 모두 비우기</button>' +
        '<div class="proposal-actions">' + leadBtn + '</div>' +
      '</div>' +
      (state.proposalExpanded ? '<pre class="proposal-patch">' + esc(patchJson) + '</pre>' : '') +
    '</footer>';
  }

  // =========================================================================
  // Full Stage Render
  // =========================================================================
  function renderStage() {
    var sm = SCOPE_META[state.targetScope];
    var theme = document.documentElement.getAttribute("data-theme") || "light";
    var totalOv = totalOverridesInScope(state.targetScope);

    // Sync active highlight on left rail 4 entry points
    document.querySelectorAll("[data-scope-entry]").forEach(function (btn) {
      var match = btn.getAttribute("data-scope-entry") === state.targetScope;
      btn.setAttribute("aria-current", String(match));
    });

    var precHtml = '<div class="prec-strip" aria-label="설정 우선순위 체인">' +
      '<span class="prec-lbl">해석 우선순위</span>' +
      PRECEDENCE.map(function (sc, idx) {
        var arrow = idx > 0 ? '<span class="prec-arrow">→</span>' : '';
        if (sc === "builtin") {
          var isBuiltinAct = state.targetScope === "builtin";
          return arrow + '<button type="button" class="prec-node' + (isBuiltinAct ? ' active builtin-mode' : '') + '" data-act="switch-scope" data-val="builtin" title="내장 기본값 읽기 전용 검사">' +
            'builtin <span class="sub">' + (isBuiltinAct ? '조회 중' : '기본') + '</span>' +
          '</button>';
        }
        if (sc === "synced") {
          return arrow + '<span class="prec-node static synced" title="261119 예정: ~/.ws/config-sync/repo.git (로컬 global이 항상 우선)">(synced) <span class="sub">예정</span></span>';
        }
        var isActive = sc === state.targetScope;
        var cls = "prec-node" + (isActive ? " active" + (sc === "repo" ? " repo-mode" : "") : "");
        return arrow + '<button type="button" class="' + cls + '" data-act="switch-scope" data-val="' + sc + '">' +
          sc + (isActive ? ' <span class="sub">편집 중</span>' : '') +
        '</button>';
      }).join("") +
      '<span class="prec-hint">오른쪽 레이어가 왼쪽을 덮어씀</span>' +
    '</div>';

    var targetPillCls = "scope-target-pill" + (state.targetScope === "repo" ? " repo" : (state.targetScope === "builtin" ? " builtin" : ""));
    var headerHtml = '<header class="shd">' +
      '<div class="shd-top">' +
        '<div class="shd-title">' +
          '<svg class="i" style="width:16px;height:16px;color:var(--wb-primary)"><use href="#i-sliders"/></svg>' +
          '<h1>워크플로 설정</h1>' +
          '<span class="route-pill">/settings</span>' +
          '<span class="' + targetPillCls + '">' +
            '<span>대상: ' + esc(state.targetScope) + ' (' + esc(sm.ko) + ')</span>' +
            '<code>' + esc(sm.file) + '</code>' +
          '</span>' +
        '</div>' +
        '<div class="shd-actions">' +
          '<div class="seg" role="radiogroup" aria-label="테마 전환">' +
            '<button type="button" role="radio" aria-checked="' + (theme === "light") + '" data-act="theme" data-val="light">라이트</button>' +
            '<button type="button" role="radio" aria-checked="' + (theme === "dark") + '" data-act="theme" data-val="dark">다크</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
      precHtml +
    '</header>';

    var filterHtml = '<div class="filter-bar">' +
      '<div class="search-wrap">' +
        '<svg class="i"><use href="#i-search"/></svg>' +
        '<input class="search-input" id="searchInput" type="text" placeholder="키·설명 검색" value="' + esc(state.search) + '" aria-label="키 또는 설명 검색">' +
        (state.search ? '<button type="button" class="search-clear" data-act="clear-search" aria-label="검색어 지우기">×</button>' : '') +
      '</div>' +
      '<div class="fchips" role="group" aria-label="빠른 필터">' +
        '<button type="button" class="fchip" aria-pressed="' + (state.filterMode === "all") + '" data-act="filter" data-val="all">전체</button>' +
        '<button type="button" class="fchip" aria-pressed="' + (state.filterMode === "overridden") + '" data-act="filter" data-val="overridden">이 스코프 오버라이드만</button>' +
        '<button type="button" class="fchip" aria-pressed="' + (state.filterMode === "editable") + '" data-act="filter" data-val="editable">편집 가능만</button>' +
      '</div>' +
      '<div class="ov-counter">' +
        '<span>현재 스코프(<b>' + esc(state.targetScope) + '</b>) 오버라이드: <b>' + totalOv + '개</b></span>' +
      '</div>' +
    '</div>';

    var navHtml = '<nav class="snav" aria-label="설정 카테고리">' +
      SECTIONS.map(function (s) {
        var ovCount = countScopeOverridesInSection(s.id, state.targetScope);
        return '<button type="button" class="snav-btn" data-act="section" data-val="' + s.id + '" aria-current="' + (state.section === s.id) + '">' +
          '<span class="dot' + (ovCount ? '' : ' none') + '"></span>' +
          '<span>' + esc(s.label) + '</span>' +
          '<span class="cnt">' + (ovCount ? ovCount : '') + '</span>' +
        '</button>';
      }).join("") +
      '<div class="snav-note">' +
        '<b>저장 방식:</b><br>' +
        (state.targetScope === "builtin"
          ? '<code>builtin</code>은 읽기 전용 기본값 검사 모드입니다. 편집하려면 <code>global</code>~<code>session</code>을 선택하세요.'
          : (state.targetScope === "repo"
            ? '<code>repo</code>는 Git 추적 파일이므로 직접 저장 대신 <b>편집 제안 바</b>로 리드에 패치를 전달합니다.'
            : '<code>' + esc(state.targetScope) + '</code> 변경 사항은 <code>TrustedWrite</code> 경로로 즉시 반영됩니다.')) +
      '</div>' +
    '</nav>';

    var bodyInner = renderSyncCard() + renderRepoBanner() + renderBuiltinBanner();
    if (state.section === "workflow") bodyInner += renderSectionWorkflow();
    else if (state.section === "agents") bodyInner += renderSectionAgents();
    else if (state.section === "compaction") bodyInner += renderSectionCompaction();
    else if (state.section === "adapters") bodyInner += renderSectionAdapters();
    else if (state.section === "profiles") bodyInner += renderSectionProfiles();
    else if (state.section === "prompts") bodyInner += renderSectionPrompts();

    var stageEl = document.getElementById("stage");
    stageEl.innerHTML = headerHtml + filterHtml +
      '<div class="sbody">' + navHtml + '<div class="scontent" id="scontent">' + bodyInner + '</div></div>' +
      renderProposalBar();
  }

  // =========================================================================
  // Toast
  // =========================================================================
  var toastTimer = null;
  function showToast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2200);
  }

  // =========================================================================
  // Live Mutations (TrustedWrite simulation for direct scopes, Proposal for repo)
  // =========================================================================
  function findKnob(id) {
    return KNOBS.find(function (k) { return k.id === id; });
  }

  function applyKnobValue(knobId, bucket, rawVal) {
    var k = findKnob(knobId);
    if (!k || !isScopeEditable(k, state.targetScope)) return;
    var val = String(rawVal);

    if (state.targetScope === "repo") {
      var draftKey = (k.bucketed || k.layerMajorBucketed) ? k.id + "." + (bucket === "*" ? "all" : bucket) : k.id;
      state.repoDrafts[draftKey] = val;
      renderStage();
      return;
    }

    if (k.bucketed || k.layerMajorBucketed) {
      var b = bucket || "*";
      if (!k.buckets[b]) k.buckets[b] = {};
      k.buckets[b][state.targetScope] = val;
    } else {
      k.layers[state.targetScope] = val;
    }
    showToast("저장됨 · TrustedWrite (" + state.targetScope + ")");
    renderStage();
  }

  function resetKnobValue(knobId, bucket) {
    var k = findKnob(knobId);
    if (!k) return;
    if (k.bucketed || k.layerMajorBucketed) {
      var b = bucket || "*";
      if (k.buckets[b]) delete k.buckets[b][state.targetScope];
    } else {
      delete k.layers[state.targetScope];
    }
    showToast("현재 스코프(" + state.targetScope + ") 오버라이드를 되돌렸습니다.");
    renderStage();
  }

  // =========================================================================
  // Event Wiring
  // =========================================================================
  document.addEventListener("click", function (e) {
    var scopeEntry = e.target.closest("[data-scope-entry]");
    if (scopeEntry) {
      state.targetScope = scopeEntry.getAttribute("data-scope-entry");
      renderStage();
      return;
    }

    var el = e.target.closest("[data-act]");
    if (!el) return;
    var act = el.getAttribute("data-act");

    if (act === "switch-scope") {
      state.targetScope = el.getAttribute("data-val");
      renderStage();
    } else if (act === "theme") {
      document.documentElement.setAttribute("data-theme", el.getAttribute("data-val"));
      renderStage();
    } else if (act === "section") {
      state.section = el.getAttribute("data-val");
      renderStage();
    } else if (act === "filter") {
      state.filterMode = el.getAttribute("data-val");
      renderStage();
    } else if (act === "clear-search") {
      state.search = "";
      renderStage();
    } else if (act === "adapter-tab") {
      state.adapterTab = el.getAttribute("data-val");
      renderStage();
    } else if (act === "tier-harness") {
      state.tierHarness = el.getAttribute("data-val");
      renderStage();
    } else if (act === "comp-bucket") {
      state.compactionBucket = el.getAttribute("data-val");
      renderStage();
    } else if (act === "pick-bucket") {
      state.bucketPick[el.getAttribute("data-knob")] = el.getAttribute("data-bucket");
      renderStage();
    } else if (act === "toggle") {
      var k = findKnob(el.getAttribute("data-knob"));
      var cur = el.getAttribute("aria-checked") === "true";
      var next = cur ? k.opts[1] : k.opts[0];
      applyKnobValue(k.id, el.getAttribute("data-bucket"), next);
    } else if (act === "set") {
      applyKnobValue(el.getAttribute("data-knob"), el.getAttribute("data-bucket"), el.getAttribute("data-val"));
    } else if (act === "step") {
      var k2 = findKnob(el.getAttribute("data-knob"));
      var b2 = el.getAttribute("data-bucket");
      var delta = parseInt(el.getAttribute("data-delta"), 10);
      var inp = el.parentElement.querySelector("input");
      var curN = parseInt(inp.value || k2.builtin || "0", 10);
      var nxt = curN + delta;
      if (k2.min != null && nxt < k2.min) nxt = k2.min;
      if (k2.max != null && nxt > k2.max) nxt = k2.max;
      applyKnobValue(k2.id, b2, String(nxt));
    } else if (act === "reset-knob") {
      resetKnobValue(el.getAttribute("data-knob"), el.getAttribute("data-bucket"));
    } else if (act === "discard-draft") {
      delete state.repoDrafts[el.getAttribute("data-draft-key")];
      showToast("제안 초안을 취소했습니다.");
      renderStage();
    } else if (act === "reset-tier") {
      var th = el.getAttribute("data-h"), tt = el.getAttribute("data-t");
      if (TIER_DATA[th] && TIER_DATA[th][tt]) delete TIER_DATA[th][tt][state.targetScope];
      showToast("agents.tier[" + th + "." + tt + "] 오버라이드를 되돌렸습니다.");
      renderStage();
    } else if (act === "toggle-prof-json") {
      var pid = el.getAttribute("data-prof");
      state.expandedProfiles[pid] = !state.expandedProfiles[pid];
      renderStage();
    } else if (act === "pick-prompt") {
      state.promptId = el.getAttribute("data-val");
      renderStage();
    } else if (act === "prompt-bucket") {
      state.promptBucket = el.getAttribute("data-val");
      renderStage();
    } else if (act === "reset-prompt") {
      var pt = PROMPTS.find(function (p) { return p.id === state.promptId; });
      if (pt && pt.buckets[state.promptBucket]) {
        delete pt.buckets[state.promptBucket][state.targetScope];
      }
      showToast("프롬프트 오버라이드를 되돌렸습니다.");
      renderStage();
    } else if (act === "repo-lead") {
      state.repoLeadActive = el.getAttribute("data-val") === "true";
      renderStage();
    } else if (act === "toggle-patch") {
      state.proposalExpanded = !state.proposalExpanded;
      renderStage();
    } else if (act === "clear-proposals") {
      state.repoDrafts = {};
      showToast("repo 편집 제안 초안을 비웠습니다.");
      renderStage();
    } else if (act === "send-proposal") {
      showToast("활성 리드(scariness-clerk-energy)에 .ws-workflow/config.json 편집 제안을 전송했습니다.");
    } else if (act === "copy-proposal") {
      showToast("JSON/diff 패치를 클립보드에 복사했습니다.");
    }
  });

  document.addEventListener("input", function (e) {
    if (e.target.id === "searchInput") {
      var pos = e.target.selectionStart;
      state.search = e.target.value;
      renderStage();
      var ni = document.getElementById("searchInput");
      if (ni) { ni.focus(); ni.setSelectionRange(pos, pos); }
      return;
    }

    var act = e.target.getAttribute("data-act");
    if (act === "prompt-edit") {
      var pt = PROMPTS.find(function (p) { return p.id === state.promptId; });
      if (!pt) return;
      var val = e.target.value;
      if (state.targetScope === "repo") {
        var dk = pt.id + "." + (state.promptBucket === "*" ? "all" : state.promptBucket);
        state.repoDrafts[dk] = val;
      } else {
        if (!pt.buckets[state.promptBucket]) pt.buckets[state.promptBucket] = {};
        pt.buckets[state.promptBucket][state.targetScope] = val;
      }
      // Update live diff in place to preserve textarea cursor & focus
      var diffBox = document.getElementById("promptDiff");
      if (diffBox) {
        diffBox.innerHTML = computeLineDiff(pt.seed, val).map(function (dl) {
          var prefix = dl.type === "add" ? "+ " : (dl.type === "del" ? "- " : "  ");
          return '<div class="diff-line ' + dl.type + '">' + esc(prefix + dl.text) + '</div>';
        }).join("");
      }
      return;
    }
  });

  document.addEventListener("change", function (e) {
    var act = e.target.getAttribute("data-act");
    if (act === "input") {
      applyKnobValue(e.target.getAttribute("data-knob"), e.target.getAttribute("data-bucket"), e.target.value);
    } else if (act === "tier-edit") {
      var h = e.target.getAttribute("data-h");
      var t = e.target.getAttribute("data-t");
      var f = e.target.getAttribute("data-f");
      if (state.targetScope !== "global" && state.targetScope !== "project") return;
      if (!TIER_DATA[h][t][state.targetScope]) {
        var base = resolveTierCell(h, t).val;
        TIER_DATA[h][t][state.targetScope] = { backend: base.backend, model: base.model, effort: base.effort };
      }
      TIER_DATA[h][t][state.targetScope][f] = e.target.value;
      showToast("저장됨 · agents.tier[" + h + "." + t + "] (" + state.targetScope + ")");
      renderStage();
    }
  });

  document.getElementById("homeBtn").addEventListener("click", function () {
    showToast("대시보드 홈 전환 (목업)");
  });

  renderStage();
})();
</script>
</body>
</html>
