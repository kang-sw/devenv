<style>
.hbm{background:#1e1f22;color:#e6e6e6;font:13px system-ui,sans-serif;padding:14px;border-radius:8px;display:flex;gap:28px;flex-wrap:wrap}
.hbm h4{margin:0 0 8px;font-size:12px;color:#9a9a9a;font-weight:600}
.hb{position:relative;display:inline-flex;align-items:center;justify-content:center;width:30px;height:18px;border-radius:5px;font:700 12px/1 ui-monospace,Consolas,monospace;flex:none;box-sizing:border-box}
.hb.sm{width:22px;height:14px;font-size:9px;border-radius:4px}
.hb[data-h=claude]{background:#d97757;color:#fff;--c:#f0a385}
.hb[data-h=pi]{background:#0b0b0c;color:#e6e6e6;border:1px solid #5a5a5a;--c:#c8c8c8}
.hb[data-h=codex]{background:#f2f2f2;color:#1e1f22;--c:#ffffff}
.hb[data-h=agy]{background:#3b7be8;color:#fff;--c:#8fb6ff}
.hb.sub{filter:saturate(.45) brightness(.72)}
.sp{position:relative;display:inline-flex;padding:2px;border-radius:7px;overflow:hidden;isolation:isolate}
.sp.sm{padding:1.5px;border-radius:5.5px}
.sp::before{content:"";position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;background:conic-gradient(var(--c) 0 100deg,transparent 100deg 360deg);animation:hbspin 1.1s linear infinite;z-index:-1}
.sp.sub::before{filter:saturate(.45) brightness(.72);animation-duration:1.6s}
@keyframes hbspin{to{transform:rotate(360deg)}}
.sp[data-h=claude]{--c:#f0a385}.sp[data-h=pi]{--c:#c8c8c8}.sp[data-h=codex]{--c:#ffffff}.sp[data-h=agy]{--c:#8fb6ff}
table.hbt{border-collapse:collapse}
.hbt td,.hbt th{padding:6px 10px;text-align:center;font-size:12px}
.hbt th{color:#9a9a9a;font-weight:600}
.gut{width:220px;border:1px solid #444;border-radius:6px;padding:6px}
.g{display:flex;align-items:center;gap:7px;padding:3px 4px;font-size:12px}
.g .ind{width:12px;color:#666}
.g .t.dimt{color:#b0b0b0}
</style>
<div class="hbm">
 <div><h4>변형 4종 × 하네스 (리드 = 큰 버전, 서브에이전트 = 작은 dim 버전)</h4>
 <table class="hbt">
  <tr><th></th><th>리드</th><th>리드 실행 중</th><th>서브</th><th>서브 실행 중</th></tr>
  <tr><th>claude</th>
   <td><span class="hb" data-h="claude">Cl</span></td>
   <td><span class="sp" data-h="claude"><span class="hb" data-h="claude">Cl</span></span></td>
   <td><span class="hb sm sub" data-h="claude">Cl</span></td>
   <td><span class="sp sm sub" data-h="claude"><span class="hb sm sub" data-h="claude">Cl</span></span></td></tr>
  <tr><th>pi</th>
   <td><span class="hb" data-h="pi">Pi</span></td>
   <td><span class="sp" data-h="pi"><span class="hb" data-h="pi">Pi</span></span></td>
   <td><span class="hb sm sub" data-h="pi">Pi</span></td>
   <td><span class="sp sm sub" data-h="pi"><span class="hb sm sub" data-h="pi">Pi</span></span></td></tr>
  <tr><th>codex</th>
   <td><span class="hb" data-h="codex">Co</span></td>
   <td><span class="sp" data-h="codex"><span class="hb" data-h="codex">Co</span></span></td>
   <td><span class="hb sm sub" data-h="codex">Co</span></td>
   <td><span class="sp sm sub" data-h="codex"><span class="hb sm sub" data-h="codex">Co</span></span></td></tr>
  <tr><th>agy</th>
   <td><span class="hb" data-h="agy">Ag</span></td>
   <td><span class="sp" data-h="agy"><span class="hb" data-h="agy">Ag</span></span></td>
   <td><span class="hb sm sub" data-h="agy">Ag</span></td>
   <td><span class="sp sm sub" data-h="agy"><span class="hb sm sub" data-h="agy">Ag</span></span></td></tr>
 </table></div>
 <div><h4>서브에이전트 gutter 적용 예</h4>
  <div class="gut">
   <div class="g"><span class="sp sm sub" data-h="pi"><span class="hb sm sub" data-h="pi">Pi</span></span><span class="t">ws call 도구</span></div>
   <div class="g"><span class="ind">└</span><span class="hb sm sub" data-h="pi">Pi</span><span class="t dimt">리뷰: call 권한</span></div>
   <div class="g"><span class="sp sm sub" data-h="codex"><span class="hb sm sub" data-h="codex">Co</span></span><span class="t">codex.medium 워커</span></div>
   <div class="g"><span class="hb sm sub" data-h="claude">Cl</span><span class="t dimt">Explore (haiku)</span></div>
   <div class="g"><span class="sp sm sub" data-h="agy"><span class="hb sm sub" data-h="agy">Ag</span></span><span class="t">agy 서브에이전트</span></div>
  </div>
 </div>
</div>
