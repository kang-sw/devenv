<div class="sr4-root">
<style>
.sr4-root{--wb-bg:#141518;--wb-fg:#e7e7e4;--wb-card:#1e2024;--wb-muted:#2b2d32;--wb-muted-fg:#a2a6ad;--wb-primary:#7aa2ff;--wb-line:color-mix(in srgb,#e7e7e4 16%,transparent);--wb-shadow:0 1px 2px rgb(0 0 0/.5),0 2px 8px rgb(0 0 0/.3);--wb-shadow-hi:0 2px 4px rgb(0 0 0/.55),0 8px 22px rgb(0 0 0/.4);--wb-ok:#6cc39a;--wb-fail:#f0797e;--wb-warn:#e0a36c;--wb-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;display:block;background:#101113;color:var(--wb-fg);font:12px/1.35 system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif;border:1px solid var(--wb-line);border-radius:10px;padding:10px;text-align:left}
.sr4-root *{box-sizing:border-box;margin:0;padding:0}
.sr4-root button,.sr4-root input{font:inherit;color:inherit}
.sr4-root .sr4-ctl{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-bottom:6px}

.sr4-root .sr4-cb:hover{background:var(--wb-muted);color:var(--wb-fg)}
.sr4-root .sr4-cb[aria-pressed="true"]{background:rgb(122 162 255/.14);border-color:rgb(122 162 255/.5);color:#cfdcff}
.sr4-root .sr4-cap{font-size:11.5px;color:var(--wb-muted-fg);margin:2px 0 8px;min-height:32px}
.sr4-root .sr4-fit{width:100%;overflow:hidden;position:relative}
.sr4-root .sr4-frame{position:relative;display:flex;width:1600px;height:440px;background:var(--wb-bg);border:1px solid var(--wb-line);border-radius:10px;overflow:hidden;transform-origin:0 0}
.sr4-root .sr4-i{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

.sr4-root .sr4-h.sr4-btn:hover,.sr4-root .sr4-sg:hover{color:var(--wb-fg)}
.sr4-root .sr4-h:focus-visible{outline:1.5px solid var(--wb-primary);outline-offset:-2px}

.sr4-root .sr4-host{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:800;letter-spacing:.04em;padding:1px 6px;border-radius:4px;background:var(--wb-muted);color:var(--wb-muted-fg)}

.sr4-root .sr4-sg{display:inline-flex;align-items:center;gap:6px;height:100%;padding:0 2px;border:0;background:transparent;color:inherit;cursor:pointer;font-weight:700}
.sr4-root .sr4-nv{color:var(--wb-fg)}
.sr4-root .sr4-q{color:var(--wb-warn);font-weight:800}
.sr4-root .sr4-sep{color:#5b5f68}
.sr4-root .sr4-dot{width:7px;height:7px;border-radius:50%;background:var(--wb-ok);box-shadow:0 0 0 3px rgb(108 195 154/.25);flex:none}
.sr4-root .sr4-dot.sr4-off{background:var(--wb-muted-fg);box-shadow:0 0 0 3px rgb(162 166 173/.2)}
.sr4-root .sr4-ug{display:inline-flex;align-items:center;gap:6px}
.sr4-root .sr4-mk{position:relative;display:inline-flex;align-items:center;width:19px;height:16px;flex:none;margin-right:3px}
.sr4-root .sr4-clk{position:absolute;width:9px;height:9px;right:-4px;bottom:-3px;border-radius:50%;background:var(--wb-card);color:var(--wb-warn);box-shadow:0 0 0 1px var(--wb-card);fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sr4-root .sr4-cs{display:inline-flex;gap:8px}
.sr4-root .sr4-uc{display:inline-flex;flex-direction:column;align-items:flex-end;gap:1px;font-family:var(--wb-mono)}
.sr4-root .sr4-cur{display:flex;align-items:baseline;gap:3px}
.sr4-root .sr4-k{color:var(--wb-muted-fg);font:500 9px/1.1 system-ui,"Noto Sans KR",sans-serif}
.sr4-root .sr4-n{color:var(--wb-fg);font:700 10.5px/1.1 var(--wb-mono);letter-spacing:-.035em}
.sr4-root .sr4-pc{font-size:9px;line-height:1.1;font-weight:500;color:var(--wb-fg)}
.sr4-root .sr4-pace{font:600 9.5px/1.1 var(--wb-mono);letter-spacing:-.025em}
.sr4-root .sr4-pace.under{color:var(--wb-ok)}.sr4-root .sr4-pace.over{color:var(--wb-fail)}
.sr4-root .sr4-st .sr4-pace,.sr4-root .sr4-st .sr4-n,.sr4-root .sr4-st .sr4-pc{color:var(--wb-muted-fg)}
.sr4-root .sr4-st .sr4-n{text-decoration:underline dotted;text-underline-offset:3px}
.sr4-root .sr4-vr{width:1px;height:20px;background:var(--wb-line);margin:0 2px}
.sr4-root .sr4-pw{position:relative}
.sr4-root .sr4-pop{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);width:340px;z-index:40;background:var(--wb-card);border:1px solid var(--wb-line);border-radius:10px;box-shadow:var(--wb-shadow-hi);padding:12px;font-size:12.5px;display:grid;gap:8px;font-weight:400}
.sr4-root .sr4-ah{display:flex;align-items:center;gap:7px;font-weight:700}
.sr4-root .sr4-ap{margin-left:auto;font-size:11px;color:var(--wb-muted-fg);font-weight:400}
.sr4-root .sr4-sn{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--wb-warn)}
.sr4-root .sr4-wc{padding:8px;border-radius:8px;background:color-mix(in srgb,var(--wb-bg) 50%,var(--wb-card));display:grid;gap:5px}
.sr4-root .sr4-wr{display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums}
.sr4-root .sr4-wn{margin-right:auto;font-weight:700}
.sr4-root .sr4-bar{height:4px;border-radius:2px;background:var(--wb-muted);overflow:hidden}
.sr4-root .sr4-fill{display:block;height:100%;border-radius:2px;background:var(--wb-primary)}
.sr4-root .sr4-fill.sr4-hi{background:var(--wb-warn)}
.sr4-root .sr4-rs{font-size:11px;color:var(--wb-muted-fg)}
.sr4-root .sr4-hb{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none;width:24px;height:15px;border-radius:4.5px;font:800 10px/1 ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;background:#3a3b3f;color:#9a9a9a}
.sr4-root .sr4-hb.sm{width:19px;height:12px;border-radius:3.5px;font-size:8px}
.sr4-root .sr4-hb::before{content:"??"}
.sr4-root .sr4-hb[data-h=claude]{background:#d97757;color:#fff}.sr4-root .sr4-hb[data-h=claude]::before{content:"Cl"}
.sr4-root .sr4-hb[data-h=codex]{background:#f2f2f2;color:#1e1f22}.sr4-root .sr4-hb[data-h=codex]::before{content:"Co"}
.sr4-root .sr4-hb[data-h=agy]{background:#3b7be8;color:#fff}.sr4-root .sr4-hb[data-h=agy]::before{content:"Ag"}
.sr4-root .sr4-hb[data-h=pi]{background:#0b0b0c;color:#e6e6e6;box-shadow:inset 0 0 0 1px #5a5a5a}.sr4-root .sr4-hb[data-h=pi]::before{content:"Pi"}
.sr4-root .sr4-rail{width:300px;flex:none;margin:12px 0 12px 12px;display:flex;flex-direction:column;border-radius:12px;background:var(--wb-card);box-shadow:var(--wb-shadow);overflow:hidden}
.sr4-root .sr4-rail.sr4-ov{position:absolute;z-index:25;left:12px;top:12px;bottom:12px;margin:0;box-shadow:var(--wb-shadow-hi),10px 0 28px rgb(0 0 0/.5);animation:sr4-in .16s ease-out}

.sr4-root .sr4-scrim{position:absolute;inset:0;z-index:20;background:rgb(0 0 0/.5);cursor:pointer}
.sr4-root .sr4-rh{display:flex;align-items:center;gap:6px;height:44px;padding:0 8px 0 14px;flex:none;border-bottom:1px solid var(--wb-muted)}
.sr4-root .sr4-rt{font-weight:800;font-size:13px;margin-right:2px}

.sr4-root .sr4-chip .sr4-dot{width:6px;height:6px;box-shadow:0 0 0 2px rgb(108 195 154/.25)}

.sr4-root .sr4-sp{flex:1}

.sr4-root .sr4-rn{font-weight:700;font-size:12px;line-height:1.2}
.sr4-root .sr4-rsub{font-size:10.5px;color:#7d828b;line-height:1.2}
.sr4-root .sr4-rfoot{display:flex;align-items:center;gap:8px;padding:7px 12px;border-top:1px solid var(--wb-muted);flex:none}
.sr4-root .sr4-rfb{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;border:1px solid var(--wb-line);border-radius:8px;background:transparent;color:var(--wb-muted-fg);font-size:12px;font-weight:700;cursor:pointer}
.sr4-root .sr4-rfb:hover{background:var(--wb-muted);color:var(--wb-fg)}
.sr4-root .sr4-conv{flex:1.05;min-width:0;display:flex;flex-direction:column;gap:9px}
.sr4-root .sr4-msg{max-width:88%;padding:8px 11px;border-radius:10px;background:var(--wb-card);line-height:1.45}

.sr4-root .sr4-tool{align-self:flex-start;font:10.5px var(--wb-mono);color:var(--wb-muted-fg);border:1px solid var(--wb-line);border-radius:7px;padding:3px 8px}
.sr4-root .sr4-comp{margin-top:auto;display:flex;align-items:center;height:38px;padding:0 12px;border:1px solid var(--wb-line);border-radius:10px;background:var(--wb-card);color:#7d828b}
.sr4-root .sr4-wbp{flex:1.2;min-width:0;background:var(--wb-card);border-radius:12px;box-shadow:var(--wb-shadow);padding:12px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.sr4-root .sr4-card{border-radius:9px;padding:8px 10px;line-height:1.4}
.sr4-root .sr4-c1{background:#2a2d33;color:#e4e5e8;font-weight:800}
.sr4-root .sr4-c2{background:#5b3a1c;color:#f6d9bd}.sr4-root .sr4-c3{background:#26385e;color:#d2dcf6}.sr4-root .sr4-c4{background:#1f4433;color:#c6ead6}
.sr4-root .sr4-drop{width:180px;flex:none;border:1.5px dashed var(--wb-line);border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--wb-muted-fg);font-size:12px;line-height:1.6;padding:12px}
</style>

 <div class="sr4-cg"><span class="sr4-cl">서브 변형</span>

 <div class="sr4-cg"><span class="sr4-cl">뷰포트</span>

<script>
(function(){

function pen(){return '<button class="sr4-pen" data-a="pen" title="'+(S.ren?'확인':'이름 바꾸기')+'">'+ic(S.ren?'ck':'pen')+'</button>'}
function sel(){var o=S.menu?'<div class="sr4-menu">'+['agy','claude','codex','pi'].map(function(h){return '<button class="sr4-mi" data-a="h" data-k="'+h+'">'+hb(h,1)+'<span>'+N[h]+'</span>'+(h==S.h?ic('ck'):'')+'</button>'}).join('')+'</div>':'';
return '<span class="sr4-pos"><button class="sr4-sel" data-a="sel" title="하니스 · 모델 선택">'+hb(S.h)+'<span>'+N[S.h]+'</span>'+ic('chev')+'</button>'+o+'</span>'}
function col(k,p,d,st){return '<span class="sr4-uc'+(st?' sr4-st':'')+'"><span class="sr4-cur"><span class="sr4-k">'+k+'</span><span class="sr4-n">'+p+'</span><span class="sr4-pc">%</span></span><span class="sr4-pace '+(d[0]=='-'?'under':'over')+'">'+d+'</span></span>'}
function mk(h,st){return '<span class="sr4-mk">'+hb(h,1)+(st?'<svg class="sr4-clk" viewBox="0 0 24 24" aria-label="오래됨"><title>12분 전 갱신 (오래됨)</title>'+P.clock+'</svg>':'')+'</span>'}
function win(n,p,d,r){return '<div class="sr4-wc"><div class="sr4-wr"><span class="sr4-wn">'+n+'</span><span>'+p+'%</span><span class="sr4-pace '+(d[0]=='-'?'under':'over')+'">'+d+'</span></div><div class="sr4-bar"><span class="sr4-fill'+(p>=75?' sr4-hi':'')+'" style="width:'+p+'%"></span></div><div class="sr4-rs">'+r+'</div></div>'}
function pop(){return '<div class="sr4-pop"><div class="sr4-ah">'+hb('claude')+'<span>Claude</span><span class="sr4-ap">Max 20x</span></div><div class="sr4-sn">'+ic('clock')+' 12분 전 갱신 · 오래됨</div>'+win('5h',26,'-11%','리셋 1시간 52분 후')+win('주',53,'+18%','리셋 3일 후')+'<div class="sr4-ah" style="margin-top:2px">'+hb('codex')+'<span>Codex</span><span class="sr4-ap">Pro</span></div>'+win('주',79,'+22%','리셋 2일 후')+'</div>'}
function rail(ov){var R=[[0,0,'방금 · 실행 중'],['claude','CL-12','3분 전'],['codex','CO-3','11분 전'],['pi','PI-1','1시간 전'],['claude','CL-9','어제'],['codex','CO-2','어제'],['agy','AGY-3','어제'],['claude','CL-7','2일 전']];
return '<aside class="sr4-rail'+(ov?' sr4-ov':'')+'"><div class="sr4-rh"><span class="sr4-rt">세션</span><span class="sr4-chip"><span class="sr4-dot'+(S.sse?'':' sr4-off')+'"></span>실시간 14</span><span class="sr4-chip"><span class="sr4-q">?</span> 43</span><span class="sr4-sp"></span><button class="sr4-pen" title="잠자기">'+ic('moon')+'</button><button class="sr4-pen" title="새로고침">'+ic('refresh')+'</button></div><div class="sr4-gl">track/agent-v2</div><div class="sr4-list">'+R.map(function(r,i){return '<div class="sr4-row'+(i?'':' sr4-act')+'">'+hb(i?r[0]:S.h)+'<div><div class="sr4-rn">'+esc(i?r[1]:S.label)+'</div><div class="sr4-rsub">'+r[2]+'</div></div></div>'}).join('')+'</div><div class="sr4-rfoot"><button class="sr4-rfb">'+ic('gear')+'설정</button><button class="sr4-rfb">'+ic('home')+'홈</button></div></aside>'}
function draw(){
 var n=S.w=='narrow',v=S.v;
 fr.style.width=(n?1200:1600)+'px';
 var tg=n?'<button class="sr4-h sr4-btn sr4-sq'+(S.open?' sr4-on':'')+'" data-a="tg" title="세션 목록">'+ic('menu',17)+'</button>':'';
 var left,harness='<div class="sr4-h">'+sel()+(v==1?'<span class="sr4-host" title="호스팅 중인 프로세스">hosted</span>':'')+'</div>';
 if(v==1)left=tg+'<div class="sr4-h sr4-tight"><div class="sr4-col"><span class="sr4-r1" title="261118-0937"><span class="sr4-fn">devenv</span><span>·</span><span>11/18 09:37</span></span><span class="sr4-r2">'+lab(0)+'</span></div>'+pen()+'</div>'+harness;
 else left=tg+'<div class="sr4-h">'+ic('folder')+'<span class="sr4-fn" title="261118-0937">devenv</span><span class="sr4-sep">/</span><span class="sr4-mu" title="261118-0937">11/18</span><span class="sr4-sep">·</span>'+lab(1)+pen()+'</div>'+harness;
 var usage='<div class="sr4-pw"><button class="sr4-h sr4-btn'+(S.pop?' sr4-on':'')+'" data-a="usage" title="플랜 사용량 자세히"><span class="sr4-ug">'+mk('claude',1)+'<span class="sr4-cs">'+col('5h','26','-11%',1)+col('주','53','+18%',1)+'</span></span><span class="sr4-vr"></span><span class="sr4-ug">'+mk('codex',0)+col('주','79','+22%',0)+'</span></button>'+(S.pop?pop():'')+'</div>';
 var right='<div class="sr4-rc" data-tip="기존 우상단 핸들 — 변경 없음"><button class="sr4-h sr4-btn sr4-add" title="새 항목">'+ic('plus')+'</button><button class="sr4-h sr4-btn" title="SW개발실">'+ic('tracker')+'<span>SW개발실</span></button><button class="sr4-h sr4-btn" title="브랜치">'+ic('branch')+'<span>track/agent-v2</span></button><button class="sr4-h sr4-btn sr4-dr sr4-sch" title="검색">'+ic('search',17)+'</button><button class="sr4-h sr4-btn sr4-dr" title="패널">'+ic('menu',17)+'</button></div>';
 var stage='<div class="sr4-stage"><div class="sr4-top"><div class="sr4-lc">'+left+'</div><div class="sr4-cc">'+usage+'</div>'+right+'</div>'+
 '<div class="sr4-conv"><div class="sr4-msg sr4-u">레일을 맨 위까지 올려 줘</div><div class="sr4-msg">레일이 전체 높이를 차지하고, 세션별 핸들은 오른쪽 스테이지 위에만 놓였습니다.</div><div class="sr4-tool">▸ wswhiteboard.write · 상단 핸들 목업 v4</div><div class="sr4-comp">메시지를 입력하세요…</div></div>'+
 '<div class="sr4-wbp"><div class="sr4-card sr4-c1">쉘 · 상단 핸들 재설계 v4</div><div class="sr4-card sr4-c2">레일: 헤더 포함 전체 높이 · 핸들: 스테이지 상단 34px</div><div class="sr4-card sr4-c3">좁은 화면: [≡] 오버레이 레일(z 25)이 핸들(z 10) 위를 덮음</div><div class="sr4-card sr4-c4">✓ Cl 시계 겹침 없음 · 마크 우측 여백 3px</div></div><div class="sr4-drop">여기에 놓으면<br>고정</div></div>';
 fr.innerHTML=(n?'':rail())+stage+(n&&S.open?'<div class="sr4-scrim" data-a="scrim"></div>'+rail(1):'');
 cap.textContent=CAP[v];
 [].forEach.call(root.querySelectorAll('.sr4-ctl [data-a]'),function(b){b.setAttribute('aria-pressed',String(b.dataset.k==String(b.dataset.a=='v'?S.v:S.w)))});
 if(S.ren){var i=fr.querySelector('.sr4-inp');i.focus();i.select();}
 fitIt();
}
function fitIt(){var w=S.w=='narrow'?1200:1600,k=Math.min(1,fit.clientWidth/w);fr.style.transform='scale('+k+')';fit.style.height=Math.round(fr.offsetHeight*k)+'px'}
function commit(){var i=fr.querySelector('.sr4-inp');if(i&&i.value.trim())S.label=i.value.trim();S.ren=0}
root.addEventListener('click',function(e){
 var t=e.target.closest('[data-a]'),a=t&&t.dataset.a,k=t&&t.dataset.k;
 if(!e.target.closest('.sr4-pos'))S.menu=0;
 if(!e.target.closest('.sr4-pw'))S.pop=0;
 if(!t){draw();return;}
 if(a=='pen'){if(S.ren)commit();else S.ren=1}
 else if(a=='v'){S.v=+k;S.menu=0;S.pop=0}
 else if(a=='w'){S.w=k;S.open=0;S.menu=0;S.pop=0}
 else if(a=='tg')S.open=!S.open;
 else if(a=='scrim')S.open=0;
 else if(a=='sel')S.menu=!S.menu;
 else if(a=='h'){S.h=k;S.menu=0}
 else if(a=='sse')S.sse=!S.sse;
 else if(a=='usage')S.pop=!S.pop;
 draw();
});
root.addEventListener('keydown',function(e){if(!e.target.classList.contains('sr4-inp'))return;
 if(e.key=='Enter'){commit();draw()}else if(e.key=='Escape'){S.ren=0;draw()}});
root.addEventListener('focusout',function(e){if(S.ren&&e.target.classList.contains('sr4-inp')){commit();draw()}});
if(window.ResizeObserver)new ResizeObserver(fitIt).observe(fit);
window.addEventListener('resize',fitIt);
draw();
})();
</script>
