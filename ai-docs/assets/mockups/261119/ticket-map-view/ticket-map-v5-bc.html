l the turn; the parent waits forever in the\n   exact failure mode the watchdog exists to recover.\n\n2. `agents-plugin-tool/internal/wsagent/record.go:611` - `flushSnapshot`\n   returns when the first pending output-rate sample arrives on a hosted slot\n   before `lastDiskAt` is set, suppressing both the snapshot write and\n   `outputRates.Append`. A first steered completion not followed at once by\n   `TurnEnd` stays RAM-only, breaking the merge's immediate-persistence and T2\n   reopen-recovery claim.\n3. `agents-plugin-tool/internal/wsdashboard/plan_usage_agy.go:419` - numeric\n   `reset_time` accepts any positive finite `float64` and converts it to\n   milliseconds without an `int64` / JavaScript `Date` range check; a huge\n   value reaches `new Date(...)` as an invalid date. Drop the malformed bucket.\n4. `agents-plugin-tool/internal/wsagent/agy_watchdog_test.go:372` - the\n   `/compact` exclusion test toggles `compactCommand` directly and never runs\n   the rea\n…"},{"s":"260626-research-playbook-print-lead-surface-leak","t":"playbook.print of lead skill/manual bodies leaks gated bootstrap surface to subagents","st":"idea","c":"research","k":1,"ph":[0,0],"odq":0,"bh":0,"ln":83,"as":null,"x":[[179,"related","surfaced this during Phase 3b workflow_manual hardening",""]],"sim":[[179,0.412,[["ws.workflow_manual",1],["ws.ferrule",1],["playbook.print",1],["session_key",1]],0],[127,0.225,[["freshbootstrapkey",1],["sentinel",0],["ferrule",0],["workflow_manual",1]],0],[178,0.17,[["playbook.print",1],["lead-sprint",1],["lead-salvage",1],["print",0]],0],[61,0.131,[["lead-workflow-manual",1],["workflow_manual",1],["workflow",0],["role",0]],0],[229,0.118,[["sentinel",0],["bootstrap",0],["workflow_manual",1],["mint",0]],0],[185,0.107,[["ferrule",0],["lead-",1],["playbook.render",1],["escalation",0]],0],[12,0.093,[["rolelead",1],["delegate",0],["role",0],["leaf",0]],0],[59,0.092,[["ferrule",0],["playbook",0],["sentinel",0],["workflow_manual",1]],0]],"kw":[["playbook.print",1],["ws.ferrule",1],["ws.workflow_manual",1],["printplaybook",1],["lead-",1],["print",0]],"pv":"## Problem\n\n`ws.workflow_manual` was hardened (260625 Phase 3a/3b) so a non-lead caller cannot\nobtain lead self-bootstrap (`ws.ferrule`) guidance: a valid `session_key` is\nrequired, a non-descriptive sentinel triggers fresh mode, the tool is lead-only\n(`isLeadOnlyTool`), and FAIL-LOUD renders no manual body.\n\nThat gating is bypassable through a different tool: **`playbook.print` has no role\ngate and no name restriction** (`internal/mcp/server.go` `case \"playbook.print\"`).\nA delegate/leaf-scoped key — or a keyless caller — can render any playbook by\nstem, and `printPlaybook` does NOT strip the `ws:fresh-only` gated region (markers\npass through as inert HTML comments, content present). Concretely:\n\n- `playbook.print(name: \"lead-workflow-manual\")` returns the full manual including\n  the gated `ws.ferrule(root: ...) ... mint your lead key` bootstrap line plus the\n  always-shown per-root rule that also names `ws.ferrule`.\n- `playbook.print(name: \"lead-proceed\" | \"lead-discuss\")` returns the repointed\n  self-load line, which contains the reserved fresh-bootstrap sentinel literal\n  (`freshBootstrapKey`) in clear text. The evidence set also covered\n  `lead-sprint` and `lead-salvage` until 2026-07-28, when\n  `260726-chore-retire-sprint-salvage-relocate-skill-authoring` deleted both;\n  the leak itself is unchanged.\n\nSo both obscured secrets — the `ws.ferrule` escalation call and the\n`ws.workflow_manual` fresh-mode sentinel — are readable by any subagent that calls\n`playbook.print` with\n…"},{"s":"260726-feat-ws-cli-call-stdin-payload","t":"ws-cli call: accept JSON payload from stdin","st":"idea","c":"feat","k":5,"ph":[0,3],"odq":0,"bh":0,"ln":167,"as":null,"x":[[96,"related","sibling CLI-fallback ergonomics ticket from the same MCP-down dogfooding session",""]],"sim":[[231,0.152,[["run_binary",1],["stdin",0],["os.execvpe",1],["ws-mcp-launcher.py",1]],0],[159,0.14,[["ws-mcp-launcher.py",1],["python3",1],["launcher",0],["exec",0]],0],[207,0.121,[["ws-cli",1],["launcher",0],["python3",1],["bin",0]],0],[224,0.103,[["ws-cli",1],["launcher",0],["cli",0],["bin",0]],0],[179,0.102,[["mcp-tools.md",1],["plugin-runtime.md",1],["git.commit",1],["agenda.set",1]],0],[205,0.101,[["ws-cli",1],["iserror",1],["args",0],["probe",0]],0],[96,0.1,[["callcommand",1],["ws-cli",1],["cli",0],["art",0]],0],[223,0.092,[["shim",0],["ws-mcp-launcher.py",1],["cli",0],["launcher",0]],0],[204,0.088,[["os.exit",1],["stdin",0],["subprocess.call",1],["launcher",0]],0]],"kw":[["len",0],["stdin",0],["callcommand",1],["ws-cli",1],["run_binary",1],["json.unmarshal",1]],"pv":"## Background\n\nDuring MCP-down recovery dogfooding, the CLI fallback path\n(`ws-cli` -> `ws-mcp call`) proved workable for reads and bootstrap, but\ncomplex root-aware **write** payloads are painful: the payload must be\ninline-quoted in the shell. Multi-line bodies with embedded double quotes are\nthe concrete pain case — `git.commit` messages carrying a `## AI Context`\nblock, and `agenda.set` prose. Shell quoting of such payloads is error-prone\nexactly when the operator is already in an outage and least able to absorb\nextra failure modes.\n\nVerified current behavior:\n\n- `callCommand` at `agents-plugin-tool/cmd/ws-mcp/main.go:1000` hard-requires\n  exactly two args: `if len(args) != 2` -> `usage: ws-mcp call <name> '<json>'`\n  and `os.Exit(2)`.\n- It then reads `rawArguments := args[1]` and `json.Unmarshal`s that string\n  directly.\n- There is **no** `os.Stdin` read and **no** `-` / `@file` sentinel handling on\n  this path.\n\nConsequence: `echo '{...}' | ws-cli call git.commit` fails with the usage\nerror, because the payload argument is simply absent.\n\n## Decisions\n\n- **Add a stdin payload source using the standard unix convention**: when the\n  payload argument is exactly `-`, read the whole payload from stdin instead of\n  treating `-` as JSON.\n- This deliberately **preserves the existing 2-arg shape** (`<name>` + `-`), so\n  the `len(args) != 2` guard and every existing invocation stay unchanged. No\n  new arg arity, no flag parsing, no change to the usage contract for the\n  inline fo\n…"},{"s":"260726-feat-ws-cli-lenient-tool-name-resolution","t":"ws-cli lenient tool-name resolution + normalized-uniqueness guard","st":"idea","c":"feat","k":5,"ph":[0,2],"odq":0,"bh":0,"ln":98,"as":null,"x":[],"sim":[[95,0.1,[["callcommand",1],["ws-cli",1],["cli",0],["art",0]],0],[98,0.089,[["canonical",0],["normalize",0],["listing",0],["dot",0]],0],[173,0.083,[["server.go",1],["normalization",0],["string",0]],0],[224,0.082,[["ws-cli",1],["cli",0],["function",0],["resolution",0]],0]],"kw":[["project_tree",1],["lenient",0],["main.go",1],["callcommand",1],["uniqueness",0],["server.go",1]],"pv":"## Background\n\n`ws-cli` / `ws-mcp` `call` and `tools` currently require the exact registered\ntool name. During a real MCP-down recovery, an agent driving the CLI fallback\nconfused separator styles: it transliterated `ws/project_tree` to `project.tree`\nand hit `unknown tool` on the FIRST call. This is high-stakes — the CLI fallback\nis the fatal-recovery lever when the MCP surface is down, and it failed at step\none on a trivial naming variant.\n\nThe registered tool names themselves already mix separators (`runtime.info` uses\na dot; `project_tree` uses an underscore — see `internal/mcp/server.go:529`\nswitch labels and the `tools/list` builder around `internal/mcp/server.go:3890`),\nso an agent has no reliable way to guess the exact separator. Resolution should\nbe lenient about separator style and an optional `ws/` prefix, while the\ncanonical names surfaced in the `tools` listing stay unchanged.\n\n## Decisions\n\n- **Lenient resolution (authoritative, do not re-litigate).** Resolve tool names\n  by normalizing: strip any leading `ws/` prefix and treat `.` and `_` as\n  interchangeable. All of `ws/project_tree`, `ws/project.tree`, `project_tree`,\n  and `project.tree` must resolve to the same tool.\n- **Only RESOLUTION becomes lenient.** The canonical names emitted by the\n  `tools` listing (`listMCPTools()` output) are unchanged; leniency applies to\n  how an inbound name is matched against that registered set, not to what is\n  advertised.\n- **Never silently mis-route (hard constraint).** L\n…"},{"s":"260728-bug-chmod-based-tests-skip-silently","t":"chmod-based unreadable-file tests skip silently on DrvFs and as root, so the guard they provide is filesystem-dependent","st":"idea","c":"bug","k":6,"ph":[0,0],"odq":0,"bh":0,"ln":79,"as":null,"x":[[181,"related","its Phase 1 hit this twice and removed one instance; the surviving one is pre-existing",""],[180,"related","adjacent case of a check that passes without the thing it checks for being present",""]],"sim":[[182,0.162,[["graph",0],["worth",0],["advisory",0],["silently",0]],0],[181,0.105,[["chmod",0],["tmpdir",1],["marker",0],["orphan",0]],0],[98,0.086,[["scantickets",1],["scan",0],["silently",0],["skip",0]],0]],"kw":[["chmod",0],["tmpdir",1],["drv",0],["graph",0],["untested",0],["unreadable",0]],"pv":"## Topic\n\n`agents-plugin-tool/internal/wsdoc/tickets_graph_test.go`'s\n`TestTicketGraphUnreadableTicketDegradesToSilence` creates a file, `chmod 000`s\nit, and skips when the read still succeeds. It was introduced by `b81bb3df`.\n\nThe skip fires on at least three real configurations:\n\n- a `TMPDIR` on a DrvFs / 9p mount — `/mnt/c/...` on this WSL host, which is an\n  ordinary place for a developer to point `TMPDIR`\n- running as root, where mode bits do not restrict reads\n- Windows\n\nMeasured during `260726-refactor-retire-spec-planned-marker-mechanism` Phase 1:\nunder `TMPDIR=/mnt/c/...` the sibling legacy-marker test using the same pattern\nreported `--- SKIP`, and both mutations that killed the behavior it guards\nsurvived with the full suite green. On ext4 the same mutations were caught. The\nguard is present or absent depending on where the developer's temp directory\nlives, and the suite reports success either way.\n\n## Why it matters\n\nThe pattern is worse than an untested branch. An untested branch is visibly\nuntested; this one reads as covered. A reviewer sees the test, a mutation run on\next4 confirms it catches, and the conclusion \"this behavior is guarded\" is\nrecorded — while on another machine the same commit ships unguarded.\n\nThe behavior being guarded makes it sharper. Both instances guard *degradation on\nread failure* — precisely the paths that decide whether a tool stays silent or\nemits a destructive instruction. Phase 1 of the retirement ticket found a case\nwhere one unrea\n…"},{"s":"260901-bug-ticket-scanner-silently-skips-noncanonical-status-dir","t":"wsdoc ticket scanner silently skips non-canonical status directories (e.g. non-hidden done/)","st":"idea","c":"bug","k":6,"ph":[0,1],"odq":0,"bh":0,"ln":86,"as":null,"x":[[182,"related","adjacent scanner robustness/observability topic in the same wsdoc ticket-resolution path",""]],"sim":[[189,0.255,[["tickets_verify",1],["git.commit",1],["canonical",0],["drift",0]],0],[198,0.153,[["tickets.go",1],["scantickets",1],["wsdoc",0],["statuses",0]],0],[113,0.124,[["scantickets",1],["tickets.go",1],["scan",0],["walk",0]],0],[182,0.105,[["stem",0],["directory",0],["wsdoc",0],["silently",0]],0],[96,0.089,[["canonical",0],["normalize",0],["listing",0],["dot",0]],0],[97,0.086,[["scantickets",1],["scan",0],["silently",0],["skip",0]],0],[197,0.082,[["wsdoc",0],["tickets_mutate.go",1],["stem",0]],0],[273,0.081,[["tickets_mutate.go",1],["wsdoc",0],["anchor",0]],0]],"kw":[["tickets_verify",1],["tickets.go",1],["tickets_verify.go",1],["scanner",0],["statuses",0],["wsdoc",0]],"pv":"## Background\n\nSurfaced in the same downstream `wsflow` v0.44.2 dogfood that produced the\n`enter.proceed` report. The downstream repo had a **non-hidden**\n`ai-docs/tickets/done/` directory, while the canonical archive name is the\n**dotted** `.done/`. Observed consequences:\n\n- `tickets_list` (default listing) missed a ticket that lived in `done/`; it\n  surfaced only via an explicit `statuses:[\"done\"]` query.\n- `git.commit` twice emitted `related: 260818-... resolves to no ticket stem and\n  no spec anchor` for a ticket whose file existed at `ai-docs/tickets/done/...`.\n\nRoot cause: the scanner's status-directory set is the canonical five dotted/bare\nnames only. `statusDirs` (`wsdoc/tickets_mutate.go:73-79`) maps\n`idea/todo/ready/.done/.dropped`; `EffectiveTicketStatuses`\n(`wsdoc/tickets.go:364-392`) builds the walk list from those; `scanTickets`\n(`wsdoc/tickets.go:229-247`) joins each canonical name under the tickets root.\n`normalizeTicketStatus` (`tickets.go:394-405`) maps a *requested* token\n`done→.done`, but that normalizes the caller's status argument, not directory\nnames found on disk. So a non-hidden `done/` is never joined, never walked, and\nits tickets are invisible to the scan — with **no warning**. `tickets_verify`\n(`tickets_verify.go:134-139`) knows the canonical five-directory set and can flag\nother directory names as invalid, but that check is not surfaced in the normal\nlist/commit/resolve path.\n\nNote: this is separate from — and was NOT the cause of — the companion\n…"},{"s":"260909-research-ws-refoundation-evidence-audit","t":"Evidence audit behind the ws refoundation: assumption verdicts, cost centers, rejected alternatives","st":"idea","c":"research","k":1,"ph":[0,0],"odq":0,"bh":0,"ln":171,"as":null,"x":[[185,"parent","",""],[178,"related","prior binding anchor; harness-infrastructure axis only",""]],"sim":[[185,0.249,[["drain-ready-queue",1],["refoundation",0],["mental",0],["mental-model",1]],0],[202,0.197,[["scarce",0],["delegation",0]],1],[178,0.141,[["mercenary",0],["mental",0],["lead-proceed",1],["reshape",0]],0],[179,0.084,[["mental",0],["lead-proceed",1],["ferrule",0],["domain",0]],0]],"kw":[["prep",0],["mental",0],["mental-model",1],["refoundation",0],["forge-",1],["#yymmdd-slug",1]],"pv":"## Background\n\nThe owner's thesis: the ws workflow was carried over from earlier model\ngenerations, where it enforced common-sense implementation and respect for\nproject conventions; with current models it acts as ballast, because capable\nmodels follow the workflow's conservative biases faithfully where earlier\nmodels ignored them. The owner asked for a destructive re-evaluation: not\n\"adjust\", but \"is the workflow built on assumptions that are now false\".\n\nThis ticket records the evidence gathered by five parallel audits (anchor\ndirection, ceremony cost, spec/mental-model efficacy, bootstrap coupling,\nprior simplification history) plus one harness-capability check, and the\nverdicts the owner confirmed. It is intended to become the repository's\nbinding anchor for the topics: lead surface, worker interpreter,\ndocument-layer retirement, stop conditions.\n\n## Truth criterion\n\nConfirmed by the owner. A layer survives only if reconstructing its value on\ndemand with a current model (code, tests, git history, current context\nbudget) costs more than maintaining it. Two facts sharpen it:\n\n- Humans never audit `ai-docs/`; every human-facing answer is an AI digest.\n  A drifted document is therefore a stale intermediary with negative value.\n- The owner's prior simplification path was already \"deterministic, tool\n  reconstructable\" almost every time; this criterion pushes that to its end.\n\n## Assumption verdicts\n\n| # | Assumption | Evidence | Verdict |\n|---|---|---|---|\n| A1 | Models cannot\n…"},{"s":"260910-feat-ws-agent-list-bounded-output","t":"Bound and filter ws-agent-list output","st":"idea","c":"feat","k":12,"ph":[0,1],"odq":0,"bh":0,"ln":30,"as":null,"x":[],"sim":[[46,0.09,[["filter",0],["response",0],["bounded",0],["page",0]],0]],"kw":[["dormant",0],["capacity",0],["ws-agent-list",1],["eviction",0],["recent",0],["revival",0]],"pv":"## Background\n\n`ws-agent-list` currently returns every entry in the persistent RPC agent registry, including dormant agents, without filtering, sorting, pagination, or a response limit. Dormant records survive reload through the sidecar and are retained until capacity eviction, so the response can grow toward the default 256-record registry cap. This makes active agents and recent recovery targets progressively harder to find and spends model context on stale entries.\n\nThe list should remain a reliable recovery surface without emitting the full dormant history by default.\n\n## Decisions\n\n- The default response should show every active agent and only a bounded recent subset of dormant agents.\n- The response should state how many older dormant records were hidden and direct callers to an explicit broader query.\n- Add status filtering so callers can request running, idle, or dormant records deliberately.\n- Add bounded pagination through a limit plus cursor (or an equivalent stable continuation contract) rather than an unbounded all-record response.\n- Preserve lookup and recovery by alias or agent ID even when a record is omitted from the default list response.\n- Preserve the registry capacity, dormant eviction, sidecar persistence, parking, and revival semantics; this ticket changes list discovery, not agent lifetime.\n- Do not delete dormant session files merely because a record is hidden from or paged out of list output.\n\n## Phases\n\nDefine and implement the list request and resp\n…"},{"s":"260913-bug-ticket-guardrails-dont-enforce-category-enum","t":"Ticket write-guardrails accept a non-enumerated category token (e.g. `test`) instead of enforcing the category enum","st":"idea","c":"bug","k":6,"ph":[0,0],"odq":0,"bh":0,"ln":67,"as":null,"x":[[187,"related","source — the closed ticket whose invalid `test` category token surfaced this gap",""]],"sim":[[182,0.132,[["tickets.verify",1],["stem",0],["argue",0],["integrity",0]],0],[278,0.119,[["tickets.create_empty",1],["tickets.verify",1],["create",0]],0],[261,0.089,[["immutable",0],["ledger",0],["investigation",0],["proposal",0]],0],[181,0.08,[["tickets.verify",1],["ticket-conventions",1],["stem",0],["grep",0]],0]],"kw":[["tickets.verify",1],["category",0],["chore",1],["guardrail",0],["tickets.create_empty",1],["refactor",0]],"pv":"## Background\n\nSurfaced by the ship-gate fit review of range `203e555c..develop` (2026-09-13).\nThe ticket `260913-test-mailbox-and-landing-gate-coverage-gaps` was authored,\n`tickets.verify`-passed, committed, moved through `ready/` → `.done/`, and\nshipped, all while carrying the category token `test` — which is NOT one of the\nsix enumerated categories the `ticket-conventions` doc defines (`bug`, `feat`,\n`refactor`, `chore`, `research`, `epic`). No other ticket in repo history uses\n`test`; it was a one-off authoring slip that nothing mechanical caught.\n\nThe lead accepted that specific closed ticket as a documented exception rather\nthan renaming it (its stem is an immutable absolute reference already cited by\ncommits e31576b8 / a6bcece1 / d448e421 and the review-ledger `ref`; a\nconvention-clean rename means drop+recreate, which would break `git log --grep`\nhistory for a cosmetic gain). This ticket tracks the ROOT cause instead: the\nguardrails do not enforce the category enum, so the next typo lands the same way.\n\n## Investigation\n\n`tickets.verify` (and the same checks `git.commit` runs before committing a\nticket-touching change) validate stem/status-dir shape, frontmatter fence\nintegrity, sage posture, and phase/Result heading well-formedness — but the\n`<category>` segment of `YYMMDD-<category>-<name>` is not checked against the\nenumerated set. Locate the stem/path guardrail (the same one that validates the\nstatus directory and date prefix) in the ticket-tooling source\n(`agents\n…"},{"s":"260915-bug-ticket-move-parallel-index-lock-contention","t":"Concurrent ticket moves in one worktree contend on the Git index lock","st":"idea","c":"bug","k":1,"ph":[0,1],"odq":0,"bh":0,"ln":18,"as":null,"x":[],"sim":[[135,0.144,[["move",0],["contention",0],["index",0],["worktree",0]],0],[152,0.138,[["worktree",0],["surprise",0],["aware",0],["promotion",0]],0],[151,0.097,[["successful",0],["surprise",0],["caller",0],["mutation",0]],0],[186,0.092,[["concurrency",0],["serially",0],["worktree",0],["overlap",0]],0],[103,0.088,[["worktree",0],["parallel",0],["surprise",0],["observation",0]],0],[111,0.085,[["worktree",0],["index",0],["caller",0],["surprise",0]],0]],"kw":[["index.lock",1],["tickets.move",1],["coherently",0],["concurrency",0],["contention",0],["lock",0]],"pv":"## Background\n\nDogfood observation on 2026-09-15: three `tickets.move(..., to: \"ready\")` calls were dispatched concurrently against the same worktree. Two failed at `git add` with `index.lock: File exists`, while the third completed and moved its ticket. The caller then had to move the successful ticket back to its original status before retrying the batch serially.\n\nThis makes a seemingly independent multi-ticket promotion non-atomic at the caller level and exposes a raw Git lock failure. The ticket records the concurrency surprise only; serialization, lock-aware retry, and explicit same-worktree concurrency rejection remain implementation choices for later settlement.\n\n## Phases\n\nReproduce concurrent ticket status mutations against one worktree, choose a bounded concurrency contract, and ensure a batch caller cannot be left with one successful status move plus sibling raw `index.lock` failures without actionable recovery guidance. Preserve independent operations across separate worktrees."},{"s":"260915-bug-ticket-worker-serial-route-acquires-extra-worktree","t":"Serial lead-run worker can acquire an unrequested second worktree","st":"idea","c":"bug","k":1,"ph":[0,1],"odq":0,"bh":0,"ln":20,"as":null,"x":[[186,"related","defines worktree provisioning as an explicitly user-gated parallel-route behavior",""]],"sim":[[186,0.317,[["serial",0],["worktree.acquire",1],["provision",0],["acquire",0]],0],[108,0.299,[["acquire",0],["checkout",0],["lead-run",1],["serial",0]],0],[152,0.283,[["acquire",0],["worktree.acquire",1],["surprise",0],["prevent",0]],0],[12,0.244,[["worktree.acquire",1],["serial",0],["acquire",0],["unrequested",0]],0],[196,0.195,[["worktree.acquire",1],["provision",0],["acquire",0],["lead-run",1]],0],[111,0.187,[["acquire",0],["impl",0],["worktree",0],["surprise",0]],0],[115,0.183,[["worktree.acquire",1],["pool",0],["parallel",0],["acquire",0]],0],[206,0.175,[["provision",0],["acquire",0],["worktree.acquire",1],["checkout",0]],0],[278,0.174,[["worktree.acquire",1],["acquire",0],["checkout",0],["impl",0]],0],[124,0.116,[["acquire",0],["worktree",0],["checkout",0],["profile",0]],0],[281,0.113,[["acquire",0],["worktree",0],["guard",0],["parent",0]],0],[195,0.092,[["worktree.acquire",1],["acquire",0]],0],[102,0.088,[["worktree",0],["parallel",0],["surprise",0],["observation",0]],0],[104,0.082,[["worktree.acquire",1],["acquire",0],["observation",0]],0],[147,0.08,[["resulting",0],["procedural",0],["additional",0],["capability",0]],0]],"kw":[["serial",0],["worktree.acquire",1],["acquire",0],["provision",0],["unrequested",0],["checkout",0]],"pv":"## Background\n\nDogfood observation on 2026-09-15: the lead acquired one isolated worktree and explicitly selected the serial `lead-run` route with no additional worktree. The spawned ticket worker nevertheless called `worktree.acquire`, created a second pooled worktree, and implemented on that checkout. The lead's acquired checkout remained on the parent goal branch while the worker reported an impl branch in the second worktree.\n\nThe serial lead-run contract says the worker checkout is shared and outlives the turn; worktree provisioning belongs to the separately approved parallel route. The ticket records the deviation and the resulting branch-location surprise. The enforcement location is not yet settled.\n\n## Phases\n\nReproduce a serial ticket-worker run with `worktree.acquire` visible in its lead-capability tool profile, establish a mechanical or procedural guard that prevents unapproved provisioning, and verify the parallel route can still acquire one worktree per approved ticket. The lead and worker must report the same checkout and branch location in serial mode."},{"s":"260916-research-pi-ts-suite-outside-release-ci-contract-rot","t":"agents-plugin-pi TS suite is outside release CI, so its contract tests rot unnoticed","st":"idea","c":"research","k":6,"ph":[0,0],"odq":0,"bh":0,"ln":69,"as":null,"x":[[188,"related","the tool addition that pushed the stale bridge.test.ts contract from 56 to 57",""]],"sim":[[110,0.303,[["bridge.test.ts",1],["bridge.test",1],["suite",0],["ci",0]],0],[130,0.143,[["runtime.json",1],["agents-plugin-pi",1],["bundle",0],["suite",0]],0],[199,0.125,[["ci",0],["github",0],["green",0],["yml",0]],0],[116,0.122,[["npm",0],["opt",0],["marker",0],["ts",0]],0],[142,0.104,[["suite",0],["agents-plugin-pi",1],["green",0],["environment",0]],0],[12,0.095,[["worktree.release",1],["acquire",0],["workflow",0],["purpose",0]],0],[124,0.094,[["worktree.release",1],["workflow",0],["acquire",0],["outside",0]],0],[135,0.087,[["suite",0],["investigation",0],["count",0],["develop",0]],0],[188,0.086,[["rationale.query",1],["runtime.json",1],["thread",0],["agents-plugin-pi",1]],0],[103,0.082,[["worktree.acquire",1],["acquire",0],["observation",0]],0],[152,0.082,[["worktree.acquire",1],["acquire",0],["observation",0],["investigation",0]],0]],"kw":[["rot",0],["bridge.test.ts",1],["bridge.test",1],["ci",0],["runtime.json",1],["unnoticed",0]],"pv":"## Status of this ticket\n\nDirection / investigation. Surfaced during the ws 0.46.8 ship-gate sweep. No\nowner agreement required to investigate, but the CI-scope and contract-shape\nchoices below are observable-workflow changes — confirm the approach before\nimplementing.\n\n## Observation\n\nThe release workflow (`.github/workflows/ws-mcp-release.yml`) runs only\n`go test ./...` in `agents-plugin-tool` (plus a Windows Go smoke). It never runs\nthe `agents-plugin-pi` TypeScript suite (`npm test`). As a result, hand-maintained\ncontract assertions in that suite can go red and stay red across releases without\nanyone noticing.\n\nConcrete instance found at the 0.46.8 ship: `agents-plugin-pi/test/bridge.test.ts`\nasserted `bundledToolNames.length === 54` and deep-equalled a hand-maintained\n`LIVE_TOOL_NAMES` snapshot of 54 tools, but `runtime.json` already carried 56\ntools at the 0.46.7 ship (`worktree.acquire`, `worktree.release` had been added\nwithout updating the snapshot) and 57 after this batch added `rationale.query`.\nThe test had therefore been shipping red since at least 0.46.7. It was fixed\nreactively in this ship (commit 160d8ec4), but only because a reviewer happened\nto run the full pi suite by hand.\n\nA second, different failure mode lives in the same suite:\n`test/web-startup.test.ts` is a real-process startup test that fails in any\nenvironment without a compatible `ws-mcp` binary (it failed locally during the\nship), so \"the pi suite is green\" is not currently a clean, portable sign\n…"},{"s":"260918-chore-pi-mailbox-waiter-epoch-race-test-coverage","t":"pi mailbox waiter epoch-race guard has no regression test (lifecycle harness missing)","st":"idea","c":"chore","k":6,"ph":[0,0],"odq":0,"bh":0,"ln":56,"as":null,"x":[[191,"related","origin — the guard this ticket wants to test",""]],"sim":[[191,0.42,[["session_start",1],["session_shutdown",1],["resolvemailboxselfslug",1],["waiter",0]],0],[220,0.148,[["arm",0],["mailbox.go",1],["waiter",0],["wsmailbox",1]],0],[204,0.14,[["mailbox.go",1],["waiter",0],["arm",0],["wsmailbox",1]],0],[194,0.139,[["waiter",0],["arm",0],["mailbox",0],["subprocess",0]],0],[218,0.095,[["arm",0],["waiter",0],["mailbox",0],["agents-plugin-pi",1]],0],[231,0.09,[["waiter",0],["arm",0],["mailbox",0],["subprocess",0]],0]],"kw":[["session_start",1],["session_shutdown",1],["epoch",0],["mailboxwaiterepoch",1],["extensionapi",1],["arm",0]],"pv":"## Background\n\nCaptured from the `v0.46.11` ship-gate review sweep (range\n`4c5c2d43..develop`, Test partition, Important). Code was accepted for release\nby explicit user override with this follow-up; correctness was independently\nverified, so this is a **regression-protection gap, not a live defect**.\n\n`260917-feat-ws-pi-mailbox-waiter-slug-wake` added an `await\nresolveMailboxSelfSlug(...)` before `mailboxWaiterHandle` is assigned at the pi\n`session_start` arm site. That await opened a window where a rapid double\n`session_start` (`/reload`) — or a `session_start` racing a `session_shutdown` —\ncould leak a waiter subprocess or leave two live waiters double-admitting mail.\nThe fix (commit `b75c4075`) added a monotonic `mailboxWaiterEpoch` counter,\nbumped at every reset site (arm site, `session_shutdown`); the post-await\n`armEpoch === mailboxWaiterEpoch` check drops a stale arm attempt.\n\nThe guard's logic was verified correct by the ship review's Correctness\npartition, but **no test exercises it**, and the harness needed to write one\ndoes not exist yet: no test in `agents-plugin-pi/test/*.ts` constructs a fake pi\n`ExtensionAPI` and calls `wsPiBridgeExtension()` to drive `session_start` /\n`session_shutdown` directly. So a future edit that reorders the epoch-bump vs\nthe await could silently regress the fix with nothing in CI to catch it; today\nonly a live two-`/reload` dogfood run would surface it, and that manual check\nwas recorded as not performed.\n\n## Suggested scope\n\n- Stand u\n…"},{"s":"260920-bug-pi-rpc-child-stderr-cascades-into-tui","t":"Nested Pi RPC child stderr cascades unframed into the parent TUI","st":"idea","c":"bug","k":8,"ph":[0,1],"odq":0,"bh":0,"ln":50,"as":null,"x":[[194,"related","same user-visible terminal contamination through a different producer and routing path",""],[193,"related","observed native crash whose raw stderr exposed this transport behavior",""]],"sim":[[194,0.25,[["tui",0],["stderr",0],["sink",0],["waiter",0]],0],[193,0.101,[["libc",0],["recursive",0],["grandchild",0],["abi",0]],0],[65,0.086,[["stderr",0],["stdout",0],["children",0],["client",0]],0]],"kw":[["stderr",0],["tui",0],["rpc",0],["cascade",0],["unframed",0],["grandchild",0]],"pv":"## Background\n\nA native filesystem crash in a nested Pi process appeared directly in the lead\nTUI as an unprefixed `libc++abi` diagnostic. Pi's installed `RpcClient` spawns\nchildren with piped streams, accumulates child stderr, and also writes each chunk\ndirectly to `process.stderr`. Because workers can spawn their own RPC children,\nraw stderr can cascade across process levels:\n\n grandchild stderr -> worker RpcClient -> worker stderr -> lead RpcClient -> lead stderr -> TUI\n\nRPC stdout remains reserved for JSONL events; the observed terminal text is raw\nstderr contamination even if it visually appears in the same TUI output area.\nThis path is separate from `MailboxWaiterDeps.onError` and the ready mailbox\nstderr-leak ticket.\n\n## Open Questions\n\n- Should child stderr become a framed RPC diagnostic event, a captured artifact,\n  or an adapter-owned bounded diagnostic sink?\n- Which diagnostics remain immediately human-visible, and where should they be\n  rendered without corrupting the interactive TUI?\n- Does the upstream Pi `RpcClient` need the fix, or can the adapter contain the\n  behavior without forking or patching installed runtime code?\n- How should repeated stderr across recursive levels avoid duplication while\n  retaining the originating agent identity?\n\n## Phases\n\nReproduce stderr emission from a grandchild and replace unframed recursive\n`process.stderr` forwarding with a transport and presentation path that retains\nthe originating agent identity without contaminating the\n…"},{"s":"260920-bug-pi-tool-call-timeout-and-process-cleanup","t":"Pi tool calls need bounded execution and subprocess-tree cleanup","st":"idea","c":"bug","k":6,"ph":[0,1],"odq":0,"bh":0,"ln":54,"as":null,"x":[],"sim":[[160,0.151,[["cancellation",0],["timeout",0],["transport",0],["bounded",0]],0],[114,0.122,[["timeout",0],["transport",0],["stall",0],["cleanup",0]],0],[135,0.089,[["timeout",0],["subprocess",0],["caller",0],["deadline",0]],0],[271,0.084,[["descendant",0],["cleanup",0],["externally",0],["timeout",0]],0],[204,0.083,[["sigterm",0],["orphan",0],["terminate",0],["node",0]],0],[200,0.082,[["transport",0],["timeout",0],["verifying",0],["stop",0]],0]],"kw":[["ppid",0],["macos",1],["subprocess",0],["impose",0],["descendant",0],["distinguishable",0]],"pv":"## Background\n\nDuring the `260914-feat-ws-pi-subagent-subtree-propagation-and-nested-gutter`\ndogfood run, the nested `nested-picker` agent invoked\n`node --test test/audit.test.ts` through a Bash tool call. The tool call never\nreturned, the test process survived with PID 86310 and PPID 1, and the agent\nproduced no further transcript activity for approximately three hours and forty\nminutes. Recovery required stopping the agent, terminating the orphan process\nwith SIGTERM, verifying that no matching process remained, and resuming the\nagent with an externally imposed 60-second command bound.\n\nThis is separate from the later recursive terminal-message delivery stall: this\nticket concerns bounded tool execution and process cleanup, not agent-message\ntransport.\n\n## Decisions\n\n- Add a caller-selectable timeout parameter to the applicable tool-call path so\n  long-running commands can be bounded explicitly instead of waiting forever.\n- Timeout or cancellation must clean up the spawned subprocess tree rather than\n  leave detached or PPID-1 descendants behind, and must return a distinguishable\n  timeout/cancellation result to the caller.\n- Do not impose a lifetime timeout on subagents. Agent lifetime remains\n  independent; only the individual tool invocation is bounded.\n\n## Open Questions\n\n- Which Pi tool-call surface owns the timeout parameter, and what name, unit,\n  maximum, and default preserve compatibility?\n- What process-group or job-object strategy provides reliable descendant cle\n…"},{"s":"260921-bug-pi-parallel-worktree-workers-inherit-lead-cwd","t":"Pi parallel worktree workers inherit the lead cwd and can mutate its checkout","st":"idea","c":"bug","k":1,"ph":[0,1],"odq":0,"bh":0,"ln":20,"as":null,"x":[[195,"related","provides the missing per-spawn placement primitive",""]],"sim":[[195,0.303,[["cwd_override",1],["cwd",0],["ws-agent-spawn",1],["acquire",0]],0],[103,0.299,[["acquire",0],["checkout",0],["lead-run",1],["serial",0]],0],[186,0.231,[["root_override",1],["acquire",0],["lead-run",1],["worktree",0]],0],[152,0.168,[["acquire",0],["worktree",0],["parallel",0],["capability",0]],0],[278,0.14,[["acquire",0],["worktree",0],["primitive",0],["inherit",0]],0],[111,0.14,[["acquire",0],["develop",0],["worktree",0],["inside",0]],0],[53,0.11,[["root_override",1],["worktree",0],["develop",0],["override",0]],0],[281,0.109,[["acquire",0],["worktree",0],["develop",0]],0],[12,0.108,[["cwd",0],["acquire",0],["worktree",0],["serial",0]],0],[206,0.103,[["cwd",0],["acquire",0],["checkout",0],["worktree",0]],0],[196,0.1,[["acquire",0],["lead-run",1],["worktree",0],["rename",0]],0],[115,0.093,[["parallel",0],["worktree",0],["acquire",0],["playbook",0]],0],[124,0.089,[["acquire",0],["worktree",0],["checkout",0]],0],[225,0.089,[["ws-agent-spawn",1],["cwd",0],["playbook",0],["prompt",0]],0],[184,0.083,[["cwd",0],["ws-agent-spawn",1],["primitive",0]],0],[42,0.083,[["capability",0],["peer",0],["primitive",0],["relate",0]],0]],"kw":[["cwd_override",1],["cwd",0],["root_override",1],["acquire",0],["ws-agent-spawn",1],["inherit",0]],"pv":"## Background\n\nDuring an approved `lead-run` parallel batch, each ticket received an acquired worktree and a worker prompt rendered with that worktree as `root_override`. The spawned Pi agents nevertheless inherited the lead process cwd. Before editing, one worker observed that its ws session key was bound to the acquired worktree while native Git commands still ran in the lead checkout; another worker's route renamed the lead checkout's `develop` branch to an implementation branch, removing the local `develop` ref and blocking peer route preflight.\n\nThis makes the current parallel route's apparent worktree isolation unsafe until native child cwd placement is explicit. The related `cwd_override` ticket supplies the missing spawn primitive, but the run playbook must also pass the acquired worktree path and fail safely when the runtime lacks that capability.\n\n## Phases\n\nAfter `cwd_override` is available, make the parallel run route pass each acquired worktree path to `ws-agent-spawn`. Add a capability-safe stop or serial fallback for runtimes that cannot set the child cwd. Verification must prove that worker-native Git and filesystem operations run inside the acquired worktree and cannot rename or modify the lead checkout's branch."},{"s":"260921-chore-pi-mirror-doc-completeness","t":"Name agents-plugin-pi as the third committed mirror in mirroring docs","st":"idea","c":"chore","k":5,"ph":[0,1],"odq":0,"bh":0,"ln":51,"as":null,"x":[],"sim":[[243,0.163,[["testpimirroruptodate",1],["testwsflowrsrcmirroruptodate",1],["agents-plugin-pi",1],["rsrc",0]],0],[193,0.135,[["agents-plugin-pi",1],["pack",0],["skill",0],["mjs",0]],0],[130,0.12,[["runtime.json",1],["agents-plugin-pi",1],["ws-mcp-launcher",1],["tree",0]],0],[208,0.102,[["wsflow-mirroring.md",1],["orientation",0],["runtime.json",1],["wsflow",0]],0],[188,0.097,[["testpimirroruptodate",1],["date",0],["agents-plugin-pi",1],["runtime.json",1]],0],[223,0.097,[["agents-plugin-pi",1],["ws-mcp-launcher.py",1],["shim",0],["look",0]],0],[207,0.093,[["bump",0],["agents.md",1],["bin",0],["launcher",0]],0],[140,0.092,[["ws-mcp-launcher.py",1],["agents.md",1],["bump",0],["launcher",0]],0],[186,0.089,[["gitignore",0],["testpimirroruptodate",1],["testwsflowrsrcmirroruptodate",1],["rsrc",0]],0],[247,0.087,[["agents-plugin-pi",1],["ws-mcp-launcher.py",1],["runtime.json",1],["bin",0]],0],[159,0.
