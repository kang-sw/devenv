al (assert completion/ordering, or a fake clock), not a tighter\nreal-time bound. For `claude-lifecycle.test.ts`, make the cleanup-confirmation\nwait on the actual lifecycle event/condition rather than a scheduling-dependent\nwindow. Verify by running the full `agents-plugin-pi` suite repeatedly (e.g. a\nhandful of back-to-back r\n…"},{"s":"260924-bug-acquire-impl-record-ignores-branch-stem","t":"tickets.acquire records any impl branch as the ticket's impl","st":"idea","c":"bug","k":1,"ph":[0,0],"odq":0,"bh":0,"ln":38,"as":null,"x":[],"sim":[[196,0.238,[["git.status",1],["impl",0],["stem",0],["acquire",0]],0],[135,0.205,[["impl",0],["lease",0],["develop",0],["index",0]],0],[103,0.187,[["acquire",0],["impl",0],["worktree",0],["surprise",0]],0],[12,0.171,[["acquire",0],["lease",0],["impl",0],["unleased",0]],0],[152,0.152,[["acquire",0],["worktree",0],["surprise",0],["dogfood",0]],0],[108,0.14,[["acquire",0],["develop",0],["worktree",0],["inside",0]],0],[206,0.139,[["lead-scope-worktree",1],["acquire",0],["lease",0],["worktree",0]],0],[281,0.138,[["acquire",0],["worktree",0],["develop",0],["behave",0]],0],[278,0.138,[["acquire",0],["impl",0],["lease",0],["worktree",0]],0],[197,0.122,[["acquire",0],["lease",0],["stem",0],["index",0]],0],[44,0.11,[["impl",0],["stem",0],["dogfood",0]],0],[151,0.104,[["git.status",1],["caller",0],["surprise",0],["worktree",0]],0],[124,0.103,[["acquire",0],["worktree",0],["fresh",0],["unrelated",0]],0],[192,0.1,[["impl",0],["develop",0],["ignore",0],["dogfood",0]],0],[186,0.099,[["acquire",0],["impl",0],["worktree",0]],0],[115,0.097,[["impl",0],["acquire",0],["worktree",0],["surprise",0]],0],[187,0.09,[["git.status",1],["acquire",0],["stem",0]],0],[102,0.085,[["worktree",0],["index",0],["caller",0],["surprise",0]],0],[130,0.081,[["scratch",0],["develop",0],["suffix",0],["dogfood",0]],0]],"kw":[["impl",0],["acquire",0],["lead-scope-worktree",1],["stem",0],["git.status",1],["suffix",0]],"pv":"## Background\n\nDogfood surprise on 2026-09-24, in the Phase 4 H1 cycle of\n`260924-feat-origin-ticket-ownership-index`. The worktree on\n`impl/develop/irate-growl-half` acquired the unleased scratch stem\n`260924-idea-ownership-dogfood-scratch-b`. The result was\n`status: acquired` with `impl_branch: impl/develop/irate-growl-half`, a branch\nthat belongs to a different ticket.\n\n- `indexCaller.implBranch` (`agents-plugin-tool/internal/mcp/ticket_index.go`)\n  returns the caller's branch for any `impl/` or `implement/` prefix, and\n  acquire stores it on every lease it writes.\n- The ticket's Worker impl record decision covers one case only: a worker's\n  acquire from its impl branch that matches the existing lease's triple.\n  Neither the decision nor the tests cover a fresh acquire, or an acquire of an\n  unrelated stem, made from an impl branch.\n- The canonical impl branch for a stem is derivable\n  (`implTicketBranch(base, stem)`, `implTicketSuffix`), so acquire could\n  record `impl` only when the caller's branch matches the stem's derived\n  suffix.\n\nEffect: the view and `git.status` show a wrong `impl <branch>` for a ticket\nthat was acquired while standing on another ticket's impl branch, for example\nfrom `lead-scope-worktree` run inside an impl worktree.\n\n## Open questions\n\n- Should acquire record `impl` only when the branch suffix matches\n  `implTicketSuffix(stem)`, and otherwise behave as a plain acquire?\n- Should a fresh acquire (no existing lease) from an impl branch record `impl\n…"},{"s":"260924-bug-ws-config-project-scope-is-machine-wide","t":"ws config \"project\" scope resolves to one machine-wide file","st":"idea","c":"bug","k":5,"ph":[0,0],"odq":0,"bh":0,"ln":43,"as":null,"x":[],"sim":[[201,0.44,[["wsconfig",0],["config.json",1],["agents.tier",1],["resolver.go",1]],1],[85,0.292,[["config.json",1],["wsconfig",0],["cacheroot",1],["worktree_pool",1]],0],[117,0.219,[["config.json",1],["wsconfig",0],["agents.tier",1],["tune",0]],0],[206,0.199,[["config.json",1],["wsconfig",0],["repo.go",1],["agents.tier",1]],0],[92,0.187,[["config.json",1],["wsconfig",0],["scope.go",1],["tune",0]],0],[50,0.185,[["wsconfig",0],["bucket",0],["config.list",1],["tune",0]],0],[11,0.125,[["wsconfig",0],["config.tune",1],["scope.go",1],["bucket",0]],0],[186,0.125,[["worktree_pool",1],["wsconfig",0],["config.tune",1],["reset",0]],0],[273,0.119,[["wsconfig",0],["bucket",0],["playbook_tools.go",1],["scope.go",1]],0],[143,0.115,[["config.tune",1],["tune",0],["codex",0],["global",0]],0],[87,0.115,[["agents.tier",1],["wsconfig",0],["config",0],["bucket",0]],0],[225,0.112,[["agents.tier",1],["tune",0],["bucket",0],["wsconfig",0]],0],[13,0.085,[["wsconfig",0],["bucket",0],["resolver.go",1],["catalog",0]],0]],"kw":[["cacheroot",1],["config.json",1],["wsconfig",0],["agents.tier",1],["ws@kang-sw-devenv",1],["wsconfig.options",1]],"pv":"## Background\n\nDogfood surprise on 2026-09-24 during `/ws:lead-tune` (resetting project-scope\n`agents.tier` mappings). The user asked to reset \"this project's bucket and any\nother project buckets\"; there are no per-project buckets.\n\n- `wsconfig.Path` returns `CacheRoot/config.json`, and `CacheRoot` with empty\n  `Options` is `~/.cache/ws@kang-sw-devenv` (or `$WS_CACHE_HOME`). No project\n  key enters the path.\n- MCP callers construct `wsconfig.Options{}` (e.g. `internal/mcp/server.go`,\n  `playbook_tools.go`), so every project on the machine reads and writes the\n  same \"project\" file.\n- Code comments describe the scope as \"per-project, machine-local\n  (`~/.ws@<id>/config.json`)\" (`internal/wsconfig/scope.go`,\n  `internal/wsconfig/repo.go`, `internal/wsconfig/resolver.go`), and\n  `worktree_pool` defaults to project scope on the premise that it is\n  per-project.\n\nEffectively \"project\" scope is a second machine-wide layer above `global`\n(`~/.ws/config.json`). A `config.tune` write meant for one project silently\nchanges every project.\n\n## Open questions\n\n- Intended semantics: key the project file by the project identity already\n  computed in `wsstate` (`projects/<rootID>/config.json`), or rename/document\n  the scope as machine-wide?\n- Migration for existing `CacheRoot/config.json` content if the path moves.\n- Whether `config.list` should surface which file each scope reads.\n\n## Related observation\n\n`config.tune` reset for `agents.tier` removes only `model_aliases` leaves; a\nlegacy `\n…"},{"s":"260924-research-rationale-incremental-history-cache","t":"Incremental commit-history cache for rationale.query","st":"idea","c":"research","k":6,"ph":[0,0],"odq":0,"bh":0,"ln":123,"as":null,"x":[[198,"related","sibling discussion; GC was found not to reduce this cost",""]],"sim":[[198,0.4,[["wsrationale",1],["rationale.query",1],["tickets.query",1],["scantickets",1]],0],[188,0.243,[["wsrationale",1],["rationale.query",1],["pickaxe",0],["tickets.query",1]],0],[98,0.124,[["scantickets",1],["tickets.go",1],["scan",0],["walk",0]],0],[83,0.085,[["truncate",0],["kinds",0],["history",0],["scan",0]],0],[69,0.082,[["discuss",0],["measurement",0],["history",0],["cost",0]],0]],"kw":[["wsrationale",1],["scantickets",1],["rationale.query",1],["tickets.query",1],["kinds",0],["cat",1]],"pv":"## Background\n\nWhile discussing whether terminal tickets (`.done/`, `.dropped/`) should be\ngarbage-collected because they accumulate without bound, the actual per-call\ncost was measured. The terminal-ticket file scan turned out to be cheap; the\ndominant cost of `rationale.query` is its full commit-history walk, which\ngrows with commit count, not ticket count, and which deleting tickets does\nnot touch. The user judged this cache potentially more urgent than the GC and\nasked for it to be captured as research.\n\n## Measurements (2026-09-24, this repository, macOS)\n\nWall times via `ws-cli call`, so each includes CLI process startup:\n\n| Call | Time |\n|---|---|\n| `tickets.query` (no match), live statuses only | 0.09s |\n| `tickets.query` (no match), with `.done/` + `.dropped/` | 0.18s |\n| raw read of all 666 terminal ticket files (`cat`) | 0.04s |\n| `rationale.query(query, kinds: [commit])` | 1.43s |\n| `rationale.query(query, kinds: [ticket])` | 2.02s |\n| `git log --name-only --format=%H%n%B HEAD` alone | 1.14s |\n| `git log --format=%H%n%B HEAD` alone (no paths) | 0.13s |\n\nHistory depth at measurement: 6,899 commits; 566 `.done/` + 100 `.dropped/`\ntickets (7.5 MB).\n\n## Current Mechanism\n\n- `queryScan` (default, path, and text-query modes) always runs\n  `scanCommits` and then `scanTickets`\n  (`agents-plugin-tool/internal/wsrationale/rationale.go`, `queryScan`).\n  `kinds` filters at assembly, so `kinds: [ticket]` still pays the full commit\n  walk.\n- `scanCommits` runs `git log --date=s\n…"},{"s":"260925-bug-windows-remote-timeout-leaves-child-processes","t":"Windows remote-command timeout leaves git and ssh children running","st":"idea","c":"bug","k":6,"ph":[0,0],"odq":0,"bh":0,"ln":59,"as":null,"x":[[197,"related","introduced the bounded read/write timeouts whose kill path this concerns",""],[199,"related","the CI gap that let the test-side symptom reach a release run",""]],"sim":[[200,0.278,[["wsindex",0],["hang",0],["ssh",0],["kill",0]],0],[197,0.162,[["wsindex",0],["ssh",0],["hang",0],["clone",0]],0],[204,0.162,[["ssh",0],["kill",0],["exe",0],["taskkill",1]],0],[63,0.146,[["execjob",1],["exec",0],["job",0],["taskkill",1]],0],[150,0.142,[["hang",0],["timeout",0],["transport",0],["production",0]],0],[190,0.14,[["execjob",1],["exec",0],["job",0],["ci",0]],0],[123,0.138,[["stdin",0],["alive",0],["hang",0],["kill",0]],0],[135,0.129,[["timeout",0],["kill",0],["timed",0],["symptom",0]],0],[107,0.122,[["timeout",0],["transport",0],["stall",0],["cleanup",0]],0],[65,0.107,[["execjob",1],["exec",0],["job",0],["outlive",0]],0],[213,0.106,[["ssh",0],["wsgit",1],["clone",0],["delay",0]],0],[149,0.105,[["timeout",0],["wsindex",0],["production",0],["stall",0]],0],[173,0.1,[["wsgit",1],["git.go",1],["server",0],["infer",0]],0],[160,0.098,[["transport",0],["timeout",0],["deadline",0],["cancel",0]],0],[137,0.092,[["ci",0],["job",0],["wsgit",1],["timeout",0]],0]],"kw":[["ssh",0],["git.go",1],["proc",0],["execjob",1],["kill",0],["wsgit",1]],"pv":"## Background\n\n`wsindex.ExecRunner.Run` (`agents-plugin-tool/internal/wsindex/git.go:105-113`)\nruns git under a context deadline. It sets `WaitDelay = 300ms` and calls\n`configureKill`:\n\n- **POSIX** (`proc_unix.go`): git runs in its own process group, and the\n  timeout SIGKILLs that whole group, including the ssh transport.\n- **Windows** (`proc_windows.go`): `configureKill` does nothing. The timeout\n  kills only the process Go started. `WaitDelay` then returns control without\n  killing anything else.\n\nEvidence from the v0.46.19 fix-forward (`ws-mcp CI` run 36079288933):\n\n- **Symptom.** The hanging-ssh test transport outlived the timed-out git call.\n  It held the test clone as its working directory, so `t.TempDir` cleanup\n  failed with \"The process cannot access the file because it is being used\n  by another process.\"\n- **Likely cause (inferred, not reproduced).** The `git` on PATH is Git for\n  Windows' `git.exe` redirector. Killing it leaves the real mingw64 `git.exe`\n  alive, and that process keeps the transport's stdin open.\n- **Tests fixed, production not.** The tests were fixed with a stop-file\n  harness (merge 30b41a3f). Production behaviour is unchanged.\n\nProduction consequence:\n\n- **What survives.** On a hanging origin, a timed-out read or write on Windows\n  can leave the real `git.exe` and `ssh.exe` running. Both keep the clone as\n  their working directory, which blocks deleting the directory and removing\n  worktrees.\n- **How long.** `batchSSHCommand` sets only `Connec\n…"},{"s":"260926-bug-parallel-workers-collide-on-shared-git-stash","t":"Parallel ticket workers collide on the repository-wide git stash","st":"idea","c":"bug","k":1,"ph":[0,0],"odq":0,"bh":0,"ln":36,"as":null,"x":[],"sim":[[103,0.183,[["worktree.acquire",1],["pool",0],["parallel",0],["acquire",0]],0],[152,0.15,[["worktree.acquire",1],["acquire",0],["parallel",0],["surprise",0]],0],[186,0.129,[["worktree.acquire",1],["pool",0],["parallel",0],["playbook",0]],0],[195,0.104,[["spawner",1],["worktree.acquire",1],["agents-plugin-pi",1],["acquire",0]],0],[12,0.099,[["worktree.acquire",1],["pool",0],["acquire",0],["impl",0]],0],[111,0.097,[["impl",0],["acquire",0],["worktree",0],["surprise",0]],0],[108,0.093,[["parallel",0],["worktree",0],["acquire",0],["playbook",0]],0],[59,0.091,[["ticket-worker-elevated",1],["ticket-worker",1],["playbook",0],["elevated",0]],0],[278,0.086,[["worktree.acquire",1],["diff",0],["acquire",0],["impl",0]],0],[177,0.085,[["ticket-worker-elevated",1],["elevated",0]],0]],"kw":[["stash",0],["ticket-worker-elevated",1],["collide",0],["ticket-worker",1],["pop",0],["refs",0]],"pv":"## Background\n\nDogfood surprise (2026-09-26, `ws:lead-run` parallel route, four pooled\nworktrees). `refs/stash` is shared by every worktree of a repository. Two\nworkers in separate pooled worktrees each ran `git stash push` / `git stash\npop` at nearly the same moment to take a test baseline, and each popped the\nother's stash:\n\n- the `260926-bug-pi-children-inherit-mailbox-identity` worker's worktree\n  ended up holding the other worker's uncommitted `agents-plugin-pi` waiter\n  edits;\n- the `260926-bug-mailbox-idle-owner-presence-goes-stale` worker's worktree\n  lost those edits and gained a duplicate of the first worker's already\n  committed spawner diff as uncommitted changes.\n\nNothing was lost only because the first worker noticed and saved both sides\nas patches. A worker that commits without noticing would land a foreign\ndiff on its impl branch and silently drop its own edits.\n\n## Direction (unsettled)\n\n- The worker playbooks (`ticket-worker`, `ticket-worker-elevated`, and any\n  other playbook that may run in a pooled worktree) forbid `git stash` and\n  name a safe baseline method instead: a throwaway worktree, or running the\n  baseline at the branch base commit before editing.\n- Alternatively or additionally, `ws/worktree.acquire` or the worker\n  preamble could flag the shared-stash hazard only when parallel worktrees\n  are live.\n- Check whether any shipped playbook or tool itself calls `git stash`."},{"s":"260927-bug-pi-develop-marker-static-manual-fixture-drifts","t":"Keep the opt-in Pi develop-marker manual check valid under current tuning","st":"idea","c":"bug","k":0,"ph":[0,1],"odq":0,"bh":0,"ln":16,"as":null,"x":[],"sim":[[125,0.184,[["gpt-6-luna",1],["luna",0],["gpt",0],["drift",0]],0],[104,0.122,[["npm",0],["opt",0],["marker",0],["ts",0]],0],[193,0.09,[["dot",0],["marker",0],["npm",0],["ts",0]],0]],"kw":[["tuning",0],["gpt-6-luna",1],["playbook.read",1],["gpt",0],["dot",0],["opt",0]],"pv":"## Background\n\nWhile verifying the Pi mailbox source-build hotfix, `WS_PI_VERIFY_DEVELOP_MARKER=1 npm test -- --test-reporter=dot test/develop-marker.integration.test.ts` failed on its pre-existing exact comparison of `playbook.read(\"lead-workflow-manual\")` to the committed static fixture. The live manual selects `gpt-6-luna` under current model tuning whereas the fixture expects `gpt-5.4-mini` and `gpt-5.5`, and the live manual includes a later worktree ownership paragraph missing from the fixture. A newly isolated source-build mailbox smoke in the same file passes independently. This is a test-fixture drift, not evidence that the mailbox runtime launch failed.\n\n## Phases\n\nDetermine whether the static fixture should be regenerated from current shipped defaults or whether this opt-in live probe should validate only stable structural properties while honoring the effective tuning scope. Ensure the test continues to detect a broken source-build/manual path without failing merely because intentional manual text or model mappings changed."},{"s":"260930-bug-wsconfig-writer-replaces-symlinked-config","t":"wsconfig shared writer replaces a symlinked config file with a regular file","st":"idea","c":"bug","k":5,"ph":[0,1],"odq":0,"bh":0,"ln":49,"as":null,"x":[[201,"related","origin (introduced the shared writer for agents.tier)",""]],"sim":[[201,0.373,[["os.rename",1],["wsconfig",0],["createtemp",1],["updateconfigfile",1]],0],[112,0.219,[["config.json",1],["wsconfig",0],["agents.tier",1],["tune",0]],0],[85,0.144,[["config.json",1],["wsconfig",0],["agents.tier",1],["tune",0]],0],[92,0.124,[["config.json",1],["wsconfig",0],["tune",0],["unconfirmed",0]],0],[50,0.099,[["wsconfig",0],["config.tune",1],["link",0],["tune",0]],0],[143,0.088,[["config.tune",1],["tune",0],["global",0]],0],[206,0.085,[["wsconfig",0],["config.tune",1],["agents.tier",1],["tune",0]],0]],"kw":[["writable",0],["regular",0],["symlink",0],["os.createtemp",1],["os.rename",1],["createtemp",1]],"pv":"## Background\n\n`updateConfigFile` (`agents-plugin-tool/internal/wsconfig/config.go`) is the\nsingle writer for project and global config files since b66cb36cd. It writes\nthrough `os.CreateTemp` in the config file's parent directory followed by\n`os.Rename` onto the config path. Two edge cases follow:\n\n- **Symlinked config is detached.** When the config path is a symlink (for\n  example a dotfiles-managed `~/.ws/config.json`), the rename replaces the\n  link with a regular file. The link target is left stale and later edits to\n  it no longer reach ws. The `os.Stat` mode lookup follows the link, so only\n  the target's permission bits carry over.\n- **Non-writable parent directory fails.** A writable config file inside a\n  non-writable directory now fails at `CreateTemp`, where a plain in-place\n  write would have succeeded.\n\nResolver override writes already used temp-write + rename before b66cb36cd;\n`agents.tier` set/unset writes (via `config.tune`) are newly exposed. Neither\nbehavior is recorded in the `260929-bug-config-tune-agents-tier-lost-update`\nResult.\n\nFound by the release-gate review of `2295a7bae..develop` (finding 2, Minor);\nthe user chose to capture it as an idea rather than block the release.\n\n## Phases\n\nNothing is decided yet. Candidate directions surfaced by the review, all\nunconfirmed:\n\n- Resolve the config path with `filepath.EvalSymlinks` before the temp-write\n  and rename, so the rename lands on the link target. Open interaction: the\n  sibling `<path>.lock` must st\n…"},{"s":"261002-bug-lead-run-effort-agent-type-missing-fallback","t":"lead-run worker spawn has no fallback when the ws:effort-* agent type is unavailable","st":"idea","c":"bug","k":4,"ph":[0,0],"odq":0,"bh":0,"ln":26,"as":null,"x":[],"sim":[[10,0.132,[["general-purpose",1],["subagent_type",1],["effort",0]],0]],"kw":[["general-purpose",1],["subagent_type",1],["effort",0],["claude-agents",1],["purpose",0],["general",0]],"pv":"## Background\n\nDogfood surprise, 2026-10-02 (Claude Code lead, ws@0.46.26 installed):\nlead-run's Spawn step 6 prescribes `subagent_type: \"ws:effort-<effort>\"`\nand falls back to `general-purpose` only when the resolved effort is not one\nof the five known values. In this session `Agent(subagent_type:\n\"ws:effort-high\")` failed with \"Agent type 'ws:effort-high' not found\"; the\nsession's agent list contained no `ws:effort-*` types even though the\ninstalled plugin manifest registers `./claude-agents/effort-*.md` and the\nfiles exist. The lead retried with `general-purpose` and the worker's own\nreviewer spawn hit the same miss.\n\n## Open questions\n\n- Why the registered plugin agents were absent from the session (plugin\n  snapshot refreshed after session start, harness version, or registration\n  shape).\n- Whether the shipped spawn text should name an explicit fallback for an\n  unavailable agent type, and what it loses (the effort pin) when it does."},{"s":"261007-bug-pi-fork-lineage-keeps-bootstrap-key-after-adoption","t":"Pi fork lineage keeps the bootstrap key after revive adoption","st":"idea","c":"bug","k":11,"ph":[0,0],"odq":0,"bh":0,"ln":37,"as":null,"x":[],"sim":[[244,0.36,[["parentsessionkey",1],["fork",0],["lineage",0],["bridge.ts",1]],0],[170,0.178,[["bootstrap",0],["fork",0],["adoption",0],["bridge",0]],0],[218,0.177,[["adoption",0],["bridge.ts",1],["index.ts",1],["src",1]],0],[247,0.129,[["bridge.ts",1],["fork",0],["bootstrap",0],["src",1]],0],[262,0.128,[["fork",0],["ws_pi_parent_session_key",1],["lineage",0],["parent",0]],0],[122,0.12,[["bridge.ts",1],["src",1],["agents-plugin-pi",1],["ts",0]],0],[151,0.11,[["fork",0],["adoption",0],["parent",0],["authority",0]],0],[202,0.103,[["src",1],["agents-plugin-pi",1],["bridge",0],["ts",0]],0],[228,0.102,[["index.ts",1],["src",1],["agents-plugin-pi",1],["bridge",0]],0],[57,0.099,[["ask.ts",1],["src",1],["index.ts",1],["bridge.ts",1]],0],[194,0.095,[["index.ts",1],["src",1],["agents-plugin-pi",1],["ts",0]],0],[191,0.094,[["index.ts",1],["src",1],["agents-plugin-pi",1],["ts",0]],0],[176,0.09,[["lineage",0],["revive",0],["src",1],["prompt",0]],0]],"kw":[["parentsessionkey",1],["fork.ts",1],["ask.ts",1],["ws_pi_parent_session_key",1],["adoption",0],["fork",0]],"pv":"## Background\n\nFound in the review sweep of `bf3216981..c43ebc3cd` (Minor). After\n`261007-bug-pi-session-key-reissued-on-resume`, a Pi lead that revives with a\ndifferent key adopts it: `adoptRevivedKey` (`agents-plugin-pi/src/bridge.ts`)\nupdates the bridge's `defaultSessionKeyRef`. The lead-bootstrap capture does\nnot follow:\n\n- `agents-plugin-pi/src/index.ts` passes `registerLeadBootstrap` the plain\n  `sessionKeyRef`, which is set once from the bootstrap key\n  (`sessionKeyRef.current = handle.defaultSessionKeyRef.current`). The ref\n  passed to the neighbouring registration two lines earlier is a getter over\n  `handle.defaultSessionKeyRef` instead.\n- `lead-bootstrap.ts` records `parentSessionKey: sessionKeyRef?.current` into\n  the captured prompt and the `ws-pi-lead-prompt` entries.\n- `fork.ts` and `ask.ts` prefer `captured.parentSessionKey ??\n  bridge.defaultSessionKeyRef.current`, so a fork spawned after adoption\n  names the abandoned bootstrap key as its `parentSessionKey` and in\n  `WS_PI_PARENT_SESSION_KEY`.\n\nThe fork refusal guard still covers both keys through `parentSessionKeys`, so\nthis is a lineage defect, not an authority hole. It runs against the adoption\nticket's intent that the adopted key becomes the lead's single key.\n\n## Direction\n\nLikely pass `registerLeadBootstrap` the same getter over\n`handle.defaultSessionKeyRef`, and test that a fork after adoption carries\nthe adopted key. Check whether an already-captured prompt from before the\nadoption should be re-keyed\n…"},{"s":"261007-bug-sage-gate-keeps-stale-skipped-design-posture","t":"Sage gate keeps a stale skipped design posture after the knob changes","st":"idea","c":"bug","k":1,"ph":[0,0],"odq":0,"bh":0,"ln":26,"as":null,"x":[],"sim":[[273,0.134,[["sage_gate",1],["knob",0],["sage",0],["tickets.sage_gate",1]],0],[230,0.115,[["tickets.sage_gate",1],["knob",0],["sage",0],["says",0]],0]],"kw":[["sage_review_design",1],["sage_gate",1],["sage",0],["posture",0],["tickets.sage_gate",1],["knob",0]],"pv":"## Background\n\nDogfood, 2026-10-07. `tickets.sage_gate(landing: \"ready\")` ran on two todo\ntickets while `sage_review_design` resolved to its builtin `off`, and wrote\n`sage-review-design: skipped` into each ticket's frontmatter. Before either\nticket was committed in `ready/`, the user set `sage_review_design: auto` at\nrepo scope (`c8ce680e6`) and the tickets were moved back to `todo/`. A fresh\n`sage_gate(landing: \"ready\")` then returned `action: skip` for both: the\npersisted `skipped` posture won over the now-`auto` knob, though the knob's\ndescription says `auto` requires a design pass before a ticket reaches\n`ready/`. Deleting the `sage-review-design: skipped` line by hand made the\ngate resolve `run` with the design reviewer.\n\n## Question\n\nShould a `skipped` posture that came from the knob (not from a review) be\nre-resolved against the current knob on each gate call, so a stricter knob\ntakes effect for tickets not yet in `ready/`? A `completed` posture backed by\na reviewed digest is a different case and is not in question here."},{"s":"261007-feat-stale-agenda-pruning-nudge","t":"Nudge stale agenda pruning at compaction and revive","st":"idea","c":"feat","k":8,"ph":[0,0],"odq":0,"bh":0,"ln":38,"as":null,"x":[],"sim":[[179,0.193,[["agenda",0],["blob",0],["remind",0],["compaction",0]],0],[176,0.175,[["agenda",0],["compaction",0],["revive",0],["compact",0]],0],[13,0.153,[["ws-compact",1],["agenda",0],["compaction",0],["nudge",0]],0],[61,0.144,[["agenda",0],["workflow_manual",1],["workflow",0],["codex",0]],0],[38,0.121,[["revive",0],["workflow_manual",1],["agenda",0],["asks",0]],0],[170,0.115,[["agenda",0],["workflow_manual",1],["compaction",0],["workflow",0]],0],[166,0.095,[["ws-compact",1],["compaction",0],["compact",0],["message",0]],0],[208,0.088,[["revive",0],["compaction",0],["nudge",0],["workflow",0]],0],[148,0.08,[["blob",0],["long",0]],0]],"kw":[["agenda",0],["blob",0],["ws-compact",1],["agenda.set",1],["revive",0],["prune",0]],"pv":"## Background\n\nDownstream dogfood (2026-10-07): a lead kept long-running work state in agenda\nblobs and, by its own account, never cleared the stale ones. Today the only\npruning signal is size-based: `agendaSizeNote`\n(`agents-plugin-tool/internal/mcp/workflow_manual.go`) tells the lead to\nclear stale blobs once the agenda totals 8192 bytes or more, both at\n`workflow_manual` render and on `agenda.set`. Below that threshold a stale\nblob is reminded at every revive with nothing prompting its removal.\n\n## Direction\n\nTie pruning to the natural boundaries where a session already re-reads its\nstate, rather than raising the size threshold:\n\n- **Pi compaction.** The `ws-compact` preparation message\n  (`agents-plugin-pi/src/lead-compaction.ts`) asks the lead to clear agenda\n  blobs that no longer hold before it writes the summary.\n- **Revive.** The `workflow_manual` session-state render asks the lead to\n  clear blobs that no longer hold whenever the agenda is non-empty, not only\n  above the size threshold. This boundary covers hosts whose compaction ws\n  does not own (Claude Code, Codex).\n\nRejected: raising the threshold to 16 KiB. Every revive re-renders the whole\nagenda, so a larger allowance costs context at every revive, and the observed\nproblem is unpruned blobs, not size.\n\n## Open\n\n- The exact wording at each boundary, and whether the revive nudge\n  replaces or joins the size note."},{"s":"261008-bug-pi-windows-python3-store-stub-blocks-release-ws","t":"Release ws-on-Pi fails on Windows when python3 is the Microsoft Store stub","st":"idea","c":"bug","k":0,"ph":[0,0],"odq":0,"bh":0,"ln":41,"as":null,"x":[[204,"related","discovered during its native-Windows probe",""]],"sim":[[204,0.238,[["py.exe",1],["python.exe",1],["python3.exe",1],["exe",0]],0],[56,0.211,[["python.exe",1],["python3",1],["exe",0],["py",0]],0],[231,0.173,[["exe",0],["python3",1],["python",0],["src",1]],0],[247,0.162,[["python3",1],["bridge.ts",1],["python",0],["src",1]],0],[159,0.146,[["python3",1],["install",0],["probe",0],["py",0]],0],[119,0.12,[["bridge.ts",1],["src",1],["agents-plugin-pi",1],["ts",0]],0],[207,0.105,[["python3",1],["install",0],["launcher",0],["devenv",0]],0],[202,0.099,[["src",1],["bridge.ts",1],["agents-plugin-pi",1],["ts",0]],0],[244,0.098,[["bridge.ts",1],["src",1],["agents-plugin-pi",1],["ts",0]],0],[218,0.093,[["bridge.ts",1],["src",1],["agents-plugin-pi",1],["ts",0]],0],[146,0.092,[["exe",0],["python3",1],["stdio",0],["probe",0]],0],[219,0.089,[["python3",1],["mcp.json",1],["src",1],["stdio",0]],0],[233,0.088,[["python3",1],["exe",0],["app",0],["desktop",0]],0],[194,0.08,[["src",1],["waiter",0],["agents-plugin-pi",1],["stdio",0]],0]],"kw":[["python.exe",1],["py.exe",1],["python3.exe",1],["python3",1],["microsoft",1],["stub",0]],"pv":"## Background\n\nDuring the 2026-10-08 native-Windows probe for\n261008-bug-windows-mailbox-wait-outlives-pi-host (host DESKTOP-3SUVUA9, Pi\n1.0.4, `pi install git:github.com/kang-sw/devenv@v0.46.34`), Pi with the\nrelease ws package failed at startup with \"session bootstrap failed ...\ncode=9009\".\n\n- On that host `python3` resolves to\n  `%LOCALAPPDATA%\\Microsoft\\WindowsApps\\python3.exe`, the Store App Execution\n  Alias stub, which exits 9009 when the Store Python is not installed.\n- A stock python.org install (`AppData\\Local\\Programs\\Python\\Python312\\`) ships\n  `python.exe` and the `py.exe` launcher but no `python3.exe`, so the stub wins\n  the PATH lookup.\n- The Pi adapter hard-codes `python3` for the launcher: `spawn` in\n  `agents-plugin-pi/src/mailbox-waiter.ts`, `McpStdioClient(\"python3\", ...)` in\n  `agents-plugin-pi/src/mcp-stdio-client.ts`, and `execFile(\"python3\", ...)` in\n  `agents-plugin-pi/src/bridge.ts`.\n- The probe worked around it with a hardlink named `python3.exe` to the real\n  `python.exe` placed first on PATH; nothing on the host was changed globally.\n\nConsequence: a downstream Windows user with only a python.org install cannot\nrun release ws-on-Pi at all.\n\n## Open questions\n\n- Interpreter resolution order on Windows (`python3`, `python`, `py -3`) and\n  how to detect the Store stub (exit 9009 or the WindowsApps path).\n- `py.exe` adds a process layer (`py.exe -> python.exe`); the probe infers it\n  would orphan `python.exe` as well as ws-mcp under the current kill pa\n…"},{"s":"261008-bug-servestdio-eof-exit-unbounded","t":"ServeStdio waits unbounded on in-flight handlers after stdin EOF","st":"idea","c":"bug","k":6,"ph":[0,0],"odq":0,"bh":0,"ln":29,"as":null,"x":[[204,"related","split out of its candidate direction 3",""],[190,"related","same EOF exit path",""]],"sim":[[204,0.193,[["eof",0],["wg.wait",1],["servestdio",1],["stdin",0]],0],[190,0.162,[["servestdio",1],["stdio",0],["exit",0],["serve",0]],0],[114,0.138,[["stdin",0],["alive",0],["hang",0],["kill",0]],0],[166,0.11,[["stdin",0],["eof",0],["exit",0],["log",0]],0],[231,0.104,[["servestdio",1],["stdin",0],["stdio",0],["serve",0]],0],[161,0.085,[["servestdio",1],["stdio",0],["server",0]],0]],"kw":[["eof",0],["wg.wait",1],["servestdio",1],["stdin",0],["wg",0],["unbound",0]],"pv":"## Background\n\nSplit out of 261008-bug-windows-mailbox-wait-outlives-pi-host, where it was\ncandidate direction 3. After stdin EOF, `ServeStdio`\n(`agents-plugin-tool/internal/mcp/server.go`) waits on `wg.Wait()` for\nin-flight handlers whose contexts derive from `context.Background()`. A hung\ngit hook or credential prompt can therefore keep `ws-mcp serve` alive\nindefinitely after its host is gone. The EOF exit is also not recorded in the\nlifecycle log.\n\nThe 2026-10-08 native-Windows probe did not observe this hang: after a\nnode-only kill, serve exited (inferred: on stdin EOF) with no lifecycle entry.\nThe risk is therefore code-derived, not reproduced.\n\n## Candidate directions (unconfirmed)\n\n- Cancel in-flight request contexts on EOF.\n- A grace timeout on `wg.Wait` after EOF.\n- Record an EOF lifecycle event."},{"s":"261020-bug-worktree-profiles-review-followups","t":"Worktree profiles lite-review follow-ups","st":"idea","c":"bug","k":1,"ph":[0,0],"odq":0,"bh":0,"ln":43,"as":null,"x":[[206,"related","origin; the lite review recorded these as Minor in its Phase 4 Result",""]],"sim":[[206,0.365,[["sparse_paths",1],["worktree.remove",1],["ws-workflow",1],["cone",0]],0],[12,0.178,[["worktree.release",1],["acquire",0],["profile",0],["workflow",0]],0],[281,0.158,[["worktree.release",1],["acquire",0],["dirty",0],["left",0]],0],[152,0.117,[["acquire",0],["worktree",0],["profile",0],["define",0]],0],[103,0.116,[["acquire",0],["worktree",0],["checkout",0],["profile",0]],0],[186,0.115,[["worktree.release",1],["acquire",0],["checkout",0]],0],[278,0.104,[["acquire",0],["profile",0],["worktree",0],["housekeeping",0]],0],[111,0.103,[["acquire",0],["worktree",0],["fresh",0],["unrelated",0]],0],[61,0.101,[["workflow_manual",1],["profile",0],["workflow",0],["worktree",0]],0],[104,0.094,[["worktree.release",1],["workflow",0],["acquire",0],["outside",0]],0],[108,0.089,[["acquire",0],["worktree",0],["checkout",0]],0],[53,0.086,[["worktree",0],["family",0],["workflow_manual",1],["bootstrap",0]],0]],"kw":[["ws-workflow",1],["worktree.release",1],["sparse_paths",1],["worktree.remove",1],["cone",0],["sparse",0]],"pv":"## Background\n\nThe lite review of `261020-feat-worktree-profiles` left seven Minor findings,\nrecorded in that ticket's Phase 4 Result. The worker flagged three as worth a\nfollow-up outside the ticket's scope. They are captured here unverified, as\nthe worker reported them.\n\n## Findings\n\n- **Release and remove read the whole profile family.** One invalid profile in\n  any scope blocks `worktree.release` and `worktree.remove`, even when it is\n  unrelated to the worktree. A field added by a newer ws that an older ws\n  rejects does the same.\n- **A failed fresh sparse acquire leaves a dirty worktree.** When the sparse or\n  branch step fails, the worktree keeps an empty index, and only\n  `worktree.release` recovers it. The former `sparse_paths` path had the same\n  leak.\n- **A housekeeping worker key misses repo-scope config.** The cone checkout\n  omits `.ws-workflow/`, so repo-defined profiles are invisible to that key.\n\n- **The strict profile decoder also gates `workflow_manual` and acquire.**\n  Raised by the v0.48.0 release-gate correctness review:\n  `worktree_profile.go:139` decodes with `DisallowUnknownFields`, and\n  `workflow_manual.go:340/:391` resolves the whole family. A profile field added\n  by a later ws would fail an older teammate's session-bootstrap manual and\n  acquire, not only release and remove.\n\n## Questions\n\n- Should release and remove resolve only the profile the worktree is marked\n  with, and tolerate unknown fields from a newer ws?\n- Should a failed fresh acquir\n…"},{"s":"261028-bug-pi-agent-batch-summary-language-drift","t":"Investigate Japanese agent batch summaries with Korean language configured","st":"idea","c":"bug","k":0,"ph":[0,1],"odq":0,"bh":0,"ln":20,"as":null,"x":[],"sim":[[116,0.184,[["gpt-6-luna",1],["luna",0],["gpt",0],["drift",0]],0],[2,0.113,[["summaries",0],["widget",0],["index.ts",1],["src",1]],0],[35,0.111,[["language",0],["openai",0],["gpt",0],["provider",0]],0],[143,0.105,[["한국어",0],["prompt",0],["drift",0],["workflow",0]],0],[33,0.092,[["language",0],["korean",0],["configure",0],["smoke",0]],0],[170,0.081,[["src",1],["prompt",0],["instruction",0],["workflow",0]],0]],"kw":[["workflow.lang",1],["language",0],["pi.display_summary_style",1],["summaries",0],["한국어",0],["gpt-6-luna",1]],"pv":"## Background\n\nDuring a live Pi agent-widget smoke test, the user reported Japanese summaries after the root lead enabled `pi.agent_widget_batch_summary_enabled=true` at session scope. Runtime `config.get` confirmed `workflow.lang=한국어` at global scope. `pi.display_summary_style` also explicitly requested polite Korean, and the configured summary model was `openai-codex/gpt-6-luna`.\n\nThe visible Japanese output is user-reported; no screenshot or actual provider request/response was captured. The cause is not yet established.\n\nFollow-up: prompt hardening was merged to `develop` in `3aee21d69` (implementation `da1e3f151`), adding the effective language instruction to the system prompt as well as the existing user message. Focused tests passed 31/31. After the user reported running `/reload`, runtime reads again confirmed the summary flag enabled and `workflow.lang=한국어`. A repeated live smoke test still produced many Japanese summaries according to the user. The symptom is therefore not resolved by that prompt hardening. The actual loaded extension path and effective provider request remain unverified. The catalog states that batch summaries reuse `workflow.lang`; a separate batch-language setting is not listed. This idea captures the dogfood surprise without selecting a fix or authorizing configuration or source changes.\n\n## Phases\n\nUnsettled idea: trace the effective language and request construction for batch summaries, distinguish generated text from fallback text, and obtain\n…"},{"s":"261029-chore-wsflow-no-agent-env-rename-and-setup-tool-removal","t":"Rename WS_MCP_NO_AGENT and remove the unread WS_MCP_SETUP_TOOL env","st":"idea","c":"chore","k":5,"ph":[0,0],"odq":0,"bh":0,"ln":21,"as":null,"x":[[208,"related","origin; deferred from its scope",""]],"sim":[[208,0.285,[["ws_mcp_no_agent",1],["plugin.json",1],["claude-plugin",1],["ws_mcp_setup_tool",1]],0],[178,0.124,[["ws_mcp_no_agent",1],["playbook.render",1],["agentless",0],["setup",0]],0],[225,0.103,[["tune",0],["setup",0],["wsflow",0],["config",0]],0]],"kw":[["ws_mcp_setup_tool",1],["ws_mcp_no_agent",1],["plugin.json",1],["claude-plugin",1],["mcp.json",1],["setup",0]],"pv":"## Background\n\nAfter `261029-feat-claude-mod-package-parity-knob-defaults` unblocks CLI\n`config tune` in wsflow, `WS_MCP_NO_AGENT` gates only the `playbook.render`\nlegacy context bridge (`wsflowRenderEligibleStems`), so its name no longer\ndescribes what it does, and wsflow is no longer framed as agentless.\n`WS_MCP_SETUP_TOOL` is set in wsflow's `.mcp.json` and\n`.claude-plugin/plugin.json`, but no source under `agents-plugin-tool/`\nreads it (grep of `internal/` and `cmd/`, 2026-10-29).\n\nOpen: whether the render bridge itself should be retired (which would remove\nthe last reason for the env), or the env renamed to name the bridge."},{"s":"261030-bug-workflow-manual-sentinel-mints-lead-key-for-subagents","t":"workflow_manual fresh sentinel mints a lead key for any caller, including subagents","st":"idea","c":"bug","k":1,"ph":[0,0],"odq":0,"bh":0,"ln":52,"as":null,"x":[[209,"related","the worker note read-only gate is bypassable through this hole",""]],"sim":[[229,0.3,[["obsidian-latch",1],["sentinel",0],["workflow_manual",1],["mint",0]],0],[94,0.225,[["freshbootstrapkey",1],["sentinel",0],["ferrule",0],["workflow_manual",1]],0],[59,0.171,[["ws_tools",1],["workflow_manual",1],["sentinel",0],["lead-run",1]],0],[48,0.143,[["lead-use-mailbox",1],["lead-run",1],["lead-delegate",1],["lead-discuss",1]],0],[61,0.14,[["workflow_manual",1],["subagent",0],["workflow",0],["role",0]],0],[185,0.136,[["lead-delegate",1],["lead-run",1],["ferrule",0],["lead-discuss",1]],0],[218,0.12,[["ferrule",0],["workflow_manual",1],["mint",0],["mod",0]],0],[12,0.114,[["git.merge",1],["mint",0],["subagent",0],["worktree",0]],0],[179,0.113,[["freshbootstrapkey",1],["handleworkflowmanual",1],["ferrule",0],["sentinel",0]],0],[66,0.104,[["lead-delegate",1],["lead-run",1],["lead-ticket",1],["delegate",0]],0],[205,0.104,[["tool.call",1],["mod",0],["server",0],["available",0]],0],[209,0.098,[["workflow_manual.go",1],["sentinel",0],["workflow",0],["role",0]],0],[151,0.091,[["ferrule",0],["mint",0],["caller",0],["runner",0]],0],[152,0.084,[["ferrule",0],["worktree",0],["bootstrap",0],["dogfood",0]],0],[53,0.082,[["git.merge",1],["workflow_manual",1],["bootstrap",0],["worktree",0]],0]],"kw":[["freshbootstrapkey",1],["workflow_manual.go",1],["sentinel",0],["obsidian-latch",1],["handleworkflowmanual",1],["lead-use-mailbox",1]],"pv":"## Background\n\nDogfood finding (2026-10-30), verified in source:\n\n- The keyed capability gate (`agents-plugin-tool/internal/mcp/server.go`, the\n  block guarded by `entry, found := s.sessions.lookup(keyStr); found &&\n  entry.scope != roleLead`) blocks lead-only tools only for a key that is\n  found and non-lead. The fresh-bootstrap sentinel `obsidian-latch`\n  (`internal/mcp/workflow_manual.go`, `freshBootstrapKey`) is not a stored\n  session, so it passes.\n- `handleWorkflowManual` with the sentinel and a `root` canonicalizes the root\n  and mints a lead key, returning the full manual (`workflow_manual.go`, the\n  `key == freshBootstrapKey` branch).\n- The sentinel is printed literally in the shipped `SKILL.md` shims of\n  `lead-discuss`, `lead-run`, `lead-delegate`, `lead-ticket`, and\n  `lead-use-mailbox`, so any subagent that loads one of those skills learns it.\n- The claude-mod adopts a minted key only for a main-thread call\n  (`agents-plugin/hooks/claude-mod/manual.ts` header), so the lead's own key is\n  not hijacked; the subagent still holds a lead-scoped key that unlocks every\n  lead-only tool (`git.merge`, `worktree.*`, lead-authority config) and every\n  role restriction, including the worker note read-only gate planned in\n  `261030-feat-note-layer-discipline-and-worker-readonly`.\n\nFor reference, the other subagent paths behave as intended: a registered\ndelegate/leaf key gets a JSON-RPC `tool not available` error, and an\nunregistered key gets only the \"no restorable state\" not\n…"},{"s":"261106-bug-claude-mod-startup-config-get-permission-flood","t":"Claude mod: startup config_get calls raise a flood of permission dialogs","st":"idea","c":"bug","k":5,"ph":[0,0],"odq":0,"bh":0,"ln":30,"as":null,"x":[],"sim":[[205,0.145,[["mcp__plugin_ws_ws__",1],["mod",0],["probe",0],["interactive",0]],0],[208,0.103,[["config_get",1],["mod",0],["knob",0],["hook",0]],0]],"kw":[["flood",0],["config_get",1],["approver",0],["person",0],["settings.json",1],["mcp__plugin_ws_ws__",1]],"pv":"## Observation (2026-11-06, dogfood)\n\nDuring the Phase 1 event probe of 261106-feat-ws-dashboard-claude-adapter, the\nprobe worker started an interactive Claude Code 2.1.319 session in default\npermission mode. The session ran in a fresh directory that is not a ws project,\nand `~/.claude/settings.json` had no `mcp__plugin_ws_ws__*` allow rule. The ws\nClaude mod's own startup `config_get` calls raised about 11 person-approved\npermission dialogs at session start (`tool.check` ask with `approver: \"person\"`).\nThe log is kept at\n`/home/swkang/.cache/ws@kang-sw-devenv/proj/dac18b1d/shared/claude-mod-event-probe/probe-log-interactive-permission.jsonl`.\n\nA downstream user in default mode without an allow rule would likely see the\nsame flood at every session start, even in a project that never uses ws.\n\n## Possible direction\n\n- Read the mod's knobs through one call (or a non-tool path such as a file or\n  the MCP server's runtime data) instead of one `config_get` per knob.\n- Or have the mod's plugin-raised tool calls bypass the permission check: the\n  mod is trusted code, and a `tool.check` hook it owns could allow its own\n  read-only calls.\n- Or have install guidance add a read-only allow rule.\n- Confirm first whether the count scales with the number of `claude.*` knobs."},{"s":"261106-bug-git-commit-trailer-placement","t":"git.commit cannot place a commit trailer such as Co-Authored-By","st":"idea","c":"bug","k":1,"ph":[0,0],"odq":0,"bh":0,"ln":25,"as":null,"x":[],"sim":[[173,0.386,[["trailer",0],["co-authored-by",1],["wsgit",1],["co",0]],0]],"kw":[["trailer",0],["co-authored-by",1],["co",0],["git.merge",1],["wsgit",1],["attribution",0]],"pv":"## Background\n\nDogfood surprise (2026-11-06, devenv lead session): delegates committing\nthrough `ws/git.commit` could not end the message with a `Co-Authored-By:`\ntrailer, which the host's attribution guidance requires.\n\n`wsgit.CommitMessage` (`agents-plugin-tool/internal/wsgit/git.go`) writes the\ntitle, the description, `## AI Context`, then the optional `## Ticket\nUpdates`, follow-ups, and resolves sections. It has no trailer input. A\ncaller's only places for the line are the description, which lands before\n`## AI Context` (commit 8f2d513d1), or an `ai_context` bullet. Neither is the\nfinal paragraph, so git does not parse it as a trailer. One delegate\namended with native git to move the line (45f722292); others left commits\nwithout a trailer (b1771b9df, 8a926fd83).\n\nOpen for design: a `trailers` argument that `CommitMessage` writes as the last\nparagraph (and the same for `git.merge`), or a configured attribution line\nthe tool appends."},{"s":"261107-bug-pi-source-tests-fetch-release-runtime","t":"Pi source-tree tests fetch the release ws-mcp, so a runtime.json tool addition breaks real-child tests","st":"idea","c":"bug","k":5,"ph":[0,0],"odq":0,"bh":0,"ln":35,"as":null,"x":[],"sim":[[247,0.166,[["local-devenv-runtime",1],["runtime.json",1],["incompatible",0],["ws-mcp-launcher",1]],0],[207,0.163,[["incompatible",0],["launcher",0],["devenv",0],["break",0]],0],[104,0.143,[["runtime.json",1],["agents-plugin-pi",1],["bundle",0],["suite",0]],0],[37,0.121,[["local-devenv-runtime",1],["incompatible",0],["launcher",0],["dev",0]],0],[109,0.12,[["runtime.json",1],["agents-plugin-pi",1],["ws-mcp-launcher",1],["tree",0]],0],[159,0.117,[["ws-mcp-launcher",1],["launcher",0],["dev",0],["node",0]],0],[193,0.117,[["agents-plugin-pi",1],["dir",0],["hash",0],["tree",0]],0],[142,0.114,[["agents-plugin-pi",1],["node",0],["failures",0],["suite",0]],0],[140,0.096,[["ws-mcp-launcher",1],["launcher",0],["repair",0],["dev",0]],0],[110,0.091,[["agents-plugin-pi",1],["bundle",0],["suite",0],["dev",0]],0],[230,0.089,[["launcher",0],["hash",0],["dev",0],["drain",0]],0],[223,0.089,[["ws-mcp-launcher",1],["agents-plugin-pi",1],["dir",0],["node",0]],0],[224,0.084,[["launcher",0],["devenv",0],["workaround",0],["help",0]],0],[34,0.081,[["runtime.json",1],["ws-mcp-launcher",1],["launcher",0],["asset",0]],0],[139,0.081,[["ws_mcp_runtime_dir",1],["ws-mcp-launcher",1],["launcher",0],["dev",0]],0],[231,0.081,[["launcher",0],["agents-plugin-pi",1],["ws-mcp-launcher",1],["dev",0]],0],[111,0.081,[["scratch",0],["develop",0],["suffix",0],["dogfood",0]],0]],"kw":[["dashboard.inbox_drain",1],["runtime.json",1],["dashboard.intake",1],["ws_mcp_runtime_dir",1],["mailbox.history",1],["local-devenv-runtime",1]],"pv":"## Observation (2026-11-07, dogfood)\n\nAfter `261106-feat-ws-dashboard-browser-interaction` merged (it added\n`dashboard.inbox_drain` to `agents-plugin-pi/runtime.json`), `node --test`\nin `agents-plugin-pi/` on develop went from 1 failure to 11. The 10 new\nfailures are all real-child spawn tests (agent-channel, web-startup, nested\nhop, execute-worker decisions), each failing with\n`ws-mcp-launcher: incompatible ws-mcp runtime after repair`.\n\n- The source-tree Pi package has no `.local-devenv-runtime` marker (that path\n  needs the plugin under a cache package), so the launcher does not build from\n  source. When the contract changes, the stamp misses and the launcher installs\n  the `v0.48.10` release asset, which lacks the tools develop's `runtime.json`\n  lists (`dashboard.intake`, `mailbox.history`, `dashboard.inbox_drain`).\n- A plain `go build` of develop does not help: the Pi bridge refuses\n  `serverInfo.version` `0.48.10-dev` against `plugin_version` `0.48.10`.\n- Workaround that yields the true result (2541 pass, only the known stale\n  65-tool contract check failing): build develop with\n  `-ldflags \"-X main.version=0.48.10\"` into a scratch dir as\n  `ws-mcp-0.48.10-<hash>` (the name the launcher picks) and run with\n  `WS_MCP_RUNTIME_DIR=<scratch dir>`.\n\n## Question\n\nBetween releases, any tool added to `runtime.json` makes the source-tree Pi\nsuite fail for reasons unrelated to the change. Options: let the source-tree\nlauncher build from source under test (a test-only local-deven\n…"},{"s":"261108-bug-pi-esc-drops-queued-mail-batches","t":"Pi Esc drops queued mailbox push batches","st":"idea","c":"bug","k":6,"ph":[0,0],"odq":0,"bh":0,"ln":27,"as":null,"x":[],"sim":[[141,0.157,[["mail",0],["message",0],["steer",0],["queue",0]],0],[191,0.129,[["mailbox.recv",1],["queue",0],["mail",0],["recv",0]],0],[228,0.11,[["@earendil-works",1],["pi-coding-agent",1],["dist",1],["tui",0]],0],[210,0.108,[["mail",0],["batch",0],["mailbox",0],["message",0]],0],[226,0.086,[["queue",0],["message",0],["steer",0],["mid",0]],0],[246,0.085,[["abort",0],["earendil",0],["steer",0],["dist",1]],0],[30,0.084,[["mailbox",0],["queue",0],["mail",0],["deliver",0]],0]],"kw":[["esc",0],["@earendil-works",1],["pi-coding-agent",1],["sendmessage",1],["mailbox.recv",1],["queue",0]],"pv":"## Background\n\nFound by the delta design review of `261107-feat-ws-dashboard-interrupt-badge`\n(2026-11-08), outside that ticket's scope. The Pi adapter pushes mailbox mail\nmid-run as custom messages through `sendMessage`, which queues them as steers\n(`@earendil-works/pi-coding-agent` `agent-session.js` around line 1117). When\nthe user presses Esc in the Pi TUI, the abort handler\n(`interactive-mode.js` `restoreQueuedMessagesToEditor({abort: true})`) calls\n`session.clearQueue()` -> `agent.clearAllQueues()`: untaken text steers move to\nthe editor, but queued custom messages are dropped silently. The mail was\nalready drained by `mailbox.recv`, so it is lost.\n\nNot reproduced live; source-read only against the installed Pi dist.\n\n## Idea\n\nTrack push batches the run has not taken and re-deliver them after an abort\n(for example as `deliverAs: \"nextTurn\"`), or return them to the mailbox. The\ninterrupt ticket's Pi decision (board (269)) may build the same tracking;\nshare it if so."},{"s":"261108-bug-tracker-reregister-second-member-same-machine-key","t":"tracker: re-registering a remote under a second member id from the same machine key fails and leaves refs on the remote","st":"idea","c":"bug","k":9,"ph":[0,0],"odq":0,"bh":0,"ln":30,"as":null,"x":[[212,"related","the tracker epic this host bug belongs to",""],[215,"related","browser acceptance that surfaced it",""]],"sim":[[213,0.307,[["refs",0],["member",0],["causal",0],["wsledger",0]],0],[212,0.25,[["member",0],["refs",0],["wsledger",0],["tracker",0]],0],[133,0.23,[["wsledger",0],["member",0],["refs",0],["clone",0]],0],[216,0.212,[["wsledger",0],["wstrackerhost",1],["refs",0],["clone",0]],0],[214,0.178,[["wsledger",0],["member",0],["causal",0],["clone",0]],0],[215,0.127,[["wstrackerhost",1],["tracker",0],["clone",0],["join",0]],0],[138,0.126,[["tracker",0],["refs",0],["causal",0],["past",0]],0],[89,0.123,[["member",0],["head",0],["tracker",0],["join",0]],0],[148,0.121,[["wsledger",0],["wstrackerhost",1],["clone",0],["acceptance",0]],0],[221,0.115,[["member",0],["causal",0],["tracker",0],["head",0]],0],[197,0.112,[["refs",0],["clone",0],["remote",0],["head",0]],0],[18,0.091,[["member",0],["tracker",0],["wstrackerhost",1]],0],[88,0.09,[["member",0],["tracker",0],["person",0]],0],[217,0.087,[["member",0],["tracker",0],["belong",0]],0]],"kw":[["member",0],["refs",0],["causal",0],["wstrackerhost",1],["wsledger",0],["tracker",0]],"pv":"## Observation\n\nFound by the drawer UI worker during browser acceptance (2026-11-08,\nisolated daemons, local bare remote): registering the same remote again\nfrom the same machine key under a second member id fails with\n`author ... is not a member in its causal past`. The failed attempt leaves\n`refs/heads/tracker/id/<member>` and `refs/heads/tracker/m/<member>/<clone>`\non the remote.\n\n## Open questions\n\n- Is a second member id for the same machine key meant to be allowed (one\n  person, two stores of identities), or should register refuse it up front\n  with a clear message?\n- Either way, a failed register should not leave refs behind on the\n  remote; decide whether register pushes only after the join verifies\n  locally, or cleans up on failure.\n\nCode: `internal/wstrackerhost` register/join, `internal/wsledger` join and\ncreate-once refs."},{"s":"261108-bug-ws-ledger-moved-reissued-events-lose-intra-batch-refs","t":"wsledger moved and re-issued events lose references to other events of the same batch","st":"idea","c":"bug","k":9,"ph":[0,0],"odq":0,"bh":0,"ln":41,"as":null,"x":[[213,"related","the re-issue decision ((211) a) and MoveToFreshClone recovery this breaks",""],[214,"related","the domain names items and comments by event id",""]],"sim":[[213,0.273,[["movetofreshclone",1],["wsledger",0],["seq",0],["remote.go",1]],0],[132,0.23,[["wsledger",0],["member",0],["refs",0],["clone",0]],0],[214,0.175,[["wsledger",0],["wstracker",1],["domain",0],["nextid",1]],0],[216,0.168,[["movetofreshclone",1],["wsledger",0],["wstracker",1],["clone",0]],0],[212,0.148,[["wstracker",1],["wsledger",0],["member",0],["clone",0]],0],[138,0.123,[["wstracker",1],["domain",0],["refs",0],["tracker",0]],0],[221,0.097,[["wstracker",1],["item.create",1],["member",0],["domain",0]],0],[222,0.091,[["wstracker",1],["item.create",1],["domain",0],["event",0]],0],[217,0.087,[["wstracker",1],["member",0],["event",0],["tracker",0]],0]],"kw":[["remote.go",1],["movetofreshclone",1],["intra",0],["nextid",1],["wsledger",0],["issued",0]],"pv":"## Background\n\nReview sweep S2 (`fbb6d0a90..8e21ac7a5`), correctness finding, overridden to\nan important follow-up on the board ((453) ok) because the fix needs a\nprotocol-level design.\n\n- `internal/wsledger/remote.go` ~L603-651 (`MoveToFreshClone`) and\n  `store.go` ~L937-961 (re-issue) carry payloads byte-for-byte to a new event\n  id.\n- The tracker domain names items and comments by event id\n  (`<member>.<clone>#<seq>`). An unpushed batch is commonly an `item.create`\n  plus follow-ups naming it; `Dispatch` supports naming an earlier event of\n  the same call through `NextID`.\n- After a move, the follow-ups name an id that was never published (the old\n  ref was reset); after a re-issue they name the Ignored original. Every\n  client flags them \"item ... is not in the state its author had seen\".\n- The payload-agnostic protocol cannot rewrite these ids, and `wstracker` has\n  no hook to remap them. No test covers a batch that references itself across\n  a move or a re-issue.\n- Related minor from the same review: moved events keep `Of` (an old-stream\n  seq), so the new stream's journal can mark unrelated new-stream seqs as\n  already re-issued (`remote.go` ~L604-608, 648).\n\n## Open Questions\n\n- Remap at the ledger (an id-alias record emitted with the moved batch, which\n  the domain resolves) versus at the domain (wstracker rewrites intra-batch\n  ids through a hook the ledger calls on move / re-issue) versus forbidding\n  intra-batch references (one event per dependent write).\n- `MoveT\n…"},{"s":"261109-research-windows-code-signing-signpath","t":"Windows code signing for ws-mcp under Apache-2.0, with no\n  proprietary components.\n- The binaries are already released, are built from our own source, and are\n  built by GitHub Actions (`.github/workflows/ws-mcp-release.yml`). SignPath\n  calls these \"verifiable builds\".\n- Every release must be approved by hand. The `lead-ship` publish\n  confi\n…"},{"s":"261110-bug-ws-mcp-move-close-guard-flake-and-suite-timeout","t":"internal/mcp: TestMoveCloseGuard fails under full-suite load, and the suite overruns go test's default 10m timeout","st":"idea","c":"bug","k":6,"ph":[0,0],"odq":0,"bh":0,"ln":38,"as":null,"x":[],"sim":[[111,0.205,[["impl",0],["lease",0],["develop",0],["index",0]],0],[136,0.205,[["flake",0],["investigation",0],["load",0],["suite",0]],0],[110,0.181,[["flake",0],["suite",0],["sensitive",0],["load",0]],0],[148,0.175,[["blob",0],["precondition",0],["impl",0],["timeout",0]],0],[102,0.144,[["move",0],["contention",0],["index",0],["worktree",0]],0],[197,0.139,[["lease",0],["timeout",0],["ttl",0],["index",0]],0],[114,0.129,[["timeout",0],["kill",0],["timed",0],["symptom",0]],0],[190,0.116,[["flake",0],["load",0],["cause",0],["timing",0]],0],[142,0.112,[["suite",0],["precondition",0],["develop",0],["reproduce",0]],0],[160,0.099,[["timeout",0],["deadline",0],["document",0],["caller",0]],0],[150,0.099,[["timeout",0],["index",0],["cause",0],["ownership",0]],0],[200,0.089,[["timeout",0],["kill",0],["suite",0],["index",0]],0],[107,0.089,[["timeout",0],["subprocess",0],["caller",0],["deadline",0]],0],[104,0.087,[["suite",0],["investigation",0],["count",0],["develop",0]],0],[149,0.085,[["timeout",0],["cause",0],["timing",0],["timed",0]],0],[278,0.082,[["impl",0],["lease",0],["move",0],["worktree",0]],0]],"kw":[["flake",0],["suite",0],["timeout",0],["lease",0],["impl",0],["guard",0]],"pv":"## Background\n\nSeen 2026-11-10 by the worker for 261106-bug-sage-stamp-missing-restamp-loop\n(branch impl/develop/late-twice-blob, merged f1f8c86a2):\n\n- `go test ./internal/mcp/... -count=1 -timeout 900s` failed only\n  `TestMoveCloseGuard` (`internal/mcp/ticket_index_view_test.go:478`, the\n  ticket-index lease warning). Run on its own with `-count=3`, it passes, so\n  it fails only under full-suite load. The sage change did not touch it.\n- The full `internal/mcp` suite takes about 760s, so `go test`'s default 10m\n  timeout kills it unless the caller raises `-timeout`.\n\nSeveral parallel workers were building and testing in worktrees at the same\ntime, which may have added to the load.\n\n## Open questions\n\n- Is the flake a timing assumption in the lease-warning path (an index cache\n  TTL, a clock, a subprocess deadline), or contention on a shared resource?\n- Should the suite be split or sped up, or should the documented verification\n  command carry an explicit `-timeout`?\n\n## Investigation (2026-11-13)\n\nThe guard's ownership read uses the index's 1.5-second default read timeout;\na timed-out first read can produce an absent or unknown view. This is a\npossible load-sensitive precondition, not a confirmed cause of the reported\nfailure. On w5090 three separate `TestMoveCloseGuard` runs with `-count=3`\npassed; the full suite also passed with `-timeout 900s` and four known tests\nexcluded, with `internal/mcp` taking 114 seconds. Neither symptom reproduced,\nand no clear cause was establish\n…"},{"s":"261110-chore-ws-claude-mod-dashboard-engine-test-load-flake","t":"claude-mod dashboard engine tests flake under machine load (first flush never reaches the intake)","st":"idea","c":"chore","k":6,"ph":[0,0],"odq":0,"bh":0,"ln":39,"as":null,"x":[],"sim":[[110,0.234,[["flake",0],["wall",0],["clock",0],["sensitivity",0]],0],[135,0.205,[["flake",0],["investigation",0],["load",0],["suite",0]],0],[190,0.135,[["flake",0],["wall",0],["clock",0],["observation",0]],0],[5,0.118,[["intake",0],["dashboard-engine.test.ts",1],["dashboard-engine.test",1],["mod",0]],0],[142,0.11,[["mod",0],["agents-plugin",1],["suite",0],["predate",0]],0],[205,0.085,[["mod",0],["clock",0],["agents-plugin",1],["hook",0]],0]],"kw":[["nice",1],["flake",0],["dashboard-engine.test.ts",1],["dashboard-engine.test",1],["engine",0],["flush",0]],"pv":"## Observation (2026-11-10)\n\nReported by the delegate of the dashboard meter cadence hotfix (f56fa8d42):\n`agents-plugin/hooks/claude-mod/dashboard-engine.test.ts` (and its wsflow\ncopy) passes 38/38 when it has the machine to itself, but runs that overlap\nanother test process fail 1-2 tests, a different one each run. Each failure\nlands at about 1.1 s with the intake never reached, including permission and\nwhiteboard tests unrelated to status. The full ws suite\n(`claude plugin test agents-plugin`) failed one unrelated test the same way\nat the pre-change HEAD, so the flake predates the hotfix.\n\n## Directions (not decided)\n\n- Find the wall-clock dependency: the commit 7e6b2a712 AI Context notes the\n  engine's `now` edge is wall time while timers run on the mock clock; a\n  first-flush wait bounded by wall time would explain load sensitivity.\n- Drive the first flush from the mock clock, or widen the bound only where a\n  real-time wait is intended.\n\n## Constraints\n\n- Mirror test changes to `agents-plugin-wsflow/hooks/claude-mod/`.\n- Run tests niced (`nice -n 19`) and scoped locally.\n\n## Investigation (2026-11-13)\n\nThe engine uses wall time for `now` and a mock clock for scheduling in tests.\nThe first flush, however, is scheduled at zero delay, so the mismatch does not\nestablish the reported first-intake failure's cause; later flushes and retries\nremain a suspected timing area. A scoped, niced `claude plugin test` run of\n`dashboard-engine.test.ts` on Windows produced no output and ti\n…"},{"s":"261110-chore-ws-mcp-ci-windows-rest-shard-speed","t":"Bring the ws-mcp CI windows `rest` shard down to the ~7 min of the other shards","st":"idea","c":"chore","k":6,"ph":[0,0],"odq":0,"bh":0,"ln":55,"as":null,"x":[],"sim":[[199,0.27,[["ws.md",1],["ci",0],["ws-mcp-ci.yml",1],["tag",0]],0],[200,0.124,[["ci",0],["sleep",0],["min",0],["latest",0]],0],[24,0.113,[["ws-rgo",1],["bin",0],["package",0],["heavy",0]],0],[190,0.103,[["ci",0],["job",0],["cmd",1],["wall",0]],0],[114,0.092,[["ci",0],["job",0],["wsgit",1],["timeout",0]],0],[34,0.091,[["ws.md",1],["bin",0],["yml",0],["proxy",0]],0]],"kw":[["shard",0],["rest",0],["ci",0],["ws-mcp-ci.yml",1],["ws-mcp-ci",1],["ws-rgo",1]],"pv":"## Problem\n\n`ws-mcp-ci.yml` gates every release (the ship flow dispatches it on the exact\ncommit to tag). Its wall time is the slowest job, and that is now always\n`go test (windows-latest, rest)`:\n\n| run | rest shard | other windows shards (mcp-0..3) | ubuntu all |\n|---|---|---|---|\n| 42821152376 (release/0.48.17) | 14m51s | 5m36s - 6m20s | 3m45s |\n| 42820094730 (develop 00fd2e5d9) | 18m12s | | |\n| four earlier runs on 2026-11-10 | 14m08s - 20m10s | | |\n\nThe user's goal (2026-11-10, whiteboard): \"속도 좀 다른거랑 비슷하게 7분대로\n끌어내릴 수 있게요\" - bring `rest` to about the same ~7 min as the others.\n\n## Current shape (evidence)\n\n- `agents-plugin-tool/scripts/ci-test-shard.sh rest` runs\n  `go test -count=1 -timeout 30m` over every package except `internal/mcp`,\n  in one job. The `mcp I N` shards split `internal/mcp` four ways by sorted\n  top-level test index.\n- The workflow comment records why the split exists: `internal/mcp` alone took\n  ~15 min serially on Windows (run 36662026067). Since then `rest` has grown\n  (wsdashboard proxy/daemon tests, cmd/ws-mcp launcher and daemon proxy tests,\n  wstrackerhost, wsdoc, wsgit...) and is now the long pole.\n- The coverage invariant: `rest` plus every `mcp I N` covers exactly the\n  tests of `all`. Any new split must keep that invariant.\n\n## Directions to evaluate (not decided)\n\n- Measure first: per-package wall time on Windows for the `rest` set\n  (`go test -json` timings, or `-v` timestamps) to find the dominant packages.\n- Split `rest` into two or more\n…"},{"s":"261111-bug-ws-tracker-body-merge-minor-gaps","t":"Tracker body merge: two minor gaps from the assignee-edit review","st":"idea","c":"bug","k":9,"ph":[0,0],"odq":0,"bh":0,"ln":30,"as":null,"x":[[221,"related","",""]],"sim":[[221,0.403,[["assignee",0],["engine.js",1],["difflines",1],["wstracker",1]],0],[222,0.208,[["wstracker",1],["engine",0],["tracker",0],["assignee",0]],0],[214,0.203,[["engine.js",1],["wstracker",1],["domain",0],["causal",0]],0],[212,0.135,[["wstracker",1],["assignee",0],["tracker",0],["attachment",0]],0],[132,0.126,[["tracker",0],["refs",0],["causal",0],["past",0]],0],[133,0.123,[["wstracker",1],["domain",0],["refs",0],["tracker",0]],0],[241,0.119,[["wstracker",1],["engine.js",1],["tracker",0]],0],[215,0.098,[["engine.js",1],["tracker",0]],0],[18,0.09,[["wstracker",1],["engine.js",1],["tracker",0],["editor",0]],0]],"kw":[["difflines",1],["wstracker",1],["engine.js",1],["engine",0],["assignee",0],["gaps",0]],"pv":"Lite review of 261111-feat-ws-tracker-assignee-edit-and-body-merge (merged\nc0e300deb) left three Minor findings open; two remain. Each needs the change\nin both the Go domain (`internal/wstracker`) and the dashboard engine\n(`engine.js`), with goldens.\n\n1. **Playbook wording overstates conflict marking.** A change made by a write\n   that is in the editor's causal past but outside its `base` closure resolves\n   to the later write with no mark. The tracker playbook says \"both are marked\n   as a conflict\", which is not true for this case. Fix either the wording or\n   the behavior.\n2. **Unbounded diff memory.** `diffLines` (Myers) keeps an O(D^2) trace and\n   bodies have no size cap, so two very large concurrent rewrites cost a lot of\n   memory on every replay. Options: a body size cap, or a linear-space diff.\n\nThe third gap (attachments dropped on a text-neutral based edit) is fixed by\n612919435: attachments now merge three-way by oid from the base value instead\nof as a union over the writes whose lines survive. Refs and mentions still\nfollow the surviving lines.\n\nAlso unverified at merge: the two-window same-base merge driven through the\ndashboard (domain tests cover it)."},{"s":"261113-bug-ws-daemon-replace-stops-hosted-sessions","t":"Daemon replace ended two other projects' hosted lead sessions with a masked exit reason","st":"idea","c":"bug","k":0,"ph":[0,0],"odq":0,"bh":0,"ln":106,"as":null,"x":[[230,"related","",""]],"sim":[[65,0.18,[["wsholder",1],["holder",0],["manager.go",1],["exit",0]],0],[3,0.178,[["wsholder",1],["manager.go",1],["breakaway",0],["ensure",0]],0],[56,0.17,[["holder.py",1],["manager",0],["wsholder",1],["detach",0]],0],[34,0.16,[["wsholder",1],["manager.go",1],["ensure.go",1],["ws-mcp-launcher.py",1]],0],[247,0.156,[["ws_mcp_bootstrap_binary",1],["ws_mcp_bootstrap_url",1],["ensure.go",1],["dashboard.log",1]],0],[71,0.151,[["ensure.go",1],["dashboard.log",1],["daemon.go",1],["shutdown",0]],0],[204,0.113,[["quit",1],["exit",0],["ws_mcp_runtime_dir",1],["ws_mcp_bootstrap_binary",1]],0],[223,0.101,[["holder.py",1],["ws-mcp-launcher.py",1],["wsagent",0],["launcher",0]],0],[238,0.1,[["agent.json",1],["registration.json",1],["wsagent",0],["ended",0]],0],[159,0.1,[["ws-mcp-launcher.py",1],["launcher",0],["dev",0],["holder",0]],0],[140,0.088,[["ws-mcp-launcher.py",1],["dev",0],["rebuild",0],["launcher",0]],0],[230,0.088,[["rebuild",0],["launcher",0],["replacement",0],["dev",0]],0],[167,0.087,[["rejoin",0],["holder",0],["resume",0],["dev",0]],0],[9,0.083,[["wsholder",1],["manager",0],["agent.json",1],["shutdown",0]],0],[130,0.081,[["ws_mcp_runtime_dir",1],["ws-mcp-launcher",1],["launcher",0],["dev",0]],0],[74,0.081,[["wsagent",0],["backend.go",1],["registration",0],["runner.go",1]],0]],"kw":[["holder.py",1],["casualty",0],["wsholder",1],["manager.go",1],["manager",0],["host_stopped",1]],"pv":"This ticket is about the session-loss consequence and the holder mechanism. The\nlauncher trigger (auto rebuild and replace in dev mode) is the related ticket.\n\n## Background\n\nObservation, 2026-11-13. A dev-launcher rebuild replaced the dashboard daemon\nat ~06:15:30Z. At 06:15:32.33Z and 06:15:32.43Z (0.09 s apart) two other\nprojects' dashboard-hosted Claude lead sessions stopped together. Both\n`sessions/<slug>/registration.json` files say `host_stopped: true`,\n`host_exit_code: 0`, `host_exit_reason: \"child_exited\"`; both transcripts ended\ncleanly at idle. About 25 sessions' `agent.json` were rewritten at 06:15:30-32Z\n(the successor daemon rejoining). `dashboard.log` was reset by the next daemon,\nso there is no daemon-side line for the stop.\n\nScan of all 181 session dirs for `host_stopped_at` on this date (4 rows):\n\n- 05:35:29Z `stop` (claude): a deliberate stop, unrelated.\n- 06:15:32Z x2 `child_exited` (claude, hosted): the casualties, within 2 s of\n  the replacement.\n- 07:17:25Z `child_exited` (claude, hosted): 3 min before the 07:20:45Z\n  replacement; not near any replacement, probably the user quitting.\n- Nothing within +-10 s of the later replacements (06:17:42, 06:31:37,\n  07:06:52, 07:20:45). One casualty slug was relaunched at 07:06:39Z, 13 s\n  before 07:06:52Z; its new holder survived.\n\nThe devenv lead (hosted, claude, holder started 04:54:53Z) and its Pi children\nsurvived every replacement. Every live holder descriptor (22: leads, Pi\nworkers, terminals, started 04:27\n…"},{"s":"261113-bug-ws-installed-plugin-locked-out-by-newer-minor-dev-daemon","t":"Installed plugin is locked out when a dev rebuild brings up a daemon one minor ahead","st":"idea","c":"bug","k":5,"ph":[0,0],"odq":0,"bh":0,"ln":82,"as":null,"x":[],"sim":[[230,0.332,[["needs_start",1],["rebuild",0],["dev",0],["launcher",0]],1],[207,0.313,[["shared-session",1],["addendum",0],["launcher",0],["bump",0]],0],[25,0.188,[["append-only",1],["minor",0],["reconnect",0],["taxonomy",0]],0],[159,0.171,[["dev",0],["ws-mcp-launcher.py",1],["launcher",0],["install",0]],0],[247,0.126,[["needs_start",1],["dev",0],["ws-mcp-launcher.py",1],["launcher",0]],0],[71,0.123,[["needs_start",1],["ws-mcp-launcher.py",1],["dev",0],["launcher",0]],0],[231,0.115,[["dev",0],["launcher",0],["ws-mcp-launcher.py",1],["reconnect",0]],0],[3,0.104,[["daemonlink.connect",1],["ws-mcp-launcher.py",1],["launcher",0],["reconnect",0]],0],[130,0.096,[["ws-mcp-launcher",1],["launcher",0],["repair",0],["dev",0]],0],[34,0.096,[["daemonunavailable",1],["ws-mcp-launcher.py",1],["launcher",0],["health",0]],0],[109,0.092,[["ws-mcp-launcher.py",1],["agents.md",1],["bump",0],["launcher",0]],0],[139,0.088,[["ws-mcp-launcher.py",1],["dev",0],["rebuild",0],["launcher",0]],0]],"kw":[["daemonlink.connect",1],["daemonunavailable",1],["shared-session",1],["append-only",1],["needs_start",1],["ideas",0]],"pv":"## Observed (2026-11-13)\n\n- Merging wb-messages (`bbd7c1bd5`) bumped develop to 0.50.0.\n- The dev launcher rebuilt and replaced the shared dashboard daemon with\n  0.50.0-dev (pid 4832).\n- Every Claude session running the installed, cached wsflow 0.49.0 plugin then\n  failed every ws call with \"dashboard daemon not reachable; request was not\n  sent (waited 75s ...)\". This included the lead session and the UI-track peer.\n- The daemon was healthy (port 29417 listening, HTTP 200).\n\n## Cause\n\n- `ws-mcp-launcher.py` `DaemonLink.connect` raises `DaemonUnavailable` when\n  `same_minor(daemon, runtime)` fails (around line 1451).\n- `needs_start` only replaces an older daemon, so a newer-minor daemon is\n  neither accepted nor replaced, and the old one is gone.\n- The real reason (\"daemon X is outside this plugin's minor\") only reaches\n  launcher stderr; the MCP error hides it.\n\n## Ideas (non-authoritative)\n\n- Surface the minor-mismatch reason in the MCP error text, with the fix: update\n  the plugin and reconnect.\n- Have the dev rebuild refuse to replace, or warn before replacing, the daemon\n  when live clients are on an older minor.\n- Or let an older-minor client spawn its own side daemon.\n\n## Recovery used\n\nUpdate the installed plugin to the repo's 0.50.0, then reconnect MCP / restart\nthe session.\n\n## Related\n\n- `261113-bug-ws-launcher-dev-rebuild-replaces-daemon-mid-work`\n\n## Owner Direction (historical)\n\nThe following records the 2026-11-13 direction under the former taxonomy.\nThe curre\n…"},{"s":"261113-bug-ws-pi-completion-mail-lost-when-held-message-starts-next-turn","t":"Pi completion mail lost when a held message starts the next turn","st":"idea","c":"bug","k":6,"ph":[0,0],"odq":0,"bh":0,"ln":49,"as":null,"x":[],"sim":[[225,0.24,[["pi.send",1],["steer",0],["completion",0],["send",0]],0],[160,0.163,[["pi.list",1],["completion",0],["observe",0],["showed",0]],0],[226,0.16,[["turn",0],["long",0],["completion",0],["message",0]],0],[131,0.157,[["mail",0],["message",0],["steer",0],["queue",0]],0],[211,0.156,[["steer",0],["held",0],["turn",0],["message",0]],0],[64,0.156,[["pi.spawn",1],["steer",0],["turn",0],["end",0]],0],[282,0.155,[["pi.send",1],["mail",0],["steer",0]],0],[230,0.134,[["turn",0],["mail",0],["said",0],["completion",0]],0],[210,0.114,[["mail",0],["turn",0],["message",0],["reply",0]],0],[78,0.103,[["pi.send",1],["turn",0],["observe",0],["reply",0]],0],[175,0.089,[["message",0],["completion",0],["long",0],["send",0]],0],[30,0.088,[["mail",0],["message",0],["send",0],["deliver",0]],0]],"kw":[["pi.send",1],["pi.list",1],["mail",0],["held",0],["completion",0],["turn",0]],"pv":"## Background\n\nObserved 2026-11-13 by a lead session, twice. A Pi worker spawned with\n`pi.spawn` finished its long turn with a full completion report, but the lead\nnever received that turn's completion mail. The lead only received the\ncompletion mail of the NEXT, short turn, in which the worker answered a message\nthe lead had sent via `pi.send` while the long turn was still running (a \"held\"\nmessage, shown as `held 1` in `pi.list`). The worker's reply said the\ninformation was \"already included in the completion report\".\n\n- Case 1: worker \"whiteboard topic panels + log\". `pi.list` showed `held 1`;\n  the lead got only \"Already included in 5b8d58710 and the final verification.\"\n- Case 2: worker \"hosted-lead bundled plugin\". The lead got only \"R2\n  confirmation was already included in the completion report\"; asking for a\n  resend recovered it.\n\nA daemon replacement happened around 08:48Z during case 2's turn (pid 33200).\nIt is not ruled out as the cause, but the common factor is a held `pi.send`\nmessage.\n\n`pi.send`'s tool description says: \"during a turn it steers that running turn\nat the next tool boundary ... The running turn's completion mail covers the\nsteered message; no extra turn is queued after it is taken.\" The observed\nbehavior contradicts this: an extra turn ran and the first turn's completion\nmail was missing.\n\n## Idea\n\nEither:\n\n- every turn end produces exactly one completion mail, delivered even when a\n  held message starts the next turn immediately; or\n- a held mes\n…"},{"s":"261113-bug-ws-preexisting-node-suite-failures","t":"Pre-existing node test suite failures in claude-mod and agents-plugin-pi","st":"idea","c":"bug","k":6,"ph":[0,0],"odq":0,"bh":0,"ln":42,"as":null,"x":[],"sim":[[110,0.164,[["suite",0],["failures",0],["agents-plugin-pi",1],["green",0]],0],[130,0.114,[["agents-plugin-pi",1],["node",0],["failures",0],["suite",0]],0],[135,0.112,[["suite",0],["precondition",0],["develop",0],["reproduce",0]],0],[136,0.11,[["mod",0],["agents-plugin",1],["suite",0],["predate",0]],0],[104,0.104,[["suite",0],["agents-plugin-pi",1],["green",0],["environment",0]],0],[208,0.1,[["claude-mod",1],["mod",0],["band",0],["hook",0]],0],[218,0.097,[["claude-mod",1],["mod",0],["agents-plugin-pi",1],["hook",0]],0],[220,0.084,[["mod",0],["claude-mod",1],["failures",0],["mail",0]],0]],"kw":[["esm",0],["preexisting",0],["failures",0],["suite",0],["claude-mod",1],["symlink",0]],"pv":"## Background\n\nTwo node test suites carry failures that predate recent merges and were never\ntriaged, so workers cannot treat a full run as a green check.\n\nEvidence (a), `agents-plugin/hooks/claude-mod` and its wsflow mirror, on develop:\n\n- Before the band-tests-cc merge (`cace4ccec`): 698 pass / 78 fail.\n- After it: 715 pass / 61 fail.\n- The 61 remaining failures are pre-existing and were not triaged.\n\nEvidence (b), `agents-plugin-pi` broader suite:\n\n- The pi-wait-mail-label worker observed 205 failures (merged in `223192e02`).\n- Representative Windows ESM/symlink failures reproduce at the merge base.\n- The rest are untriaged.\n\n## Idea\n\nGet both suites to a known-green baseline.\n\n- Triage each failing group into one of: environment-only (Windows ESM/symlink,\n  Claude Code version drift), stale test, or real bug.\n- Fix real bugs; fix or delete stale tests; mark environment-only groups with an\n  explicit platform skip or a documented precondition.\n- Result: workers can run one passing full check instead of per-file subsets.\n\nCompatibility: test-only and skip-marker changes, T0. Deleting tests is a\n\"deleting functionality\" question, so ask before deleting any test that covers\nshipped behavior.\n\n## Open\n\n- Run these suites locally on Windows, or add Node to the remote? w5090 has no\n  Node installed today."},{"s":"261113-feat-ws-configurable-per-turn-lead-reminder","t":"A configurable reminder appended to every lead turn","st":"idea","c":"feat","k":12,"ph":[0,0],"odq":0,"bh":0,"ln":38,"as":null,"x":[],"sim":[[208,0.119,[["config.tune",1],["tune",0],["hook",0],["workflow",0]],0],[226,0.118,[["configurable",0],["turn",0],["feedback",0],["long",0]],0],[112,0.115,[["config.tune",1],["tune",0],["codex",0],["global",0]],0],[125,0.105,[["한국어",0],["prompt",0],["drift",0],["workflow",0]],0],[85,0.103,[["config.tune",1],["tune",0],["global",0],["compaction",0]],0],[92,0.094,[["config.tune",1],["tune",0],["global",0],["manifest",0]],0],[50,0.088,[["config.tune",1],["tune",0],["manifest",0],["global",0]],0],[117,0.088,[["config.tune",1],["tune",0],["global",0]],0],[205,0.086,[["submit",0],["turn",0],["hook",0],["proposal",0]],0],[201,0.086,[["config.tune",1],["tune",0],["global",0]],0]],"kw":[["configurable",0],["reminder",0],["config.tune",1],["submit",0],["한국어",0],["응답",0]],"pv":"## Background\n\nOwner proposal, 2026-11-13. The owner's user-level `UserPromptSubmit` hook\nalready appends `(응답:한국어)` to every turn the host starts, including turns\na plugin or the mailbox submits. The owner wants the same channel for a\nworkflow reminder set through `config.tune`, e.g. `[reminder: FULL\nDELEGATION MODE]`, so a standing operating mode stays salient across a long\nsession; the same day the lead drifted from full delegation into running\nbuilds and tests itself, which such a reminder would have caught. ws ships no\n`UserPromptSubmit` hook today.\n\n## Idea\n\n- A config key (working name `lead.turn_reminder`, string, empty = off) set\n  through `config.tune`; the ws plugin's hook appends its value to every turn\n  of a lead session.\n- Lead sessions only: a worker or delegate must not receive a lead-mode\n  reminder (it would invert the instruction). Resolve lead vs worker from the\n  session key the hook can see.\n- Compatibility: a new config manifest field, T0. A new plugin hook is an\n  observable workflow behavior change: ask before ready.\n\n## Open\n\n- Harness coverage: Claude Code `UserPromptSubmit` additional context is\n  direct; Codex hook feedback semantics differ (see\n  `ai-docs/manuals/codex-integration.md`); Pi needs an extension-side\n  injection.\n- Scope of the value: global, per project, or per session (a mode the lead\n  sets for one session only).\n- Whether the reminder also rides compaction recovery (lead-revive) output."},{"s":"261113-feat-ws-dashboard-harness-auth-slots","t":"Dashboard: remember per-harness auth slots and switch accounts for new sessions","st":"idea","c":"feat","k":2,"ph":[0,0],"odq":0,"bh":0,"ln":32,"as":null,"x":[[237,"related","prerequisite (the usage gutter and popover this extends)",""]],"sim":[[237,0.359,[["claude_config_dir",1],["openai-codex",1],["codex_home",1],["usage-gutter",1]],
