<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket Map v5 — B+C 위계 포커스 + 키워드 수프 성좌</title>
<style>
:root{
  --bg:#f3f3f0; --fg:#1b1d21; --card:#ffffff; --muted:#e9e8e3; --muted-fg:#5f646b; --sub:#80858c;
  --primary:#2b62d9; --primary-fg:#fff;
  --line:color-mix(in srgb,var(--fg) 14%,transparent); --line2:color-mix(in srgb,var(--fg) 8%,transparent);
  --ok:#1d7348; --warn:#a35f00; --fail:#c0262d; --sim:#6a4bd6; --idea:#8a6d2f;
  --shadow:0 1px 2px rgb(0 0 0/.12),0 2px 6px rgb(0 0 0/.05);
  --shadow-hi:0 2px 4px rgb(0 0 0/.14),0 10px 28px rgb(0 0 0/.12);
  --pill:rgb(255 255 255/.95); --canvas:#ecebe6;
  --cl-s:56%; --cl-l:40%; --cl-a:.10;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --bar:46px; --insp:340px;
}
:root[data-theme="dark"]{
  --bg:#141518; --fg:#e8e9ec; --card:#1c1e23; --muted:#23262c; --muted-fg:#9aa0a9; --sub:#7d838c;
  --primary:#5b8cf0; --primary-fg:#0e1116;
  --line:color-mix(in srgb,var(--fg) 13%,transparent); --line2:color-mix(in srgb,var(--fg) 7%,transparent);
  --ok:#4cc38a; --warn:#e0a23a; --fail:#ef6b72; --sim:#a68cff; --idea:#c9a55a;
  --shadow:0 1px 2px rgb(0 0 0/.5);
  --shadow-hi:0 2px 4px rgb(0 0 0/.5),0 12px 32px rgb(0 0 0/.45);
  --pill:rgb(27 29 34/.94); --canvas:#111215;
  --cl-s:62%; --cl-l:66%; --cl-a:.085;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.45 var(--sans);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.cc{--c:hsl(var(--h) var(--cl-s) var(--cl-l))}
kbd{font:600 10px var(--mono);padding:0 4px;border-radius:4px;border:1px solid var(--line);color:var(--muted-fg);line-height:15px}
.mono{font-family:var(--mono)}

/* ---------------- top bar */
.bar{height:var(--bar);flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;position:sticky;top:0;z-index:30;
  background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{font-weight:680;font-size:13px;white-space:nowrap;letter-spacing:-.2px;display:flex;align-items:center;gap:7px}
.brand i{width:9px;height:9px;border-radius:3px;background:linear-gradient(135deg,var(--primary),var(--sim));display:block}
.seg{display:flex;gap:2px;padding:3px;background:var(--muted);border-radius:9px;flex:none}
.seg button{all:unset;cursor:pointer;height:28px;padding:0 10px;border-radius:7px;font-size:12px;color:var(--muted-fg);display:flex;align-items:center;gap:6px;white-space:nowrap}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:var(--shadow);font-weight:620}
.seg button:focus-visible,.pill:focus-visible,.btn:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
.search{position:relative;flex:0 1 230px;min-width:140px}
.search input{width:100%;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:0 64px 0 28px;font:12.5px var(--sans);outline:none}
.search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 22%,transparent)}
.search svg{position:absolute;left:9px;top:9px;width:12px;height:12px;stroke:var(--muted-fg);fill:none;stroke-width:2}
.search .hc{position:absolute;right:8px;top:7px;font:600 10.5px var(--mono);color:var(--muted-fg);display:flex;gap:5px;align-items:center}
.search .hc b{color:var(--primary);font-weight:700}
.pills{display:flex;gap:4px;flex:none}
.pill{all:unset;cursor:pointer;height:24px;padding:0 8px;border-radius:999px;border:1px solid var(--line);font-size:11.5px;color:var(--muted-fg);display:flex;align-items:center;gap:5px;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;display:block}
.pill[aria-pressed="true"]{color:var(--fg);background:var(--card);border-color:color-mix(in srgb,var(--fg) 22%,transparent)}
.pill[aria-pressed="false"]{opacity:.55;text-decoration:line-through}
.pill .n{font:600 10.5px var(--mono);color:var(--muted-fg)}
.spacer{flex:1;min-width:4px}
.stats{font-size:11.5px;color:var(--muted-fg);white-space:nowrap;padding:3px 9px;border-radius:999px;background:var(--muted)}
.stats b{color:var(--fg);font-weight:650}
.btn{all:unset;cursor:pointer;height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--line);font-size:12px;color:var(--fg);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;background:var(--card)}
.btn:hover{border-color:color-mix(in srgb,var(--fg) 30%,transparent)}
.btn.p{background:var(--primary);color:var(--primary-fg);border-color:transparent;font-weight:620}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.4;pointer-events:none}
@media (max-width:1440px){.brand span{display:none}.pill .n{display:none}}

/* ---------------- stage */
.stage{flex:1;min-height:0;display:flex;position:relative}
.views{flex:1;min-width:0;position:relative}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}

/* ---------------- view B matrix */
#bMain{position:absolute;inset:0;overflow:auto;overflow-x:hidden;scrollbar-gutter:stable}
.matrix{--cols:212px minmax(0,.78fr) minmax(0,1fr) minmax(0,1.3fr) minmax(0,1.3fr);padding:0 12px 40px}
.mhead{display:grid;grid-template-columns:var(--cols);gap:8px;position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 7px;border-bottom:1px solid var(--line)}
.mhead div{font-size:11px;font-weight:650;letter-spacing:.4px;color:var(--muted-fg);display:flex;align-items:center;gap:6px;text-transform:uppercase}
.mhead div b{font:600 10.5px var(--mono);color:var(--sub)}
.mhead .tools{text-transform:none;letter-spacing:0;gap:4px}
.mhead .tools button{all:unset;cursor:pointer;font-size:11px;color:var(--muted-fg);padding:1px 6px;border-radius:5px}
.mhead .tools button:hover{color:var(--fg);background:var(--muted)}
.lane{display:grid;grid-template-columns:var(--cols);gap:8px;padding:8px 0;border-bottom:1px solid var(--line2)}
.lane.empty{display:none}
.lh{position:sticky;top:44px;align-self:start;display:flex;flex-direction:column;gap:5px;padding:7px 9px 8px 13px;border-radius:9px;background:var(--card);border:1px solid var(--line2);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;user-select:none}
.lh::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.lh .ln{font-weight:650;font-size:12.5px;line-height:1.3;display:flex;gap:6px;align-items:flex-start}
.lh .ln .chev{flex:none;color:var(--muted-fg);font-size:10px;margin-top:3px;transition:transform .15s}
.lane.col .lh .chev{transform:rotate(-90deg)}
.lh .cnt{display:flex;gap:8px;font:11px var(--mono);color:var(--muted-fg)}
.lh .cnt b{color:var(--fg);font-weight:600}
.lh .cnt .r{color:var(--ok)}
.lh .kw{display:flex;flex-wrap:wrap;gap:3px}
.chip{font-size:10.5px;line-height:16px;padding:0 5px;border-radius:4px;background:var(--muted);color:var(--muted-fg);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.code{font-family:var(--mono);font-size:10px;background:color-mix(in srgb,var(--sim) 13%,transparent);color:color-mix(in srgb,var(--sim) 70%,var(--fg))}
.chip.men{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn);font-weight:600}
.cell{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:6px;align-content:start;min-width:0}
.cell.ref{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.lane.col .cell{display:flex;flex-wrap:wrap;gap:3px;align-content:center}
.lane.col .tc{display:none}
.dots{display:none;gap:3px;flex-wrap:wrap;align-items:center}
.lane.col .dots{display:flex}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--sd);display:block}
.dots i.h{box-shadow:0 0 0 2px var(--primary)}
.tc{position:relative;min-width:0;padding:6px 8px 7px 9px;border-radius:8px;background:var(--card);border:1px solid var(--line2);box-shadow:var(--shadow);cursor:pointer;transition:opacity .14s,border-color .14s,box-shadow .14s,transform .14s}
.tc::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2.5px;border-radius:2px;background:var(--c);opacity:.85}
.tc:hover{border-color:color-mix(in srgb,var(--c) 60%,transparent);box-shadow:var(--shadow-hi)}
.tc .top{display:flex;align-items:center;gap:5px;min-width:0;height:16px}
.sd{width:8px;height:8px;border-radius:50%;flex:none;background:var(--sd)}
.sd.done,.sd.dropped{background:none;width:auto;height:auto;font-size:10.5px;line-height:1;color:var(--muted-fg)}
.cat{font:600 9.5px var(--mono);letter-spacing:.2px;text-transform:uppercase;color:var(--muted-fg);padding:0 4px;border-radius:3px;background:var(--muted)}
.cat.bug{color:var(--fail)} .cat.epic{color:var(--sim)} .cat.research{color:var(--idea)}
.tc .ind{margin-left:auto;display:flex;gap:4px;align-items:center;font:600 9.5px var(--mono);color:var(--muted-fg)}
.ind .bk{color:var(--warn)} .ind .odq{color:var(--sim)} .ind .ph{display:flex;align-items:center;gap:3px}
.ind .ph i{display:block;width:18px;height:3px;border-radius:2px;background:var(--muted);overflow:hidden}
.ind .ph i b{display:block;height:100%;background:var(--ok)}
.tc .tt{font-size:12px;line-height:1.36;margin-top:3px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.tc.ref .tt{color:var(--muted-fg);font-size:11.5px}
.tc.ref{background:color-mix(in srgb,var(--card) 60%,var(--bg))}
.matrix.hovering .tc:not(.lit):not(.hov){opacity:.5}
.tc.lit{border-color:color-mix(in srgb,var(--primary) 70%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--primary) 50%,transparent),var(--shadow)}
.tc.hov{border-color:var(--primary)}
.tc.hit{box-shadow:0 0 0 2px color-mix(in srgb,var(--primary) 65%,transparent)}
.tc.fx{display:none}
.cell.ref .tc.more{display:none}
.lane.refall .cell.ref .tc.more,.matrix.searching .cell.ref .tc.more{display:block}
.lane.refall .cell.ref .tc.more.fx,.matrix.searching .cell.ref .tc.more.fx{display:none}
.more-btn{all:unset;cursor:pointer;font-size:11px;color:var(--muted-fg);padding:3px 8px;border-radius:6px;border:1px dashed var(--line);text-align:center}
.more-btn:hover{color:var(--fg);border-color:color-mix(in srgb,var(--fg) 30%,transparent)}
.matrix.searching .more-btn,.lane.col .more-btn{display:none}
.st-ready{--sd:var(--ok)} .st-todo{--sd:var(--primary)} .st-idea{--sd:var(--idea)} .st-done{--sd:var(--muted-fg)} .st-dropped{--sd:var(--fail)}
.cempty{font-size:11px;color:var(--sub);padding:4px 2px}

/* ---------------- view B focus (v5: hierarchical 3-tier workspace, full width) */
.focus{padding:0 18px 48px}
@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fbar{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:8px;padding:10px 0;background:var(--bg);border-bottom:1px solid var(--line)}
.fbar .trail{display:flex;gap:4px;align-items:center;min-width:0;overflow:hidden;font-size:11.5px;color:var(--muted-fg);flex:1}
.fbar .trail span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;cursor:pointer}
.fbar .trail span:hover{color:var(--fg)}
.fbar .trail span.cur{color:var(--fg);font-weight:600}
.fbar .trail em{font-style:normal;color:var(--sub)}
.btn[aria-pressed="true"]{border-color:var(--primary);color:var(--primary)}
.hier{position:relative;margin:14px 0 4px;padding:4px 0 6px;display:grid;grid-template-columns:minmax(0,1fr);column-gap:64px;row-gap:54px;align-items:start;animation:fin .22s ease-out}
.hier.has-lat{grid-template-columns:minmax(0,2fr) minmax(300px,1fr)}
.hier>.hwire,.hier>.hlab{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.hier>.hwire{z-index:0}
.hier>.hlab{z-index:2}
.hier>:not(.hwire):not(.hlab){position:relative;z-index:1;min-width:0}
.hwire path{fill:none;stroke-linejoin:round;stroke-linecap:round}
.hwire .w-parent,.hwire .w-child{stroke:color-mix(in srgb,var(--primary) 85%,var(--fg));stroke-width:1.6px}
.hwire .w-blocked-by,.hwire .w-blocks{stroke:var(--warn);stroke-width:1.8px}
.hwire .w-related{stroke:color-mix(in srgb,var(--fg) 38%,transparent);stroke-width:1.3px;stroke-dasharray:5 4}
.tier{grid-column:1;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.anc{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:11.5px;color:var(--muted-fg);max-width:100%}
.anc a{cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px;padding:1px 7px;border-radius:999px;border:1px solid var(--line2);background:color-mix(in srgb,var(--card) 60%,transparent)}
.anc a:hover{color:var(--fg);border-color:var(--line)}
.anc a .cat{margin-right:4px}
.anc em{font-style:normal;color:var(--sub)}
.grps{display:flex;justify-content:center;align-items:flex-start;gap:40px;max-width:100%}
.grp{min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.gcards{display:grid;grid-template-columns:repeat(var(--cols,1),var(--cw,232px));gap:24px 16px;justify-content:center}
.gcards .xc.more{display:none}
.grp.all .gcards .xc.more{display:grid}
.wl{position:absolute;left:0;top:0;font:600 10px var(--mono);height:17px;display:inline-flex;align-items:center;gap:4px;padding:0 6px;border-radius:4px;white-space:nowrap;letter-spacing:.2px;background:var(--bg)}
.wl b{font-weight:700}
.wl.parent,.wl.child{color:var(--primary);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--primary) 40%,transparent)}
.wl.blocked-by,.wl.blocks{color:var(--warn);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn) 45%,transparent)}
.wl.related{color:var(--muted-fg);box-shadow:inset 0 0 0 1px var(--line)}
.focal{grid-column:1;justify-self:center;width:min(800px,100%);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;padding:14px 16px 14px 21px;border-radius:12px;background:var(--card);
  border:1.5px solid color-mix(in srgb,var(--primary) 75%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 13%,transparent),var(--shadow-hi);overflow:hidden}
.focal::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--c)}
.focal .eyebrow{font:600 10px var(--mono);letter-spacing:.6px;text-transform:uppercase;color:var(--primary);margin-bottom:3px}
.focal h2{font-size:17px;line-height:1.36;letter-spacing:-.3px;word-break:break-word}
.focal .stem{font:11.5px var(--mono);color:var(--muted-fg);margin-top:3px;word-break:break-all}
.focal .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;align-items:center}
.focal .kwr{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.focal .acts{display:flex;flex-direction:column;gap:6px;align-items:stretch;justify-content:center}
.lat{grid-column:2;align-self:center;display:flex;flex-direction:column;gap:8px;min-width:0}
.lat h4{font-size:11.5px;font-weight:650;color:var(--muted-fg);display:flex;gap:6px;align-items:center;margin-bottom:2px}
.lat h4 b{font:600 10.5px var(--mono)}
.lat .xc.more{display:none}
.lat.all .xc.more{display:grid}
.sb{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:620;border:1px solid color-mix(in srgb,var(--sd) 45%,transparent);color:var(--sd);background:color-mix(in srgb,var(--sd) 11%,transparent);white-space:nowrap}
.cp{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:999px;font-size:11px;color:var(--fg);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.cp i{width:7px;height:7px;border-radius:2px;background:var(--c);flex:none;display:block}
.tag{font:11px var(--mono);color:var(--muted-fg);padding:1px 6px;border-radius:5px;background:var(--muted);white-space:nowrap}
.phbar{display:inline-flex;align-items:center;gap:6px;font:11px var(--mono);color:var(--muted-fg)}
.phbar i{display:block;width:70px;height:5px;border-radius:3px;background:var(--muted);overflow:hidden}
.phbar i b{display:block;height:100%;background:var(--ok)}
.fsec{margin-top:30px}
.semhead small{font:600 11px var(--mono);color:var(--muted-fg);background:var(--muted);padding:1px 7px;border-radius:999px}
.xc{display:grid;gap:5px;align-content:start;padding:8px 10px 9px 12px;border-radius:9px;background:var(--card);border:1px solid var(--line2);box-shadow:var(--shadow);cursor:pointer;position:relative;overflow:hidden;min-width:0;transition:border-color .14s,box-shadow .14s}
.xc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.xc:hover{border-color:color-mix(in srgb,var(--primary) 60%,transparent);box-shadow:var(--shadow-hi)}
.xc .r1{display:flex;gap:5px;align-items:center;flex-wrap:wrap;min-width:0}
.xc .tt{font-size:12.5px;line-height:1.38;font-weight:540;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.xc .note{font-size:11.5px;color:var(--muted-fg);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding:3px 7px;border-radius:6px;background:var(--muted);border-left:2px solid color-mix(in srgb,var(--c) 70%,transparent)}
.xc .note em{font-style:normal;font-size:10px;color:var(--sub);margin-right:4px}
.xc .kids{font:600 10px var(--mono);color:var(--primary);padding:0 5px;border-radius:4px;background:color-mix(in srgb,var(--primary) 12%,transparent);height:18px;display:inline-flex;align-items:center}
.rp{font:600 10px var(--mono);height:18px;display:inline-flex;align-items:center;padding:0 6px;border-radius:4px;letter-spacing:.2px}
.rp.parent,.rp.child{background:color-mix(in srgb,var(--primary) 16%,transparent);color:var(--primary)}
.rp.blocked-by,.rp.blocks{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.rp.related{background:var(--muted);color:var(--muted-fg)}
.fempty{border:1px dashed var(--line);border-radius:11px;padding:14px 16px;color:var(--muted-fg);font-size:12.5px;display:flex;gap:10px;align-items:center}
.hier .fempty{grid-column:1;justify-self:center;max-width:800px}
.gmore{font-size:11px}
.semhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px;padding:9px 12px;border-radius:11px;background:var(--card);border:1px solid var(--line2)}
.semhead h3{font-size:13.5px;display:flex;align-items:center;gap:8px;letter-spacing:-.1px}
.semhead h3 span{color:var(--muted-fg);font-weight:500;font-size:12px}
.semhead .ctl{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted-fg)}
.semhead input[type=range],.ctool input[type=range]{width:110px;accent-color:var(--sim)}
.semhead output,.ctool output{font:600 11px var(--mono);color:var(--sim);min-width:30px}
.tg{display:flex;gap:2px;padding:2px;border-radius:7px;background:var(--muted)}
.tg button{all:unset;cursor:pointer;font-size:11.5px;padding:2px 8px;border-radius:5px;color:var(--muted-fg);white-space:nowrap}
.tg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:var(--shadow);font-weight:600}
.chk{display:flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap}
.chk input{accent-color:var(--primary)}
.semgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:8px}
.sc{display:grid;grid-template-columns:54px minmax(0,1fr);gap:10px;padding:9px 11px 9px 9px;border-radius:10px;background:var(--card);border:1px solid var(--line2);box-shadow:var(--shadow);cursor:pointer;position:relative;overflow:hidden;transition:border-color .14s,box-shadow .14s}
.sc:hover{border-color:color-mix(in srgb,var(--sim) 60%,transparent);box-shadow:var(--shadow-hi)}
.sc .pct{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border-radius:8px;background:color-mix(in srgb,var(--sim) calc(var(--p) * .3%),var(--muted));padding:6px 3px}
.sc .pct b{font:700 16px/1 var(--mono);color:var(--fg);letter-spacing:-.5px}
.sc .pct b small{font-size:10.5px;font-weight:600;color:var(--muted-fg)}
.sc .pct i{display:block;width:40px;height:4px;border-radius:2px;background:color-mix(in srgb,var(--fg) 12%,transparent);overflow:hidden}
.sc .pct i u{display:block;height:100%;background:var(--sim);border-radius:2px}
.sc .m{display:grid;gap:5px;min-width:0;align-content:start}
.sc .r1{display:flex;gap:5px;align-items:center;flex-wrap:wrap;min-width:0}
.sc .r1 .cp{max-width:190px}
.sc .tt{font-size:12.5px;font-weight:560;line-height:1.38;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.sc .chips{display:flex;gap:4px;flex-wrap:wrap}
.lk{font-size:10.5px;font-weight:650;height:18px;display:inline-flex;align-items:center;padding:0 6px;border-radius:4px;white-space:nowrap}
.lk.new{background:color-mix(in srgb,var(--ok) 17%,transparent);color:var(--ok)}
.lk.old{background:var(--muted);color:var(--muted-fg);font-weight:500}

/* ---------------- inspector */
.insp{flex:none;width:var(--insp);border-left:1px solid var(--line);background:color-mix(in srgb,var(--card) 55%,var(--bg));display:none;flex-direction:column;min-height:0;position:relative}
.insp.on{display:flex}
.insp.min{width:38px}
.insp.min .ib{display:none}
.insp .ih{display:flex;align-items:center;gap:6px;padding:9px 10px;border-bottom:1px solid var(--line);font-size:11px;font-weight:650;letter-spacing:.5px;color:var(--muted-fg);text-transform:uppercase;white-space:nowrap}
.insp.min .ih span{display:none}
.insp .ih button{all:unset;cursor:pointer;margin-left:auto;width:20px;height:20px;display:grid;place-items:center;border-radius:5px;color:var(--muted-fg)}
.insp .ih button:hover{background:var(--muted);color:var(--fg)}
.insp.min .ih button{margin:0}
.ib{overflow:auto;padding:12px 14px 30px;display:flex;flex-direction:column;gap:12px}
.ib h3{font-size:14px;line-height:1.35}
.ib .stem{font:11px var(--mono);color:var(--muted-fg);word-break:break-all}
.kv{display:grid;grid-template-columns:76px minmax(0,1fr);gap:5px 8px;font-size:12px}
.kv dt{color:var(--muted-fg)}
.kv dd{min-width:0;overflow:hidden;text-overflow:ellipsis}
.ib .sec{font-size:10.5px;font-weight:650;letter-spacing:.5px;text-transform:uppercase;color:var(--muted-fg);display:flex;gap:6px;align-items:center}
.ib .sec b{font:600 10.5px var(--mono);color:var(--sub)}
.il{display:grid;gap:3px}
.il a{display:flex;gap:6px;align-items:center;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:12px;min-width:0;text-decoration:none;color:inherit}
.il a:hover{background:var(--muted)}
.il a span.t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.il a .pc{font:600 10.5px var(--mono);color:var(--sim);min-width:30px;text-align:right}

/* ---------------- view C */
#vp{position:absolute;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--canvas);cursor:grab}
#vp.grabbing{cursor:grabbing}
#vp.nodedrag{cursor:move}
#vp svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hull{fill:hsl(var(--h) var(--cl-s) var(--cl-l)/var(--cl-a));stroke:hsl(var(--h) var(--cl-s) var(--cl-l)/.38);stroke-width:1.2px;vector-effect:non-scaling-stroke}
.ed{fill:none;vector-effect:non-scaling-stroke;pointer-events:none}
.ed.parent{stroke:color-mix(in srgb,var(--fg) 46%,transparent);stroke-width:1.3px}
.ed.blocked{stroke:var(--warn);stroke-width:1.5px;opacity:.9}
.ed.related{stroke:color-mix(in srgb,var(--fg) 30%,transparent);stroke-width:1px;stroke-dasharray:4 4}
.ed.sim{stroke:var(--sim);stroke-width:1.15px;stroke-dasharray:1.5 3.2;stroke-linecap:round;opacity:.8}
.ehit{fill:none;stroke:transparent;stroke-width:9px;vector-effect:non-scaling-stroke;pointer-events:stroke}
.ed.hl{opacity:1;stroke-width:2.2px}
.ed.sim.hl{stroke-width:2px;stroke-dasharray:2 3}
.has-sel .ed:not(.hl),.has-q .ed{opacity:.12}
.nd .core{stroke-width:1.5px;vector-effect:non-scaling-stroke;transition:opacity .15s}
.nd.st-ready .core{fill:var(--c);stroke:var(--ok);stroke-width:2.4px}
.nd.st-todo .core{fill:var(--c);stroke:var(--canvas)}
.nd.st-idea .core{fill:color-mix(in srgb,var(--c) 42%,var(--canvas));stroke:var(--c)}
.nd.st-done .core{fill:var(--canvas);stroke:var(--muted-fg)}
.nd.st-dropped .core{fill:var(--canvas);stroke:var(--fail);stroke-dasharray:2 2;opacity:.85}
.nd{transition:opacity .15s}
.has-sel .nd:not(.nb):not(.sel){opacity:.22}
.has-q .nd:not(.qh){opacity:.18}
.nd.qh .core{stroke:var(--primary);stroke-width:2.6px}
.nd.fx,.ed.fx,.ehit.fx{display:none}
.selring{fill:none;stroke:var(--primary);stroke-width:2.5px;vector-effect:non-scaling-stroke;pointer-events:none}
.hovring{fill:none;stroke:var(--fg);stroke-width:1.5px;vector-effect:non-scaling-stroke;pointer-events:none;opacity:.7}
.ego-on .hull{opacity:0}
.ego-on .nd:not(.eg){opacity:0;pointer-events:none}
.ego-on #gEdge{display:none}
.egoguide{fill:none;stroke:color-mix(in srgb,var(--fg) 10%,transparent);stroke-width:1px;stroke-dasharray:3 5;vector-effect:non-scaling-stroke}
#lbl{position:absolute;inset:0;pointer-events:none;overflow:hidden;--halo:0 1px 6px var(--canvas),0 0 12px var(--canvas),0 0 3px var(--canvas)}
/* ticket labels: calm borderless typography with a soft halo; framed badge only for hovered / selected */
.lb{position:absolute;left:0;top:0;height:18px;line-height:18px;padding:0 4px;overflow:hidden;text-overflow:ellipsis;font-size:12px;white-space:nowrap;color:color-mix(in srgb,var(--fg) 90%,transparent);background:none;border:0;text-shadow:var(--halo);pointer-events:auto;display:none;will-change:transform}
.lb.on{display:block}
.lb b{font:600 10.5px var(--mono);color:var(--sim);margin-right:5px}
.lb.sel,.lb.hov{height:20px;line-height:18px;padding:0 8px;border-radius:6px;background:var(--pill);border:1px solid var(--primary);box-shadow:0 2px 10px rgb(0 0 0/.28);text-shadow:none;color:var(--fg);font-weight:620}
.lb.hov:not(.sel){border-color:color-mix(in srgb,var(--fg) 45%,transparent);font-weight:560}
.lb.dim{opacity:.5}
.lb.kw{color:var(--fg)}
/* cluster anchor header: borderless, dot + auto label + count */
.cb{position:absolute;left:0;top:0;height:22px;padding:0 6px;font-size:12px;font-weight:680;letter-spacing:-.1px;white-space:nowrap;display:none;align-items:center;gap:6px;
  color:color-mix(in srgb,hsl(var(--h) var(--cl-s) var(--cl-l)) 55%,var(--fg));background:none;border:0;text-shadow:var(--halo);pointer-events:none}
.cb.on{display:flex}
.cb i{width:8px;height:8px;border-radius:50%;background:hsl(var(--h) var(--cl-s) var(--cl-l));display:block;box-shadow:0 0 0 3px hsl(var(--h) var(--cl-s) var(--cl-l)/.18);flex:none}
.cb small{font:600 10.5px var(--mono);color:var(--muted-fg)}
/* keyword soup: topographic sub-keywords at the real ticket centroid */
.sk{position:absolute;left:0;top:0;white-space:nowrap;text-align:center;display:none;background:none;border:0;padding:0;
  color:hsl(var(--h) 52% var(--sk-l));opacity:calc(var(--a) * var(--soup,1));text-shadow:var(--halo);pointer-events:auto;cursor:pointer;letter-spacing:-.15px;font-weight:540;will-change:transform,opacity;transition:color .12s}
:root{--sk-l:30%}
:root[data-theme="dark"]{--sk-l:80%}
.sk.on{display:block}
.sk.code{font-family:var(--mono);letter-spacing:-.4px;font-weight:500}
.sk:hover,.sk.kwon{opacity:1;color:var(--fg);text-decoration:underline;text-decoration-color:hsl(var(--h) var(--cl-s) var(--cl-l));text-underline-offset:3px;text-decoration-thickness:1.5px}
.sect{position:absolute;left:0;top:0;text-align:center;overflow:hidden;font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--muted-fg);background:none;text-shadow:var(--halo);padding:2px 9px;display:none;white-space:nowrap;pointer-events:none}
.sect.on{display:block}
/* calm overview backdrop (soft starlight) */
.calm .hull{stroke:hsl(var(--h) var(--cl-s) var(--cl-l)/.24)}
.calm .ed.parent,.calm .ed.blocked,.calm .ed.related{opacity:.28}
.calm .ed.sim{opacity:.22}
.calm .nd .core{opacity:.8}
.calm .nd.nb .core,.calm .nd.sel .core,.calm .nd.hvn .core,.calm .nd.kwh .core{opacity:1}
.ed.hl,.ed.hv{opacity:1!important}
.ed.hv{stroke-width:2px}
.nd.hvn .core{opacity:1}
.has-kw .nd:not(.kwh){opacity:.2}
.has-kw .ed:not(.hv){opacity:.1!important}
.nd.kwh .core{stroke:var(--fg);stroke-width:2.2px}
.kwchip{display:none;align-items:center;gap:6px;height:24px;padding:0 4px 0 9px;border-radius:999px;font-size:11.5px;color:var(--fg);background:color-mix(in srgb,hsl(var(--h) var(--cl-s) var(--cl-l)) 16%,var(--card));border:1px solid hsl(var(--h) var(--cl-s) var(--cl-l)/.6);white-space:nowrap}
.kwchip.on{display:inline-flex}
.kwchip b{font-weight:650}
.kwchip button{all:unset;cursor:pointer;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:var(--muted-fg);font-size:13px;line-height:1}
.kwchip button:hover{background:var(--muted);color:var(--fg)}
.ctool{position:absolute;left:12px;top:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 8px;border-radius:10px;background:var(--pill);border:1px solid var(--line);box-shadow:var(--shadow);font-size:11.5px;color:var(--muted-fg);z-index:4;max-width:calc(100% - 24px)}
.ctool .et{all:unset;cursor:pointer;display:flex;align-items:center;gap:5px;padding:3px 7px;border-radius:6px;white-space:nowrap}
.ctool .et svg{width:22px;height:8px;overflow:visible}
.ctool .et[aria-pressed="false"]{opacity:.45}
.ctool .et:hover{background:var(--muted);color:var(--fg)}
.ctool .sep{width:1px;height:16px;background:var(--line)}
.ctool .rd{font:600 11px var(--mono);color:var(--fg)}
.zoomctl{position:absolute;right:12px;bottom:12px;display:flex;gap:2px;align-items:center;padding:3px;border-radius:9px;background:var(--pill);border:1px solid var(--line);box-shadow:var(--shadow);z-index:4}
.zoomctl button{all:unset;cursor:pointer;min-width:26px;height:26px;padding:0 6px;display:grid;place-items:center;border-radius:6px;font-size:13px;color:var(--fg)}
.zoomctl button.s{font-size:11.5px}
.zoomctl button:hover{background:var(--muted)}
.zoomctl output{font:600 11px var(--mono);color:var(--muted-fg);min-width:44px;text-align:center}
.legend{position:absolute;left:12px;bottom:12px;padding:7px 10px;border-radius:9px;background:var(--pill);border:1px solid var(--line);box-shadow:var(--shadow);font-size:11px;color:var(--muted-fg);display:flex;gap:10px;align-items:center;z-index:4}
.legend span{display:flex;gap:5px;align-items:center;white-space:nowrap}
.legend svg{width:12px;height:12px}
.hint{position:absolute;right:12px;top:12px;font-size:11px;color:var(--muted-fg);padding:5px 9px;border-radius:8px;background:var(--pill);border:1px solid var(--line);z-index:4;display:flex;gap:8px;align-items:center}
.egobar{position:absolute;right:12px;top:12px;display:none;gap:8px;align-items:center;padding:6px 8px 6px 12px;border-radius:10px;background:var(--pill);border:1px solid var(--primary);box-shadow:var(--shadow-hi);z-index:5;font-size:12px;max-width:60%}
.egobar.on{display:flex}
.egobar>span{white-space:nowrap}
.egobar b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#vC.ego .ctool{display:none}
#vC.ego .egobar{left:12px;right:auto;max-width:calc(100% - 24px)}
.tip{position:absolute;left:0;top:0;z-index:8;pointer-events:none;max-width:340px;padding:8px 10px;border-radius:9px;background:var(--pill);border:1px solid var(--line);box-shadow:var(--shadow-hi);font-size:12px;display:none;backdrop-filter:blur(6px)}
.tip.on{display:block}
.tip .tt{font-weight:620;line-height:1.35}
.tip .s{font:10.5px var(--mono);color:var(--muted-fg);margin-top:2px}
.tip .r{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px;align-items:center}
.tip .big{font:700 15px var(--mono);color:var(--sim)}

/* ---------------- modal */
.modal{position:fixed;inset:0;z-index:50;background:rgb(0 0 0/.45);display:none;place-items:center;padding:30px}
.modal.on{display:grid}
.mbox{width:min(860px,100%);max-height:86vh;display:flex;flex-direction:column;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-hi);overflow:hidden}
.mbox header{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.mbox header h3{font-size:14px;flex:1;min-width:0}
.mbox .mb{overflow:auto;padding:14px 20px 24px;font-size:13px;line-height:1.6}
.mb h4{font-size:13.5px;margin:14px 0 4px}
.mb h5{font-size:12.5px;margin:10px 0 3px;color:var(--muted-fg)}
.mb p{margin:5px 0}
.mb li{margin-left:18px}
.mb code{font:12px var(--mono);background:var(--muted);padding:0 4px;border-radius:4px}
.mb pre{font:11.5px/1.5 var(--mono);background:var(--muted);padding:8px 10px;border-radius:7px;overflow:auto;margin:6px 0}
.mb .warn{font-size:11.5px;color:var(--muted-fg);border-top:1px solid var(--line);margin-top:14px;padding-top:8px}
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><i></i><span>Ticket Map v5</span></div>
  <div class="seg" role="group" aria-label="뷰 선택">
    <button id="tabB" aria-pressed="true" title="스윔레인 매트릭스 (1)">B · 스윔레인 매트릭스 <kbd>1</kbd></button>
    <button id="tabC" aria-pressed="false" title="성좌 그래프 (2)">C · 성좌 그래프 <kbd>2</kbd></button>
  </div>
  <label class="search"><svg viewBox="0 0 12 12"><circle cx="5" cy="5" r="3.6"/><path d="M8 8l3 3"/></svg>
    <input id="q" type="search" placeholder="티켓 검색" autocomplete="off" spellcheck="false" aria-label="티켓 검색">
    <span class="hc"><span id="qc"></span><kbd>/</kbd></span></label>
  <div class="pills" id="pills"></div>
  <span class="spacer"></span>
  <span class="stats" id="stats"></span>
  <button class="btn ghost" id="theme" title="테마 전환">◐ <span id="themeLbl">다크</span></button>
</header>

<main class="stage">
  <div class="views">
    <section class="view on" id="vB"><div id="bMain"></div></section>
    <section class="view" id="vC">
      <div id="vp">
        <svg id="svg" aria-label="성좌 그래프">
          <defs>
            <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 1L10 5L0 9z" fill="var(--warn)"/></marker>
            <marker id="arwP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 1L10 5L0 9z" fill="color-mix(in srgb,var(--fg) 46%,transparent)"/></marker>
          </defs>
          <g id="world"><g id="gHull"></g><g id="gGuide"></g><g id="gEdge"></g><g id="gEgo"></g><g id="gNode"></g><circle class="hovring" id="hovRing" r="0"/><circle class="selring" id="selRing" r="0"/></g>
        </svg>
        <div id="lbl"></div>
      </div>
      <div class="ctool" id="ctool">
        <button class="et" data-e="parent" aria-pressed="true" title="parent 엣지"><svg><line x1="0" y1="4" x2="22" y2="4" stroke="currentColor" stroke-width="1.5"/></svg>Parent</button>
        <button class="et" data-e="blocked" aria-pressed="true" title="blocked-by 엣지"><svg><line x1="0" y1="4" x2="17" y2="4" stroke="var(--warn)" stroke-width="1.6"/><path d="M15 0.5L22 4L15 7.5z" fill="var(--warn)"/></svg>Blocked-by</button>
        <button class="et" data-e="related" aria-pressed="false" title="related 엣지 (기본 끔)"><svg><line x1="0" y1="4" x2="22" y2="4" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 3"/></svg>Related</button>
        <span class="sep"></span>
        <button class="et" data-e="sim" aria-pressed="true" title="본문 유사도 엣지"><svg><line x1="0" y1="4" x2="22" y2="4" stroke="var(--sim)" stroke-width="1.6" stroke-dasharray="1.5 3" stroke-linecap="round"/></svg>유사도 ≥</button>
        <input type="range" id="simTh" min="15" max="60" step="1" value="24" aria-label="유사도 엣지 임계값"><output id="simThO">24%</output>
        <span>엣지 <span class="rd" id="simCnt">0</span></span>
        <span class="sep"></span>
        <button class="btn" id="egoBtn" disabled title="선택 티켓 Ego Ring (E)">◎ Ego Ring <kbd>E</kbd></button>
        <span class="kwchip" id="kwchip" role="status"><span>키워드:</span><b id="kwT"></b><span id="kwN"></span><button id="kwX" title="키워드 필터 해제 (Esc)" aria-label="키워드 필터 해제">×</button></span>
      </div>
      <div class="hint" id="chint">드래그 = 이동 · 휠 = 확대/축소 · <kbd>Alt</kbd>+드래그 = 노드 이동 · 키워드 클릭 = 필터 · 더블클릭 = Ego Ring</div>
      <div class="egobar" id="egobar"><span>◎ Ego Ring</span><b id="egoTitle"></b><button class="btn" id="egoExit">닫기 <kbd>Esc</kbd></button></div>
      <div class="legend" id="legend">
        <span><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.4" fill="var(--sub)" stroke="var(--ok)" stroke-width="2"/></svg>Ready</span>
        <span><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.6" fill="var(--sub)"/></svg>Todo</span>
        <span><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.2" fill="color-mix(in srgb,var(--sub) 40%,var(--canvas))" stroke="var(--sub)" stroke-width="1.4"/></svg>Idea</span>
        <span><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.2" fill="none" stroke="var(--muted-fg)" stroke-width="1.4"/></svg>Done 참조</span>
        <span><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.2" fill="none" stroke="var(--fail)" stroke-width="1.4" stroke-dasharray="2 2"/></svg>Dropped 참조</span>
        <span>색 = 자동 클러스터</span>
      </div>
      <div class="zoomctl"><button id="zOut" title="축소">−</button><output id="zRd">100%</output><button id="zIn" title="확대">+</button><button class="s" id="zFit" title="전체 맞춤">Fit</button><button class="s" id="z100" title="100%">1:1</button></div>
      <div class="tip" id="tip"></div>
    </section>
  </div>
  <aside class="insp" id="insp"><div class="ih"><span>인스펙터</span><button id="inspT" title="인스펙터 접기/펴기">⇥</button></div><div class="ib" id="ib"></div></aside>

_busy",1],["sq",0]],0],[274,0.112,[["folders_cache.go",1],["whiteboard_nudges.go",1],["folder",0],["readfile",1]],0]],"kw":[["pending.json",1],["folders.go",1],["meta.json",1],["committed.json",1],["whiteboard.load",1],["sqlite_busy",1]],"pv":"## Background\n\nThe whiteboard's authoritative store is a repo-rooted, git-excluded folder per\nsession board, `ai-docs/whiteboards/<reply-id>/`, written through a two-phase\nintent protocol (`wswhiteboard/folders.go`). The epic\n`261119-epic-ws-daemon-sqlite-storage` moves it to one SQLite file per board.\nThe owner chose this store as the epic's pilot child (2026-11-19, 23:06), so\nit also sets the pattern later children follow.\n\nGo paths below are relative to `agents-plugin-tool/internal/`. Line numbers\nwere read on `develop` at `9f43a8f00` and `7c26b7b0a`. They drift: re-check\neach one against the implementation base before editing.\n\nBoard folder `ai-docs/whiteboards/<reply-id>/`:\n\n| File | Role | Source |\n|---|---|---|\n| `meta.json` | Session metadata: schema version, generation, `next_topic`, `State` minus topics/items/labels/close results, topic refs (dir, key, `log_bytes`), item order | `wswhiteboard/folders.go:49-56` |\n| `pending.json` | Commit intent: exact panel bytes, log appends with offsets, topic metadata, next session metadata; replayed before any read | `folders.go:78-91`, `:400-408`, `:957-1045` |\n| `committed.json` | Receipt (`schema_version`, `generation`) that blocks a legacy fallback when `meta.json` is missing | `folders.go:93-96`, `:450-455` |\n| `.lock` | Cross-process flock for every open and update (30 s queue budget) | `folders.go:225-259` |\n| `tN/meta.json` | Topic metadata: doc minus entries, items, label, closed flag, close result | `folders.go:58-65`\n…"},{"s":"261120-bug-ws-rail-heartbeat-starvation","t":"레일 하트비트 정체 근본 수정 (하트비트 sweeper 분리 + 세션별 잠금)","st":"ready","c":"bug","k":3,"ph":[0,1],"odq":0,"bh":0,"ln":132,"as":null,"x":[],"sim":[[68,0.21,[["heartbeatat",1],["conv",0],["heartbeat",0],["writeregistration",1]],0],[161,0.195,[["heartbeatinterval",1],["heartbeat",0],["registration",0],["interval",0]],0],[274,0.13,[["heartbeat",0],["registration",0],["wsagent",0],["snapshot",0]],0],[74,0.129,[["wsagent",0],["runner_summary.go",1],["registration",0],["conv",0]],0],[238,0.118,[["registration.json",1],["asleep",0],["fence",0],["wsagent",0]],0],[165,0.093,[["registration.json",1],["green",0],["row",0],["loop",0]],0],[93,0.088,[["performance.md",1],["wsagent",0],["stall",0],["sweep",0]],0]],"kw":[["heartbeatat",1],["heartbeatinterval",1],["conv",0],["heartbeat",0],["writeregistration",1],["registration.json",1]],"pv":"## Background\n\nOn 2026-11-20 rail rows for live hosted sessions disappeared for about five\nminutes and then returned one by one. Diagnosis (read-only, file:line\nverified at develop b5842fabd):\n\n- The conv loop owns the periodic `HeartbeatAt` refresh. Its default tick is\n  every 30 s and it rewrites `registration.json` every\n  `wsdashboard.HeartbeatInterval` (agents-plugin-tool/internal/wsagent/runner_conv.go#L478-L479,\n  agents-plugin-tool/internal/wsagent/runner_conv.go#L566-L588).\n- The beat called `c.live.heartbeatSnapshot()` before `writeRegistration()`.\n  The snapshot publish takes the runner-wide `summaryMu`\n  (`internal/wsagent/runner_summary.go`, `internal/wsagent/record.go`), which\n  other sessions hold across ring I/O. One slow disk write can therefore stall\n  other hosted lead sessions' snapshot publication and, once their loops block,\n  their later registration heartbeats (agents-plugin-tool/internal/wsagent/runner_summary.go#L19-L29,\n  agents-plugin-tool/internal/wsagent/record.go#L611-L624).\n- The rail classifies a row whose heartbeat is older than five minutes as\n  pending deletion before it checks \"asleep\"\n  (`internal/wsdashboard/session_visibility.go`), so the row is hidden.\n- The overnight 15-17 minute ws call hangs are plausibly the same stall;\n  unproven, because no goroutine dump was captured.\n\nFix 1 (refresh registration before the snapshot) landed in 46dc9c67e as a\nmitigation. It only reorders one tick: a conv loop already blocked inside\nanother `summa\n…"},{"s":"261003-feat-pi-execute-readonly-auto-approval","t":"Auto-approve read-only ws-execute commands with a typed decision model; mutations still go to the lead","st":"todo","c":"feat","k":2,"ph":[0,2],"odq":0,"bh":0,"ln":105,"as":null,"x":[[202,"related","prerequisite; structural removal of git inspection approvals lands first, and this ticket's value is measured on the residual",""],[203,"related","origin; decision-model survey and the discussion that narrowed this to read-only",""],[184,"related","origin constraints; §2 per-mutation gate invariant kept, §5 no-string-classification partially reversed",""]],"sim":[[203,0.349,[["jev",0],["decision.ask",1],["ws-worker-exec",1],["risky",0]],0],[202,0.184,[["ws-worker-exec",1],["classifier",0],["execute",0],["mutation",0]],0],[184,0.132,[["ws-worker-exec",1],["risky",0],["gateway",0],["execute",0]],0],[72,0.085,[["llm",0],["exec",0],["judge",0],["model",0]],0]],"kw":[["shadow",0],["jev",0],["ws-worker-exec",1],["classifier",0],["risky",0],["irreversible",0]],"pv":"## Background\n\nEvery `ws-worker-exec` command an execute-worker issues costs a lead turn,\nincluding commands that change nothing. Once\n`261003-feat-pi-execute-worker-git-read-tools` lands, the remaining read-only\nrequests in the historical sample are:\n\n- 39 non-git inspection requests (`date`, `env`, smoke scripts, version probes);\n- 18 cross-worktree `git -C` inspection requests;\n- possibly 13 build/test requests.\n\nThat is up to ~70 of 327, about 20%.\n\n## Decisions\n\n- **Read-only auto-approval only.**\n  - A typed decision model (TypeSafe Jev or equivalent) may auto-approve **only** commands it judges read-only.\n  - `risky_edit`, `irreversible` and secrets-touching are vetoes.\n  - Every mutation, including non-risky reversible ones, still elevates to the lead.\n  - Rejected: auto-approving non-risky mutations. It would reverse `260904` §2 and wave through calls the lead uses as review checkpoints (e.g. a `git commit` denied over a correctness flaw). Routine mutation belongs on an ungated general worker.\n- **§2 is kept to the letter; §5 is partially reversed.**\n  - §2 holds because non-mutations were never what the per-mutation gate protects.\n  - §5's rejection of command-string classification is partially reversed. That is accepted because the execute-worker is cooperative, the residual risk is model error or injection, and layered vetoes bound it.\n- **Its own ticket.** It takes `261003-feat-pi-execute-worker-git-read-tools` as prerequisite, so its value is measured on the res\n…"},{"s":"261106-feat-whiteboard-policy-answer-user-alternative","t":"Whiteboard policy answer that proposes the user's own alternative","st":"todo","c":"feat","k":4,"ph":[0,1],"odq":0,"bh":0,"ln":80,"as":null,"x":[],"sim":[[54,0.129,[["comment",0],["whiteboard",0],["policy",0],["answer",0]],0],[72,0.101,[["intent",0],["discussion",0],["answer",0],["whiteboard",0]],0],[44,0.094,[["reproduction",0],["policy",0],["create",0],["assume",0]],0],[7,0.087,[["old-write",1],["new-reopen",1],["amendment",0],["intent",0]],0],[47,0.086,[["reproduction",0],["whiteboard",0],["policy",0],["writer",0]],0],[10,0.085,[["old-write",1],["new-reopen",1],["amendment",0],["reopen",0]],0],[270,0.081,[["old-write",1],["new-reopen",1],["patch",0],["parser",0]],0]],"kw":[["letter",0],["old-write",1],["new-reopen",1],["alternative",0],["comment",0],["patch",0]],"pv":"## Background\n\nDogfood surprise (2026-11-06, devenv lead session): the user answered a\npolicy item with an alternative none of its options named (\"(202) note:\nstore each ring entry as its own file ...\"). `whiteboard.update` refused\nthe answer: \"a policy answer starts with its option letter (a-c)\". The\nlead had to patch the item's `options` to append the user's alternative as\noption d in a separate update (since `answer` applies before `patch` in one\nbatch), and then record `d` in a second update, breaking the one-update-\nper-turn rule.\n\nThe `whiteboard` playbook's `#### Answers` covers letters, notes, and\n`assumed`, but not an answer that is a new alternative. Users do this often\nin discussion, so every lead hits the same two-update workaround.\n\nOpen for design: accept a free-text policy answer (for example `answer:\n\"other, <text>\"` or no letter), apply `patch` before `answer` within a batch\nso one update can add and select the option, or document the two-step\nworkaround in the playbook.\n\n## Additional dogfood evidence — 2026-11-16 (#14)\n\nThe owner again reported that a whiteboard policy item cannot record an answer\noutside its listed options. This matches the original incident above; reuse\nthis ticket and accept it into todo instead of creating a duplicate. Today's\nitem ID and exact answer/refusal were not supplied, so the original concrete\nrefusal remains the detailed reproduction evidence. Do not treat a note-only\ncommented status as necessarily equivalent to recording a n\n…"},{"s":"261110-epic-ws-dashboard-agent-host","t":"ws dashboard as the first-tier agent host: daemon-spawned lead sessions, multi-session and workspace management, terminal, file preview","st":"todo","c":"epic","k":0,"ph":[0,0],"odq":0,"bh":0,"ln":149,"as":null,"x":[[183,"related","partially reversed - the daemon takes back session hosting and the terminal that this decision ceded to Orca",""],[210,"related","the daemon this epic builds on; its Non-Scope (no browser terminal; no browser permission approval, 241 b) is reopened here",""],[211,"related","the session page as the primary conversation surface; reused for daemon-hosted sessions",""]],"sim":[[219,0.168,[["workspace",0],["management",0],["orca",0],["terminal",0]],0],[183,0.155,[["orca",0],["management",0],["ade",0],["workspace",0]],0],[233,0.136,[["tauri",0],["desktop",0],["thin",0],["shell",0]],0],[211,0.125, ueues and per-session history remain the substrate. Public recipients must survive existing body-based delivery and rendering without adding stored envelope fields.\n\n## Decisions\n\n- **Accepted argument shape — (787)=a:** `mailbox.send` accepts `to: string | string[]`, with optional `cc: string[]` and `bcc: string[]`. Preserve existing scalar addressing. To, CC and BCC are delivery destinations, not passive labels.\n- **Independent fan-out:** the server delivers one ordinary envelope per recipient. This is explicit finite addressing; there is no all-peers broadcast, stored group, magic mailbox slug or membership expansion.\n- **Public context in content:** the server prepends a generated public To/CC header to the content body. All copies carry public To/CC context; BCC is never shown in that public header or disclosed to co-recipients. Preserve the supplied message body after the generated context. Do not depend on a new structured envelope/header field to make the audience visible.\n- **Compatibility: T0, additive argumen\n…"},{"s":"261114-feat-ws-whiteboard-center-reference-scroll","t":"Center whiteboard reference navigation targets","st":"todo","c":"feat","k":7,"ph":[0,1],"odq":0,"bh":0,"ln":45,"as":null,"x":[[248,"related","preserves deferred closed-topic reveal and highlight scope",""]],"sim":[[248,0.638,[["center",0],["reveal",0],["navigation",0],["reference",0]],0],[169,0.177,[["center",0],["navigation",0],["topic",0],["screenshot",0]],0],[17,0.082,[["reveal",0],["edge",0],["scroll",0],["vertical",0]],0]],"kw":[["center",0],["navigation",0],["viewport",0],["highlight",0],["reference",0],["vertically",0]],"pv":"## Background\n\nOn the whiteboard page, clicking an item-number reference such as `(12)` or\n`{{12}}` should move the referenced item to the vertical center of the current\nviewport. The current edge-oriented navigation is inconvenient when following\nreferences in a long board.\n\n## Decisions\n\n- Apply the change to item-number reference navigat e settings API returns\n  only a masked representation and never exposes the key to LAN viewers.\n  Audio travels renderer -> local daemon -> provider. Browser-direct calls\n  and a CORS workaround are rejected.\n- Push-to-talk records with `MediaRecorder` as webm/opus. Stopping recording\n  uploads the audio, then inserts the completed transcription at the composer\n  caret. The caret-anchored capsule and input lock follow owner (885) below.\n- The owner's addition, verbatim: \"중간중간에 만들어지는 텍스트를 스트리밍으로 돌려주는 식이면 그것도 표기\".\n  English translation: if intermediate text is returned as a stream, display\n  it too. MAIN's official-doc research now supports OpenAI `gpt-transcribe`\n  with `stream=true` [O1][O2]. Realtime WebSocket transcription remains outside\n  this contract.\n- **VERIFIED:** MAIN's 2026-11-15 02:15:58 relay con\n…"},{"s":"261115-feat-ws-dashboard-session-four-state-followups","t":"Session four-state rail: post-ship follow-ups","st":"todo","c":"feat","k":11,"ph":[0,1],"odq":0,"bh":0,"ln":81,"as":null,"x":[[238,"related","source ticket; both phases carry Results, so its known deviations are captured here",""],[243,"related","earlier fix for a similar trusted-provenance refusal; check whether the child-spawn report is a regression of it",""]],"sim":[[238,0.203,[["archive",0],["rail",0],["prune",0],["exemption",0]],0],[147,0.082,[["ceiling",0],["rail",0],["network",0],["explore",0]],0]],"kw":[["pruneregistrations",1],["countdown",0],["exemption",0],["rail",0],["archive",0],["followups",0]],"pv":"## Background\n\nWhiteboard topic `session-four-state` (세션 4상태(비활성 보관)). The four-state\nrail shipped in two phases: backend `012d5568a` and rail UI `e2725a2d6`\n(Phase 2 Result `33d872de9`, archive-500 handling `d2cafcc29`). The board's\nclosing line listed deviations from the approved (1127)=ok mockup and marked\none as a post-ship follow-up:\n\n> 목업과 다른 점: 대기 메일 칩은 없습니다(백엔드에 개수가 없음). 범례 카드는\n> 넣지 않았습니다. 터미널이 세션을 가져가서 생긴 409에도 \"확인 중\" 문구가\n> 나옵니다(배포 뒤 후속).\n\nMAIN romotion. None is decided here:\n\n- **Element shape.** Either extend `wb:mention` with new locator a\n…"},{"s":"261116-feat-ws-dashboard-localhost-token","t":"Require a browser credential on localhost dashboard access (cookie gate, one-time login links, Electron cookie)","st":"todo","c":"feat","k":0,"ph":[3,3],"odq":0,"bh":0,"ln":665,"as":null,"x":[[28,"related","LAN token/cookie branch this gate coexists with; whichever lands second keeps the localhost gate",""],[3,"related","Electron daemon launch shipping in the same release (1227)",""],[4,"related","Electron shell whose navigation gets the native cookie",""],[25,"related","tier vocabulary; old-client behavior against a new daemon",""]],"sim":[[234,0.226,[["cookie",0],["localviewer",1],["sameorigin",1],["localhost",0]],0],[28,0.226,[["cookie",0],["lan",0],["localviewer",1],["access.go",1]],0],[71,0.148,[["daemon.go",1],["endpoint.json",1],["proxy.go",1],["shutdown",0]],0],[3,0.147,[["proxy.go",1],["endpoint.go",1],["client.go",1],["health",0]],0],[34,0.126,[["health",0],["endpoint.json",1],["daemon.go",1],["proxy.go",1]],0],[267,0.121,[["cookie",0],["pwa",0],["access.go",1],["lan",0]],0],[280,0.114,[["cookie",0],["publicasset",1],["access.go",1],["rid",1]],0],[26,0.1,[["access.go",1],["endpoint.go",1],["hostguard",1],["localhost",0]],0],[210,0.098,[["exchange",0],["health",0],["localhost",0],["lan",0]],0],[8,0.094,[["roster",0],["session-hire",1],["session_hire.go",1],["hire",0]],0],[247,0.094,[["client.go",1],["proxy.go",1],["lan",0],["health",0]],0],[4,0.081,[["main.js",1],["electron",0],["fs",1],["localhost",0]],0]],"kw":[["cookie",0],["session-hire",1],["clipboard",0],["publicasset",1],["localviewer",1],["hostguard",1]],"pv":"## Background\n\nEvery browser request to the dashboard daemon from this machine needs a\ncredential, not only LAN requests. A browser gets it once, through a\nsingle-use login code, and keeps it as a long-lived cookie. The Electron\nshell sets that cookie itself. Machine callers that installed 0.50.1 binaries\nuse keep working unchanged.\n\n- **Loopback mode has no credential.** Without LAN mode the whole mux sits\n  behind `hostGuard`, which only checks that the Host header is a loopback\n  name (`wsdashboard/daemon.go:771-775,781-804`). Any local process, including\n  another OS user's, can drive every route. It only has to forge `Host` and,\n  for the stricter writes, `Origin`. `TrustedWrite` is `localViewer(r)` plus\n  `sameOrigin(r)` (`wsdashboard/access.go:162-170`; `inbox_routes.go:154-164`).\n  Both are headers that a non-browser client sets freely.\n- **Agent routes are reachable without a credential.** `POST /agents`\n  (create a conversation with any profile and root) and\n  `POST /agents/<id>/send|interrupt|stop|close|...` pass only `writeAllowed`.\n  That check accepts a JSON body with no Origin or the daemon's own Origin\n  (`wsagent/http.go:150-153,217,224,324-341`). This lets any local process\n  run code through a Pi worker. Lead spawn, settings, approvals and moves add\n  `Trusted` (`wsagent/http.go:168-177`), which uses the same forgeable\n  headers. The `/support` POST routes follow the same `writeAllowed` rule\n  (`wsagent/support.go:30-31,675`).\n- **LAN mode.** `lanGuard` adm\n…"},{"s":"261116-feat-ws-session-outside-git-folder","t":"Create a ws session in a folder that is not a Git repository","st":"todo","c":"feat","k":1,"ph":[0,1],"odq":0,"bh":0,"ln":30,"as":null,"x":[],"sim":[[186,0.145,[["root_override",1],["git.merge",1],["playbook.render",1],["worktree",0]],0],[108,0.11,[["root_override",1],["worktree",0],["develop",0],["override",0]],0],[152,0.101,[["worktree",0],["bootstrap",0],["setup",0],["aware",0]],0],[40,0.089,[["해야",0],["rail",0],["하는",0],["verbatim",0]],0],[124,0.086,[["worktree",0],["family",0],["workflow_manual",1],["bootstrap",0]],0],[127,0.082,[["git.merge",1],["workflow_manual",1],["bootstrap",0],["worktree",0]],0]],"kw":[["canonicalgitroot",1],["folder",0],["rev-parse",1],["root_override",1],["git.merg istory",0],["asset",0]],0],[283,0.08,[["gs",0],["mockup",0],["pn",1]],0]],"kw":[["stext",1],["cb3fe3",0],["comment",0],["mockup",0],["display",0],["gs",0]],"pv":"## Background\n\n261113-feat-ws-whiteboard-update-refusal-cost Phase 1 added the `commented`\nstatus: a policy item answered with a note only. That status currently\nrenders as the bare English text \"user commented, lead's move\". The mockups\n(16 PNGs, develop `998cb3fe3`, under that ticket's assets) show fresh,\nrecent-settled, history and re-ask states.\n\n## Decisions\n\n- (1182)=ok, 2026-11-16: the owner approved the mockups as drawn. That\n  includes state 3, where a commented item stays inside the settled list as\n  shown.\n- UI work is done by a Claude agent, never by a GPT/pi worker.\n\n## Phases\n\n- Implement the mockup states, adding i18n keys for every new string.\n- Fix two defects the mockup work found in the merged placeholder (see the\n  `998cb3fe3` merge body):\n  - the historyTransition re-ask fallback;\n  - the bare `stext` span.\n- Acceptance: screenshots at 1440, dark and light, match each mockup state.\n  Existing whiteboard view and status tests still pass. The owner checks it\n  visually."},{"s":"261116-feat-ws-whiteboard-retire-disk-pages","t":"Retire the whiteboard's disk-rendered pages (file-only mode) in favor of daemon-served boards","st":"todo","c":"feat","k":3,"ph":[0,1],"odq":0,"bh":0,"ln":69,"as":null,"x":[[280,"related","sibling; the payload ticket explicitly excludes this retirement, and this one would unblock the client-side rendering it rejected for now",""],[51,"related","sibling undesigned todo from the same day; same decision-queue handling",""]],"sim":[[289,0.338,[["layoutembed",1],["render.go",1],["embed",0],["whiteboard_tools.go",1]],0],[19,0.177,[["whiteboard_tools.go",1],["index.stamp.js",1],["index.stamp",1],["session_state.go",1]],0],[91,0.144,[["render.go",1],["renderpage",1],["index.html",1],["wswhiteboard",0]],0],[269,0.143,[["whiteboard_tools.go",1],["ses teboard item (494)=a, chose a Go holder port as the long-term direction. It is not implemented, and a Go holder binary would need code signing first.\n\nOwner decision (1197)=a: run an experiment that launches the holder with the official Windows embeddable Python distribution (the `python.exe` inside the embeddable zip) on a PC that has V3, and see whether V3 reacts.\n\nOwner note (gist: this goes ahead as option a, but it is only recorded as a todo ticket for now, because it can only be run on the owner's office PC, which has V3; and the owner has tested many Python versions on that PC over the years and has never seen V3 react to Python):\n\n> a로 가긴 할 건데, 일단 이건 todo 티켓으로 적어만 둡니다. 제가 회사 출근해야 먹을\n…"},{"s":"261116-research-ws-hosted-session-first-tier","t":"Hosted sessions as the first tier: move features out of the plugin/extension path, retire the Pi extension, keep a limited Claude CLI compatibility tier","st":"todo","c":"research","k":8,"ph":[0,0],"odq":0,"bh":0,"ln":377,"as":null,"x":[[29,"parent","",""],[23,"related","the existing first-tier agent host epic; this research asks which harness-side features the daemon should own once hosted sessions are the reference tier",""],[29,"related","CLI-plugin entry vs MCP-only hosted entry kept distinct (its Cross-Child Decisions); this research may change the weight between those two entries and must be reconciled with that epic before any child is cut",""],[225,"related","done; pi.* is the existing daemon-owned spawn path and the closest prior art for a harness-neutral agent.spawn",""],[218,"related","done; the WS_HOSTED_SESSION gate that already moves input delivery and the dashboard feed from the Claude mod and the Pi extension to the daemon",""],[42,"related","a hosted Pi peer lead had no spawn surface for run-worker routing; a daemon-native spawn tool is one candidate answer",""],[10,"related","session-level workers (hosted sessions reporting by mailbox); overlaps with what a daemon-native spawn tool would cover", wn",1]],0],[203,0.112,[["goal-loop.ts",1],["ws-approve",1],["index.ts",1],["ws-execute",1]],0],[240,0.106,[["runner.spawn",1],["pi_tools.go",1],["children.go",1],["pi.spawn",1]],0],[232,0.105,[["pi_lead",1],["register.ts",1],["claude-mod",1],["runner.go",1]],0],[64,0.101,[["pi.spawn",1],["agent.spawn",1],["compaction",0]],0],[119,0.099,[["ask.ts",1],["src",1],["index.ts",1],["bridge.ts",1]],0],[176,0.082,[["compaction",0],["compact",0],["lever",0],["src",1]],0],[159,0.081,[["pi.spawn",1],["pi_tools.go",1]],0],[74,0.081,[["wsagent",0],["claude.go",1],["pi.go",1],["children.go",1]],0]],"kw":[["register.ts",1],["claude.go",1],["claude-mod",1],["pi_lead.go",1],["pi_lead",1],["hosted.ts",1]],"pv":"## Background\n\nToday ws features reach a lead through two harness-side channels: the Claude\nmod (`agents-plugin/hooks/claude-mod/`, a Claude Code hooks module shipped in\nthe ws/wsflow plugin) and the Pi extension (`agents-plugin-pi/`, shipped as the\n`native-pi` payload). Hosted sessions (leads the dashboard daemon spawns and\nfeeds through `wsagent.Runner` and the session holder) already take over input\ndelivery, mailbox delivery and the dashboard feed from both channels, but a\nhosted lead still loads the same mod or extension for everything else.\n\nOwner direction, 2026-11-16 23:02, when compaction nudges moving to the daemon\ncame up. Earlier in the same thread the owner noted that compaction is\nsomething a user can push from outside (`/compact`) into any headless harness,\nso much of this could come from a common harness interface spec. The owner then\nwidened the scope (the note was cut off after a trailing \"이런 접근을 하면\"):\n\n> 정확히는 플러그인 쪽 경로에서 기능을 하나씩 하나씩 빼고, 기준을 hosted 세션 기준으로 잡자는 방향입니다. 즉, hosted 세션은 상당히 제어권을 많이 갖고 있으니까, 예를 들어 에이전트 도구까지도 하네스 내부 에이전트 스폰 툴에 기대지 않고 ws/agent.spawn... 같은 도구를 제공해서 네이티브 에이전트로 연결해줄 수 있고, 이러면 서브에이전트 추적까지 이쪽에서 꽤 자연스럽게 가져올 수 있다고 보거든요. (대부분의 하네스가 툴 화이트리스트는 제공을 하니까요)\n\nGist: pull features out of the plugin-side path one at a time and make the\nhosted session the reference. Hosted sessions have a lot of control, so even\nagent spawning need not rely on the harness's own spawn tool: ws can offer a\n`ws/agent.spawn`-like tool that connects to native agents, which\n…"},{"s":"261116-research-ws-polling-minimization-event-ledger","t":"Research polling minimization and a change ledger","st":"todo","c":"research","k":3,"ph":[0,0],"odq":0,"bh":0,"ln":61,"as":null,"x":[[279,"related","Actionable phased implementation of board 1242=a and 1243=a",""],[275,"related","Frontend idle and switch costs",""],[274,"related","Low-risk daemon idle touch reductions",""],[0,"related","Earlier daemon idle CPU and discovery work",""]],"sim":[[274,0.382,[["poke",0],["indexstamp",1],["heartbeat",0],["sessionstamp",1]],0],[0,0.275,[["samefile",1],["pagecache.get",1],["minimization",0],["os.stat",1]],0],[279,0.271,[["dlp",0],["non-notifying",1],["poke",0],["poller",0]],0]],"kw":[["minimization",0],["poller",0],["dlp",0],["indexstamp",1],["non-notifying",1],["poke",0]],"pv":"## Goal\n\nInvestigate a path from periodic discovery toward event-driven change delivery that minimizes file touches without losing updates.\n\n## Context\n\nOwner directive at 12:52 on 2026-11-16: minimize polling and move toward event-driven design; writers touch a single change ledger only on change, and readers fstat it and read only changed targets. The owner runs DLP that inspects every file touch, making touch count a first-class cost.\n\nThe daemon idle file-touch audit (`ec56856d-02-daemon-file-touch-audit.md`) estimated 45–60k touches/min under its 68-session, 203-conversation workload. Exec3 after-capture, per 125 s, found discovery metadata-dominated: `os.Stat` 8.19 s and `SameFile`/`loadFileId` 5.12 s including `CreateFile` 4.28 s. Of 70.35 s `ReadFile`, 68.73 s is exec output-pipe goroutines; the git subset is 22.11 s, wait-dominated. Do not treat pipe reads as discovery or sum overlapping timings as CPU.\n\n## Topic: Alternatives and criteria\n\nCompare (a) one shared change ledger plus fstat, with readers fetching changed targets; (b) a daemon in-memory event hub, with writers notifying it over existing IPC; and (c) Windows `ReadDirectoryChangesW` / fsnotify. Quantify DLP-visible touches, wakeups and latency; identify cross-platform tradeoffs. For each, assess cross-version compatibility tier and fallback for old binaries that do not write the ledger, multiple writers (hosted sessions, CLI ws-mcp, Pi extension), daemon restart, missed notifications, concurrent updates, c\n…"},{"s":"261117-bug-pi-ticket-worker-profile-tools","t":"Pi ticket worker가 ticket-worker playbook 도구를 갖고 spawn되게 하기","st":"todo","c":"bug","k":1,"ph":[0,1],"odq":1,"bh":0,"ln":126,"as":null,"x":[[240,"related","prior decision; defined pi-mini-lead as the bounded ticket-workflow Pi profile",""],[273,"related","origin; its first Pi worker stopped for missing tools",""],[278,"related","prior decision; mini-lead is the profile for a full ticket-lifecycle worker",""],[127,"related","origin of the workflow_manual profile bar",""],[12,"related","landing-order; edits the same builtin.go profile lists and fixtures",""],[11,"related","same track; changes workflow_manual file selection by profile",""]],"sim":[[240,0.442,[["pi-mini-lead",1],["pi-worker",1],["builtin_test.go",1],["ws_tools",1]],0],[127,0.171,[["ws_tools",1],["workflow_manual",1],["sentinel",0],["lead-run",1]],0],[66,0.156,[["review-handler",1],["lead-review",1],["ticket-handler",1],["lead-run",1]],0],[11,0.146,[["pi-mini-lead",1],["ticket-handler",1],["pi.spawn",1],["playbook_tools.go",1]],0],[185,0.135,[["ticket-worker",1],["lead-run",1],["ferrule",0],["playbook.render",1]],0],[282,0.128,[["pi-mini-lead",1],["pi.spawn",1],["pi-worker",1],["profile.go",1]],0],[177,0.127,[["ticket-worker-elevated",1],["mini",0],["elevated",0],["lead-run",1]],0],[273,0.123,[["playbook_tools.go",1],["ticket-handler",1],["lead-ticket",1],["playbook.render",1]],0],[61,0.119,[["workflow_manual",1],["profi ue, Priority, WrittenAt, Visible}`; `Visible`\n  is mute state, and there is no audience\n…"},{"s":"261117-feat-ws-exec-mux-terminal","t":"ws/exec mux: PTY-backed terminal sessions with a rendered screen read","st":"todo","c":"feat","k":8,"ph":[0,1],"odq":0,"bh":0,"ln":60,"as":null,"x":[[29,"parent","",""],[63,"related","prerequisite; owns exec.shell, exec.write and the job model this builds on",""],[64,"related","same live-view direction",""]],"sim":[[63,0.289,[["exec.shell",1],["mux",0],["pty",0],["shell",0]],0],[29,0.156,[["exec.mux.read",1],["exec.shell",1],["mux",0],["prerequisite",0]],0],[226,0.125,[["exec.run",1],["shell",0],["output",0],["send",0]],0],[56,0.113,[["pty",0],["con",0],["screen",0],["corporate",0]],0],[65,0.108,[["pty",0],["exec",0],["pipe",0],["output",0]],0],[72,0.093,[["exec",0],["escape",0],["shell",0],["model",0]],0],[276,0.081,[["emulator",0],["screen",0],["shell",0]],0]],"kw":[["mux",0],["exec.mux.read",1],["exec.shell",1],["exec.write",1],["pty",0],["screen",0]],"pv":"## Background\n\nSplit out of `261117-feat-ws-exec-tools` by (51)=a: interactive full-screen\nprograms (REPLs, TUIs, debuggers) need a terminal, which pipe-based `exec.run`\nand `exec.shell` cannot give. The daemon provides one itself.\n\n## Decisions\n\n1. **Surface (51)=a.** `exec.shell(cmd, mux: true, ...)` runs the command under a\n   PTY. `exec.mux.read(exec_id)` returns the rendered current screen text.\n   `exec.write(exec_id, data)` (from the exec tools ticket) sends input, keys as\n   escape sequences.\n2. **Daemon-embedded PTY plus VT emulator.** `openpty` on Unix, ConPTY on\n   Windows 10 1809+, and a Go VT emulator library that renders the screen\n   buffer. Rejected: tmux. It is absent on native Windows, needs WSL/MSYS2 there,\n   native console programs misbehave under MSYS2 tmux, and corporate PCs with\n   heavy security software block extra installs.\n3. **Later direction, not a decision:** a dashboard live view/takeover of the\n   screen buffer (same direction as `261117-feat-ws-hosted-child-session-entry`).\n\n## Constraints\n\n- Go tests run on remote w5090 only, never local `go test`.\n- Read before editing `agents-plugin-tool/`: `ai-docs/manuals/shipped-surface-boundary.md`\n  and `ai-docs/manuals/release-compatibility.md`; for `agents-plugin-tool/internal/mcp/`\n  also `ai-docs/manuals/ws-mcp.md`.\n- Release-gate file-touch rule (owner, 2026-11-17): the screen buffer lives in\n  memory; no per-output file writes.\n\n## Compatibility\n\nNew `exec.shell` argument and `exec.mux.read` too\n…"},{"s":"261117-feat-ws-exec-tools","t":"ws/exec tools: daemon-owned command execution with async conversion, completion push, and native process-tool removal","st":"todo","c":"feat","k":8,"ph":[0,2],"odq":0,"bh":0,"ln":138,"as":null,"x":[[29,"parent","",""],[65,"related","prerequisite",""],[226,"related","absorbed; dropped (43); origin of the exec concept (owner, 2026-11-13)",""],[62,"related","owns the PTY mux direction split out of this ticket (51)=a",""],[249,"related","future consumer of daemon-visible exec I/O",""],[7,"related","permission-profile caps are enforced here",""],[284,"related","default tool removal range and native subagent removability items",""],[282,"related","shares the sleep-not-close and cascading-close rules for child agents",""],[68,"related","release-gate file-touch constraint; not edited from here",""]],"sim":[[226,0.337,[["async",0],["exec.run",1],["tail",0],["shell",0]],0],[62,0.289,[["exec.shell",1],["mux",0],["pty",0],["shell",0]],0],[65,0.242,[["exec.tail",1],["jobs",0],["execjob",1],["tail",0]],0],[285,0.18,[],1],[114,0.146,[["execjob",1],["exec",0],["job",0],["taskkill",1]],0],[282,0.126,[["awake",0],["sleep",0],["disallow",0],["runner_events.go",1]],0],[29,0.124,[["exec.shell",1],["jobs",0],["terminate",0],["holder",0]],0],[204,0.097,[["taskkill",1],["terminate",0],["stdin",0],["job",0]],0],[190,0.096,[["execjob",1],["exec",0],["job",0],["pipe",0]],0],[219,0.085,[["can_use_tool",1],["shell",0], 7-176,193-202`). With\n  `SpawnBeforeShutdown` (the Windows Werkschaft strict starter) it spawns\n  first and drains second, and a refused drain reports `unavailable`\n  (`ensure.go:159-172`). It starts at most two daemons, so it can replace a\n  concurrently started older daemon once (`ensure.go:38-41,113-114`). The\n  explicit `--replace` flag swaps an equal core once and never downgrades\n  (`ensure.go:54-56`, `cmd/ws-mcp/proxy.go:380\n…"},{"s":"261118-feat-ws-exec-intent-filter","t":"ws/exec intent filter: a lightweight model checks a command against its declared intent before it runs","st":"todo","c":"feat","k":8,"ph":[0,1],"odq":0,"bh":0,"ln":41,"as":null,"x":[[63,"blocked-by","",""],[63,"related","prerequisite; the filter sits on its daemon-owned command path, and its detailed design starts only after that ticket is implemented",""]],"sim":[[226,0.106,[["exec",0],["shell",0],["turn",0],["bypass",0]],0],[22,0.101,[["intent",0],["discussion",0],["answer",0],["whiteboard",0]],0],[62,0.093,[["exec",0],["escape",0],["shell",0],["model",0]],0],[29,0.089,[["exec",0],["lightweight",0],["prerequisite",0]],0],[21,0.085,[["llm",0],["exec",0],["judge",0],["model",0]],0],[192,0.083,[["intent",0],["pattern",0],["judgment",0],["router",0]],0]],"kw":[["lightweight",0],["intent",0],["mistake",0],["filter",0],["exec",0],["tbd",0]],"pv":"## Background\n\nOwner direction (2026-11-18, whiteboard item (103), answered b): instead of a\nstatic pattern guard on shell commands run through the ws/exec tools, a later\nstage adds an LLM filter. Before a command runs, a lightweight model judges\n\"does this script do what its declared intent says?\" - an auto mode for our own\ncode.\n\nStatic block lists miss variants (for example an escaping mistake that turns a\nnarrow delete into a broad one); a judgment against the declared intent catches\nthe mismatch itself. Shell syntax can never be parsed perfectly, so the filter\ncan be bypassed: it is a mistake guard, not a security boundary.\n\nThe owner chose a separate ticket over a follow-up phase inside\n261117-feat-ws-exec-tools, keeping that ticket unchanged and linking it here\nas the prerequisite.\n\n## Constraints\n\n- Detailed design is TBD and is discussed with the owner only after\n  261117-feat-ws-exec-tools is implemented. Open topics named by the owner:\n  which model to use, a one-shot harness call versus a dedicated decision\n  model, and the provider (for example OpenRouter). This ticket settles none\n  of them; promotion to `ready/` requires that discussion first.\n\n## Phases\n\nScope and mechanism are TBD (see `## Constraints`); this phase is a\nplaceholder until the post-exec-tools design discussion settles them."},{"s":"261118-feat-ws-hosted-child-connection-identity","t":"Hosted child-connection identity: refuse a child's use of its parent's session key","st":"todo","c":"feat","k":2,"ph":[0,1],"odq":0,"bh":0,"ln":38,"as":null,"x":[[29,"parent","",""],[14,"blocked-by","",""],[14,"related","prerequisite; its Decisions 10, 11 and 19 apply the hosted session_key rules to hosted lead connections only, and (124)=a moved the child-side refusal here",""]],"sim":[[13,0.192,[["wsagent",0]],1],[14,0.157,[["session_key",1],["server.hostedsessionkey",1],["connection",0],["workflow_manual",1]],0],[25,0.096,[["connection",0],["refusal",0],["workflow_manual",1],["refuse",0]],0],[229,0.094,[["workflow_manual",1],["peer",0],["refuse",0],["workflow",0]],0],[240,0.084,[["workflow_manual",1],["parent",0],["wsagent",0],["children",0]],0],[61,0.081,[["workflow_manual",1],["parent",0],["children",0],["workflow",0]],0]],"kw":[["server.hostedsessionkey",1],["connection",0],["session_key",1],["workflow_manual",1],["freely",0],["clause",0]],"pv":"## Background\n\nOwner note on (109), 2026-11-18: `session_key` may stay as an argument for\ncompatibility and child-session override, with a permission check so a session\ncannot freely use a peer's or parent's key. `261117-feat-ws-hosted-prompt-assembly`\n(Decision
