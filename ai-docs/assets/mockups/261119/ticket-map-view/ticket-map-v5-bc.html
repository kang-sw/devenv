ance\nPhase 1 merge (21c3d4262).\n\n- `node scripts/board-headless.mjs history-paint --url <adapter page> --width 1800`\n  fails with `native ResizeObserver loop errors: ResizeObserver loop completed\n  with undelivered notifications.` (VERIFIED)\n- The page was served by `serve --topics 40 --history-entries 180`.\n- It fails twice out of two runs on develop 534fe3297, before the perf merge,\n  and twice out of two after it. The perf merge did not cause it. (VERIFIED)\n- On the same page, `history`, `history-cards` and `history-regressions` pass.\n  `keep` and `observer` pass after harness fix 3a8ecd7b3. (VERIFIED)\n- The topic-history merge (be41211bb) fixed a loop of this kind: stream.js\n  moved its control visibility writes out of the history ResizeObserver\n  callback. So the loop may have come back with a later develop change, most\n  likely the iframe shell or the session-rail tree merges (534fe3297). (INFERRED)\n  This has not been bisected.\n\n## Notes\n\n- First step: bisect between be41211bb and 534fe3297 with the same scenario.\n- The scenario runs in the shell's child frame (`/s/<rid>?frame=1`), so a\n  ResizeObserver in the shell or the rail could also be the source."},{"s":"261114-bug-ws-dashboard-label-cross-writer-stale","t":"Dashboard: a label saved on one page goes stale when another writer sets it back before the render","st":"idea","c":"bug","k":7,"ph":[0,0],"odq":0,"bh":0,"ln":51,"as":null,"x":[[239,"related","found in its Phase 4 harness run; Forward note in 4d760277c and b710d81ce",""]],"sim":[[239,0.23,[["rail-headless.mjs",1],["labelsave",1],["data-lgen",1],["rail",0]],0],[238,0.135,[["rail-headless.mjs",1],["rail",0],["script",0]],0],[236,0.107,[["rail",0],["menu",0],["dashboard.js",1],["page",0]],0],[154,0.095,[["page",0],["rail",0],["script",0],["stream",0]],0],[164,0.08,[["scenario",0],["page",0],["script",0],["headless",0]],0]],"kw":[["labelsave",1],["data-lgen",1],["rail-headless.mjs",1],["rail-headless",1],["weigh",0],["rail",0]],"pv":"## Problem\n\nA page that saves a session label (the rail row pencil, the row menu's\nrename, or the head rename) shows the new label at once, before any render\nof it arrives.\n\nIf another writer sets the label back before the daemon sends a render\nbetween the two writes, the next render matches the hash the page still\nholds for the old content. The page therefore skips that render. The other\nwriter can be another browser, a second rename, or an MCP or API caller.\n\nThe page keeps showing the stale label until something else changes the\nrail.\n\n## Evidence\n\n- Phase 4's `menu` scenario in `scripts/rail-headless.mjs` hit this reliably\n  when it reset a label right after renaming it. The scenario now waits for\n  the rename's render before it resets the label (commit 4d760277c, Forward\n  note).\n- A client-only fix was tried: after a local save, forget the rail and head\n  `data-h` so that the next render always lands.\n  - It failed because the daemon dedupes each stream against the render it\n    last sent there. It never re-sends a render equal to that one, whatever\n    the page holds now.\n  - The fix was reverted (commit b710d81ce, `## AI Context`).\n- Reproduced on the rail. The head is inferred to behave the same from the\n  same code pattern (`labelSave` in `assets/dashboard.js`), but this was not\n  reproduced.\n\n## Directions to weigh\n\n- After a local save, the page asks its stream for a fresh render: a resync\n  message, or a reconnect carrying an empty `held()` hash for the region.\n-\n…"},{"s":"261114-bug-ws-dashboard-search-palette-minors","t":"Dashboard search palette: four minor leftovers from the unified-search run","st":"idea","c":"bug","k":9,"ph":[0,0],"odq":0,"bh":0,"ln":37,"as":null,"x":[[253,"related","source: left open by its worker (merged b9f5086e4, 2026-11-14)",""]],"sim":[[253,0.194,[["palette",0],["fs",1],["act",0],["search",0]],0],[265,0.149,[["fs",1],["tab",0],["listing",0],["button",0]],0],[283,0.086,[["tall",0],["search",0],["narrow",0],["px",0]],0],[236,0.085,[["palette",0],["shell",0],["frame",0],["iframe",0]],0],[90,0.081,[["palette",0],["font",0],["look",0],["mockup",0]],0]],"kw":[["palette",0],["fs",1],["toast",0],["act",0],["tab",0],["leftover",0]],"pv":"## Background\n\nThe unified-search palette worker left these unfixed. Each was rated Minor or\njudged pre-existing.\n\n- **Open toast under the palette.** The result toast of an `fs/act open` from\n  the palette's file slot may render behind the modal palette, so the user\n  does not see whether the open worked.\n- **Truncated listing unmarked.** When `fs/list` answers with `more` (a\n  truncated listing), the palette's file list shows the partial list with no\n  mark that entries were cut.\n- **Narrow tab overflow.** At the narrow layout step, the English tab labels\n  overflow the tab row, which then scrolls sideways.\n- **Shell search button overlap.** In the iframe shell at narrow width, the\n  shell's search button can overlap the top-left corner of a tall palette.\n  This looks pre-existing and may belong to the shell's layout, not the\n  palette.\n\n## Direction\n\n- Raise the toast above the palette layer, or route palette-originated toasts\n  into the palette itself.\n- Show a \"more entries not listed\" row when `fs/list` sets `more`.\n- Let the tab row fit at the narrow step: shorter labels, icon-only tabs, or\n  a smaller font. Choose against the palette mockup.\n- Check the shell button's stacking and position against the palette's top\n  inset at narrow width, in the shell frame.\n- Verify headless on an isolated daemon at 420 px and in the shell frame."},{"s":"261114-bug-ws-pi-reviewer-spawn-hidden-write-scope-contract","t":"Expose the Pi reviewer spawn write-scope requirement before dispatch","st":"idea","c":"bug","k":11,"ph":[0,1],"odq":0,"bh":0,"ln":26,"as":null,"x":[],"sim":[[243,0.281,[["ws-pi-agent",1],["code-review-test",1],["code-review-fit",1],["code-review-correctness",1]],0],[195,0.136,[["write_scopes",1],["ws-agent-spawn",1],["scopes",0],["optional",0]],0],[147,0.097,[["reviewer",0],["dispatch",0],["procedure",0],["correction",0]],0],[158,0.09,[["ws-pi-agent",1],["exactly",0],["retry",0],["access",0]],0],[42,0.082,[["reviewer",0],["align",0],["permission",0],["supply",0]],0]],"kw":[["code-review-correctness",1],["code-review-fit",1],["code-review-test",1],["write_scopes",1],["ws-pi-agent",1],["path.generate",1]],"pv":"## Background\n\nDuring review sweep (794), three `ws-agent-spawn` calls using rendered `code-review-correctness`, `code-review-fit`, and `code-review-test` prompts were refused with `ws-pi-agent: code reviewer requires exactly one file write scope`. The public tool description presents `write_scopes` as optional and does not expose this reviewer-specific restriction. The lead-review procedure says to render and spawn reviewers but does not mention reserving a single output file and granting exactly that file.\n\nThe refused calls returned no agent ID. Reserving one report path per reviewer with `ws/path.generate` and supplying one exact-file grant allowed all three dispatches to succeed. This is a discoverability/contract mismatch, not a request to relax reviewer write isolation.\n\n## Decisions\n\n- Capture only; no implementation approval or readiness claim.\n- Preserve exact-file reviewer output isolation. Prefer documenting or surfacing the dispatch requirement over weakening enforcement.\n- Candidate compatibility tier is T0 if the correction only clarifies tool/playbook guidance; settle the tier against the actual proposed surface before implementation.\n\n## Phases\n\nVerify the role-specific enforcement and relevant tool schema, lead-review playbook, and tests. Make the required single report-path allocation and file grant discoverable before a reviewer spawn. Preserve read-only source access and existing permission checks. Add focused contract coverage for successful bounded disp\n…"},{"s":"261114-bug-ws-pi-settled-executor-resume-ho 8,[["transport",0],["timeout",0],["unreachable",0],["cancellation",0]],0],[225,0.179,[["pi.wait",1],["subagent",0],["post",0],["completion",0]],0],[141,0.163,[["pi.list",1],["completion",0],["observe",0],["showed",0]],0],[107,0.151,[["cancellation",0],["timeout",0],["transport",0],["bounded",0]],0],[149,0.117,[["timeout",0],["focus",0],["diagnose",0],["deadline",0]],0],[200,0.1,[["transport",0],["timeout",0],["unreachable",0],["bounded",0]],0],[135,0.099,[["timeout",0],["deadline",0],["document",0],["caller",0]],0],[166,0.099,[["pi.wait",1],["subagent",0],["showed",0],["reviewer",0]],0],[220,0.098,[["pi.wait",1],["timeout",0],["cancellation",0],["failures",0]],0],[114,0.098,[["transport",0],["timeout",0],["deadline",0],["cancel",0]],0],[180,0.092,[["expect",0],["reviewer",0],["observe",0],["complete",0]],0]],"kw":[["pi.wait",1],["pi.list",1],["transport",0],["cancellation",0],["timeout",0],["cancel",0]],"pv":"## Observed\n\nVERIFIED during a ticket-worker run on 2026-11-14: `pi.wait` with\n`timeout_s: 300` returned:\n\n pi.wait: the dashboard daemon, which runs this subagent's Pi subagents, did not answer at http://127.0.0.1:29417: Post \"http://127.0.0.1:29417/agents/by-token/wait\": context canceled\n\nA subsequent `pi.list` succeeded and showed the same reviewer still running.\nA later `pi.wait(timeout_s: 120)` reported that its completed report had already\narrived, and the normal completion report did arrive. No daemon lifecycle\noperation was performed in response.\n\nINFERRED: the wait deadline may be reaching the transport boundary instead of\nreturning the documented bounded `running` result. The timing/cancellation\nsource was not instrumented; this observation does not establish a daemon crash.\n\n## Expected boundary\n\nA normal bounded timeout should return the documented running status, not\nsuggest that the daemon is unavailable. Actual transport failure should remain\ndistinct. Diagnose the cancellation source before changing error handling; do\nnot hide genuine connectivity failures.\n\n## Scope / verification\n\nInvestigate the wait endpoint/client deadline interaction and add a focused\nregression distinguishing timeout, caller cancellation and unreachable daemon.\nThis idea grants no authority to restart or replace a shared daemon."},{"s":"261114-bug-ws-proxy-predecessor-end-write-after-reconnect","t":"Harden proxy registration ownership against predecessor end writes","st":"idea","c":"bug","k":3,"ph":[0,1],"odq":0,"bh":0,"ln":37,"as":null,"x":[[247,"related","coordinated daemon replacement and recovery lane",""]],"sim":[[20,0.195,[["heartbeatinterval",1],["heartbeat",0],["registration",0],["interval",0]],0],[162,0.123,[["dashboard_sessions.go",1],["registration",0],["occurrence",0],["heartbeat",0]],0],[37,0.096,[["emergency",0],["liveness",0],["recovery",0],["interval",0]],0],[279,0.093,[["heartbeat",0],["liveness",0],["registration.live",1],["earliest",0]],0],[274,0.093,[["heartbeat",0],["liveness",0],["registration",0],["interval",0]],0],[123,0.085,[["servestdio",1],["stdio",0],["server",0]],0],[68,0.082,[["dashboardreconnect",1],["heartbeat",0],["dashboard_sessions.go",1],["fence",0]],0],[190,0.081,[["servestdio",1],["stdio",0],["server",0]],0]],"kw":[["predecessor",0],["servestdio",1],["successor",0],["dashboardreconnect",1],["heartbeatinterval",1],["registration.live",1]],"pv":"## Background\n\nReview sweep (794), pinned at `459fd070b2043fa45430eed12a1379f95fc630d5`, found an allowed replacement interleaving: an idle predecessor proxy stream closes, a successor restores its registration as live, and delayed predecessor `ServeStdio` cleanup writes `EndedAt` afterward. `dashboardWriteRow` protects a hosted takeover but does not distinguish proxy generations. The successor caches a non-idle registration, so an ordinary keyed call does not immediately rewrite the row; its heartbeat later repairs it.\n\nVerified source: `internal/wsdashboard/proxy.go` `drainProxy`, `internal/mcp/server.go` `ServeStdio` cleanup, and `internal/mcp/dashboard_sessions.go` `dashboardReconnect`, `dashboardWriteRow`, and `dashboardEnd`. `Registration.Live` immediately rejects any end mark; the pinned `HeartbeatInterval` is two minutes. The source permits a wrong liveness interval after a successful reconnect. Runtime occurrence, distribution and exact duration were not reproduced or measured by the static sweep; do not report a guaranteed two-minute outage.\n\nThis is a known documented deferral, not a newly discovered undisclosed mechanism. Source `fb1074fb7` explicitly records that row locks do not fence proxy generations and that a successor repairs a late predecessor overwrite on heartbeat. The earliest changed repair landing in this sweep is `5a3758f36ae4681b9dedf4cd2f7fd66734134ab5`, through `fix/rail-reload-ended`; the underlying writer predates the sweep.\n\n## Decisions\n\n- MAI\n…"},{"s":"261114-chore-ws-dashboard-index-removal-diagnostics","t":"Record time and reason when the dashboard session index removes a session","st":"idea","c":"chore","k":3,"ph":[0,1],"odq":0,"bh":0,"ln":56,"as":null,"x":[[247,"related","separate incident investigation; index churn did not prove a daemon restart",""]],"sim":[[0,0.132,[["loadrecordwith",1],["session_layout.go",1],["unreadable",0],["physical",0]],0],[161,0.123,[["dashboard_sessions.go",1],["registration",0],["occurrence",0],["heartbeat",0]],0],[259,0.103,[["session_layout.go",1],["dashboard_sessions.go",1]],0],[68,0.08,[["index.go",1],["dashboard_sessions.go",1],["heartbeat",0]],0]],"kw":[["lookuprecord",1],["readsession",1],["loadrecordwith",1],["index.go",1],["dashboard.log",1],["session_layout.go",1]],"pv":"## Background\n\nMAIN requested this short idea capture on 2026-11-14 after the live dashboard\nshowed `js.banner.gone` while daemon PID 94122 remained unchanged. Retained\n`dashboard.log` removal/readdition pairs at physical lines 206–207, 228–229,\n233–234, 241–242, 253–254, 256–257 and 259–260 contain neither occurrence times\nnor failure reasons. They cannot identify which session read failed, correlate\nit with a writer, or distinguish a transient unreadable record from a genuine\nregistration/root/role/parent mismatch.\n\nCurrent source boundaries are `internal/wsdashboard/index.go` session removal\nand `internal/mcp/dashboard_sessions.go` `lookupRecord`/`ReadSession`. The\nlatter reduces missing/unreadable parts and identity mismatches to false;\n`internal/mcp/session_layout.go` `loadRecordWith` retains more specific read\nerrors before that reduction. The latest bounded registration/key snapshot\nwas valid, so no historical failing file or writer has been established.\n\n## Decisions\n\n- Capture diagnostic improvement only: include a timestamp and removal reason\n  when the dashboard session index removes a session. MAIN explicitly requested\n  this idea; no runtime fix, daemon operation or ready promotion is authorized.\n- Compatibility target T0: internal diagnostic output only. Do not change\n  session-validity, heartbeat, registration, stream or removal semantics.\n\n## Constraints\n\n- Do not log session contents, credentials, tokens, mailbox bodies or private\n  reasoning. Diagnostic cont\n…"},{"s":"261114-feat-ws-prompt-refusal-conversation-notice","t":"Design conversation-visible prompt refusal with old-dashboard compatibility","st":"idea","c":"feat","k":5,"ph":[0,1],"odq":0,"bh":0,"ln":66,"as":null,"x":[[246,"related","Busy-state repair deliberately retains controls-menu-only refusal visibility",""]],"sim":[[246,0.186,[["state.error",1],["statusrunning",1],["notice",0],["refusal",0]],0],[144,0.109,[["login",0],["usage",0],["account",0],["limit",0]],0],[168,0.097,[["usage",0],["login",0],["repair",0],["model",0]],0],[47,0.084,[["old-writer",1],["reader",0],["safe",0],["history",0]],0],[24,0.081,[["conversation",0],["menu",0],["model",0],["promotion",0]],0]],"kw":[["statusrunning",1],["new-writer",1],["login",0],["state.error",1],["old-writer",1],["notice",0]],"pv":"## Background\n\nThe busy-state repair preserves truthful prompt-refusal text in the existing\n`State.Error` field while retaining `StatusRunning`. That field is visible\nonly when opening the controls menu, not as a conversation-history entry.\n\nOwner decision (723)=a, relayed by MAIN on 2026-11-14, explicitly separates\nconversation refusal visibility from that immediate repair. This idea records\nthe required compatibility design, not approval of a new representation.\n\n## Evidence\n\nThe pre-repair template at\n`agents-plugin-tool/internal/wsdashboard/assets/dashboard.tmpl:293` renders a\nnotice through `noticeword`; `:299` recognizes `login` and `model`, then labels\nall other kinds with `notice.limit`. An additive unknown notice kind can\ntherefore be mislabeled as a usage-limit failure by an older dashboard.\nThis is source evidence, not a mixed-version runtime acceptance result.\n\n## Decisions\n\n- Capture conversation-visible refusal as a separate design task, per (723)=a.\n  The immediate repair remains menu-only and does not depend on this task.\n- Compatibility tier is not settled for the future representation. Do not\n  claim T0 merely because a proposed notice kind is additive: reader behavior\n  must be accounted for before the design is approved.\n- Rejected for the immediate repair: shipping a new conversation notice on\n  the superseded (715) authority or reusing a login/model/usage-limit meaning\n  for an unrelated refusal.\n\n## Constraints\n\n- No new notice kind, shared-ring shape,\n…"},{"s":"261115-bug-board-headless-scenario-gaps","t":"board-headless: adapter history deep-link and shared-controls scenario gaps","st":"idea","c":"bug","k":7,"ph":[0,0],"odq":0,"bh":0,"ln":37,"as":null,"x":[],"sim":[[154,0.318,[["board-headless.mjs",1],["history",0],["headless",0],["bisect",0]],0],[260,0.182,[["board-headless.mjs",1],["shared-controls",1],["script",0],["mjs",0]],0],[32,0.148,[["board-headless.mjs",1],["card",0],["adapter",0],["script",0]],0],[258,0.144,[["b ld settles after the final answer","st":"idea","c":"bug","k":6,"ph":[0,0],"odq":0,"bh":0,"ln":77,"as":null,"x":[],"sim":[[225,0.153,[["ws-agent-",1],["pi.wait",1],["ws-agent-spawn",1],["ws-agent-send",1]],0],[246,0.144,[["agent_settled",1],["agent_start",1],["abort",0],["compact",0]],0],[123,0.11,[["stdin",0],["eof",0],["exit",0],["log",0]],0],[160,0.099,[["pi.wait",1],["subagent",0],["showed",0],["reviewer",0]],0],[121,0.095,[["ws-compact",1],["compaction",0],["compact",0],["message",0]],0],[13,0.085,[["ws-compact",1],["compaction_start",1],["compact",0],["compaction",0]],0]],"kw":[["ws-compact",1],["agent_settled",1],["addendum",0],["lsof",1],["print",0],["stdin",0]],"pv":"## Background\n\nDogfood surprise, 2026-11-15 (EXEC4 lead, Pi 1.5.2, devenv ws Pi package\nloaded as a user package). A Claude lead ran ticket reviewers as\n`pi -p -a --no-session --append-system-prompt <rendered playbook> \"<task>\"`\n(text mode). Two design-reviewer runs that spawned a ws explorer subagent\nexited 0 with a single newline on stdout; completeness runs without a child\nprinted their verdict normally.\n\nRe-running with `--mode json` showed two `agent_start`/`agent_end` pairs: the\nreviewer's final assistant text (a full `verdict: pass` report) ended the\nfirst run, then a `ws-push-batch` custom message (`ws-agent-settled` for the\nexplorer, reason idle) started a second agent run whose final assistant\nmessage carried no text. Text mode prints only that last message, so the\ncaller loses the real answer. Evidence log: `/tmp/exec4/rev-design-busy2.jsonl`\n(machine-local, not tracked).\n\n## Open Questions\n\n- Should a settled-child push arriving after the parent's final answer in\n  print mode be suppressed, folded into the same run, or should print mode\n  print the last non-empty assistant text?\n- Workaround in use: `--mode json` and extract the last non-empty assistant\n  `message_end` text.\n\n## Addendum - 2026-11-15: print mode also exits while a child still runs\n\nA `pi <script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const N = DATA.nodes, CL = DATA.clusters, M = DATA.meta;
const OPEN = new Set(['ready', 'todo', 'idea']);
const ST = {ready: 'Ready', todo: 'Todo', idea: 'Idea', done: '✓ Done', dropped: '⊘ Dropped'};
const STORD = {ready: 0, todo: 1, idea: 2, done: 3, dropped: 4};
const REL_UP = new Set(['parent', 'blocked-by']), REL_DOWN = new Set(['child', 'blocks']);

/* ============================================================ derived graph */
N.forEach((n, i) => { n.i = i; n.open = OPEN.has(n.st); n.X = new Map(); n.simMap = new Map(); });
function addRel(a, b, rel, note, side) {
  const n = N[a]; let e = n.X.get(b);
  if (!e) { e = {j: b, rels: new Set(), notes: []}; n.X.set(b, e); }
  e.rels.add(rel);
  if (note) e.notes.push({note, side, rel});
}
N.forEach((n, i) => {
  for (const [j, rel, note] of n.x) {
    addRel(i, j, rel, note, 'out');
    addRel(j, i, rel === 'parent' ? 'child' : rel === 'blocked-by' ? 'blocks' : 'related', note, 'in');
  }
  for (const [j, s, terms, men] of n.sim) n.simMap.set(j, {j, s, terms, men});
});
N.forEach(n => {
  n.deg = n.X.size;
  n.blockedOpen = [...n.X.values()].some(e => e.rels.has('blocked-by') && N[e.j].open);
  n.hay = (n.t + ' ' + n.s + ' ' + n.kw.map(k => k[0]).join(' ') + ' ' + CL[n.k].label + ' ' + n.pv).toLowerCase();
});
const relBucket = e => [...e.rels].some(r => REL_UP.has(r)) ? 'up' : [...e.rels].some(r => REL_DOWN.has(r)) ? 'down' : 'rel';
const relOrder = r => ({parent: 0, 'blocked-by': 1, child: 2, blocks: 3, related: 4})[r];
function simOf(a, b) { const s = N[a].simMap.get(b) || N[b].simMap.get(a); return s ? s.s : 0; }

/* ============================================================ state */
const S = {
  view: 'B', sel: null, hist: [], hp: -1, q: '', hits: null,
  st: {ready: true, todo: true, idea: true, done: true, dropped: true},
  collapsed: new Set(), inspMin: false, inspB: false, kw: null, kwHover: null,
  simTh: 15, simUnlinked: false, simRefs: true,
  ego: null, edge: {parent: true, blocked: true, related: false, sim: true}, simEdgeTh: 24, hover: null,
};

/* ============================================================ shared ui atoms */
const clStyle = k => `--h:${CL[k].hue}`;
const sBadge = n => `<span class="sb st-${n.st}">${n.open ? '<span class="sd"></span>' : ''}${ST[n.st]}</span>`;
const cPill = k => `<span class="cp cc" style="${clStyle(k)}" title="자동 클러스터: ${esc(CL[k].label)}"><i></i>${esc(CL[k].label)}</span>`;
const chip = ([w, code]) => `<span class="chip${code ? ' code' : ''}">${esc(w)}</span>`;
const catTag = n => `<span class="cat ${n.c}">${esc(n.c)}</span>`;
function indicators(n) {
  let h = '';
  if (n.blockedOpen) h += `<span class="bk" title="열린 blocked-by 선행 티켓 있음">⛔</span>`;
  if (n.bh) h += `<span class="bk" title="## Blocked 섹션">B!</span>`;
  if (n.odq) h += `<span class="odq" title="Open Decision Queue">ODQ</span>`;
  if (n.ph[1]) h += `<span class="ph" title="Phase ${n.ph[0]}/${n.ph[1]} 완료"><i><b style="width:${Math.round(n.ph[0] / n.ph[1] * 100)}%"></b></i>${n.ph[0]}/${n.ph[1]}</span>`;
  if (n.deg) h += `<span title="명시적 연결 ${n.deg}">↔${n.deg}</span>`;
  return h;
}
const sdot = n => n.st === 'done' ? '<span class="sd done">✓</span>' : n.st === 'dropped' ? '<span class="sd dropped">⊘</span>' : '<span class="sd"></span>';

/* ============================================================ top bar */
const pillsEl = $('#pills');
const stCount = {}; N.forEach(n => stCount[n.st] = (stCount[n.st] || 0) + 1);
pillsEl.innerHTML = ['ready', 'todo', 'idea', 'done', 'dropped'].map(s =>
  `<button class="pill st-${s}" data-st="${s}" aria-pressed="true" title="${ST[s]} 표시 전환">${s === 'done' || s === 'dropped' ? '' : '<i style="color:var(--sd)"></i>'}${s === 'done' ? '✓ Done Ref' : s === 'dropped' ? '⊘ Dropped Ref' : ST[s]}<span class="n">${stCount[s] || 0}</span></button>`).join('');
pillsEl.addEventListener('click', e => {
  const b = e.target.closest('.pill'); if (!b) return;
  const s = b.dataset.st; S.st[s] = !S.st[s]; b.setAttribute('aria-pressed', S.st[s]);
  applyFilters();
});
$('#stats').innerHTML = `오픈 <b>${M.open}</b> · 참조 <b>${M.refs}</b> · 자동 클러스터 <b>${CL.length}</b>`;
$('#stats').title = `참조 = 오픈 티켓이 parent/blocked-by/related로 직접 가리키는 .done ${M.refDone} + .dropped ${M.refDropped} (미참조 ${M.skippedDone + M.skippedDropped}건 생략)\nLouvain γ=${M.gamma} · modularity ${M.modularity} · 고DF 자동 제외 ${M.dfCut}개 (${M.dfCutTop.join(', ')} …)`;

const root = document.documentElement;
function setTheme(t) { root.dataset.theme = t; $('#themeLbl').textContent = t === 'dark' ? '다크' : '라이트'; try { localStorage.setItem('tmv5-theme', t); } catch (_) {} if (C.ready) C.measureReset(); }
$('#theme').addEventListener('click', () => setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark'));

const qEl = $('#q');
qEl.addEventListener('input', () => { S.q = qEl.value.trim().toLowerCase(); applyFilters(); });
qEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && S.hits && S.hits.size) {
    const first = [...S.hits].sort((a, b) => STORD[N[a].st] - STORD[N[b].st])[0];
    select(first, {focusB: true, centerC: true}); qEl.blur();
  }
  if (e.key === 'Escape') { qEl.value = ''; S.q = ''; applyFilters(); qEl.blur(); e.stopPropagation(); }
});

function applyFilters() {
  if (S.q) { S.hits = new Set(); const terms = S.q.split(/\s+/); N.forEach(n => { if (terms.every(t => n.hay.includes(t))) S.hits.add(n.i); }); }
  else S.hits = null;
  $('#qc').innerHTML = S.hits ? `<b>${S.hits.size}</b>건` : '';
  B.filter(); C.filter();
}
const visible = n => S.st[n.st];

/* ============================================================ selection / view */
function setView(v) {
  if (S.view === v) return;
  S.view = v;
  $('#tabB').setAttribute('aria-pressed', v === 'B'); $('#tabC').setAttribute('aria-pressed', v === 'C');
  $('#vB').classList.toggle('on', v === 'B'); $('#vC').classList.toggle('on', v === 'C');
  hideTip();
  if (v === 'C') { C.show(); if (S.sel != null) C.select(S.sel, {center: true}); }
  else { if (S.sel != null) B.focus(S.sel, {push: B.cur !== S.sel}); else B.matrix(); }
  Insp.render();
}
function select(i, o = {}) {
  S.sel = i;
  if (S.view === 'B') { if (i == null) B.matrix(); else B.focus(i, {push: o.push !== false}); if (C.ready) { if (i == null && S.ego != null) C.exitEgo(); C.highlight(); } }
  else { C.select(i, {center: !!o.centerC}); }
  Insp.render();
}
$('#tabB').addEventListener('click', () => setView('B'));
$('#tabC').addEventListener('click', () => setView('C'));

/* ============================================================ inspector */
const Insp = {
  el: $('#insp'), body: $('#ib'),
  render() {
    const show = S.sel != null && (S.view === 'C' || (B.mode === 'focus' && S.inspB));
    this.el.classList.toggle('on', show);
    this.el.classList.toggle('min', S.inspMin);
    if (!show) { C.resize(); return; }
    const n = N[S.sel];
    const links = [...n.X.values()].sort((a, b) => Math.min(...[...a.rels].map(relOrder)) - Math.min(...[...b.rels].map(relOrder)));
    const sims = n.sim.slice(0, 8);
    this.body.innerHTML = `
      <div class="cc" style="${clStyle(n.k)}"><h3>${esc(n.t)}</h3><div class="stem">${esc(n.s)}</div></div>
      <dl class="kv cc" style="${clStyle(n.k)}">
        <dt>상태</dt><dd>${sBadge(n)}</dd>

/* ============================================================ preview modal */
function md(src) {
  const out = []; let inPre = false, pre = [];
  const inl = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  for (const ln of src.split('\n')) {
    if (ln.trim().startsWith('```')) { if (inPre) { out.push(`<pre>${esc(pre.join('\n'))}</pre>`); pre = []; } inPre = !inPre; continue; }
    if (inPre) { pre.push(ln); continue; }
    let m;
    if ((m = ln.match(/^##\s+(.*)/))) out.push(`<h4>${inl(m[1])}</h4>`);
    else if ((m = ln.match(/^#{3,6}\s+(.*)/))) out.push(`<h5>${inl(m[1])}</h5>`);
    else if ((m = ln.match(/^\s*[-*]\s+(.*)/))) out.push(`<li>${inl(m[1])}</li>`);
    else if (ln.trim()) out.push(`<p>${inl(ln)}</p>`);
  }
  if (pre.length) out.push(`<pre>${esc(pre.join('\n'))}</pre>`);
  return out.join('');
}

}
