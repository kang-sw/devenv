<!doctype html><html lang="ko" data-theme="dark"><head><meta charset="utf-8"><title>Agents panel stats line mockup</title><style>
/* ---- copied verbatim from wswhiteboard/assets/page.css (tokens, base, .chip, .i) ---- */
:root {
  --wb-bg: var(--background, #f3f3f0);
  --wb-fg: var(--foreground, #1b1d21);
  --wb-card: var(--card, #ffffff);
  --wb-muted: var(--muted, #e9e8e3);
  --wb-muted-fg: var(--muted-foreground, #5f646b);
  --wb-primary: var(--primary, #2b62d9);
  --wb-primary-fg: var(--primary-foreground, #ffffff);
  --wb-topic: #2c3038;
  --wb-on-topic: #ffffff;
  --wb-now: var(--wb-primary);
  --wb-on-now: var(--wb-primary-fg);
  --wb-line: color-mix(in srgb, var(--wb-fg) 16%, transparent);
  --wb-wash: color-mix(in srgb, var(--wb-fg) 6%, transparent);
  --wb-policy: #b25000;      --wb-on-policy: #ffffff;
  --wb-technical: #2457c5;   --wb-on-technical: #ffffff;
  --wb-announced: #1d7348;   --wb-on-announced: #ffffff;
  --wb-accent-assumed: #b0245a;
  --wb-accent-policy: #b25000;
  --wb-on-accent-policy: #ffffff;
  --wb-opt: color-mix(in srgb, var(--wb-policy) 5%, var(--wb-card));
  --wb-opt-hover: color-mix(in srgb, var(--wb-policy) 10%, var(--wb-card));
  --wb-shadow: 0 1px 2px rgb(0 0 0 / .14), 0 2px 6px rgb(0 0 0 / .06);
  --wb-shadow-hi: 0 2px 4px rgb(0 0 0 / .16), 0 6px 18px rgb(0 0 0 / .10);
  --wb-radius: 12px;
  --wb-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --wb-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
  color-scheme: light dark;
}
/* Dark palette. The OS preference applies it unless the page pins light
   (data-theme="light"); data-theme="dark" applies it whatever the OS says.
   The two blocks hold the same variables: change them together. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --wb-bg: var(--background, #141518);
    --wb-fg: var(--foreground, #e7e7e4);
    --wb-card: var(--card, #1e2024);
    --wb-muted: var(--muted, #2b2d32);
    --wb-muted-fg: var(--muted-foreground, #a2a6ad);
    --wb-primary: var(--primary, #7aa2ff);
    --wb-primary-fg: var(--primary-foreground, #0c1424);
    --wb-topic: #2a2d33;
    --wb-on-topic: #e4e5e8;
    --wb-now: #243457;
    --wb-on-now: #d3defb;
    --wb-policy: #5b3a1c;      --wb-on-policy: #f6d9bd;
    --wb-technical: #26385e;   --wb-on-technical: #d2dcf6;
    --wb-announced: #1f4433;   --wb-on-announced: #c6ead6;
    --wb-accent-assumed: #e48aae;
    --wb-accent-policy: #e0a36c;
    --wb-on-accent-policy: #1f150b;
    --wb-opt: color-mix(in srgb, var(--wb-policy) 20%, var(--wb-card));
    --wb-opt-hover: color-mix(in srgb, var(--wb-policy) 34%, var(--wb-card));
    --wb-shadow: 0 1px 2px rgb(0 0 0 / .5), 0 2px 8px rgb(0 0 0 / .3);
    --wb-shadow-hi: 0 2px 4px rgb(0 0 0 / .55), 0 8px 22px rgb(0 0 0 / .4);
  }
}
:root[data-theme="dark"] {
  --wb-bg: var(--background, #141518);
  --wb-fg: var(--foreground, #e7e7e4);
  --wb-card: var(--card, #1e2024);
  --wb-muted: var(--muted, #2b2d32);
  --wb-muted-fg: var(--muted-foreground, #a2a6ad);
  --wb-primary: var(--primary, #7aa2ff);
  --wb-primary-fg: var(--primary-foreground, #0c1424);
  --wb-topic: #2a2d33;
  --wb-on-topic: #e4e5e8;
  --wb-now: #243457;
  --wb-on-now: #d3defb;
  --wb-policy: #5b3a1c;      --wb-on-policy: #f6d9bd;
  --wb-technical: #26385e;   --wb-on-technical: #d2dcf6;
  --wb-announced: #1f4433;   --wb-on-announced: #c6ead6;
  --wb-accent-assumed: #e48aae;
  --wb-accent-policy: #e0a36c;
  --wb-on-accent-policy: #1f150b;
  --wb-opt: color-mix(in srgb, var(--wb-policy) 20%, var(--wb-card));
  --wb-opt-hover: color-mix(in srgb, var(--wb-policy) 34%, var(--wb-card));
  --wb-shadow: 0 1px 2px rgb(0 0 0 / .5), 0 2px 8px rgb(0 0 0 / .3);
  --wb-shadow-hi: 0 2px 4px rgb(0 0 0 / .55), 0 8px 22px rgb(0 0 0 / .4);
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
/* Scrollbars, for every scroller of the board, its body frames, and the embed: thin,
   a transparent track, and a thumb of the text colour, a little stronger under the
   pointer, so the OS's wide opaque bars (Windows) read as part of either theme;
   overlay bars (macOS) stay overlay. Standard properties only: Chromium 121+ ignores
   ::-webkit-scrollbar on an element whose scrollbar-color is set, and the engines
   that still read those rules (Safari, older Chromium) would swap macOS overlay bars
   for always-shown ones. Set on every element rather than inherited from :root, so
   :hover strengthens the scrollers under the pointer and not the ones nested inside
   them; hover changes the colour only, never the width, so nothing reflows. The
   dashboard declares the same pair for its own page. */
* { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--wb-fg) 24%, transparent) transparent; }
*:hover { scrollbar-color: color-mix(in srgb, var(--wb-fg) 42%, transparent) transparent; }
html, body { margin: 0; background: var(--wb-bg); color: var(--wb-fg); }
body { font: 14px/1.5 var(--wb-sans); }
.id, code { font-family: var(--wb-mono); }
.chip { display: inline-flex; align-items: center; gap: 3px; height: 20px; font-size: 12px; font-weight: 700; line-height: 1; padding: 0 9px; border-radius: 999px; background: var(--wb-muted); color: var(--wb-muted-fg); white-space: nowrap; }
.i { width: 14px; height: 14px; flex: none; display: block; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.chip .i, details.settled .i { width: 12px; height: 12px; stroke-width: 2; }
/* ---- copied verbatim from wsdashboard/assets/dashboard.css (dark tokens; phases, spin; batch rows; agent tree) ---- */
:root {
  --wb-ph-think: #6a4fc4;  --wb-on-ph-think: #ffffff;
  --wb-ph-reply: #0e7a83;  --wb-on-ph-reply: #ffffff;
  --wb-ph-tool: #2457c5;   --wb-on-ph-tool: #ffffff;
  --wb-ph-perm: #a35f00;   --wb-on-ph-perm: #ffffff;
  --wb-ph-compact: #9a3a73; --wb-on-ph-compact: #ffffff;
  --wb-perm-ink: var(--wb-ph-perm);
  --wb-compact-ink: var(--wb-ph-compact);
  --wb-ok: #1d7348; --wb-fail: #c0262d;
  --wb-warn: #c27a00; --wb-warn-ink: #a35f00;
  /* the warning tone on a toast, whose surface is the inverted text colour */
  --wb-toast-warn: #f2c06b;
}
/* Dark variants: the same OS-or-pinned rule as the whiteboard sheet. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --wb-ph-think: #3d2f6b;  --wb-on-ph-think: #ddd3fb;
    --wb-ph-reply: #1b4a4f;  --wb-on-ph-reply: #c5ecef;
    --wb-ph-tool: #26385e;   --wb-on-ph-tool: #d2dcf6;
    --wb-ph-perm: #55400f;   --wb-on-ph-perm: #f6dfae;
    --wb-ph-compact: #4f2342; --wb-on-ph-compact: #f5d2e7;
    --wb-perm-ink: var(--wb-on-ph-perm);
    --wb-compact-ink: var(--wb-on-ph-compact);
    --wb-ok: #6cc39a; --wb-fail: #f0797e;
    --wb-warn: #e0a36c; --wb-warn-ink: #e0a36c;
    --wb-toast-warn: #9a5a00;
  }
}
:root[data-theme="dark"] {
  --wb-ph-think: #3d2f6b;  --wb-on-ph-think: #ddd3fb;
  --wb-ph-reply: #1b4a4f;  --wb-on-ph-reply: #c5ecef;
  --wb-ph-tool: #26385e;   --wb-on-ph-tool: #d2dcf6;
  --wb-ph-perm: #55400f;   --wb-on-ph-perm: #f6dfae;
  --wb-ph-compact: #4f2342; --wb-on-ph-compact: #f5d2e7;
  --wb-perm-ink: var(--wb-on-ph-perm);

  --wb-ok: #6cc39a; --wb-fail: #f0797e;
  --wb-warn: #e0a36c; --wb-warn-ink: #e0a36c;
  --wb-toast-warn: #9a5a00;
}


/* ===== chips, phases, spinners ===== */
.chip .i, .pghead .i { width: 12px; height: 12px; stroke-width: 2; }
.phase { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px 0 8px; border-radius: 999px; font-size: 12px; font-weight: 800; white-space: nowrap; flex: none; }
.phase .i { width: 12px; height: 12px; }
.phase.thinking { background: var(--wb-ph-think); color: var(--wb-on-ph-think); }
.phase.replying { background: var(--wb-ph-reply); color: var(--wb-on-ph-reply); }
.phase.tool { background: var(--wb-ph-tool); color: var(--wb-on-ph-tool); }
.phase.permission { background: var(--wb-ph-perm); color: var(--wb-on-ph-perm); }
.phase.compacting { background: var(--wb-ph-compact); color: var(--wb-on-ph-compact); }
.phase.idle { background: var(--wb-muted); color: var(--wb-muted-fg); }
.phase.none { background: transparent; color: var(--wb-muted-fg); box-shadow: inset 0 0 0 1px var(--wb-muted); font-weight: 600; }
.ahead .phase, .peer .phase, .sess .phase { height: 18px; font-size: 11px; padding: 0 7px 0 6px; gap: 5px; }
.spin { width: 11px; height: 11px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: dash-spin .8s linear infinite; flex: none; display: inline-block; }
.sess .spin, .activity .spin, .brow .mk .spin { width: 10px; height: 10px; }
@keyframes dash-spin { to { transform: rotate(360deg); } }
.idle-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .55; flex: none; display: inline-block; }
/* the agents panel's running-agent mark: a pulsing dot, never rotating, so
   it reads apart from a live tool row's spinner */
.pulse { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; display: inline-block; animation: dash-pulse 1.6s ease-in-out infinite; }
@keyframes dash-pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .spin, .caret, .pulse { animation: none; } }
.args { font-family: var(--wb-mono); font-size: 12px; color: var(--wb-muted-fg); }
code.fpath { font-size: 11.5px; color: var(--wb-muted-fg); overflow-wrap: anywhere; }
.empty { margin: 8px 0; padding: 18px 14px; text-align: center; font-size: 13px; color: var(--wb-muted-fg); border: 1px dashed var(--wb-muted-fg); border-radius: var(--wb-radius); }

/* ===== boxes with a sticky title bar: tree and conversation ===== */
.r-tree, .convo { background: var(--wb-card); border-radius: var(--wb-radius); box-shadow: var(--wb-shadow); }
.convo { background: color-mix(in srgb, var(--wb-muted) 45%, var(--wb-bg)); }
/* the conversation's two regions lay out as the #convo wrapper's own
   children, so its sticky title bar sticks across both */
.r-entries, .r-convlive { display: contents; }
.thead { padding: 4px 8px 4px 12px; min-height: 30px; display: flex; gap: 8px; align-items: center; font-weight: 700; font-size: 13px; background: var(--wb-muted); position: sticky; top: 0; z-index: 1; }
.thead .sum { margin-left: auto; display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.thead .chip { background: var(--wb-card); }

/* ===== batch rows ===== */
.brows { list-style: none; margin: 0; padding: 0; font-size: 12px; }
.brow { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 6px; align-items: baseline; padding: 1px 0; }
.brow .mk { font-weight: 800; color: var(--wb-muted-fg); display: inline-flex; justify-content: center; align-self: center; }
.brow .mk .i { width: 12px; height: 12px; }
.brow.fail .mk { color: var(--wb-fail); }
.brow .bp { min-width: 0; overflow: hidden; display: flex; gap: 4px; flex-wrap: nowrap; align-items: baseline; white-space: nowrap; }
.brow .bm { font-size: 11.5px; color: var(--wb-muted-fg); font-variant-numeric: tabular-nums; white-space: nowrap; }
.brow.done .bp, .brow.fail .bp { color: var(--wb-muted-fg); }
.brow .tool { font-family: var(--wb-mono); font-size: 11.5px; padding: 0 6px; border-radius: 4px; background: var(--wb-muted); flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.brow.live { font-weight: 600; }
.brow.live .mk .spin { color: var(--wb-primary); }
.brow.perm .mk { color: var(--wb-perm-ink); }
.brow.ph .mk { opacity: .5; }
.brow.live .args { font-size: 11.5px; font-weight: 400; flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; }

/* ===== agent tree ===== */
.tree { padding: 2px 10px 6px; }
/* div: the tracker renderer marks agent-written events (li.agent) too */
div.agent + div.agent { border-top: 1px solid var(--wb-muted); }
.agent .kids { margin-left: 16px; padding-left: 10px; border-left: 2px solid var(--wb-muted); }
.agent .kids .agent { border-top: 0; }
.agent.root > .kids { margin-left: 7px; }
summary.ahead { list-style: none; }
summary.ahead::-webkit-details-marker { display: none; }
.ahead { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; min-width: 0; padding: 3px 0; cursor: pointer; }
/* the board's .tree summary rule (baseline) reaches these rows; centring keeps
   an agent row one height whatever its phase pill holds */
.tree summary.ahead { align-items: center; }
.ahead .amk { width: 16px; display: inline-flex; justify-content: center; font-weight: 800; flex: none; }
.ahead .amk .i { width: 12px; height: 12px; }
.agent.running > details > .ahead .amk, .agent.root > details > .ahead .amk { color: var(--wb-primary); }
.agent.done > details > .ahead .amk { color: var(--wb-ok); }
.agent.failed > details > .ahead .amk { color: var(--wb-fail); }
.agent.root.idle > details > .ahead .amk { color: var(--wb-muted-fg); }
.agent.root.permission > details > .ahead .amk { color: var(--wb-perm-ink); }
.ahead .aname { font-weight: 700; font-size: 12.5px; flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agent.root > details > .ahead .aname { font-size: 13px; flex: none; }
.ahead .arid { font-family: var(--wb-mono); font-size: 10px; padding: 0 5px; border-radius: 4px; background: color-mix(in srgb, var(--wb-primary) 10%, var(--wb-card)); color: var(--wb-primary); text-decoration: none; flex: none; opacity: .85; }
.ahead a.arid:hover { text-decoration: underline; }
.ahead .arid.nob { background: var(--wb-muted); color: var(--wb-muted-fg); }
.ahead .am { margin-left: auto; font-size: 11.5px; color: var(--wb-muted-fg); display: inline-flex; gap: 7px; align-items: center; font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; }
.ahead .am .f { color: var(--wb-fail); font-weight: 700; }
.ahead .am .ok { color: var(--wb-ok); font-weight: 700; }
.ahead .am > .i { width: 12px; height: 12px; transition: transform .15s; }
details[open] > .ahead .am > .i { transform: rotate(180deg); }
.ahead .acap { flex: 1 1 0; min-width: 0; font-size: 11px; color: var(--wb-muted-fg); font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* the lead row's live detail: the running or approval-waiting tool, one line */
/* a subagent's telemetry (template astat); the agents panel is the
   container, so a narrow panel (a side column, the session rail's three
   columns) moves the stats into the hover card (agentTip) whatever the
   viewport is */
.r-tree { container: atree / inline-size; }
.ahead .astat { flex: none; display: inline-flex; gap: 7px; align-items: center; font-size: 11px; color: var(--wb-muted-fg); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ahead .astat .amodel { font-family: var(--wb-mono); font-size: 10.5px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
.ahead .astat .atps { color: var(--wb-primary); font-weight: 700; }
@container atree (max-width: 559px) { .ahead .astat { display: none; } }
.gltip.atip .tm { display: grid; gap: 2px; }
.ahead .ldet { flex: 1 1 0; min-width: 0; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ahead .ldet .tn { font-family: var(--wb-mono); font-weight: 700; font-size: 11.5px; }
.ahead .ldet .args { font-size: 11.5px; }
.agent .brows { margin-left: 23px; }
/* a running agent's fixed live rows hang from its mark on a guide line; every
   row keeps one height so a placeholder holds the slot */
.agent > .brows.bguide { margin-left: 7px; padding-left: 14px; border-left: 2px solid var(--wb-muted); }
.brows.bguide > .brow { min-height: 20px; align-items: center; box-sizing: border-box; }
.agent.done > details > .brows, .agent.failed > details > .brows { opacity: .8; }
.agent.done > details > .ahead { opacity: .7; }
.agent.failed > details > .ahead { opacity: .85; }
.gltip { position: fixed; z-index: 60; max-width: 420px; padding: 8px 10px; border-radius: 8px; background: var(--wb-card); box-shadow: var(--wb-shadow-hi), 0 0 0 1px var(--wb-line); font-size: 12.5px; pointer-events: none; display: grid; gap: 5px; }
.gltip[hidden] { display: none; }
.gltip .ts { font-weight: 700; overflow-wrap: anywhere; }
.gltip .tr { display: flex; flex-wrap: wrap; gap: 4px; }
.gltip .tm { display: flex; gap: 6px; flex-wrap: wrap; color: var(--wb-muted-fg); font-size: 12px; }
.gltip .tm code { color: var(--wb-fg); }
.gltip.atip .tm { display: grid; gap: 2px; }
/* ---- mockup-only ---- */
body { padding: 20px 24px 40px; width: 1160px; }
h1 { font-size: 17px; margin: 0 0 4px; }
.lede { margin: 0 0 18px; color: var(--wb-muted-fg); font-size: 12.5px; max-width: 900px; }
.lede code { font-size: 11.5px; }
.row { display: flex; gap: 24px; align-items: flex-start; margin-bottom: 26px; }
figure { margin: 0; }
figcaption { display: grid; gap: 1px; margin-bottom: 6px; font-size: 12px; max-width: 520px; }
figcaption span { color: var(--wb-muted-fg); }
.tipnote { margin: 10px 0 4px; font-size: 11px; color: var(--wb-muted-fg); }
.gltip.static { position: static; display: grid; width: max-content; }
.r-tree { overflow: hidden; }
.thead { position: static; }
.thead { flex-wrap: nowrap; }
.thead .sum { flex-wrap: nowrap; }

/* ===== option (a): the one proposed change =====
   Markup: a subagent summary wraps its leading items (mark, name, phase, caption)
   in <span class="arow">, which is display: contents (a no-op) except in the
   narrow query. Narrow: the summary wraps; arow takes the first line with the
   trailing .am (flex-basis 0, so it never forces a break and keeps today's
   shrink/ellipsis behaviour), and .astat takes a full-width second line. */
.arow { display: contents; }
@container atree (max-width: 559px) {
  .va .ahead { flex-wrap: wrap; row-gap: 0; }
  .va .arow { display: flex; align-items: center; gap: 6px; flex: 1 1 0; min-width: 0; }
  .va .ahead .astat { display: inline-flex; order: 1; flex: 0 0 100%; min-width: 0; padding: 0 0 2px 22px; gap: 0; overflow: hidden; }
  .va .ahead .astat > span + span::before { content: "\00b7"; margin: 0 6px; opacity: .7; }
  .va .ahead .astat .amodel { flex: 0 1 auto; min-width: 0; max-width: none; }
  .va .ahead .astat .actx, .va .ahead .astat .atps { flex: none; }
}
