<!-- Mockup (not approved): permission-profile Phase 2 UI controls.
     A fragment layered on the real dashboard page: the classes it reuses
     (.rpop, .sphd, .sploc, .spsec, .spseg, .spopts, .sprc, .spsm, .spdesc,
     .sprow, .pbtn, .spacts, .spact, dialog.rdeldlg and its parts) come from
     the dashboard's own CSS, and only the pm* rules below are new. The
     renderer injects the <style> and one <template> per state into a served
     session shell page (Korean UI), in both colour schemes at 1440 and 420.
     States: create, settings, full-warning, state, unsupported. -->
<style id="pm-css">
/* permission level: a three-way segment the width of the popover */
.rpop .pmseg { width: 100%; box-sizing: border-box; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.rpop .pmseg button { padding: 3px 4px; white-space: nowrap; }
.rpop .pmseg button.full[aria-checked="true"] { color: var(--wb-fail); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--wb-fail) 50%, transparent); }
/* what the picked level asks for, then how this harness carries it */
.rpop .pmwhat { margin: 2px 0 0; font-size: 11.5px; color: var(--wb-fg); }
.rpop .pmmap { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 6px; margin: 0; font-size: 11.5px; color: var(--wb-muted-fg); }
.rpop .pmmap code, .pmstate code, .rdeldlg .pmc { font-family: var(--wb-mono); font-size: 11px; color: var(--wb-fg); background: var(--wb-muted); padding: 0 5px; border-radius: 4px; }
.rpop .pmfine { margin: 0; font-size: 11px; color: var(--wb-muted-fg); }
/* evidence quality pills; there is deliberately no "enforced" pill */
.pmq { display: inline-flex; align-items: center; font-size: 10.5px; font-weight: 700; padding: 0 7px; border-radius: 999px; line-height: 17px; white-space: nowrap; }
.pmq.partial { color: var(--wb-primary); background: color-mix(in srgb, var(--wb-primary) 13%, var(--wb-card)); }
.pmq.advisory { color: color-mix(in srgb, var(--wb-warn-ink) 80%, var(--wb-fg)); background: color-mix(in srgb, var(--wb-warn) 16%, var(--wb-card)); }
.pmq.pending { color: var(--wb-muted-fg); background: var(--wb-muted); }
.pmq.mismatch { color: var(--wb-fail); background: color-mix(in srgb, var(--wb-fail) 12%, var(--wb-card)); }
/* a lead's permission state: intent, native mode and evidence, apart */
.rpop .pmstate { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 10px; align-items: baseline; padding: 8px 10px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--wb-line); }
.pmstate .k { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--wb-muted-fg); white-space: nowrap; }
.pmstate .v { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 6px; min-width: 0; }
.pmstate .v b { font-weight: 700; }
.pmstate .pmsrc { font-size: 11px; color: var(--wb-muted-fg); }
.pmstate .pmnote { grid-column: 1 / -1; margin: 0; font-size: 11.5px; color: var(--wb-muted-fg); }
.pmstate .pmnote.bad { color: var(--wb-fail); }
.rpop .pmchg { display: grid; gap: 5px; }
/* unsupported and refused */
.rpop .pmoff { margin: 0; padding: 6px 9px; border-radius: 8px; background: var(--wb-muted); font-size: 11.5px; color: var(--wb-muted-fg); }
.rpop .pmerr { margin: 0; padding: 7px 10px; border-radius: 8px; background: color-mix(in srgb, var(--wb-fail) 12%, var(--wb-card)); color: var(--wb-fail); font-size: 11.5px; display: grid; gap: 2px; }
.rpop .pmerr span { color: color-mix(in srgb, var(--wb-fail) 70%, var(--wb-fg)); }
.rpop .pbtn.pmfull { background: var(--wb-fail); color: var(--wb-card); }
/* the full-permission warning: the delete dialog's frame and parts */
.rdeldlg .rdhd .i.pmlock { color: var(--wb-fail); }
.rdeldlg .pmack { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: 8px; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--wb-fail) 45%, transparent); cursor: pointer; font-weight: 600; }
.rdeldlg .pmack input { margin: 2px 0 0; accent-color: var(--wb-fail); flex: none; }
/* the head chip beside the harness badge */
.chip.pmhead { display: inline-flex; align-items: center; gap: 4px; margin-left: 6px; background: var(--wb-muted); color: var(--wb-fg); font-weight: 700; }
.chip.pmhead .i { width: 11px; height: 11px; }
.chip.pmhead .pmq { line-height: 15px; padding: 0 5px; margin-right: -4px; }
/* mockup chrome only: a gallery of popovers and their captions */
.pmgal { position: fixed; inset: 0; z-index: 70; overflow: auto; background: var(--wb-bg); color: var(--wb-fg); padding: 22px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 18px; align-content: flex-start; justify-content: center; font: 13px/1.45 var(--wb-sans); }
.pmgal .pmcard { display: grid; gap: 6px; align-content: start; width: 330px; max-width: 100%; }
.pmgal .pmcap { font-size: 12px; font-weight: 800; color: var(--wb-fg); }
.pmgal .pmcap span { display: block; font-weight: 400; font-size: 11.5px; color: var(--wb-muted-fg); }
.pmgal .rpop { position: static; width: auto; max-height: none; }
.pmgal .pmtitle { flex: 1 0 100%; font-size: 14px; font-weight: 800; text-align: center; }
</style>

<!-- 1. Lead creation: shown only when /support/choices names
     permission_levels for the picked harness. The native mode row gives way
     to the mode the level maps to; Start with "full" opens the warning. -->
<template data-state="create">
<div class="rpop pm-anchor-rail" role="dialog" aria-label="새 세션">
  <div class="sphd">새 세션</div>
  <div class="sploc"><svg class="i" aria-hidden="true"><use href="#i-repo"/></svg><span>devenv</span><svg class="i" aria-hidden="true"><use href="#i-branch"/></svg><b>feat/agent-popup</b><code>~/devenv/.ws-worktrees/agent-popup</code></div>
  <div class="spsec"><div class="spseg" role="radiogroup" aria-label="하네스"><button type="button" role="radio" aria-checked="true">Claude</button><button type="button" role="radio" aria-checked="false">Pi</button></div></div>
  <div class="spsec">
    <div class="splbl">권한 수준</div>
    <div class="spseg pmseg" role="radiogroup" aria-label="권한 수준"><button type="button" role="radio" aria-checked="false">읽기 전용</button><button type="button" role="radio" aria-checked="true">작업 폴더 쓰기</button><button type="button" role="radio" aria-checked="false" class="full">전체</button></div>
    <p class="pmwhat">작업 폴더 안에서의 수정을 요청합니다.</p>
    <p class="pmmap">Claude <code>acceptEdits</code> 모드로 실행 · <span class="pmq advisory">권고</span> 작업 폴더 밖은 막지 않습니다</p>
  </div>
  <div class="spopts">
    <div class="sprc"><label>모델</label><select class="spsm mono"><option>opus-4.7</option></select></div>
    <div class="sprc"><label>노력 수준</label><select class="spsm"><option>high</option></select></div>
    <p class="spdesc">--effort high</p>
  </div>
  <div class="spsec"><div class="splbl">플러그인</div><div class="spseg"><button type="button" aria-checked="true">기본</button><button type="button" aria-checked="false">격리</button></div><p class="spdesc">번들된 ws/wsflow가 설치된 사본을 대체하며, 다른 플러그인은 그대로 유지됩니다.</p></div>
  <p class="pmfine">권한 수준은 의도 표시이며 샌드박스가 아닙니다.</p>
  <div class="sprow"><span class="spnote"></span><button type="button" class="pbtn">취소</button><button type="button" class="pbtn go">시작</button></div>
</div>
</template>

     state block on top and the level change under it. -->

<div class="rpop pm-anchor-head" role="dialog" aria-label="대시보드가 실행하는 세션">
  <div class="sphd">대시보드가 실행하는 세션</div>
  <div class="pmstate">
    <span class="k">의도</span><span class="v"><b>작업 폴더 쓰기</b><span class="pmsrc">· 명시적 선택</span></span>
    <span class="k">네이티브</span><span class="v">Claude <code>acceptEdits</code><span class="pmsrc">· 하네스가 보고함</span></span>
    <span class="k">근거</span><span class="v"><span class="pmq advisory">권고</span><span class="pmsrc">하네스가 이 경계를 강제한다는 근거가 없습니다</span></span>
  </div>
  <div class="spsec pmchg">

  <div class="spopts">
    <div class="sprc"><label>모델</label><select class="spsm mono"><option>opus-4.7</option></select></div>
    <div class="sprc"><label>노력 수준</label><select class="spsm"><option>high</option></select></div>

<!-- 3. The full-permission warning: the creation popover with "full"
     picked stays behind; Start opened this modal. Cancel sends nothing; the
     grant button enables only once the box is ticked, and only that submit
     carries permission_full_ack:true. Shown as it opens: unticked, grant
     disabled, focus on Cancel. -->
<template data-state="full-warning">
<div class="rpop pm-anchor-rail" role="dialog" aria-label="새 세션">
  <div class="sphd">새 세션</div>
  <div class="sploc"><svg class="i" aria-hidden="true"><use href="#i-repo"/></svg><span>devenv</span><svg class="i" aria-hidden="true"><use href="#i-branch"/></svg><b>feat/agent-popup</b><code>~/devenv/.ws-worktrees/agent-popup</code></div>

  <div class="spsec">
    <div class="splbl">권한 수준</div>
    <div class="spseg pmseg"><button type="button" aria-checked="false">읽기 전용</button><button type="button" aria-checked="false">작업 폴더 쓰기</button><button type="button" aria-checked="true" class="full">전체</button></div>
