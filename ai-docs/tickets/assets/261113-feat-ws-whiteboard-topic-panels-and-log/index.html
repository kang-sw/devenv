<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화이트보드 메시지 로그 - 변형 비교 목업</title>
<style>
/* ---- copied from wswhiteboard/assets/page.css (theme vars, topic card, recap, doc, md) ---- */
:root {
  --wb-bg: #f3f3f0; --wb-fg: #1b1d21; --wb-card: #ffffff; --wb-muted: #e9e8e3; --wb-muted-fg: #5f646b;
  --wb-primary: #2b62d9; --wb-primary-fg: #ffffff; --wb-topic: #2c3038; --wb-on-topic: #ffffff;
  --wb-now: var(--wb-primary); --wb-on-now: var(--wb-primary-fg);
  --wb-line: color-mix(in srgb, var(--wb-fg) 16%, transparent);
  --wb-wash: color-mix(in srgb, var(--wb-fg) 6%, transparent);
  --wb-policy: #b25000; --wb-on-policy: #ffffff;
  --wb-accent-policy: #b25000;
  --wb-shadow: 0 1px 2px rgb(0 0 0 / .14), 0 2px 6px rgb(0 0 0 / .06);
  --wb-shadow-hi: 0 2px 4px rgb(0 0 0 / .16), 0 6px 18px rgb(0 0 0 / .10);
  --wb-radius: 12px;
  --wb-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --wb-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --wb-bg: #141518; --wb-fg: #e7e7e4; --wb-card: #1e2024; --wb-muted: #2b2d32; --wb-muted-fg: #a2a6ad;
    --wb-primary: #7aa2ff; --wb-primary-fg: #0c1424; --wb-topic: #2a2d33; --wb-on-topic: #e4e5e8;
    --wb-now: #243457; --wb-on-now: #d3defb; --wb-policy: #5b3a1c; --wb-on-policy: #f6d9bd;
    --wb-accent-policy: #e0a36c;
    --wb-shadow: 0 1px 2px rgb(0 0 0 / .5), 0 2px 8px rgb(0 0 0 / .3);
    --wb-shadow-hi: 0 2px 4px rgb(0 0 0 / .55), 0 8px 22px rgb(0 0 0 / .4);
  }
}
:root[data-theme="dark"] {
  --wb-bg: #141518; --wb-fg: #e7e7e4; --wb-card: #1e2024; --wb-muted: #2b2d32; --wb-muted-fg: #a2a6ad;
  --wb-primary: #7aa2ff; --wb-primary-fg: #0c1424; --wb-topic: #2a2d33; --wb-on-topic: #e4e5e8;
  --wb-now: #243457; --wb-on-now: #d3defb; --wb-policy: #5b3a1c; --wb-on-policy: #f6d9bd;
  --wb-accent-policy: #e0a36c;
  --wb-shadow: 0 1px 2px rgb(0 0 0 / .5), 0 2px 8px rgb(0 0 0 / .3);
  --wb-shadow-hi: 0 2px 4px rgb(0 0 0 / .55), 0 8px 22px rgb(0 0 0 / .4);
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
* { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--wb-fg) 24%, transparent) transparent; }
*:hover { scrollbar-color: color-mix(in srgb, var(--wb-fg) 42%, transparent) transparent; }
html, body { margin: 0; background: var(--wb-bg); color: var(--wb-fg); }
body { font: 14px/1.5 var(--wb-sans); }
.id, code { font-family: var(--wb-mono); }
button { font: inherit; color: inherit; }
a { color: var(--wb-primary); }
.chip { display: inline-flex; align-items: center; gap: 3px; height: 20px; font-size: 12px; font-weight: 700; line-height: 1; padding: 0 9px; border-radius: 999px; background: var(--wb-muted); color: var(--wb-muted-fg); white-space: nowrap; }
.topic { position: relative; background: var(--wb-card); border-radius: var(--wb-radius); box-shadow: var(--wb-shadow); margin-bottom: 16px; overflow: hidden; }
.tbar { display: flex; align-items: center; gap: 6px; padding: 4px 12px; min-height: 30px; background: var(--wb-topic); color: var(--wb-on-topic); }
.tbar .tlead { margin-right: auto; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.tbar .tname { font-size: 14px; font-weight: 700; overflow-wrap: anywhere; }
.tbar .tago { font-size: 11.5px; opacity: .7; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tbar .tnote-toggle { background: transparent; color: inherit; opacity: .7; flex: none; }
.topic.has-doc > .tbar { padding-right: 46px; }
:not(pre) > code { font-size: .92em; background: var(--wb-muted); border-radius: 4px; padding: 0 4px; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol, .md pre, .md table, .md blockquote { margin: 0 0 6px; }
.md ul, .md ol { padding-left: 18px; }
.md li { margin: 2px 0; }
.btn { font-size: 13px; background: var(--wb-muted); border: 0; border-radius: 999px; padding: 3px 12px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.btn.mini { padding: 0; width: 24px; height: 22px; }
.trecap { display: flex; align-items: baseline; gap: 10px; margin: 10px 10px 0; padding: 7px 10px; font-size: 13px; background: var(--wb-wash); border-left: 3px solid var(--wb-accent-policy); border-radius: 0 8px 8px 0; }
.trecap .rtext { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.trecap .rat { flex: none; font-size: 11px; color: var(--wb-muted-fg); white-space: nowrap; font-variant-numeric: tabular-nums; }
details.tdoc > summary { position: absolute; top: 5px; right: 12px; cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 9px; border-radius: 999px; background: rgb(127 127 127 / .28); color: var(--wb-on-topic); }
details.tdoc > summary::-webkit-details-marker { display: none; }
.doc-body { padding: 10px 14px 12px; overflow-x: auto; overflow-wrap: anywhere; }
.doc-body > :first-child { margin-top: 0; }
.doc-body > :last-child { margin-bottom: 0; }
.i { width: 14px; height: 14px; flex: none; display: block; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* ---- mockup chrome ---- */
.ctl { position: sticky; top: 0; z-index: 20; background: var(--wb-bg); border-bottom: 1px solid var(--wb-line); padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 12.5px; }
.ctl h1 { font-size: 15px; margin: 0 6px 0 0; font-weight: 700; }
.ctl .grp { display: inline-flex; align-items: center; gap: 6px; color: var(--wb-muted-fg); }
.seg { display: inline-flex; background: var(--wb-muted); border-radius: 999px; padding: 2px; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 2px 10px; font-size: 12.5px; cursor: pointer; color: var(--wb-muted-fg); }
.seg button[aria-pressed="true"] { background: var(--wb-card); color: var(--wb-fg); box-shadow: var(--wb-shadow); font-weight: 700; }
.ctl .act { border: 0; border-radius: 999px; padding: 3px 12px; font-size: 12.5px; cursor: pointer; background: var(--wb-now); color: var(--wb-on-now); font-weight: 700; }
.ctl .act.sec { background: var(--wb-muted); color: var(--wb-fg); font-weight: 500; }
.ctl .legend { margin-left: auto; color: var(--wb-muted-fg); display: inline-flex; gap: 8px; align-items: center; }
.wrap { margin: 0 auto; padding: 16px; max-width: 780px; }
.wrap.all { max-width: 1560px; }
.vgrid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px 20px; align-items: start; }
.wrap.all .vgrid { grid-template-columns: repeat(auto-fit, minmax(460px, 1fr)); }
.variant[hidden] { display: none; }
.vcap { margin: 4px 2px 8px; }
.vcap h2 { font-size: 14px; margin: 0; }
.vcap p { margin: 2px 0 0; font-size: 12.5px; color: var(--wb-muted-fg); }

/* ---- message log (the new part) ---- */
.msgs { margin: 0 14px; padding: 7px 0 10px; border-top: 1px solid var(--wb-line); font-size: 13px; }
.mhead { display: flex; align-items: center; gap: 6px; padding: 0 4px 4px; font-size: 10.5px; font-weight: 800; letter-spacing: .06em; color: var(--wb-muted-fg); min-height: 22px; }
.mhead .i { width: 12px; height: 12px; }
.mhead .n { font-variant-numeric: tabular-nums; letter-spacing: 0; font-size: 11.5px; }
.mhead .mmeta { margin-left: auto; display: inline-flex; gap: 6px; align-items: center; font-weight: 600; letter-spacing: 0; font-size: 11.5px; font-variant-numeric: tabular-nums; }
.msg { display: flex; align-items: baseline; gap: 8px; padding: 2px 6px; border-radius: 6px; line-height: 1.45; }
.msg:hover { background: var(--wb-wash); }
.msg.owner { background: color-mix(in srgb, var(--wb-accent-policy) 7%, transparent); }
.msg .mt { flex: none; font: 11.5px/1.45 var(--wb-mono); color: var(--wb-muted-fg); font-variant-numeric: tabular-nums; cursor: default; }
.msg .who { flex: none; align-self: center; width: 15px; height: 15px; border-radius: 50%; font-size: 9px; font-weight: 800; line-height: 1; display: inline-flex; align-items: center; justify-content: center; background: var(--wb-muted); color: var(--wb-muted-fg); }
.who.owner { background: color-mix(in srgb, var(--wb-accent-policy) 24%, transparent); color: var(--wb-accent-policy); }
.msg .mtext { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.msg .mtext p { margin: 0; }
.msg .mtext ul { margin: 1px 0 0; padding-left: 16px; }
.msg .mtext li { margin: 0; }
.msg.fresh { animation: mfresh 1.8s ease-out; }
@keyframes mfresh { from { background: color-mix(in srgb, var(--wb-primary) 26%, transparent); } to { background: transparent; } }
.mbtn { border: 0; height: 22px; padding: 0 10px; border-radius: 999px; background: var(--wb-muted); color: var(--wb-muted-fg); font-size: 12px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.mbtn:hover { color: var(--wb-fg); }
.mbtn.ghost { background: transparent; box-shadow: inset 0 0 0 1px var(--wb-muted); }
.mbtn.hot { background: var(--wb-now); color: var(--wb-on-now); }
.mctl { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 2px 0 4px; }
.mrest { font-size: 11.5px; color: var(--wb-muted-fg); }
.pgsep { border-top: 1px dashed var(--wb-line); margin: 3px 6px; }
.mnone { padding: 4px 6px; font-size: 12.5px; color: var(--wb-muted-fg); }

/* A: chat, time on the right */
.vA .msg .mt { order: 3; margin-left: auto; padding-left: 6px; }

/* B: pager */
.pager { display: flex; justify-content: center; align-items: center; gap: 3px; margin-top: 6px; }
.pg { border: 0; min-width: 24px; height: 22px; padding: 0 6px; border-radius: 999px; background: transparent; color: var(--wb-muted-fg); font-size: 12px; font-variant-numeric: tabular-nums; cursor: pointer; }
.pg:hover:not(:disabled) { background: var(--wb-wash); color: var(--wb-fg); }
.pg[aria-current="page"] { background: var(--wb-topic); color: var(--wb-on-topic); font-weight: 700; }
.pg:disabled { opacity: .35; cursor: default; }
.pgell { color: var(--wb-muted-fg); padding: 0 2px; font-size: 12px; }

/* C: height cap */
.mboxw { position: relative; }
.mbox { overflow-y: auto; overscroll-behavior: contain; }
.mbox.fade-top { -webkit-mask-image: linear-gradient(to bottom, transparent, #000 22px); mask-image: linear-gradient(to bottom, transparent, #000 22px); }
.msent { text-align: center; font-size: 11.5px; color: var(--wb-muted-fg); padding: 4px 0 6px; }
.jump { position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%); border: 0; height: 24px; padding: 0 11px; border-radius: 999px; background: var(--wb-card); color: var(--wb-fg); box-shadow: 0 0 0 1px var(--wb-line), var(--wb-shadow-hi); font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.jump.new { background: var(--wb-now); color: var(--wb-on-now); box-shadow: var(--wb-shadow-hi); }
.jump[hidden] { display: none; }

/* D: compact timeline */
.tl { gap: 0; padding-top: 1px; padding-bottom: 1px; }
.tl .mt { width: 46px; padding-right: 8px; margin-right: 8px; border-right: 1px solid var(--wb-line); text-align: right; }
.tl .who { width: 13px; height: 13px; font-size: 8px; margin-right: 6px; }
.tl .mtext.one { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl .mtext.one p { display: inline; }
.tl .xmore { font-size: 10.5px; color: var(--wb-muted-fg); margin-left: 6px; padding: 0 5px; border-radius: 999px; background: var(--wb-muted); }
.tl.has-more { cursor: pointer; }
.tl.x .mtext.one, .tl:not(.x) .mtext.full { display: none; }
details.grp > summary, details.efold > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 2px 6px; border-radius: 6px; font-size: 12px; color: var(--wb-muted-fg); font-variant-numeric: tabular-nums; }
details.grp > summary::-webkit-details-marker, details.efold > summary::-webkit-details-marker { display: none; }
details.grp > summary:hover, details.efold > summary:hover { background: var(--wb-wash); color: var(--wb-fg); }
details.grp > summary::before, details.efold > summary::before { content: ""; flex: none; width: 0; height: 0; border-left: 5px solid currentColor; border-top: 4px solid transparent; border-bottom: 4px solid transparent; transition: transform .12s; }
details.grp[open] > summary::before, details.efold[open] > summary::before { transform: rotate(90deg); }
details.grp[open] > summary { color: var(--wb-fg); font-weight: 600; }
details.grp > summary .gp { font: 700 10.5px/1 var(--wb-mono); padding: 2px 5px; border-radius: 4px; background: var(--wb-muted); color: var(--wb-muted-fg); }
details.grp > summary .od { width: 6px; height: 6px; border-radius: 50%; background: var(--wb-accent-policy); }
details.grp > .gbody, details.dmore > .gbody { padding: 1px 0 3px 0; }
details.dmore > .gbody { padding-left: 12px; }

/* E: recap split */
details.efold { margin-bottom: 2px; }
details.efold > summary .sub { margin-left: auto; font-size: 11px; }
details.efold > .gbody { margin: 2px 0 4px 12px; padding-left: 8px; border-left: 2px solid var(--wb-muted); }
.rline { display: flex; align-items: center; gap: 8px; margin: 4px 6px; font-size: 11px; font-weight: 700; color: var(--wb-accent-policy); font-variant-numeric: tabular-nums; }
.rline::before, .rline::after { content: ""; flex: 1; border-top: 1px solid color-mix(in srgb, var(--wb-accent-policy) 45%, transparent); }
.rline::before { flex: 0 0 10px; }

/* block markdown (copied from page.css .md rules) */
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { font-size: inherit; margin: 0 0 4px; }
.md blockquote { padding: 5px 11px; border-left: 3px solid color-mix(in srgb, var(--wb-primary) 70%, transparent); border-radius: 0 6px 6px 0; background: color-mix(in srgb, var(--wb-primary) 7%, transparent); color: color-mix(in srgb, var(--wb-fg) 78%, var(--wb-muted-fg)); }
.md blockquote > :last-child { margin-bottom: 0; }
.md pre { background: var(--wb-muted); border-radius: 8px; padding: 6px 9px; overflow-x: auto; font-size: 12.5px; }
.md pre > code { background: none; padding: 0; font-size: inherit; }
.md table { display: table; width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12.5px; border: 1px solid var(--wb-line); border-radius: 8px; }
.md th, .md td { padding: 5px 10px; vertical-align: top; overflow-wrap: break-word; }
.md th + th, .md td + td { border-left: 1px solid color-mix(in srgb, var(--wb-line) 55%, transparent); }
.md th { text-align: left; background: var(--wb-wash); font-weight: 700; border-bottom: 1px solid var(--wb-line); }
.md td { border-top: 1px solid var(--wb-line); }
.md tbody tr:first-child td { border-top: 0; }
.md tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--wb-fg) 3%, transparent); }

/* ---- F–H: panels (big cards in the topic) + one-line log ---- */
.wrap.wide { max-width: 1100px; }
.topic.ncard { container: tcard / inline-size; }
.tpin { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin: 10px 10px 0; padding: 7px 10px; font-size: 13px; background: var(--wb-wash); border-left: 3px solid var(--wb-accent-policy); border-radius: 0 8px 8px 0; }
.tpin .ptext { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.tpin .pat { flex: none; display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--wb-muted-fg); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tpin.fresh { animation: pinfresh 1.8s ease-out; }
@keyframes pinfresh { from { background: color-mix(in srgb, var(--wb-accent-policy) 32%, transparent); } to { background: var(--wb-wash); } }
.evi { flex: none; width: 15px; display: inline-flex; justify-content: center; align-items: center; }
.evi .i { width: 11px; height: 11px; stroke-width: 2; }
.evi.lead { height: 15px; border-radius: 50%; font-size: 8.5px; font-weight: 800; background: color-mix(in srgb, var(--wb-primary) 16%, transparent); color: var(--wb-primary); }
.nsec { margin: 0 14px; padding: 7px 0 10px; border-top: 1px solid var(--wb-line); }
.nsec .mhead .i, .rail .mhead .i { width: 12px; height: 12px; }
.doc-body a.mref { font-family: var(--wb-mono); font-size: .92em; font-weight: 600; text-decoration: none; padding: 0 4px; border-radius: 4px; background: color-mix(in srgb, var(--wb-primary) 12%, transparent); }
.doc-body a.mref:hover { background: color-mix(in srgb, var(--wb-primary) 22%, transparent); }

/* panel: a card inside the topic card */
.dstack { display: flex; flex-direction: column; gap: 6px; }
.pnl { background: var(--wb-bg); border-radius: 10px; overflow: hidden; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--wb-fg) 9%, transparent); }
.pbar { display: flex; align-items: center; gap: 8px; padding: 4px 10px; min-height: 30px; cursor: pointer; }
.pbar:hover { background: var(--wb-wash); }
.pnl.open > .pbar { border-bottom: 1px solid var(--wb-line); }
.pcaret { flex: none; width: 10px; font-size: 10px; color: var(--wb-muted-fg); }
.ptitle { flex: 1; min-width: 0; font-weight: 700; font-size: 13.5px; overflow-wrap: anywhere; }
.pnl:not(.open) .ptitle { font-weight: 600; font-size: 13px; }
.pmeta { flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--wb-muted-fg); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pmeta .mt { font: 11px var(--wb-mono); }
.pmeta .hint { padding: 0 6px; border-radius: 999px; background: var(--wb-muted); line-height: 16px; }
.pmeta a.mref { font: 600 11px var(--wb-mono); color: inherit; text-decoration: none; }
.pmeta a.mref:hover { color: var(--wb-primary); }
.pbody { padding: 10px 14px 12px; font-size: 13.5px; overflow-wrap: anywhere; }
.pnl.flash { animation: wbflash 1.8s ease-out; }
.pnl.fresh { animation: pfresh 1.8s ease-out; }
@keyframes wbflash { 0%, 30% { box-shadow: 0 0 0 2px var(--wb-primary); } 100% { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--wb-fg) 9%, transparent); } }
@keyframes pfresh { from { box-shadow: 0 0 0 2px color-mix(in srgb, var(--wb-primary) 60%, transparent); } }
details.dfold { margin-bottom: 6px; }
details.dfold > summary, details.grp > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 2px 6px; border-radius: 6px; font-size: 12px; color: var(--wb-muted-fg); font-variant-numeric: tabular-nums; }
details.dfold > summary::-webkit-details-marker { display: none; }
details.dfold > summary:hover { background: var(--wb-wash); color: var(--wb-fg); }
details.dfold > summary::before { content: ""; flex: none; width: 0; height: 0; border-left: 5px solid currentColor; border-top: 4px solid transparent; border-bottom: 4px solid transparent; transition: transform .12s; }
details.dfold[open] > summary::before { transform: rotate(90deg); }
details.dfold[open] > summary { margin-bottom: 6px; }

/* placeholder images and the mini UI mockup */
.figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; margin: 0 0 8px; }
.ph { margin: 0 0 8px; max-width: 520px; }
.figs .ph { max-width: none; }
.figs .ph { margin: 0; }
.ph svg { display: block; width: 100%; height: auto; max-height: 260px; background: var(--wb-muted); border-radius: 8px; }
.ph figcaption { margin-top: 3px; font-size: 11.5px; color: var(--wb-muted-fg); }
.ph .a { fill: var(--wb-primary); }
.ph .b { fill: color-mix(in srgb, var(--wb-fg) 14%, transparent); }
.ph .c { fill: var(--wb-card); }
.ph .d { fill: color-mix(in srgb, var(--wb-fg) 22%, transparent); }
.ph .s { stroke: var(--wb-muted-fg); stroke-width: 1.5; fill: none; }
.ph .sf { fill: var(--wb-muted-fg); }
.mk { max-width: 380px; border-radius: 8px; overflow: hidden; background: var(--wb-card); box-shadow: 0 0 0 1px var(--wb-line), var(--wb-shadow); font-size: 10.5px; line-height: 1.4; }
.mk-bar { display: flex; justify-content: space-between; padding: 3px 8px; background: var(--wb-topic); color: var(--wb-on-topic); font-weight: 700; }
.mk-pin { display: flex; justify-content: space-between; gap: 8px; margin: 5px 6px 0; padding: 2px 6px; border-left: 2px solid var(--wb-accent-policy); background: var(--wb-wash); }
.mk-pin span, .mk-bar span { opacity: .7; font-weight: 400; }
.mk i { display: block; height: 5px; margin: 4px 0; border-radius: 3px; background: color-mix(in srgb, var(--wb-fg) 14%, transparent); }
.mk-doc { padding: 2px 8px 2px; }
.mk-pnl { margin: 4px 6px; padding: 2px 6px; border-radius: 5px; background: var(--wb-bg); box-shadow: inset 0 0 0 1px var(--wb-line); }
.mk-pnl b { font-weight: 700; }

const RECAP_AFTER = 26; // index of the last message the recap already reflects
const POOL = [

  ['lead', '리뷰어 보고: minor 1건 — 빈 로그일 때 헤더 문구'],
  ['lead', 'SSE 재연결 확인, 지연 0.3s'],
  ['lead', '티켓 `261113-wb-message-log` Phase 1 Result 기록'],

let msgs, recapAt, N = 8, view = 'all', nextId, poolI;
const fresh = new Set();
function seed() {
  const total = SEED.reduce((s, x) => s + x[2], 0);
  let t = Date.now() - 2 * 60000 - total * 60000;
  msgs = SEED.map((x, i) => { t += x[2] * 60000; return { id: i + 1, who: x[0], text: x[1], at: t }; });
  recapAt = msgs[RECAP_AFTER].at + 60000;
  nextId = msgs.length + 1; poolI = 0;
}

// ---- helpers -----------------------------------------------------------
const pad = n => String(n).padStart(2, '0');
const clock = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const stamp = t => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${clock(t)}`; };
function rel(t) {
  const m = Math.floor((Date.now() - t) / 60000);
  if (m < 1) return '방금';
  if (m < 60) return m + '분 전';
  const h = Math.floor(m / 60);
  return h < 24 ? h + '시간 ' + (m % 60 ? (m % 60) + '분 ' : '') + '전' : Math.floor(h / 24) + '일 전';
}
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>')
    // #pN panel anchors (F–H): the card's click handler scrolls to the panel
    .replace(/(^|\s)#p(\d+)\b/g, '$1<a class="mref" href="#p$2" data-pid="$2">#p$2</a>');
}
// tiny block markdown: paragraphs, - lists, | tables |, ### headings, > quotes, ``` fences,
// and placeholder figures ![caption](img:chart|flow|shot|photo) / ![caption](ui:pinned|stream|rail)
const FIG = /^!\[([^\]]*)\]\((img|ui):(\w+)\)$/;
function md(text) {
  const L = text.split('\n'), cells = r => r.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
  const special = /^(```|\||#{1,6} |- |> |!\[)/;
  let out = '', i = 0;
  while (i < L.length) {
    const l = L[i];
    if (FIG.test(l)) {
      const figs = [];
      while (i < L.length && FIG.test(L[i])) { const [, cap, kind, name] = L[i++].match(FIG); figs.push(`<figure class="ph">${kind === 'img' ? IMG[name] : UI[name]}<figcaption>${inline(cap)}</figcaption></figure>`); }
      out += figs.length > 1 ? `<div class="figs">${figs.join('')}</div>` : figs[0];
    }
    else if (l.startsWith('```')) { const b = []; i++; while (i < L.length && !L[i].startsWith('```')) b.push(L[i++]); i++; out += `<pre><code>${esc(b.join('\n'))}</code></pre>`; }
    else if (l.startsWith('|')) {
      const rows = []; while (i < L.length && L[i].startsWith('|')) rows.push(L[i++]);
      out += `<table><thead><tr>${cells(rows[0]).map(c => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${rows.slice(2).map(r => `<tr>${cells(r).map(c => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    }
    else if (/^#{1,6} /.test(l)) { out += `<h4>${inline(l.replace(/^#+ /, ''))}</h4>`; i++; }
    else if (l.startsWith('> ')) { const b = []; while (i < L.length && L[i].startsWith('> ')) b.push(inline(L[i++].slice(2))); out += `<blockquote><p>${b.join('<br>')}</p></blockquote>`; }
    else if (l.startsWith('- ')) { out += '<ul>'; while (i < L.length && L[i].startsWith('- ')) out += `<li>${inline(L[i++].slice(2))}</li>`; out += '</ul>'; }
    else if (!l.trim()) i++;
    else { const b = []; while (i < L.length && L[i].trim() && !special.test(L[i])) b.push(inline(L[i++])); out += `<p>${b.join('<br>')}</p>`; }
  }
  return out;
}
const WHO = { lead: ['L', '리드'], owner: ['O', '오너'] };
const timeEl = m => `<time class="mt" datetime="${new Date(m.at).toISOString()}" data-at="${m.at}">${clock(m.at)}</time>`;

const row = m => `<div class="msg ${m.who}${fresh.has(m.id) ? ' fresh' : ''}" data-id="${m.id}">${timeEl(m)}${whoEl(m)}<div class="mtext md">${md(m.text)}</div></div>`;

const head = (meta) => `<div class="mhead">${ICON.msg}메시지 <span class="n">${msgs.length}</span><span class="mmeta">${meta || ''}</span></div>`;

function pageList(cur, n) {
  const s = new Set([1, n, cur - 1, cur, cur + 1]);
  if (cur <= 3) [2, 3, 4].forEach(x => s.add(x));
  if (cur >= n - 2) [n - 1, n - 2, n - 3].forEach(x => s.add(x));
  const arr = [...s].filter(x => x >= 1 && x <= n).sort((a, b) => a - b), out = [];
  arr.forEach((x, i) => { if (i && x - arr[i - 1] > 1) out.push('…'); out.push(x); });
  return out;
}
function pager(cur, n, act) {
  let h = `<div class="pager"><button class="pg" data-act="${act}" data-p="${cur - 1}" ${cur <= 1 ? 'disabled' : ''} title="이전">‹</button>`;

  title: 'C. 높이 제한', desc: '약 N줄 높이의 박스 안에서 스크롤, 기본은 최신(아래)에 붙어 있다. 위로 올리면 "최신으로" 칩, 그 상태에서 새 메시지가 오면 "새 메시지 n개" 칩. 맨 위에 닿으면 이전 2N개를 지연 로드.',
  reset() { this.loaded = Math.min(msgs.length, 2 * N); this.unseen = 0; this.atBottom = true; },
  render(el, mode) {
    const old = el.querySelector('.mbox'), prevTop = old ? old.scrollTop : 0, prevH = old ? old.scrollHeight : 0;
    const total = msgs.length; this.loaded = Math.min(total, this.loaded);
    const start = total - this.loaded;
    let h = head(`${this.loaded}/${total} 로드됨`);
    h += `<div class="mboxw"><div class="mbox" style="max-height:${N * 23 + 6}px">`;
    h += start > 0 ? `<div class="msent">↑ 끝까지 올리면 이전 ${Math.min(2 * N, start)}개를 더 불러옴 · 남은 ${start}개</div>` : '<div class="msent">— 첫 메시지 —</div>';
    for (let i = start; i < total; i++) h += row(msgs[i]);
    h += '</div><button class="jump" data-act="bottom" hidden></button></div>';
    el.innerHTML = h;
    const box = el.querySelector('.mbox');
    if (this.atBottom) box.scrollTop = box.scrollHeight;
    else if (mode === 'prepend') box.scrollTop = prevTop + (box.scrollHeight - prevH);
    else box.scrollTop = prevTop;
    this.sync(el);
  },
  sync(el) {
    const box = el.querySelector('.mbox'), jump = el.querySelector('.jump');
    jump.hidden = this.atBottom;
    jump.classList.toggle('new', this.unseen > 0);
    jump.textContent = this.unseen ? `↓ 새 메시지 ${this.unseen}개` : '↓ 최신으로';
    box.classList.toggle('fade-top', box.scrollTop > 4);
  },
  scroll(el, box) {
    if (!box.clientHeight) return; // hidden tab
    this.atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 6;
    if (this.atBottom) this.unseen = 0;
    if (box.scrollTop < 24 && this.loaded < msgs.length) { this.loaded = Math.min(msgs.length, this.loaded + 2 * N); this.render(el, 'prepend'); return; }
    this.sync(el);
  },
  act(el, a) { if (a === 'bottom') { const box = el.querySelector('.mbox'); box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' }); } },
  onAdd() { this.loaded++; if (!this.atBottom) this.unseen++; },
};

V.D = {
  title: 'D. 컴팩트 타임라인', desc: '시각 열 + 한 줄 텍스트(여러 줄은 "+n줄", 클릭해 펼침). 페이지는 오래된 쪽부터 고정된 N개 묶음이라 새 메시지가 와도 기존 묶음이 흔들리지 않는다. 최신 묶음만 펼침(최신 묶음이 N/2 미만이면 직전 묶음도), 이전 묶음 3개 너머는 "더 이전"으로 한 번 더 접힘.',
  reset() { this.ov = new Map(); this.moreOpen = false; },
  render(el) {
    const total = msgs.length, G = Math.ceil(total / N), last = G - 1, lastCount = total - last * N;
    const groups = [];
    for (let g = 0; g < G; g++) groups.push(msgs.slice(g * N, (g + 1) * N));
    const isOpen = g => this.ov.has(g) ? this.ov.get(g) : (g === last || (g === last - 1 && lastCount < Math.ceil(N / 2)));
    const grp = g => {
      const list = groups[g], owners = list.filter(m => m.who === 'owner').length;
      return `<details class="grp" data-g="${g}"${isOpen(g) ? ' open' : ''}><summary><span class="gp">p${g + 1}</span>${range(list[0], list[list.length - 1])} · ${list.length}개${owners ? `<span class="od" title="오너 메시지 ${owners}개"></span>` : ''}</summary><div class="gbody">${list.map(tlRow).join('')}</div></details>`;
    };
    let h = head(`묶음 ${G}개 · ${N}개씩`);
    const cut = Math.max(0, last - 3); // groups [0, cut) fold into "더 이전"
    if (cut > 0) {
      const a = groups[0][0], b = groups[cut - 1][groups[cut - 1].length - 1];
      h += `<details class="grp dmore"${this.moreOpen ? ' open' : ''}><summary>더 이전 · 묶음 ${cut}개 (${cut * N}개) ${range(a, b)}</summary><div class="gbody">`;
      for (let g = 0; g < cut; g++) h += grp(g);
      h += '</div></details>';
    }
    for (let g = cut; g < G; g++) h += grp(g);
    el.innerHTML = h;
  },
  toggle(el, d) {
    if (d.classList.contains('dmore')) this.moreOpen = d.open;
    else if (d.dataset.g != null) this.ov.set(+d.dataset.g, d.open);
  },
  click(el, e) { const r = e.target.closest('.tl.has-more'); if (r && !e.target.closest('a')) r.classList.toggle('x'); },
};

  reset() { this.more = 0; this.page = 1; this.foldOpen = false; },
  render(el) {
    const after = msgs.filter(m => m.at > recapAt), before = msgs.filter(m => m.at <= recapAt);
    let h = head(`recap 이후 ${after.length}개 <button class="mbtn ghost" data-act="recap" title="recap을 지금 갱신한 것으로 가정">recap 갱신</button>`);
    if (before.length) {
      const pages = Math.max(1, Math.ceil(before.length / N));
      this.page = Math.min(Math.max(1, this.page), pages);
      const a = (this.page - 1) * N, list = before.slice().reverse().slice(a, a + N);
      h += `<details class="efold"${this.foldOpen ? ' open' : ''}><summary>recap에 반영됨 · ${before.length}개<span class="sub">${range(before[0], before[before.length - 1])}</span></summary><div class="gbody">${list.map(tlRow).join('')}${pages > 1 ? pager(this.page, pages, 'epg') : ''}</div></details>`;
    }
    h += `<div class="rline">recap ${clock(recapAt)} 이후 · ${after.length}개</div>`;
    if (!after.length) h += '<div class="mnone">recap 이후 새 메시지 없음</div>';
    else {
      const shown = Math.min(after.length, N * (1 + this.more)), start = after.length - shown;
      if (start > 0 || this.more) {
        h += '<div class="mctl">';
        if (start > 0) h += `<button class="mbtn" data-act="more">↑ ${Math.min(N, start)}개 더 보기</button><span class="mrest">남은 ${start}개</span>`;
        if (this.more) h += '<button class="mbtn ghost" data-act="less">접기</button>';
        h += '</div>';
      }
      h += after.slice(start).map(row).join('');
    }
    el.innerHTML = h;
  },
  act(el, a, t) {
    if (a === 'more') this.more++;
    else if (a === 'less') this.more = 0;
    else if (a === 'epg') this.page = +t.dataset.p;
    else if (a === 'recap') { recapAt = Date.now(); this.more = 0; this.page = 1; updateCards(); }
    this.render(el);
  },
  toggle(el, d) { if (d.classList.contains('efold')) this.foldOpen = d.open; },
};

const KEYS = ['F', 'G', 'H', 'A', 'B', 'C', 'D', 'E'], NEW = ['F', 'G', 'H'];
const grid = document.getElementById('grid');
const DOC = () => `<details class="tdoc" open><summary title="본문">${ICON.book}</summary><div class="doc-body md">${md(P(
  '**현재 상태**',
  '- 저장: topic별 append-only JSONL (`T0`), 패널 본문은 별도 파일 — 근거 #p2',
  '- recap 제거: 최신 에이전트 로그 줄이 현재 상태 (`recap` 인자는 T1 별칭) — #p5',
  '- 기본 로그 묶음 크기 8 — 실측 #p6',
  '',
  '**참고 패널**',
  '- 문제 정의 #p1 · 채택 시안 #p3 (대안 #p4)',
  '- 최신 대시보드 화면 #p7'))}</div></details>`;
const tbar = () => `<div class="tbar"><span class="tlead"><span class="tname">whiteboard-messages</span></span><time class="tago" title="업데이트됨"></time><button class="btn mini tnote-toggle" title="토픽 메모">${ICON.pen}</button></div>`;
function card(k) {
  const cap = `<div class="vcap"><h2>${V[k].title}</h2><p>${V[k].desc}</p></div>`;
  if (V[k].log) return `<div class="variant" id="var-${k}">${cap}<section class="topic has-doc ncard v${k}" data-topic="whiteboard-messages">${tbar()}${V[k].shell()}</section></div>`;
  return `<div class="variant" id="var-${k}">${cap}
<section class="topic has-doc v${k}" data-topic="whiteboard-messages">${tbar()}
<div class="trecap"><div class="rtext md"><p>메시지 로그 저장은 JSONL(<code>T0</code>)로 확정했고 페이징 테스트까지 통과했다. 지금은 렌더 변형을 비교 중.</p></div><span class="rat">recap <time class="tago rat-t"></time></span></div>
<details class="tdoc" open><summary title="본문">${ICON.book}</summary><div class="doc-body md">
<p><b>현재 상태</b></p>
<ul><li>저장: topic별 append-only JSONL — 호환성 <code>T0</code></li><li>렌더: content 아래, 표시 상한 N개 + 이전 페이지</li><li>남은 일: 변형 선택 → 대시보드 반영, 기본 N 결정</li></ul>
</div></details>
<div class="msgs" data-v="${k}"></div></section></div>`;
}
seed(); seedLog();
grid.innerHTML = KEYS.map(card).join('');
const boxes = {};
for (const k of KEYS) {
  const el = V[k].log ? grid.querySelector(`#var-${k} .topic`) : grid.querySelector(`.msgs[data-v="${k}"]`); boxes[k] = el;
  document.getElementById('var-' + k).addEventListener('click', e => {
    const a = e.target.closest('a.mref');
    if (a) { e.preventDefault(); if (V[k].goto) V[k].goto(el, +a.dataset.pid); return; }
    if (!el.contains(e.target) || e.target.closest('a')) return;
    const b = e.target.closest('[data-act]');
    if (b && !b.disabled) { V[k].act(el, b.dataset.act, b); return; }
    if (V[k].click) V[k].click(el, e);
  });
  el.addEventListener('toggle', e => { if (V[k].toggle && e.target.tagName === 'DETAILS') V[k].toggle(el, e.target); }, true);
  el.addEventListener('scroll', e => { const c = e.target.classList; if (V[k].scroll && c && (c.contains('mbox') || c.contains('rail'))) V[k].scroll(el, e.target); }, true);
}
function updateCards() {
  grid.querySelectorAll('.topic').forEach(sec => {
    const last = sec.classList.contains('ncard') ? log[log.length - 1] : msgs[msgs.length - 1];
    const t = sec.querySelector('.tbar .tago'); t.textContent = clock(last.at); t.dataset.at = last.at;
  });
  grid.querySelectorAll('.rat-t').forEach(t => { t.textContent = clock(recapAt); t.dataset.at = recapAt; });
}
function renderAll() { updateCards(); for (const k of KEYS) V[k].render(boxes[k]); }
function resetAll() { for (const k of KEYS) V[k].reset(); }

function setView(v) {
  view = v;
  const wrap = document.getElementById('wrap');
  wrap.classList.toggle('all', v === 'all');
  wrap.classList.toggle('wide', v === 'new' || NEW.includes(v));
  for (const k of KEYS) document.getElementById('var-' + k).hidden = !(v === 'all' || v === k || (v === 'new' && NEW.includes(k)));
  document.querySelectorAll('#views button, #views2 button').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === v));
  renderAll(); // C and the H rail need a visible box to pin themselves to the newest
}
function setN(n) {
  N = n;
  document.querySelectorAll('#sizes button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.n === n));
  resetAll(); renderAll();
}
function markFresh(set, id) { set.add(id); setTimeout(() => set.delete(id), 1800); }
function addOld(at) {
  const p = POOL[poolI++ % POOL.length];
  const m = { id: nextId++, who: p[0], text: p[1], at };
  msgs.push(m); markFresh(fresh, m.id);
  for (const k of KEYS) if (V[k].onAdd) V[k].onAdd();
}
function addEntries(...es) { for (const e of es) { log.push(e); markFresh(freshLog, e.id); } }
function addLine(at) { addEntries({ id: logId++, k: 'l', t: AGENT_LINES[agentI++ % AGENT_LINES.length], at }); addOld(at); }
function addSys(at) { addEntries(Object.assign({ id: logId++, k: 's', at }, pick(SYS_GEN)())); }
function addPanel(at) { addEntries(...makePanel(PANEL_TITLES[panelI++ % PANEL_TITLES.length], panelBody(pick(['S', 'M', 'L'])), at)); }

document.getElementById('views').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setView(b.dataset.view); });
document.getElementById('views2').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setView(b.dataset.view); });
document.getElementById('sizes').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setN(+b.dataset.n); });
document.getElementById('addpanel').addEventListener('click', () => { addPanel(Date.now()); renderAll(); });
document.getElementById('add').addEventListener('click', () => { addLine(Date.now()); renderAll(); });
document.getElementById('addsys').addEventListener('click', () => { addSys(Date.now()); renderAll(); });
document.getElementById('add5').addEventListener('click', () => {
  for (let i = 0; i < 5; i++) { const at = Date.now() - (4 - i) * 2000; Math.random() < .6 ? addLine(at) : addSys(at); }
  renderAll();
});
document.getElementById('reset').addEventListener('click', () => { seed(); seedLog(); fresh.clear(); freshLog.clear(); resetAll(); renderAll(); });
const THEMES = [['auto', '자동'], ['light', '라이트'], ['dark', '다크']];
let themeI = 0;
document.getElementById('theme').addEventListener('click', e => {
  themeI = (themeI + 1) % THEMES.length;
  const [v, label] = THEMES[themeI];
  if (v === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = v;
  e.currentTarget.textContent = '테마: ' + label;
});
// relative time on hover, computed when shown so it never goes stale
document.addEventListener('mouseover', e => {
  const t = e.target.closest('time[data-at]');
  if (t) t.title = t.classList.contains('rel') ? stamp(+t.dataset.at) : (t.classList.contains('mt') ? '' : '업데이트 · ') + rel(+t.dataset.at) + ' · ' + stamp(+t.dataset.at);
});
// the pinned status's "n분 전" ticks on its own
setInterval(() => document.querySelectorAll('time.rel[data-at]').forEach(t => { t.textContent = clock(+t.dataset.at) + ' · ' + rel(+t.dataset.at); }), 20000);

resetAll();
setN(8);
setView('new');
})();
</script>
</body>
</html>
