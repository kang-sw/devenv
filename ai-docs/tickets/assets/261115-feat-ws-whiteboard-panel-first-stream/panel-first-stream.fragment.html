<!-- Whiteboard panel-first topic history mockup (261115-feat-ws-whiteboard-panel-first-stream, Phase 2).
     Injected into the real dashboard board frame; pf* classes are the only new CSS.
     .pf-payload marks a panel payload the driver renders in the real sandboxed doc frame. -->
<style id="pf-css">
/* Proposed additions only; everything else is the whiteboard's own CSS. */
.pfname { font: 11px var(--wb-mono); color: var(--wb-muted-fg); }
@container (max-width: 520px) { .pfname { display: none; } }
.pfver { padding: 0 6px; border-radius: 999px; font: 700 10.5px/16px var(--wb-sans); background: color-mix(in srgb, var(--wb-primary) 16%, transparent); color: var(--wb-primary); }
.pfver.old { background: var(--wb-muted); color: var(--wb-muted-fg); font-weight: 600; }
.pmeta a.pfnewer { font: 600 11px var(--wb-mono); color: var(--wb-primary); text-decoration: none; }
.pmeta a.pfnewer:hover { text-decoration: underline; }
.pmeta .ibtn.pflink { width: 22px; height: 22px; min-width: 22px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 5px; color: var(--wb-muted-fg); background: transparent; border: 0; }
.pmeta .ibtn.pflink .i { width: 13px; height: 13px; }
.pmeta .ibtn.pflink.on, .pmeta .ibtn.pflink:hover { background: var(--wb-wash); color: var(--wb-fg); }
.pf-old > .entry-panel > summary .entry-recap { color: var(--wb-muted-fg); }
.pf-old > .entry-panel > .entry-body.doc-body { border-left-style: dashed; }
.pfoldnote { display: flex; align-items: center; gap: 6px; margin: 6px 0 0 18px; padding: 3px 8px; width: fit-content; border-radius: 6px; background: var(--wb-muted); font-size: 11.5px; color: var(--wb-muted-fg); }
.pfoldnote .i { width: 12px; height: 12px; flex: none; }
.pfoldnote a, .pfprev a { color: var(--wb-primary); text-decoration: none; font-weight: 600; }
.pfprev { margin: 4px 0 2px 30px; font-size: 11.5px; }
.pf-arrive > .entry-panel { outline: 2px solid var(--wb-primary); outline-offset: 2px; border-radius: 4px; }
.wb-entry.panel { position: relative; }
.pfmenu { position: absolute; right: 30px; top: 26px; z-index: 6; width: 268px; max-width: calc(100vw - 40px); padding: 4px; border: 1px solid var(--wb-line); border-radius: 8px; background: var(--wb-card, var(--wb-bg)); box-shadow: var(--wb-shadow-hi); }
.pfmh { padding: 4px 8px 2px; font-size: 10.5px; font-weight: 700; color: var(--wb-muted-fg); letter-spacing: .02em; }
.pfmi { display: grid; grid-template-columns: 16px minmax(0, 1fr) 14px; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border: 0; border-radius: 6px; background: transparent; color: var(--wb-fg); text-align: left; font: inherit; cursor: pointer; }
.pfmi:first-of-type { background: var(--wb-wash); }
.pfmi .i, .pfmi .li { width: 14px; height: 14px; color: var(--wb-muted-fg); }
.pfmt { display: flex; flex-direction: column; min-width: 0; }
.pfmt .k { font-size: 12.5px; font-weight: 600; }
.pfmt .k code { font: 600 11.5px var(--wb-mono); color: var(--wb-primary); }
.pfmt .d { font-size: 11px; color: var(--wb-muted-fg); }
.history-gap.pf-gap { padding: 2px 0; }
/* Gallery chrome for the link-affordance sheet. */
.pfgal { display: grid; grid-template-columns: repeat(auto-fill, minmax(520px, 1fr)); gap: 14px; align-items: start; }
@media (max-width: 700px) { .pfgal { grid-template-columns: 1fr; } }
.pfcard { min-width: 0; }
.pfcap { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; margin: 0 2px 6px; font-size: 12.5px; color: var(--wb-fg); }
.pfcap span { font-size: 11.5px; color: var(--wb-muted-fg); }
.pfcard > .topic { margin: 0; }
.pfcard .topic, .pfcard .topic-stream, .pfcard .wb-history, .pfcard .history-live { overflow: visible; }
.pfcard.pfroom { padding-bottom: 96px; }
</style>
