const LABEL = "Electron 데스크톱 셸 · Windows 창 처리";

const POOL = [
  "프로토타입 창을 띄워 기본 레이아웃을 확인했습니다. 세션 레일 · 보드 · 입력창 배치는 브라우저 대시보드와 같습니다",

  "대시보드 데몬 주소를 창이 직접 찾지 않고, 실행 인자로 받도록 바꿨습니다",
  "개발용 자동 새로고침을 붙였습니다. 화면 파일을 고치면 창이 다시 그려집니다",
  "보안 기본값 점검: 렌더러에서 Node 접근을 끄고, 미리 정한 통로로만 데몬과 통신합니다",
  "Windows 빌드 스크립트를 추가했습니다. 아직 서명은 하지 않습니다",
  "창 최소 크기를 720×480으로 정했습니다. 그보다 작으면 세션 레일이 접힙니다",

  "EXEC 2 보고: 맥 빌드 통과, 실행 확인. 메뉴의 단축키가 브라우저 단축키와 겹치는 2곳을 찾았습니다",

const E = [];
let n = 0, clock = 10 * 60 + 58;
const t = () => { const h = Math.floor(clock / 60), m = clock % 60; return `${h}:${String(m).padStart(2, "0")}`; };
function logs(count, step) { for (let i = 0; i < count; i++) { E.push({ k: "agent", at: t(), text: (i % 3 === 1) ? POOL[(n++) % POOL.length] + ". " + POOL[(n++) % POOL.length] + ". 다음 단계는 EXEC 2 보고를 받은 뒤 이어서 진행합니다" : POOL[(n++) % POOL.length] }); if (i % 4 === 3) E.push({ k: "system", at: t(), text: i % 8 === 3 ? "Topic state: implementing" : "Panel [p41](#p41) re-posted: 빌드 결과" }); clock += step; } }
// top region: 14 entries before cluster 1's lead
logs(12, 2);
E.push({ k: "panel", at: t(), recap: "Windows 제목 표시줄 세 가지 방식 비교 (스크린샷 3장)", lines: 42, imgs: 3 });                 // lead of cluster 1
E.push({ k: "add", at: t(), q: 895 }); E.push({ k: "add", at: t(), q: 896 });
clock += 2;
// middle region K
logs(34, 1);
E.push({ k: "agent", at: t(), text: "Windows 창 버튼을 직접 그리는 쪽으로 기본 작업은 진행해 둡니다. 닫기 버튼 동작은 정해야 해서 {{899}}로 여쭙니다" });   // lead of cluster 2
E.push({ k: "add", at: t(), q: 899 });
clock += 2;
// lower region M
logs(16, 1);
clock = 12 * 60 + 18;
E.push({ k: "answer", at: t(), q: 896, comment: "ThinkPad에서 검증을 시작합니다. 앞으로 Electron 화면 확인은 모두 ThinkPad에서 하고, 결과 화면은 패널로 올립니다" });
E.push({ k: "agent", at: "12:19", text: "ThinkPad 원격 실행 확인: 창이 뜨고 세션 목록이 보입니다. 제목 표시줄은 {{895}} 답을 기다리는 동안 OS 기본으로 둡니다", current: true });
E.forEach((e, i) => { e.i = i; e.id = "e" + (5000 + i); });
const mins = s => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
E.forEach(e => { if (e.k === "add") Q[e.q].asked = e.at; });
E.forEach(e => { if (e.k === "answer") { const q = Q[e.q]; q.answered = e.at; const d = mins(e.at) - mins(q.asked); q.wait = d >= 60 ? `${Math.floor(d / 60)}시간 ${d % 60}분 뒤` : `${d}분 뒤`; } });

// ---- anchors -------------------------------------------------------------
// always visible: each question cluster (consecutive adds), the one log|panel
// right before it, every answer row, the current-state line.
function anchors() {
  const a = new Set();
  E.forEach((e, i) => {
    if (e.k === "add" || e.k === "answer" || e.current) a.add(i);
    if (e.k === "add" && (i === 0 || E[i - 1].k !== "add")) {
      for (let j = i - 1; j >= 0; j--) if (E[j].k === "agent" || E[j].k === "panel") { a.add(j); E[j].lead = true; break; }
    }
  });
  return a;
}
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\{\{(\d+)\}\}/g, (_, d) => `<a href="#item-${d}" data-jump="item-${d}">(${d})</a>`);
const icon = k => `<svg class="i" aria-hidden="true"><use href="#i-${k}"/></svg>`;
const licon = k => `<svg class="li" aria-hidden="true"><use href="#l-${k}"/></svg>`;
function md(table) {
  const rows = table.split("\n").filter(r => !/^\|-/.test(r)).map(r => r.split("|").slice(1, -1).map(c => c.trim()));
  if (rows.length < 2) return `<p>${esc(table)}</p>`;
  return `<table><thead><tr>${rows[0].map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${rows.slice(1).map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}
function opts(q, pick) {
  return `<div class="opts stack">${q.options.map((o, i) => { const L = String.fromCharCode(97 + i), rec = L === q.rec;
    return pick ? `<div class="opt static${rec ? " rec" : ""}${L === pick ? " picked" : ""}"><span class="k">${L}${rec ? icon("star") : ""}</span><div class="md">${esc(o)}</div></div>`
                : `<div class="opt${rec ? " rec" : ""}" role="button" tabindex="0" data-opt="${L}" aria-pressed="false"><span class="k">${L}${rec ? icon("star") : ""}</span><div class="md">${esc(o)}</div></div>`; }).join("")}</div>`;
}
function rowHTML(e) {
  if (e.k === "agent") return `<article class="wb-entry agent${e.current ? " current" : ""}${e.lead ? " w-anchor-lead" : ""}" id="${e.id}"><div class="entry-line"><span class="evi lead">L</span><span class="entry-text"><time class="entry-at">${e.at}</time> — ${inline(e.text)}${e.current ? `<span class="ptag">현재 상태</span>` : ""}${e.lead ? `<span class="lead-tag">질문 직전</span>` : ""}</span></div></article>`;
  if (e.k === "system") return `<article class="wb-entry system" id="${e.id}"><div class="entry-line"><span class="evi sys"></span><span class="entry-text"><time class="entry-at">${e.at}</time> — ${inline(e.text)}</span></div></article>`;
  if (e.k === "panel") return `<article class="wb-entry panel${e.lead ? " w-anchor-lead" : ""}" id="${e.id}"><details class="entry-panel msg"><summary><span class="entry-recap">${esc(e.recap)}${e.lead ? `<span class="lead-tag">질문 직전</span>` : ""}</span><span class="pmeta"><time class="entry-at">${e.at}</time><span class="hint">이미지 ${e.imgs} · ${e.lines}줄</span><a class="mref" href="#p40">#p40</a></span></summary></details></article>`;
  const q = Q[e.q];
  if (e.k === "add") {
    if (!q.answered) return `<div class="card policy ix-q open-ask" id="item-${e.q}"><div class="cbar"><span class="head"><span class="id">(${e.q})</span><span class="cls">policy</span><span class="title">${esc(q.title)}</span></span><span class="qtime">질문 ${q.asked}<span class="wait">대기 중</span></span><button class="btn mini note-toggle">${icon("pen")}</button></div><div class="cbody">${q.ctx ? `<div class="ctx md">${q.ctx.startsWith("|") ? md(q.ctx) : `<p>${esc(q.ctx)}</p>`}</div>` : ""}${opts(q)}<div class="rec-line md"><b>${icon("star")}${q.rec}</b> ${esc(q.recWhy)}</div></div></div>`;
    const po = q.options[q.pick.charCodeAt(0) - 97];
    return `<details class="ix-done" id="item-${e.q}"><summary><span class="ok">${icon("check")}</span><span class="orig">원래 질문</span><span class="id">(${e.q})</span><span class="qt"><a href="#ans-${e.q}" data-jump="ans-${e.q}" title="답변 위치로 이동">${esc(q.title)}</a></span>
      <span class="ansl"><span class="pick"><span class="k">${q.pick}</span><span class="pt">${esc(po.slice(0, 30))}…</span></span><span class="qtime">질문 ${q.asked}<span class="sep">→</span>답변 ${q.answered}<span class="wait">${q.wait}</span></span><a class="jump" href="#ans-${e.q}" data-jump="ans-${e.q}">↓ 답변 위치</a></span></summary>
      <div class="sx">${opts(q, q.pick)}<div class="rec-line md"><b>${icon("star")}${q.rec}</b> ${esc(q.recWhy)}</div></div></details>`;
  }
  if (e.k === "answer") return `<details class="w-ans" id="ans-${e.q}"><summary><span class="evi owner">O</span><time class="entry-at">${e.at}</time><span><a href="#item-${e.q}" data-jump="item-${e.q}">(${e.q})</a> 답변 <b>${q.pick}</b>, ${esc(q.reading)} · “${esc(q.quote)}”</span><span class="exp">질문 ${q.asked} · 펼치기</span></summary>
     <div class="ab"><div class="h">원래 질문 · ${q.asked}</div><div><b>${esc(q.title)}</b></div>${opts(q, q.pick)}<div class="h">오너 답변 · ${e.at}</div><div class="said">“${esc(q.quote)}”</div><div class="h">에이전트 코멘트 · ${e.at}</div><div>${inline(e.comment)}</div></div></details>`;
}

// ---- window state ------------------------------------------------------
const LIMIT = 1000;
let shown, H = [];
function reset() { const a = anchors(); shown = E.map((_, i) => a.has(i)); }
function gaps() { const g = []; let s = -1; E.forEach((_, i) => { if (!shown[i] && s < 0) s = i; if ((shown[i] || i === E.length - 1) && s >= 0) { g.push([s, shown[i] ? i - 1 : i]); s = -1; } }); return g; }
// Reveal whole rows from one edge of a gap until the revealed height reaches
// LIMIT; the row that crosses the line joins (never cut), so a click always
// shows >= LIMIT px unless the gap runs out first.
let STRADDLE = -1;
function load(gs, ge, dir) {
  let sum = 0, i = dir === "up" ? ge : gs; const out = [];
  while (i >= gs && i <= ge && sum < LIMIT) { shown[i] = true; out.push(i); sum += H[i]; if (sum >= LIMIT) STRADDLE = i; i += dir === "up" ? -1 : 1; }
  return out;
}
const fmtRange = (a, b) => E[a].at === E[b].at ? E[a].at : `${E[a].at}–${E[b].at}`;
function gapHTML(s, e) {
  const top = s === 0, cnt = e - s + 1;
  return `<div class="w-gap" data-gap="${s}-${e}"><span class="dots">⋯</span><span class="cnt">${cnt}개 로그 항목</span><span class="rng">${fmtRange(s, e)}</span><span class="acts"><button data-load="up">▲ 위쪽 더 불러오기</button>${top ? "" : `<button data-load="down">▼ 아래쪽 더 불러오기</button>`}</span></div>`;
}
function draw(fresh) {
  let h = "", i = 0;
  const gl = gaps(), gmap = new Map(gl.map(g => [g[0], g]));
  while (i < E.length) {
    if (gmap.has(i)) { const [s, e] = gmap.get(i); h += gapHTML(s, e); i = e + 1; continue; }
    let run = [];
    while (i < E.length && shown[i] && E[i].k === "system") run.push(E[i++]);
    if (run.length) { h += sysRun(run, fresh); continue; }
    h += `<div class="w-row${fresh && fresh.has(i) ? " revealed" : ""}${i === STRADDLE && fresh && fresh.has(i) ? " straddle" : ""}">${rowHTML(E[i])}</div>`; i++;
  }
  const hidden = shown.filter(x => !x).length, open = Object.values(Q).filter(q => !q.answered).length;
  document.getElementById("root").innerHTML = `<div class="mk-label">VARIANT W · ${STEP_LABEL[STEP]} · ${THEME}</div>
  <section class="topic" data-topic="electron-shell">${tophead(open)}<div class="topic-stream"><div class="wb-history"><div class="mhead"><span class="wb-mtitle">${icon("list")}<span class="wb-mlabel">기록</span><span class="n">${E.length}</span></span><span></span><span class="mmeta">질문 3 · 접힘 ${hidden} · 패널 1</span></div><div class="history-live">${h}</div></div></div></section>`;
}
function sysRun(list, fresh) {
  const r = list[0].at === list[list.length - 1].at ? list[0].at : `${list[0].at}–${list[list.length - 1].at}`;
  const rev = fresh && list.some(e => fresh.has(e.i));
  return `<details class="system-run w-row${rev ? " revealed" : ""}"><summary><span class="rl"></span><span class="lbl">시스템 이벤트 ${list.length}개 · ${r}</span></summary>${list.map(rowHTML).join("")}</details>`;
}
function tophead(open) {
  const cur = E.find(e => e.current);
  return `<div class="tophead"><div class="tbar"><span class="tlead"><span class="tname">${LABEL}</span></span><time class="tago">1분 전</time>
  <button type="button" class="chip policy bulk" title="답변 필요">${icon("ask")}${open}</button>
  <button class="ibtn">${licon("pin")}</button><button class="ibtn">${licon("chevron-down")}</button><button class="ibtn">${licon("arrow-up-to-line")}</button><button class="ibtn">${licon("maximize-2")}</button><button class="btn mini tnote-toggle">${icon("pen")}</button></div>
  <div class="tsub"><div class="trecap"><span class="rat" role="button"><span class="evi lead">L</span>${cur.at} · <time class="tago">1분 전</time></span> — <div class="rtext md">${inline(cur.text)}</div></div></div></div>`;
}
function measure() {
  // Lay out every row once (all shown) to learn its height, as the real page
  // would from its rendered rows; system rows count at their own height.
  shown = E.map(() => true);
  let h = E.map(e => `<div class="w-row" data-m="${e.i}">${rowHTML(e)}</div>`).join("");
  document.getElementById("root").innerHTML = `<section class="topic"><div class="topic-stream"><div class="wb-history"><div class="history-live">${h}</div></div></div></section>`;
  H = E.map(e => document.querySelector(`[data-m="${e.i}"]`).getBoundingClientRect().height + 2);
}

const STEP_LABEL = ["처음: 앵커만", "가운데 틈 '아래쪽 더 불러오기' 1회 후", "+ 맨 위 틈 '위쪽 더 불러오기' 1회 후"];
const qs = new URLSearchParams(location.search);
let STEP = +(qs.get("step") || 0), THEME = qs.get("theme") || "dark";
if (qs.get("shot")) document.documentElement.classList.add("shot");
let lastLoad = null;
function apply() {
  document.documentElement.setAttribute("data-theme", THEME);
  measure(); reset();
  let fresh = new Set(); STRADDLE = -1;
  if (STEP >= 1) { const g = gaps()[1]; lastLoad = load(g[0], g[1], "down"); if (STEP === 1) lastLoad.forEach(i => fresh.add(i)); }
  if (STEP >= 2) { const g = gaps()[0]; load(g[0], g[1], "up").forEach(i => fresh.add(i)); }
  draw(fresh);
  if (qs.get("openans")) document.querySelectorAll("details.w-ans, details.ix-done").forEach(d => d.open = true);
  document.querySelectorAll("[data-step]").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.step === STEP)));
  document.querySelectorAll("[data-theme-btn]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.themeBtn === THEME)));
}
document.getElementById("mkbar").addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  if (b.dataset.step) STEP = +b.dataset.step;
  if (b.dataset.themeBtn) THEME = b.dataset.themeBtn;
  apply();
});
document.addEventListener("click", ev => {
  const lb = ev.target.closest("[data-load]");
  if (lb) { STRADDLE = -1; const [s, e] = lb.closest(".w-gap").dataset.gap.split("-").map(Number); draw(new Set(load(s, e, lb.dataset.load))); return; }
  const j = ev.target.closest("[data-jump]");
  if (j) { ev.preventDefault(); const t = document.getElementById(j.dataset.jump); if (t) { t.scrollIntoView({ block: "center", behavior: "smooth" }); t.classList.remove("flash"); void t.offsetWidth; t.classList.add("flash"); } return; }
  const o = ev.target.closest(".opt[data-opt]");
  if (o) { const on = o.getAttribute("aria-pressed") !== "true"; o.parentNode.querySelectorAll(".opt").forEach(x => x.setAttribute("aria-pressed", "false")); o.setAttribute("aria-pressed", String(on)); }
});
apply();
</script>
</body>
</html>
