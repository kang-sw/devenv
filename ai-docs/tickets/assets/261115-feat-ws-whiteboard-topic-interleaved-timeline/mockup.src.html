const BATCHES = {

  2: { at: "11:39:02", inputs: ["m2"] },
  3: { at: "11:40:17", inputs: ["m3"] },
  4: { at: "11:40:28", inputs: [] },
  5: { at: "11:46:50", inputs: ["mx"] },
};
const SCENE_CUT = { open: 2, final: 5 }; // last batch included

// ---------------------------------------------------------------------------
const q = new URLSearchParams(location.search);
let V = q.get("v") || "A", SCENE = q.get("scene") || "final", THEME = q.get("theme") || "dark";
if (q.get("shot")) document.documentElement.classList.add("shot");

const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
function inline(s) {
  let h = esc(s);
  h = h.replace(/`([^`]+)`/g, (_, c) => "<code>" + c + "</code>");
  h = h.replace(/\{\{(\d+)\}\}/g, (_, n) => `<a href="#item-${n}">(${n})</a>`);
  return h;
}
const icon = n => `<svg class="i" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const licon = n => `<svg class="li" aria-hidden="true"><use href="#l-${n}"/></svg>`;

function visible() {
  const cut = SCENE_CUT[SCENE];
  return E.filter(e => e.b <= cut);
}
function itemState(id) {
  const cut = SCENE_CUT[SCENE];
  return cut >= 3 ? "answered" : "open";
}
function openItems() { return Object.values(ITEMS).filter(it => visible().some(e => e.item === it.id && e.k === "add") && itemState(it.id) === "open"); }
function currentId() { const a = visible().filter(e => e.k === "agent"); return a[a.length - 1].id; }
function nowLabel() { return SCENE === "open" ? "방금" : "2분 전"; }

// --- shared pieces --------------------------------------------------------
function tophead() {
  const open = openItems().length;
  const cur = visible().find(e => e.id === currentId());
  return `<div class="tophead"><div class="tbar"><span class="tlead"><span class="tname">${TOPIC_LABEL}</span></span>
    <time class="tago">${nowLabel()}</time>
    ${open ? `<button type="button" class="chip policy bulk" title="답변 필요">${icon("ask")}${open}</button>` : ""}
    <button class="ibtn tpin" title="고정">${licon("pin")}</button>
    <button class="ibtn t-fold" title="접기/펼치기">${licon("chevron-down")}</button>
    <button class="ibtn t-raise" title="맨 위로 올리기">${licon("arrow-up-to-line")}</button>
    <button class="ibtn d-max" title="크게 보기">${licon("maximize-2")}</button>
    <button class="btn mini tnote-toggle" title="토픽 메모">${icon("pen")}</button></div>
    <div class="tsub"><div class="trecap" data-kind="agent"><span class="rat" role="button" tabindex="0"><span class="evi lead" title="에이전트 로그">L</span>${cur.at} · <time class="tago">${nowLabel()}</time></span> — <div class="rtext md">${inline(cur.t)}</div></div></div></div>`;
}
function entryLine(e, extra) {
  const cur = e.id === currentId();
  return `<article class="wb-entry agent${cur ? " current" : ""}" id="${e.id}"><div class="entry-line"><span class="evi lead" title="에이전트 로그">L</span><span class="entry-text"><time class="entry-at">${e.at}</time> — ${inline(e.t)}${cur ? `<span class="ptag">현재 상태</span>` : ""}${extra || ""}</span></div></article>`;
}
function sysRun(list) {
  if (!list.length) return "";
  const r = list[0].at === list[list.length - 1].at ? list[0].at : list[0].at + "–" + list[list.length - 1].at;
  return `<details class="system-run"><summary><span class="rl"></span><span class="lbl">시스템 이벤트 ${list.length}개 · ${r}</span></summary>${list.map(s => `<article class="wb-entry system"><div class="entry-line"><span class="evi sys"></span><span class="entry-text"><time class="entry-at">${s.at}</time> — ${inline(s.t)}</span></div></article>`).join("")}</details>`;
}
function optsHTML(it, staticPick) {
  return `<div class="opts stack">${it.options.map((o, i) => {
    const L = String.fromCharCode(97 + i), rec = L === it.rec;
    if (staticPick) return `<div class="opt static${rec ? " rec" : ""}${L === it.pick ? " picked" : ""}"><span class="k">${L}${rec ? icon("star") : ""}</span><div class="md">${esc(o)}</div></div>`;
    return `<div class="opt${rec ? " rec" : ""}" role="button" tabindex="0" data-opt="${L}" aria-pressed="false"><span class="k">${L}${rec ? icon("star") : ""}</span><div class="md">${esc(o)}</div></div>`;
  }).join("")}</div>`;
}
// Inline question: open = the full answerable card; answered = one folded line.
function question(it, opts = {}) {
  if (itemState(it.id) === "open") {
    return `<div class="card policy ix-q open-ask" id="item-${it.id}"><div class="cbar"><span class="head"><span class="id">(${it.id})</span><span class="cls">policy</span><span class="title">${esc(it.title)}</span></span><span class="qtime">질문 ${it.asked}<span class="wait">대기 중</span></span><button class="btn mini note-toggle" title="메모">${icon("pen")}</button></div>
      <div class="cbody">${optsHTML(it, false)}<div class="rec-line md"><b>${icon("star")}${it.rec}</b> ${esc(it.recWhy)}</div></div></div>`;
  }
  const opt = it.options[it.pick.charCodeAt(0) - 97];
  const short = opt.length > 34 ? opt.slice(0, 34) + "…" : opt;
  return `<details class="ix-done" id="item-${it.id}"><summary><span class="ok">${icon("check")}</span><span class="id">(${it.id})</span><span class="qt">${esc(it.title)}</span>
      <span class="ansl"><span class="pick"><span class="k">${it.pick}</span><span class="pt">${esc(short)}</span></span>${it.reading ? `<span class="ans">${esc(it.reading)}</span>` : ""}
      <span class="qtime">질문 ${it.asked}<span class="sep">→</span>답변 ${it.answered}<span class="wait">${it.wait}</span></span>${opts.jump ? `<a class="jump" href="#${opts.jump}">↓ 답변 위치</a>` : ""}</span></summary>
      <div class="sx">${optsHTML(it, true)}<div class="rec-line md"><b>${icon("star")}${it.rec}</b> ${esc(it.recWhy)}</div><div class="quote" style="margin-top:6px">“${esc(it.quote)}”</div></div></details>`;
}
function stats() {
  const v = visible();
  return { logs: v.filter(e => e.k === "agent").length, qs: v.filter(e => e.k === "add").length };
}
function shell(title, metaRight, body, foot) {
  return `<section class="topic" data-topic="message-timestamp" data-state="${SCENE === "open" ? "discussing" : "waiting"}">${tophead()}
   <div class="topic-stream"><div class="wb-history"><div class="mhead"><span class="wb-mtitle">${icon("list")}<span class="wb-mlabel">${title}</span></span><span></span><span class="mmeta">${metaRight}</span></div>
   <div class="history-live">${body}</div>${foot || ""}</div></div></section>`;
}

// --- Variant A: iteration blocks keyed by owner input ----------------------
function iterations() {
  // A new iteration starts at a batch that had any input delivered before it;
  // a batch with none joins the running iteration.
  const cut = SCENE_CUT[SCENE], out = [];
  for (let b = 1; b <= cut; b++) {
    const bt = BATCHES[b];
    if (!out.length || bt.inputs.length) out.push({ inputs: bt.inputs, batches: [] });
    out[out.length - 1].batches.push(b);
  }
  return out;
}
function iterHead(it) {
  const inp = it.inputs.map(k => INPUTS[k]);
  const firstAt = BATCHES[it.batches[0]].at.slice(0, 5);
  const text = inp.find(m => m.kind === "text"), chips = inp.find(m => m.kind === "chips");
  if (text) {
    return `<div class="ix-head"><span class="evi owner" title="오너 메시지">O</span><span class="when">${text.at}</span><span class="src">오너 메시지</span>${text.att ? `<span class="att">${text.att}</span>` : ""}<span class="lat">→ ${firstAt} 반영</span><span class="quote2">${esc(text.text)}</span></div>`;
  }
  if (chips) {
    return `<div class="ix-head" id="ans-${chips.at}"><span class="evi owner" title="오너 답변">O</span><span class="when">${chips.at}</span><span class="src">오너 답변 ${chips.chips.length}개</span><span class="lat">→ ${firstAt} 반영</span><span class="chips">${chips.chips.map(c => `<span class="pick"><a href="#item-${c.id}">(${c.id})</a><span class="k">${c.k}</span><span class="pt">${esc(c.t)}${c.note ? ` <span class="note">^ ${esc(c.note)}</span>` : ""}</span></span>`).join("")}</span></div>`;
  }
  return `<div class="ix-head agent"><span class="evi lead">L</span><span class="when">${firstAt}</span><span class="src">에이전트 후속</span><span class="quote2" style="padding-left:23px;-webkit-line-clamp:1">이 토픽에 대한 새 오너 메시지 없음 · 그 사이 다른 토픽 메시지 ${INPUTS.mx.n}건</span></div>`;
}
function renderBatchEntries(list, answeredHere) {
  let h = "", sys = [];
  const flush = () => { h += sysRun(sys); sys = []; };
  for (const e of list) {
    if (e.k === "system") { sys.push(e); continue; }
    if (e.k === "answer") continue;             // carried by the iteration header + the card
    flush();
    if (e.k === "agent") h += entryLine(e);
    else if (e.k === "add") h += question(ITEMS[e.item]);
  }
  flush();
  return h;
}
function variantA() {
  const its = iterations(), v = visible();
  const blocks = its.map((it, i) => {
    const list = v.filter(e => it.batches.includes(e.b));
    const hasOpen = list.some(e => e.k === "add" && itemState(e.item) === "open");
    const now = i === its.length - 1;
    return `<div class="ix-iter${hasOpen ? " has-open" : ""}${now ? " now" : ""}">${iterHead(it)}<div class="ix-body">${renderBatchEntries(list)}</div></div>`;
  }).join("");
  const s = stats();
  return shell(`기록 <span class="n">${its.length}회 주고받음</span>`, `질문 ${s.qs} · 로그 ${s.logs}줄 · 패널 0`, blocks);
}

// --- Variant B: flat timeline, owner rows, sticky open-question index ------
function variantB() {
  const v = visible(), cut = SCENE_CUT[SCENE];
  let h = "", sys = [];
  const flush = () => { h += sysRun(sys); sys = []; };
  for (let b = 1; b <= cut; b++) {
    for (const k of BATCHES[b].inputs) {
      const m = INPUTS[k];
      if (m.kind === "text") { flush(); h += `<article class="wb-entry owner msg"><div class="entry-line"><span class="evi owner" title="오너 메시지">O</span><span class="entry-text"><time class="entry-at">${m.at}</time> — <span class="clamp">${esc(m.text)}</span></span></div></article>`; }
    }
    for (const e of v.filter(x => x.b === b)) {
      if (e.k === "system") { sys.push(e); continue; }
      flush();
      if (e.k === "agent") h += entryLine(e);
      else if (e.k === "add") h += question(ITEMS[e.item], { jump: "row-" + e.item });
      else if (e.k === "answer") {
        const it = ITEMS[e.item];
        h += `<article class="wb-entry owner" id="row-${it.id}"><div class="entry-line"><span class="evi owner" title="오너 답변">O</span><span class="entry-text"><time class="entry-at">${e.at}</time> — <a href="#item-${it.id}">(${it.id})</a> 답변 <b>${it.pick}</b>${it.reading ? ", " + esc(it.reading) : ""} · “${esc(it.quote)}”<a class="back" href="#item-${it.id}">↑ ${it.asked} 질문</a></span></div></article>`;
      }
    }
  }
  flush();
  const open = openItems();
  const foot = `<div class="ix-index">${open.length
    ? `<span class="lbl">${icon("ask")}열린 질문 ${open.length}</span>${open.map(it => `<a class="qchip" href="#item-${it.id}"><span class="id">(${it.id})</span><span class="t">${esc(it.title)}</span><span class="ago">${it.asked}</span></a>`).join("")}`
    : `<span class="done">열린 질문 없음 · 답변 2개 (마지막 11:40)</span>`}</div>`;
  const s = stats();
  return shell(`기록 <span class="n">${v.length + (SCENE === "open" ? 2 : 3)}</span>`, `질문 ${s.qs} · 로그 ${s.logs}줄 · 패널 0`, h, foot);
}

// --- Variant C: conversation turns; a settled past turn folds to one line --
function variantC() {
  const its = iterations(), v = visible();
  const body = its.map((it, i) => {
    const list = v.filter(e => it.batches.includes(e.b));
    const hasOpen = list.some(e => e.k === "add" && itemState(e.item) === "open");
    const now = i === its.length - 1;
    const inp = it.inputs.map(k => INPUTS[k]);
    const text = inp.find(m => m.kind === "text"), chips = inp.find(m => m.kind === "chips");
    const firstAt = BATCHES[it.batches[0]].at.slice(0, 5);
    let bubble;
    if (text) bubble = `<div class="ix-bubble-row"><div class="ix-bubble"><div class="bh"><span>${text.at}</span><span>오너</span>${text.att ? `<span>· ${text.att}</span>` : ""}</div><div class="bt">${esc(text.text)}</div></div></div>`;
    else if (chips) bubble = `<div class="ix-bubble-row"><div class="ix-bubble"><div class="bh"><span>${chips.at}</span><span>오너 답변</span></div><div class="chips">${chips.chips.map(c => `<span class="pick"><a href="#item-${c.id}">(${c.id})</a><span class="k">${c.k}</span><span class="pt">${c.note ? esc(c.note) : esc(c.t)}</span></span>`).join("")}</div></div></div>`;
    else bubble = `<div class="ix-sysline">${firstAt} · 에이전트 후속 (이 토픽에 새 메시지 없음)</div>`;
    const inner = bubble + `<div class="ix-turn-body">${renderBatchEntries(list)}</div>`;
    if (now || hasOpen) return `<div class="ix-turn${now ? " now" : ""}">${inner}</div>`;
    // folded summary: who spoke, what came back
    const logs = list.filter(e => e.k === "agent").length;
    const asks = list.filter(e => e.k === "add").map(e => ITEMS[e.item]);
    const qtext = text ? esc(text.text) : chips ? chips.chips.map(c => `(${c.id})=${c.k}`).join(" · ") : "에이전트 후속";
    const sum = asks.map(a => `<span class="pick"><span class="k">${a.id}</span><span class="pt">→ ${a.pick} · ${a.answered}</span></span>`).join("") + `<span class="n">로그 ${logs}</span>`;
    return `<details class="ix-fold"><summary><span class="when">${text ? text.at : chips ? chips.at : firstAt}</span><span class="q">${text || chips ? "오너 · " : ""}${qtext}</span><span class="sum">${sum}</span></summary><div class="ix-turn">${inner}</div></details>`;
  }).join("");
  const s = stats();
  return shell(`기록 <span class="n">${its.length}턴</span>`, `질문 ${s.qs} · 로그 ${s.logs}줄 · 패널 0`, body);
}

// --- Current card (baseline): stream, then the settled list at the bottom ---
function variantNow() {
  const v = visible();
  let h = "", sys = [];
  const flush = () => { h += sysRun(sys); sys = []; };
  for (const e of v) {
    if (e.k === "system" || e.k === "add") { sys.push(e); continue; }
    flush();
    if (e.k === "agent") h += entryLine(e);
    else if (e.k === "answer") h += `<article class="wb-entry system owner"><div class="entry-line"><span class="evi owner">O</span><span class="entry-text"><time class="entry-at">${e.at}</time> — ${inline(e.t)}</span></div></article>`;
  }
  flush();
  const items = [892, 889].map(id => ITEMS[id]).filter(it => v.some(e => e.item === it.id));
  let tail;
  if (SCENE === "open") {
    tail = `<div class="tbody">${items.slice().reverse().map(it => `<div class="card policy" id="item-${it.id}"><div class="cbar"><span class="head"><span class="id">(${it.id})</span><span class="cls">policy</span><span class="title">${esc(it.title)}</span></span><button class="btn mini note-toggle">${icon("pen")}</button></div><div class="cbody">${optsHTML(it, false)}<div class="rec-line md"><b>${icon("star")}${it.rec}</b> ${esc(it.recWhy)}</div></div></div>`).join("")}</div>`;
  } else {
    tail = `<div class="tbody"><details class="settled" open><summary title="완료됨">${icon("list")}${items.length}</summary>${items.map(it => { const o = it.options[it.pick.charCodeAt(0) - 97]; return `<div class="srow" id="item-${it.id}"><details class="sx"><summary><span class="stext"><span class="id">(${it.id})</span><b>${esc(it.title)}</b> <span class="pick"><span class="k">${it.pick}</span><span class="pt">${esc(o)}</span></span>${it.reading ? ` <span class="ans">${esc(it.reading)}</span>` : ""} <span class="quote">“${esc(it.quote)}”</span></span></summary></details></div>`; }).join("")}</details></div>`;
  }
  return `<section class="topic" data-topic="message-timestamp">${tophead()}<div class="topic-stream"><div class="wb-history"><div class="mhead"><span class="wb-mtitle">${icon("list")}<span class="wb-mlabel">기록</span><span class="n">${v.length}</span></span><span></span><span class="mmeta">패널 0 · 로그 ${v.length}줄</span></div><div class="history-live">${h}</div></div></div>${tail}</section>`;
}

const DESC = {
  A: "<b>A · 메시지 단위 블록</b> — 오너 입력 1건(이후 첫 whiteboard.update부터 다음 입력 전까지)이 한 블록. 머리는 오너 메시지 인용 또는 답변 칩, 몸통은 그 턴의 로그 · 시스템 이벤트 · 질문 카드를 실제 위치에. 답변된 질문은 한 줄로 접히고 \"질문 11:35 → 답변 11:40 (5분 뒤)\"를 표시.",
  B: "<b>B · 단일 타임라인</b> — 블록 머리 없이 오너 메시지도 O 줄로 끼워 넣음. 질문은 제자리, 답변 줄은 질문으로 되돌아가는 링크. 카드 하단에 고정된 \"열린 질문 N\" 색인이 해당 카드로 점프.",
  C: "<b>C · 대화형 턴 + 지난 턴 접기</b> — 오너 말풍선(오른쪽) · 에이전트 응답(왼쪽). 열린 질문이 없는 지난 턴은 한 줄 요약(\"(889) → c · 11:40 · 로그 2\")으로 접혀, 카드가 길어지지 않고 열린 질문이 있는 턴과 현재 턴만 펼쳐짐.",
  NOW: "<b>현재 카드</b> — 비교용 기준선: 기록 스트림(항목 추가 이벤트는 시스템 칩에 접힘) 아래에 질문 목록이 따로 붙음.",
};
function render() {
  document.documentElement.setAttribute("data-theme", THEME);
  const f = { A: variantA, B: variantB, C: variantC, NOW: variantNow }[V];
  document.getElementById("root").innerHTML = `<div class="mk-label">${V === "NOW" ? "CURRENT" : "VARIANT " + V} · ${SCENE === "open" ? "11:39 시점" : "11:48 시점"} · ${THEME}</div>` + f();
  document.getElementById("mkdesc").innerHTML = DESC[V];
  document.querySelectorAll("[data-v]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === V)));
  document.querySelectorAll("[data-scene]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.scene === SCENE)));
  document.querySelectorAll("[data-theme-btn]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.themeBtn === THEME)));
}
document.getElementById("mkbar").addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  if (b.dataset.v) V = b.dataset.v;
  if (b.dataset.scene) SCENE = b.dataset.scene;
  if (b.dataset.themeBtn) THEME = b.dataset.themeBtn;
  render();
});
// option buttons: pick toggles like form.js (visual only)
document.addEventListener("click", ev => {
  const o = ev.target.closest(".opt[data-opt]"); if (!o) return;
  const on = o.getAttribute("aria-pressed") !== "true";
  o.parentNode.querySelectorAll(".opt").forEach(x => x.setAttribute("aria-pressed", "false"));
  o.setAttribute("aria-pressed", String(on));
});
render();
</script>
