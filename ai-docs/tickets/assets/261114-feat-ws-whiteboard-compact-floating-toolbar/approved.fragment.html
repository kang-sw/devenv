<style>
.st{box-sizing:border-box;max-width:1440px;margin:auto;padding:24px;border-radius:12px;background:#181c22;color:#e0e6ef;font:13px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}.st *{box-sizing:border-box}.st h1{font-size:21px;line-height:1.35;letter-spacing:-.04em;margin:0 0 8px}.st .intro{font-size:12px;color:#99a9c0;margin:0 0 18px}.st .case{margin-top:18px;min-width:0}.st .case-head{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:7px;font-size:10px;color:#94a4be}.st .demo-controls{display:flex;align-items:center;gap:6px}.st .demo-controls button{font:inherit;font-size:10px;padding:3px 7px;background:#283243;color:#b7c8e3;border:1px solid #425571;border-radius:5px;cursor:pointer}.st .mode{color:#9ab6e8;font-size:10px}.st .viewport{height:370px;overflow:auto;overflow-anchor:none;scrollbar-gutter:stable;scroll-padding-top:calc(var(--face-height,46px) + 10px);border:1px solid #3a465a;border-radius:10px;background:#13171d;min-width:0}.st .content{position:relative;min-height:100%;padding:12px}.st .lead{height:56px;font-size:11px;color:#7f92ae;padding:5px 2px}.st .sentinel{display:block;height:0}.st .toolbar-slot{position:sticky;top:0;z-index:3;height:var(--reserved,46px);margin-bottom:10px;pointer-events:none;min-width:0}.st .face{container: demo-toolbar / inline-size;position:relative;pointer-events:auto;width:100%;border:1px solid #495364;border-radius:12px;background:#20242b;min-width:0}.st .tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:7px 8px;min-width:0}.st .floating .tools{padding-block:1px}.st .action{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none;height:30px;padding:0 11px;border:1px solid transparent;border-radius:8px;background:#2c323c;color:#e1e7f1;font:inherit;font-size:12.5px;font-weight:600;white-space:nowrap;cursor:pointer}.st .action:hover,.st .action[aria-pressed=true],.st .action[aria-expanded=true]{background:#354259;border-color:#5b7398}.st .action svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5;flex:none}/* Keep original inline layout boxes; shrink glyphs uniformly. The 30px hit region
extends 1px above / 5px below each 24px face, avoiding sticky-top clipping.
Wrapped action rows use an 8px gap to avoid fractional-pixel hit-test edge sharing. */
.st .floating .face{border-radius:8px}.st .floating .action{height:24px;border-radius:6px}.st .floating .action::after{content:"";position:absolute;inset:-2px -1px -6px;border-radius:inherit}.st .floating .action svg,.st .floating .action>span[aria-hidden]{transform:scale(.857142857143);transform-origin:center}.st .floating .counts{line-height:14px}.st .floating.wrapped-actions .tools{row-gap:8px}
.st .action kbd{font:600 10px ui-monospace,monospace;padding:0 4px;border:1px solid #4e596b;border-radius:4px;color:#a1aec4}.st .counts{margin-left:auto;white-space:nowrap;font-size:10.5px;color:#9aa9bf;line-height:24px}.st button:focus-visible,.st .target:focus-visible{outline:2px solid #a8c9ff;outline-offset:2px}.st .popover{position:absolute;top:calc(100% + 6px);left:8px;z-index:8;width:230px;max-width:calc(100% - 16px);padding:12px;background:#2b3443;border:1px solid #627594;border-radius:8px;box-shadow:0 7px 22px #0008;color:#d1ddf1;font-size:11px}.st .popover[hidden]{display:none}.st .popover p{margin:0 0 6px}.st .popover small{color:#9fb1cf}.st .card{margin:0 0 12px;border:1px solid #333e50;border-radius:9px;background:#20262f;min-width:0;scroll-margin-top:10px}.st .card h2{font-size:13px;line-height:1.6;margin:0;padding:9px 12px;border-bottom:1px solid #3b4657;letter-spacing:-.02em}.st .card-body{padding:12px;color:#9eafc8;font-size:12px;line-height:1.75;min-height:150px}.st .card-body p{margin:0 0 9px}.st .card-body .target{font:inherit;color:#c9d9f5;border:1px solid #516a8f;border-radius:5px;background:#2d3c54;padding:5px 8px;cursor:pointer}.st .demo-note{font-size:10px;color:#8297b8;line-height:1.7}.st .narrow{display:flex;gap:18px;flex-wrap:wrap;align-items:start}.st .narrow .case{width:360px;max-width:100%}.st .narrow .small{width:320px}.st .foot{font-size:11px;color:#879bb9;border-top:1px solid #39475d;padding-top:12px;margin:23px 0 0}@container demo-toolbar (max-width:540px){.st .action:not(.overview) .label,.st .action kbd{display:none}.st .action:not(.overview){padding-inline:8px}.st .counts{font-size:10px}}@media(max-width:460px){.st{padding:14px 10px;border-radius:0}.st h1{font-size:19px}.st .content{padding:8px}.st .viewport{height:350px}.st .narrow{gap:14px}.st .case-head{gap:5px}.st .action{font-size:12px}}
</style>
<div class="st" id="sticky-toolbar-study"><h1>상단 기능바 · 플로팅 높이 약 60%</h1><p class="intro">한눈에 보기·새 터미널·웹 페이지·검색·파일·집계를 그대로 유지합니다. 한 줄 기능바는 46→28px, 약 61% 높이로 남습니다. 버튼 30→24px · 아이콘 14→12px · 여백 7→1px. 좁은 화면은 줄바꿈과 클릭 영역을 우선합니다.</p><div class="wide-slot"></div><div class="narrow"><div class="phone-slot case"></div><div class="small-slot case small"></div></div><p class="foot">MAIN 검토용 목업이며 구현 승인 상태는 아닙니다. 기능 버튼은 위치·초점·메뉴 유지를 확인하는 데모입니다. 실제 터미널·파일·검색 기능을 새로 구현하지 않았습니다. 각 미리보기 안을 스크롤하거나 바깥의 이동 버튼을 눌러 보세요.</p></div>
<script>
(()=>{const root=document.getElementById('sticky-toolbar-study');if(!root)return;const paths={overview:'M2 5l5 5 5-5M2 1l5 5 5-5',terminal:'M2 3h12v10H2zM4 5l2 2-2 2M8 10h3',web:'M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1M1 8h14M8 1c4 4 4 10 0 14M8 1c-4 4-4 10 0 14',search:'M11 11l4 4M7 1a6 6 0 1 0 0 12A6 6 0 0 0 7 1',files:'M1 4h5l2 2h7v8H1zM1 4V2h5l2 2'};function action(id,label,extra){return '<button type="button" class="action '+id+'" aria-label="'+label+'" title="'+label+'"'+(id==='overview'?' aria-pressed="false"':'')+(id==='terminal'?' aria-haspopup="menu" aria-expanded="false"':'')+'><svg viewBox="0 0 16 16" aria-hidden="true"><path d="'+paths[id]+'"/></svg><span class="label">'+label+'</span>'+(extra||'')+'</button>'}function demo(id,label){return '<section class="case" data-demo="'+id+'"><div class="case-head"><span>'+label+'</span><div class="demo-controls"><span class="mode">맨 위 · 기본 높이</span><button type="button" data-scroll="top">위로</button><button type="button" data-scroll="down">아래로 스크롤</button></div></div><div class="viewport"><div class="content"><div class="lead">세션 정보 영역 · 아래 기능바부터 보드가 시작됩니다.</div><i class="sentinel" aria-hidden="true"></i><div class="toolbar-slot"><div class="face" role="toolbar" aria-label="보드 기능"><div class="tools">'+action('overview','한눈에 보기')+action('terminal','새 터미널','<span aria-hidden="true">▾</span>')+action('web','웹 페이지')+action('search','검색','<kbd>Ctrl K</kbd>')+action('files','파일')+'<span class="counts">진행 중 18 · 종료 18</span></div><div class="popover" role="menu" hidden><p>기존 터미널 드롭다운 영역</p><small>프로필·메뉴 내용은 그대로 유지합니다. Esc로 닫을 수 있습니다.</small></div></div></div><article class="card" data-card="one"><h2>기록 속 패널 카드: 선택된 A안</h2><div class="card-body"><p>기능바는 보드와 같은 폭으로 유지됩니다. 아래로 스크롤해도 다섯 기능과 집계는 사라지지 않습니다.</p><p class="demo-note">버튼·아이콘·세로 여백을 함께 줄입니다. 글자 크기·가로 간격과 30px 클릭 영역은 유지합니다.</p></div></article><article class="card" data-card="two"><h2>읽는 위치 유지</h2><div class="card-body"><p>상단바의 원래 공간은 유지합니다. 플로팅 전환 때문에 문서가 갑자기 위로 당겨지지 않도록 한 데모입니다.</p><button class="target" type="button">초점 유지 확인</button></div></article><article class="card" data-card="three"><h2>이동 대상 · 가려지지 않는 제목</h2><div class="card-body"><p>기능바 높이를 이동 여백에 반영해 링크·키보드로 도착한 제목과 조작이 바 아래에 가려지지 않게 합니다.</p><p class="demo-note">실제 앱의 scroll-keep·도착 위치 계산과 연동 검증이 필요합니다.</p></div></article><article class="card"><h2>계속되는 보드 내용</h2><div class="card-body"><p>내용 렌더러는 변경하지 않습니다.</p></div></article></div></div></section>'}root.querySelector('.wide-slot').innerHTML=demo('wide','넓은 화면 · 위/스크롤 상태 직접 전환');root.querySelector('.phone-slot').innerHTML=demo('phone','360px · 기존 아이콘 모드 유지');root.querySelector('.small-slot').innerHTML=demo('small','320px · 모든 기능과 집계 유지');root.querySelectorAll('[data-demo]').forEach(d=>{const v=d.querySelector('.viewport'),slot=d.querySelector('.toolbar-slot'),face=d.querySelector('.face'),sentinel=d.querySelector('.sentinel'),mode=d.querySelector('.mode'),terminal=d.querySelector('.terminal'),popover=d.querySelector('.popover');// Reconstruct original flex-row heights without remounting or changing visible state.
function reserve(){const h=face.getBoundingClientRect().height,rows=new Map();[...face.querySelector('.tools').children].forEach(n=>{const r=n.getBoundingClientRect(),center=Math.round((r.top+r.bottom)*2)/4;rows.set(center,Math.max(rows.get(center)||0,n.classList.contains('action')?30:24))});slot.classList.toggle('wrapped-actions',[...rows.values()].filter(h=>h===30).length>1);const reserved=16+6*(rows.size-1)+[...rows.values()].reduce((a,b)=>a+b,0);slot.style.setProperty('--reserved',reserved+'px');v.style.setProperty('--face-height',h+'px')}function update(){const floating=sentinel.getBoundingClientRect().top<=v.getBoundingClientRect().top+v.clientTop;slot.classList.toggle('floating',floating);mode.textContent=floating?'플로팅 · 전체 높이 약 60% 목표':'맨 위 · 기본 높이';reserve()}v.addEventListener('scroll',update,{passive:true});new ResizeObserver(reserve).observe(face);d.querySelectorAll('[data-scroll]').forEach(b=>b.addEventListener('click',()=>{v.scrollTop=b.dataset.scroll==='top'?0:220;update()}));terminal.addEventListener('click',()=>{popover.hidden=!popover.hidden;terminal.setAttribute('aria-expanded',String(!popover.hidden))});d.querySelector('.overview').addEventListener('click',e=>e.currentTarget.setAttribute('aria-pressed',String(e.currentTarget.getAttribute('aria-pressed')!=='true')));d.addEventListener('keydown',e=>{if(e.key==='Escape'){popover.hidden=true;terminal.setAttribute('aria-expanded','false');terminal.focus()}});update()});})();
</script>
