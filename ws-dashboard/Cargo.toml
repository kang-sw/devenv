[workspace]
members = [
    "crates/core",
    "crates/daemon",
    "crates/harness-cli",
    "crates/harness-core",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
ws-dashboard-core = { path = "crates/core" }
ws-dashboard-harness-core = { path = "crates/harness-core" }
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
