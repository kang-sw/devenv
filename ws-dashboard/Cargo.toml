[workspace]
members = [
    "crates/core",
    "crates/daemon",
    "crates/harness-cli",
    "crates/harness-core",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
ws-dashboard-core = { path = "crates/core" }
ws-dashboard-harness-core = { path = "crates/harness-core" }
