  <h1>Python 3 is required</h1>
  <p>Install Python 3 or set <code>WS_MCP_HOLDER_PYTHON</code> to the interpreter’s full path.</p>
  <p>Start the dashboard through your ws plugin, then choose <strong>Connection → Retry</strong>.</p>
