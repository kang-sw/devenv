[package]
name = "werkschaft-desktop"
version = "0.1.0"
description = "Attach-only native window for the local dashboard"
edition = "2021"
rust-version = "1.95"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
open = "=5.4.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = { version = "=2.12.5", features = [] }
ureq = { version = "=3.5.2", default-features = false, features = ["json"] }
url = "=2.5.8"

[features]
custom-protocol = ["tauri/custom-protocol"]
