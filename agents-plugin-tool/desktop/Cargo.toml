[package]
name = "werkschaft-desktop"
version = "0.1.0"
description = "Native shell for the local dashboard"
edition = "2021"
rust-version = "1.95"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
arboard = { version = "=3.7.0", default-features = false }
open = "=5.4.5"
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "system-proxy", "stream"] }
rusqlite = { version = "=0.34.0", features = ["bundled"] }
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
tauri = { version = "=2.12.5", features = ["devtools"] }
tauri-plugin-dialog = { version = "=2.8.4", default-features = false }
tauri-plugin-single-instance = { version = "=2.5.5", default-features = false }
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["native-tls", "zip"] }
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["time"] }
ureq = { version = "=3.5.2", default-features = false, features = ["json"] }
url = "=2.5.8"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.5"
objc2-foundation = "=0.3.2"
objc2-web-kit = "=0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
