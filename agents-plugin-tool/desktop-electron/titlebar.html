<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'">
<title>Werkschaft title bar</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: #202020; color: white; font: 12px 'Segoe UI', sans-serif; user-select: none; }
  header { height: 30px; display: flex; align-items: center; gap: 8px; padding-left: 10px; padding-right: env(titlebar-area-x, 138px); -webkit-app-region: drag; }
  img { width: 18px; height: 18px; -webkit-app-region: no-drag; }
  button { width: 30px; height: 26px; padding: 0; background: transparent; color: inherit; border: 0; border-radius: 4px; font-size: 18px; -webkit-app-region: no-drag; }
  button:hover, button:focus-visible { background: #80808040; outline: 1px solid currentColor; }
  #title { position: absolute; left: 50%; transform: translateX(-50%); max-width: calc(100% - 300px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; -webkit-app-region: no-drag; }
</style>
</head>
<body><header><img src="icons/icon.png" alt="Werkschaft"><button id="menu" aria-label="Application menu (Alt)" title="Application menu (Alt)">☰</button><span id="title">Werkschaft</span></header><script src="titlebar-renderer.js"></script></body>
</html>
